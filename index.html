oday, forever","k":"Bb","s":[{"p":"v","t":"Oh, how sweet the glorious message,\nSimple faith may claim,\nYesterday, today, forever,\nJesus is the same,\nStill He loves to save the sinful\nHeal the sick and lame,\nCheer the mourner, still the tempest,\nGlory to His name.","n":1},{"p":"c","t":"Yesterday, today, forever,\nJesus is the same;\nAll may change, but Jesus never!\nGlory to His name.\nGlory to His name.\nGlory to His name.\nAll may change, but Jesus never!\nGlory to His name.","n":1},{"p":"v","t":"He who was the friend of sinners,\nSeeks the lost one now,\nSinner, come, and at His footstool\nPenitently wait,\nHe who said, \u201cI\u2019ll not condemn thee,\nGo and sin no more\u201d,\nSpeaks to thee that word of pardon,\nAs in days of yore","n":2},{"p":"v","t":"Oft on earth He healed the sufferer,\nBy His mighty hand;\nStill our sickness and our sorrow,\nGo at His command,\nHe who gave His healing virtue,\nTo a woman\u2019s touch;\nTo the faith that claims His fullness,\nStill will give as much.","n":3},{"p":"v","t":"He who pardoned erring Peter,\nNever need\u2019st thou fear,\nHe that came to faithless Thomas,\nAll thy doubt will clear,\nHe who let the loved disciple,\nOn His bosom rest,\nBids thee still, with love as tender,\nLean upon His breast.","n":4},{"p":"v","t":"He who \u2018mid the raging billows,\nWalked upon the sea,\nStill can hush our wildest tempest;\nAs on Galilee,\nHe who wept and prayed in anguish,\nIn Gethsemane,\nDrinks with us each cup of trembling,\nIn our agony.","n":5},{"p":"v","t":"As of old He walked to Emmaus,\nWith them to abide;\nSo through all life\u2019s way He walketh,\nEver near our side,\nSoon again we shall behold Him,\nHasten, Lord, the day!\nBut \u2018twill still be \u201cthis same Jesus\u201d,\nAs He went away.","n":6}]},{"n":62,"t":"The old-time religion","k":"Eb","s":[{"p":"v","t":"It\u2019s the old time Holy Spirit,\nAnd the devil won\u2019t go near it,\nThat\u2019s the reason people fear it,\nBut it\u2019s good enough for me.","n":1},{"p":"c","t":"Give me that old time religion,\nGive me that old time religion,\nGive me that old time religion,\nAnd it\u2019s good enough for me.","n":1},{"p":"v","t":"It will make you stop your lying,\nIt will save you when you\u2019re dying,\nIt will start the devil flying,\nAnd it\u2019s good enough for me.","n":2},{"p":"v","t":"It\u2019s so good I want no other,\nFor it makes me love my brother,\nAnd it bring things from under cover,\nAnd it\u2019s good enough for me.","n":3},{"p":"v","t":"It was good in the fiery furnace\u2026\nIt was good for Paul and Silas\u2026\nIt was good for our fathers\u2026\nit is good enough for me.","n":4},{"p":"v","t":"It was good for Brother Branham\u2026\nMakes me love everybody\u2026\nIt will do when I am dying\u2026\nIt will take us all to heaven\u2026","n":5}]},{"n":63,"t":"It\u2019s the old ship of Zion","k":"Ab","s":[{"p":"v","t":"It\u2019s the old ship of Zion,\nIt\u2019s the old ship of Zion,\nIt\u2019s the old ship of Zion,\nGet on board, get on board.","n":1},{"p":"v","t":"It has landed our fathers,\nIt has landed our fathers,\nIt has landed our fathers,\nGet on board, get on board.","n":2}]},{"n":64,"t":"On the other shore","k":"","s":[{"p":"v","t":"I\u2019ve got a Father over yonder\nI\u2019ve got a Father over yonder\nI\u2019ve got a Father over yonder\nOn the other shore.","n":1},{"p":"v","t":"Some bright day I\u2019ll go and see Him,\nSome bright day I\u2019ll go and see Him,\nSome bright day I\u2019ll go and see Him,\nOn the other shore.","n":2},{"p":"v","t":"Won\u2019t that be a happy meeting?\nWon\u2019t that be a happy meeting?\nWon\u2019t that be a happy meeting?\nOn the other shore.","n":3},{"p":"v","t":"That bright day may be tomorrow.\nThat bright day may be tomorrow.\nThat bright day may be tomorrow.\nOn the other shore.","n":4}]},{"n":65,"t":"Shine on me","k":"Ab","s":[{"p":"v","t":"Shine on me, Oh Lord, shine on me,\nLet the light from the lighthouse, shine on me,","n":1}]},{"n":66,"t":"To be like Jesus","k":"Ab","s":[{"p":"v","t":"From Bethlehem\u2019s manger, came forth a stranger,\nOn earth I long to be like Him,\nMy faithful Saviour,\nhow rich His favour?\nOn earth I long to be like Him.","n":1},{"p":"c","t":"To be like Jesus,\nTo be like Jesus,\nOn earth I long to be like Him,\nAll through life\u2019s journey from earth to glory,\nI only ask to be like Him.","n":1},{"p":"v","t":"Serene and Holy, Obedient, Lowly,\nOn earth I long to be like Him,\nBy grace forgiven, an heir of heaven,\nOn earth I long to be like Him.","n":2}]},{"n":67,"t":"Great is thy faithfulness","k":"Eb","s":[{"p":"v","t":"Great is Thy faithfulness,\n\u201cO God my Father,\u201d\nThere is no shadow of turning with Thee;\nThou changest not, Thy compassions, they fail not,\nAs Thou hast been, Thou forever wilt be.","n":1},{"p":"c","t":"Great is Thy faithfulness! Great is Thy faithfulness!\nMorning by morning new mercies I see;\nAll I have needed Thy hands hath provided;\n\u201cGreat is Thy faithfulness!\u201d Lord unto me.","n":1},{"p":"v","t":"Summer and winter, springtime and harvest,\nSun, moon and stars in their courses above,\nJoin with all nature in manifold witness,\nTo Thy great faithfulness, mercy and love.","n":2},{"p":"v","t":"Pardon for sin and a peace that endureth,\nThy own dear presence to cheer and to guide;\nStrength for today and bright hope for tomorrow,\nBlessings all mine with ten thousand besides!","n":3}]},{"n":68,"t":"Open my eyes, that I may see","k":"Ab","s":[{"p":"v","t":"Open my ears, that I may hear,\nVoices of truth Thou sendest clear,\nAnd while the wave-notes fall on my ear,\nEverything false will disappear.","n":1},{"p":"c","t":"Silently now, I wait for Thee,\nReady my God, Thy will to see;\nOpen my eyes, illumine me,\nSpirit Divine!","n":1},{"p":"v","t":"Open my mouth, and let me bear,\nGladly the warm truth everywhere;\nOpen my heart, and let me prepare,\nLove with Thy children thus to share.","n":2}]},{"n":69,"t":"He\u2019s everything to me","k":"F","s":[{"p":"v","t":"He\u2019s everything, He\u2019s everything to me,\nHe\u2019s everything, He\u2019s everything to me,\nHe\u2019s my Father, my mother, my sister, my brother,\nHe\u2019s everything to me.","n":1},{"p":"v","t":"He feeds me when I\u2019m hungry,\nHe\u2019s everything to me\nHe feeds me when I\u2019m hungry,\nHe\u2019s everything to me\nHe\u2019s my Father, my mother, my sister, my brother,\nHe\u2019s everything to me.","n":2}]},{"n":70,"t":"I know it was the blood","k":"F","s":[{"p":"v","t":"I know it was the blood,\nI know it was the blood for me,\nOne day, when I was lost, Jesus died upon the cross,\nI know it was the blood for me.","n":1},{"p":"v","t":"I know it was His love,\nI know it was His love for me,\nOne day, when I was lost, Jesus died upon the cross,\nI know it was His love for me.","n":2},{"p":"v","t":"I know it was His life,\nI know it was His life for me,\nOne day, when I was lost, Jesus died upon the cross,\nI know it was His life for me.","n":3}]},{"n":71,"t":"Oh, won\u2019t you watch?","k":"Bb","s":[{"p":"v","t":"Oh, won\u2019t you watch with me one hour,\nWhile I go yonder, while I go yonder?\nOh, won\u2019t you watch with me one hour,\nWhile I go and pray?","n":1}]},{"n":72,"t":"I\u2019m overcoming","k":"Bb","s":[{"p":"v","t":"I\u2019m overcoming, I\u2019m overcoming,\nI\u2019m overcoming, I\u2019m overcoming,\nFor I love Jesus, He\u2019s my Saviour,\nAnd He smiles and He loves me too.","n":1}]},{"n":73,"t":"Spirit of the living God","k":"F","s":[{"p":"v","t":"Spirit of the Living God, fall afresh on me;\nSpirit of the Living God, fall afresh on me;\nBreak me! Melt me! Mould me! and fill me!","n":1}]},{"n":74,"t":"The beauty of Jesus","k":"Eb","s":[{"p":"v","t":"Let the beauty of Jesus be seen in me,\nAll His wonderful passion and purity,\nO Thou Spirit divine, all my nature refine,\nTill the beauty of Jesus be seen in me.","n":1},{"p":"v","t":"When your burden is heavy and hard to bear,\nWhen your neighbours refuse all your loads to share;\nWhen you\u2019re feeling so blue, don\u2019t know just what to do,\nLet the beauty of Jesus be seen in you.","n":2},{"p":"v","t":"When somebody has been so unkind to you,\nSome word spoken that pierces you through and through,\nThink how he was beguiled, spat upon and reviled;\nLet the beauty of Jesus be seen in you.","n":3},{"p":"v","t":"From the dawn of the morning to close of days,\nIn example, in deeds, and in all you say;\nLay your gifts at His feet, ever strive to keep sweet,\nLet the beauty of Jesus be seen in you.","n":4}]},{"n":75,"t":"Shut in with God","k":"C","s":[{"p":"v","t":"The disciples were praying\nFor power to fall\nTen days they determined\nOn God they did trust\nAnd God send His Spirit\nTo Baptize them all\nFor they have been shut in with God","n":1},{"p":"c","t":"Shut in with God in the secret place\nThere in the Spirit beholding His face,\nGaining new power to run in the race,\nI love to be shut in with God.","n":1},{"p":"v","t":"Of all pleasant places\nOn land and the sea\nNo place on earth that is sweeter to me\nThan to kneel at the feet of my Saviour\nThere I'll be shut in with God","n":2},{"p":"v","t":"On the day of Pentecost\nAll with one accord\nThere came from heaven\nRushing mighty winds\nTongue of fire\nWas upon their head while they were shut in with God","n":3}]},{"n":76,"t":"Turn your eyes upon Jesus","k":"F","s":[{"p":"v","t":"O soul, are you weary and troubled?\nNo light in the darkness you see?\nThere\u2019s light for a look at the Saviour,\nAnd life more abundant and free!","n":1},{"p":"c","t":"Turn your eyes upon Jesus,\nLook full in His wonderful face,\nAnd the things of earth will grow strangely dim,\nIn the light of His glory and grace.","n":1},{"p":"v","t":"Through death into life everlasting,\nHe passed, and we follow Him there;\nOver us sin no more hath dominion,\nFor more than conquerors we are!","n":2},{"p":"v","t":"His Word shall not fail you, He promised,\nBelieve Him, and all will be well;\nThen go to a world that is dying,\nHis perfect salvation to tell!","n":3}]},{"n":77,"t":"We give glory to Jesus","k":"Bb","s":[{"p":"v","t":"We give all the glory to Jesus,\nAnd tell of His love, His wonderful love,\nWe give all the glory to Jesus,\nAnd tell of His wonderful love.","n":1}]},{"n":78,"t":"Sweep over my soul","k":"Ab","s":[{"p":"v","t":"Sweep Over My Soul,\nSweep Over My Soul,\nSweet Spirit, Sweep Over My Soul,\nMy rest is complete, while I sit at your feet;\nSweet Spirit, Sweep Over My Soul.","n":1}]},{"n":79,"t":"Friendship with Jesus","k":"Eb","s":[{"p":"v","t":"A friend of Jesus, Oh, what bliss,\nThat one so vile as I,\nShould ever have a friend like this,\nTo lead me unto God.","n":1},{"p":"c","t":"Friendship with Jesus,\nFellowship divine,\nOh, what blessed\nsweet communion,\nJesus is a friend of mine.","n":1},{"p":"v","t":"A friend when other friendships cease,\nA friend when others fail,\nA friend who gives me joy and peace,\nA friend who will prevail.","n":2},{"p":"v","t":"A friend when sickness lays me low,\nA friend when death draws near,\nA friend as through the vale I go,\nA friend to help and cheer.","n":3},{"p":"v","t":"A friend to lead me in the dark,\nA friend who knows the way,\nA friend to steer my weak, frail back,\nA friend my debts to pay.","n":4},{"p":"v","t":"A friend when life\u2019s rough voyage is o\u2019er,\nA friend when death is past,\nA friend to greet on heaven\u2019s shore,\nA friend when home at last.","n":5}]},{"n":80,"t":"Jesus is the one","k":"C","s":[{"p":"v","t":"When the sky is dark before you,\nAnd the clouds are hanging low,\nThere is One who watches o\u2019er you,\nEverywhere that you go.","n":1},{"p":"c","t":"Jesus is the One,\nHe\u2019s the only One,\nLet Him have His way until the day is done;\nWhen He speaks, you know the clouds will have to go,\nJust because He loves you so.","n":1},{"p":"v","t":"O, if you are sad and lonely,\nLife is but an empty tomb,\nBreathe a prayer to Jesus only,\nHe will drive away the gloom.","n":2},{"p":"v","t":"When you come to cross the river,\nHe will be your Friend and Guide,\nYou can live with Him forever,\nOver on the other side.","n":3}]},{"n":81,"t":"He\u2019s coming again","k":"","s":[{"p":"v","t":"Would you be numbered as one of His fold?\nWould you be numbered as one of His fold?\nBe spotless within, be watching and waiting that sight to behold;\nHe\u2019s coming again.","n":1}]},{"n":82,"t":"The lily of the valley","k":"C","s":[{"p":"v","t":"I have found a friend in Jesus,\nHe\u2019s everything to me,\nHe\u2019s the fairest of ten thousand to my soul;\nThe Lily of the valley in Him\nalone I see,\nAll I need to cleanse and make me fully whole.\nIn sorrow He\u2019s my comfort,\nIn trouble He\u2019s my stay,\nHe tells me every care on Him to roll,","n":1},{"p":"c","t":"He\u2019s the Lily of the valley,\nThe Bright and Morning Star,\nHe\u2019s the fairest of ten thousand to my soul.","n":1},{"p":"v","t":"He all my griefs has taken,\nAnd all my sorrows borne;\nIn temptation He\u2019s my strong and mighty tower;\nI have all for Him forsaken, and all my idols torn,\nFrom my heart, and now He keeps me by His power.\nThough all the world forsake me,\nAnd Satan tempts me sore,\nThrough Jesus, I shall safely reach the goal,","n":2},{"p":"v","t":"He will never, ever leave me,\nNor yet forsake me here,\nWhile I live by faith and do His blessed will;\nA wall of fire about me, I\u2019ve nothing now to fear,\nWith His manna He my hungry soul shall fill.\nThen sweeping up to glory,\nWe\u2019ll see His blessed face,\nWhere rivers of delight shall ever roll,","n":3}]},{"n":83,"t":"He careth for me","k":"F","s":[{"p":"v","t":"My burden rolled away,\nMy burden rolled away,\nJust at the feet of Jesus,\nWhere I\u2019m kneeling down and praying,\nMy burden rolled away.","n":1},{"p":"c","t":"He careth for me,\nHe careth for me,\nThrough sunshine or shadow,\nHe careth for me.","n":1}]},{"n":84,"t":"When I get to the end of the way","k":"C","s":[{"p":"v","t":"The sands have been washed in the footprints\nOf the stranger on Galilee\u2019s shore,\nAnd the voice that subdue the rough billows,\nWill be heard in Judea no more.\nBut the path of that lone Galilean,\nWith joy I will follow today,\nAnd the toils of the road will seem nothing,","n":1},{"p":"c","t":"When I get to the end of the way,\nAnd the toils of the road will seem nothing,\nWhen I get to the end of the way.","n":1},{"p":"v","t":"There are so many hills to climb upward,\nI often am longing for rest,\nBut He who appoints me my pathway,\nKnows just what is needful and best.\nI know in His Word He hath promised,\nThat my strength\n\u201cit shall be as my day\u201d,\nAnd the toils of the road will seem nothing,","n":2},{"p":"v","t":"He loves me too well to forsake me,\nOr give me one trial too much,\nAll His people have been dearly purchased,\nAnd Satan can never claim such.\nBy and by, I shall see Him and praise Him,\nIn the city of unending day,\nAnd the toils of the road will seem nothing,","n":3},{"p":"v","t":"When the last feeble steps have been taken,\nAnd the gates of the city appear,\nAnd the beautiful songs of the angels,\nFloat out of my listening ear.\nWhen all that now seem so mysterious,\nWill be bright and as clear as the day,\nAnd the toils of the road will seem nothing,","n":4}]},{"n":85,"t":"Room at the cross for you","k":"Ab","s":[{"p":"v","t":"The cross upon which Jesus died,\nIs a shelter in which we can hide,\nAnd its grace so free is sufficient for me,\nAnd deep is its fountain; as wide as the sea.","n":1},{"p":"c","t":"There\u2019s room at the cross for you,\nThere\u2019s room at the cross for you,\nThough millions have come, there\u2019s still room for one,\nYes, there\u2019s room at the cross for you.","n":1},{"p":"v","t":"Though millions have found Him a friend,\nAnd have turned from the sins they have sinned,\nThe Saviour still waits to open the gates\nAnd welcome a sinner before it\u2019s too late.","n":2},{"p":"v","t":"The hand of my Saviour is strong,\nAnd the love of my Saviour is long,\nThrough sunshine or rain, through loss or in gain,\nThe blood flows from Calv\u2019ry to cleanse every stain.","n":3}]},{"n":86,"t":"When the roll is called","k":"Ab","s":[{"p":"v","t":"When the trumpet of the Lord shall sound, and time shall be no more,\nAnd the morning breaks eternal bright and fair,\nWhen the saved of earth shall gather over on the other shore,\nAnd the roll is called up yonder, I\u2019ll be there.","n":1},{"p":"c","t":"When the roll is called up yonder,\nWhen the roll is called up yonder,\nWhen the roll is called up yonder,\nWhen the roll is called up yonder,\nI\u2019ll be there.","n":1},{"p":"v","t":"On that bright and cloudless morning, when the dead in Christ shall rise,\nAnd the glory of His resurrection share,\nWhen His chosen ones shall gather to their home beyond the skies,\nAnd the roll is called up yonder, I\u2019ll be there.","n":2},{"p":"v","t":"Let us labour for the Master from the dawn till setting sun,\nLet us talk of all His wondrous love and care;\nThen when all of life is over, and our work on earth is done,\nAnd the roll is called up yonder, I\u2019ll be there.","n":3}]},{"n":87,"t":"The haven of rest","k":"Ab","s":[{"p":"v","t":"My soul in sad exile was out on life\u2019s sea,\nSo burdened with sin and distressed,\nTill I heard a sweet voice saying, \u201cMake me your choice\u201d,\nAnd I entered the \u201cHaven of Rest.\u201d","n":1},{"p":"c","t":"I\u2019ve anchored my soul, in the Haven of rest,\nI\u2019ll sail the wild seas no more,\nThe tempest may sweep o\u2019er the wide stormy deep,\nIn Jesus I\u2019m saved evermore.","n":1},{"p":"v","t":"I yielded myself to His tender embrace,\nAnd faith taking hold of the Word,\nMy fetters fell off and I anchored my soul;\nThe Haven of Rest is my Lord.","n":2},{"p":"v","t":"The song of my soul since the Lord made me whole,\nHas been the old story so blest,\nOf Jesus, who\u2019ll save whosoever will have,\nA home in the Haven of rest.","n":3},{"p":"v","t":"How precious the thought that we may all recline,\nLike John the beloved and the blest,\nOn Jesus\u2019 strong arm, where no tempest can harm,\nSecure in the Haven of rest.","n":4},{"p":"v","t":"Oh, come to the Saviour, He patiently waits,\nTo save by His power divine,\nCome, anchor your soul in the Haven of rest,\nAnd say, \u201cMy Beloved is mine.\u201d","n":5}]},{"n":88,"t":"Must Jesus bear the cross alone?","k":"A","s":[{"p":"v","t":"Must Jesus bear the cross alone,\nAnd all the world go free?\nNo, there\u2019s a cross for everyone,\nAnd there\u2019s a cross for me.","n":1},{"p":"v","t":"The consecrated cross I bear,\nTill death shall set me free,\nAnd then go home my crown to wear,\nFor there\u2019s a crown for me.","n":2},{"p":"v","t":"Upon the crystal pavement down,\nAt Jesus\u2019 pierced feet,\nWith joy I\u2019ll cast my golden crown,\nAnd His dear name repeat.","n":3},{"p":"v","t":"O precious cross! O glorious crown!\nO resurrection day!\nYe angels from the stars come down,\nAnd bear my soul away.","n":4}]},{"n":89,"t":"Blessed be the name","k":"A","s":[{"p":"v","t":"All praise to Him who reigns above,\nIn majesty supreme,\nWho gave His Son for man to die,\nThat He might man redeem.","n":1},{"p":"c","t":"Blessed be the name, Blessed be the name,\nBlessed be the name of\nthe Lord;\nBlessed be the name, Blessed be the name,\nBlessed be the name of\nthe Lord.","n":1},{"p":"v","t":"His name above all names shall stand;\nExalted more and more,\nAt God the Father\u2019s own right hand,\nWhere angel-hosts adore.","n":2},{"p":"v","t":"Redeemer, Saviour, Friend of men,\nOnce ruined by the fall;\nThou hast devised Salvation\u2019s plan,\nFor Thou hast died for all.","n":3},{"p":"v","t":"His name shall be the Counselor,\nThe Mighty Prince of Peace,\nOf all earth Kingdoms conqueror,\nWhose reign shall never cease.","n":4}]},{"n":90,"t":"I\u2019m going through","k":"Ab","s":[{"p":"v","t":"Lord, I have started to walk in the light,\nShinning upon me from heaven so bright;\nI\u2019ve bade the world and its follies adieu,\nAnd now with my Saviour,\nI mean to go through.","n":1},{"p":"c","t":"I\u2019m going through,\nI\u2019m going through,\nI\u2019ll pay the price whatever others do;\nI\u2019ll take the way with the Lord\u2019s despised few,\nI\u2019m going through, Jesus, I\u2019m going through.","n":1},{"p":"v","t":"Many once started to run in this race,\nBut with our Redeemer they could not keep pace;\nOthers accepted because it was new,\nBut not very many seem bound to go through.","n":2},{"p":"v","t":"Let me but follow my Lord all alone,\nAnd have for my pillow, like Jacob a stone;\nRather than vain worldly pleasure pursue,\nThan turn from this pathway and fail to go through.","n":3},{"p":"v","t":"Lone then, my comrades and walk in this way,\nThat leads to the kingdom of unending day;\nTurn from your idols and join with the few,\nStart in with your Saviour and keep going through.","n":4}]},{"n":91,"t":"Speak, my Lord","k":"G","s":[{"p":"v","t":"Hear the Lord of harvest sweetly calling,\n\u201cWho will go and work for me today?\nWho will bring me to the lost and dying?\nWho will point them to the narrow way?\u201d","n":1},{"p":"c","t":"Speak, my Lord,\nSpeak, my Lord,\nSpeak, and I\u2019ll be quick to answer Thee;\nSpeak, my Lord,\nSpeak, my Lord,\nSpeak, and I will answer, \u201cLord, send me.\u201d","n":1},{"p":"v","t":"When the coal of fire touched the prophet,\nMaking him as pure as pure can be,\nWhen the voice of God, said \u201cwho\u2019ll go for us?\u201d\nThen he answered, \u201cHere I am send me\u201d.","n":2},{"p":"v","t":"Millions now in sin and shame are dying,\nListen to their sad and bitter cry;\nHasten, brother, hasten to the rescue,\nQuickly answer, \u201cMaster, here am I.\u201d","n":3},{"p":"v","t":"Soon the time for reaping will be over,\nSoon we\u2019ll gather for the harvest home;\nMay the Lord of harvest smile upon us,\nMay we hear His blessed child, \u201cwell done.\u201d","n":4}]},{"n":92,"t":"The love of God","k":"Eb","s":[{"p":"v","t":"The love of God is greater far\nThan tongue or pen can ever tell;\nIt goes beyond the highest star;\nAnd reaches to the lowest hell.\nThe guilty pair, bowed down with care,\nGod gave His son to win;\nHis erring child He reconciled,\nAnd pardoned from his sin.","n":1},{"p":"c","t":"Oh, love of God, how rich and pure,\nHow measureless and strong!\nIt shall forever more endure,\nThe saints\u2019 and angels\u2019 song.\nWhen hoary time shall pass away,\nAnd earthly thrones and kingdoms fall;\nWhen men who here refuse to pray,\nOn rocks and hills and mountains call;","n":1},{"p":"v","t":"God\u2019s love so sure, shall still endure,\nAll measureless and strong!\nRedeeming grace to Adam\u2019s race,\nThe saints\u2019 and angels\u2019 song.\nOh, love of God, how rich and pure,\nHow measureless and strong!\nIt shall forever more endure,\nThe saints\u2019 and angels\u2019\nsong.","n":2},{"p":"v","t":"Could we with ink the ocean fill,\nAnd were the skies of parchment made;\nWere every stalk on earth a quill,\nAnd every man a scribe by trade.\nTo write the love of God above,\nWould drain the ocean dry;\nNor could the scroll contain the whole,\nCould stretch from sky to sky\nOh, love of God, how rich and pure,\nHow measureless and strong!\nIt shall forever more endure,\nThe saints\u2019 and angels\u2019\nsong.","n":3}]},{"n":93,"t":"The meeting in the air","k":"C","s":[{"p":"v","t":"You have heard of little Moses in the bulrush,\nYou have heard of fearless David and his sling;\nYou have heard the story told of dreaming Joseph,\nAnd of Jonah and the whale you often sing,\nThere are many, many others through the Bible,\nI should like to meet them all, I do declare!\nBy and by Lord will surely let us meet them\nAt the meeting in the air.","n":1},{"p":"c","t":"There\u2019s going to be a meeting in the air\nIn the sweet, sweet by and by\nI am going to meet you, meet you there\nIn that home beyond the sky;\nSuch singing you will hear, never heard by mortal ear,\n\u2018Twill be glorious, I do declare!\nAnd God\u2019s own son will be the leading one\nAt the meeting in the air.","n":1},{"p":"v","t":"Many things will there be missing, in that meeting;\nFor the mourners bench will have no place at all;\nThere will never be a sermon preached to sinners,\nFor the sinner had refused to heed the call.\nThere will be no mourning over way-ward loved ones,\nthere will be no lonely nights of pleading prayer;\nAll our burdens and our anguish will be lifted\nAt the meeting in the air.","n":2},{"p":"v","t":"There the doubters will be missing altogether\nAll the skeptics will be absent on that day;\nThere will be no grumblers present to disturb us,\nAnd the Achans will be busy far away\nThere the saints will have His \u201cseal upon their foreheads,\u201d\nDressed in raiment none but ransomed ones can wear,\nAll who have the wedding garments will be present\nAt the meeting in the air.","n":3}]},{"n":94,"t":"It\u2019s dripping with blood","k":"C","s":[{"p":"v","t":"The first one to die for this Holy Ghost plan,\nWas John the Baptist,\nbut he died like a man;\nThen came our Lord Jesus,\nthey crucified Him,\nHe taught that the Spirit would save men from sin.","n":1},{"p":"c","t":"It\u2019s dripping with blood,\nIt\u2019s dripping with blood,\nThis Holy Ghost Gospel,\nIs dripping with blood,\nThe blood of disciples,\nwho died for the Truth,\nThis Holy Ghost Gospel,\nIs dripping with blood.","n":1},{"p":"v","t":"There was Peter and Paul, and John the divine,\nThey gave up their lives so this Gospel could shine;\nThey mingled their blood, like the prophets of old,\nSo the true Word of God could honest be told.","n":2},{"p":"v","t":"Then they stoned Stephen, he preached against sin,\nHe made them so angry, they dashed his head in;\nBut he died in the Spirit and gave up the ghost,\nAnd went to join others,\nIn that life-giving host.","n":3},{"p":"v","t":"There\u2019re souls under the altar, crying, \u201cHow long?\u201d\nFor the Lord to punish those who\u2019ve done wrong;\nBut there\u2019s going to be more who\u2019ll give their lives\u2019 blood\nFor this Holy Ghost Gospel and its crimson flood.","n":4}]},{"n":95,"t":"Holy, Holy, Holy","k":"F","s":[{"p":"v","t":"Holy, Holy, Holy, Lord God of hosts,\nHeaven and earth are full of Thee,\nHeaven and earth are praising Thee,\nO Lord Most High.","n":1}]},{"n":96,"t":"This old world can never hold me","k":"C","s":[{"p":"v","t":"This old world can never hold me,\nAny moment I\u2019ll be gone,\nFor I\u2019ve made my consecration,\nAnd I have my wedding garment on.","n":1}]},{"n":97,"t":"Our lord\u2019s return","k":"G","s":[{"p":"v","t":"I am watching for the coming of the glad millennial day,\nWhen our blessed Lord shall come and catch His waiting Bride away;\nOh! My heart is filled with rapture as I labour, watch and pray,\nFor our Lord is coming back to earth again.","n":1},{"p":"c","t":"Oh! Our Lord is coming back to earth again,\nYes, Our Lord is coming back to earth again,\nSatan will be bound a thousand years, we\u2019ll have no tempter then,\nAfter Jesus shall come back to earth again.","n":1},{"p":"v","t":"Jesus\u2019 coming back will be the answer to earth\u2019s sorrowing cry,\nFor the knowledge of the Lord shall fill the earth and sea and sky;\nGod shall take away all sickness and the sufferer\u2019s tears will dry,\nWhen our Saviour shall come back to earth again.","n":2},{"p":"v","t":"Yes, the Ransomed of the Lord shall come to Zion then with joy,\nAnd in all His holy mountain nothing hurts or shall destroy;\nPerfect peace shall reign in every heart, and love without alloy,\nAfter Jesus shall come back to earth again.","n":3},{"p":"v","t":"Then the sin and sorrow, pain and death of this dark world shall cease;\nIn a glorious reign with Jesus of a thousand years of peace;\nAll the earth is groaning, crying for that day of sweet release,\nFor our Jesus to come back to earth again.","n":4}]},{"n":98,"t":"I shall know him","k":"C","s":[{"p":"v","n":1,"t":"When my lifework is ended and I cross the swelling tide,\nWhen the bright and glorious morning I shall see;\nI shall know my Redeemer when I reach the other side,\nAnd His smile will be the first to welcome me."},{"p":"c","n":1,"t":"I shall know Him, I shall know Him,\nAnd redeemed by His side I shall stand;\nI shall know Him, I shall know Him\nBy the print of the nails in His hand."},{"p":"v","n":2,"t":"Oh, the soul thrilling rapture when I view His blessed face,\nAnd the luster of His kindly beaming eye;\nHow my full heart will praise Him for the mercy, love and grace\nThat prepared for me a mansion in the sky."},{"p":"v","n":3,"t":"Oh, the dear ones in glory, how they beckon me to come,\nAnd our parting at the river I recall;\nTo the sweet vales of Eden they will sing my welcome home,\nBut I long to meet my Savior first of all."},{"p":"v","n":4,"t":"Thro' the gates to the city in a robe of spotless white,\nHe will lead me where no tears will ever fall;\nIn the glad song of ages I shall mingle with delight,\nBut I long to meet my Savior first of all."}]},{"n":99,"t":"Then Jesus came","k":"C","s":[{"p":"v","t":"One sat alone beside the highway begging,\nHis eyes were blind, the light he could not see;\nHe clutched his rags and shivered in the shadows,\nThen Jesus came and bade his darkness flee.","n":1},{"p":"c","t":"When Jesus comes, the tempter\u2019s power is broken;\nWhen Jesus comes, the tears are wiped away,\nHe takes the gloom and fills the life with glory,\nFor all is changed when Jesus comes to stay.","n":1},{"p":"v","t":"From home and friends the evil spirits drove him,\nAmong the tombs he dwelt in misery;\nHe cut himself as demon powers possessed him,\nThen Jesus came and set the captive free.","n":2},{"p":"v","t":"Unclean! Unclean! The leper cried in torment,\nThe deaf, the dumb, in helplessness stood near,\nThe fever raged, disease had gripped its victim,\nThen Jesus came and cast out every fear.","n":3},{"p":"v","t":"So men today have found the Saviour able,\nThey could not conquer passion, lust and sin;\nTheir broken hearts had left them sad and lonely,\nThen Jesus came and dwelt Himself within.","n":4}]},{"n":100,"t":"When I survey the wondrous cross","k":"Eb","s":[{"p":"v","t":"When I survey the wondrous cross,\nOn which the Prince of glory died,\nMy richest gain I count but loss,\nAnd pour contempt on all my pride.","n":1},{"p":"v","t":"Forbid it Lord, that I should boast,\nSave in the death of Christ, my God,\nAll the vain things that charm me most,\nI sacrifice them to His blood.","n":2},{"p":"v","t":"See, from His head, His hands, His feet,\nSorrow and love flow mingled down,\nDid e\u2019er such love and sorrow meet,\nOr thorns composed so rich a crown.","n":3},{"p":"v","t":"Were the whole realm of nature mine,\nThat were a present far too small;\nLove so amazing, so divine,\nDemands my soul, my life, my all.","n":4}]},{"n":101,"t":"The water way","k":"C","s":[{"p":"v","t":"Long ago the maids drew water\nIn the evening time, they say\nOne day Isaac sent His servant\nTo stop Rebecca on her way,\n\"My master sent me here to tell thee;\nSee these jewels rich and rare;\nWould'st thou not his lovely bride be\nIn that country over there?","n":1},{"p":"c","t":"It shall be light in. the evening time,\nThe path to glory you will surely find;\nThru the water way, it is the light today, Buried in the precious Name of Jesus Christ,\nYoung and old, repent of all your sin,\nThe Holy Ghost will surely enter in;\nThe evening light has come,\nIt is a fact that God and Christ are one.","n":1},{"p":"v","t":"So God's servants come to tell you\nOf a bridegroom in the sky,\nLooking for a holy people\nTo be His bride soon, by and by;\nHe sends us refreshing water\nIn this wondrous latter day;\nThey who really will be raptured,\nMust go thru the water way.","n":2},{"p":"v","t":"Are you on your way to ruin,\nCumbered with a load of care?\nSee the quick work God is doing\nThat so His glory you may share\nAt last the faith He once delivered\nTo the saints, is ours today;\nTo get in the Church triumphant\nYou must go the water way.","n":3},{"p":"v","t":"Have you looked and often wondered\nWhy the power is slack today?\nWill you stay in that back number\nAnd go in the man-made way?\nO saints who never have been buried,\nIn the blessed name of God,\nLet the truth now sanctify you;\nIt's the way apostles trod.","n":4}]},{"n":102,"t":"Don\u2019t forget prayer","k":"F","s":[{"p":"v","t":"Don\u2019t forget the family prayer,\nJesus wants to meet you there;\nHe will take your every care\nOh, don\u2019t forget the family prayer.","n":1}]},{"n":103,"t":"Crying Holy unto the Lord","k":"F","s":[{"p":"v","t":"Crying \u201cHoly\u201d unto the Lord,\nCrying \u201cHoly\u201d unto the Lord,\nIf I could, I surely would\nStand on the rock where Moses stood.","n":1}]},{"n":104,"t":"Oh, that man from Galilee","k":"F","s":[{"p":"v","t":"In a manger long ago, I know it\u2019s really so,\nA Babe was born to save men from their sin;\nJohn saw Him on the shore, the Lamb forever more,\nOh, Christ, the Crucified of Calvary.","n":1},{"p":"c","t":"Oh, I love that Man from Galilee,\nFor He has done so very much for me,\nHe has forgiven me all my sins, and placed the Holy Ghost within,\nOh, I love, that Man from Galilee.","n":1},{"p":"v","t":"The Publican went to pray in the temple there one day,\nHe cried \u201cO Lord be merciful to me\u201d,\nHe was forgiven of every sin, and a deep peace came within;\nHe said \u201cCome see this Man from Galilee\u201d.","n":2},{"p":"v","t":"The lame was made to walk, the dumb was made to talk,\nThat power was spoken with love upon the sea;\nThe blind was made to see, I know it could only be\nBy the mercy of that Man from Galilee.","n":3},{"p":"v","t":"Nicodemus came by night, to know the way of right,\nHe asked the Son of man what must he do?\nThese words He said to him, \u201cYe must be born again\u201d,\nBy the Spirit of that Man of Galilee.","n":4},{"p":"v","t":"The woman at the well, He all her sins did tell,\nHow five husbands she had at that time,\nShe was forgiven of every sin, and a deep peace came within,\nThen she cried \u201cCome see this Man from Galilee\u201d.","n":5}]},{"n":105,"t":"Reach out, touch the Lord","k":"F","s":[{"p":"v","t":"Reach out and touch the Lord as He passes by,\nYou\u2019ll find He\u2019s not too busy to hear your heart\u2019s cry;","n":1},{"p":"v","t":"He\u2019s passing by this moment,\nYour needs to supply,\nReach out and touch the Lord as He goes by.","n":2}]},{"n":106,"t":"In that city, where the lamb is the light","k":"Bb","s":[{"p":"v","t":"There\u2019s a country far beyond the starry sky,\nThere\u2019s a city where there never comes a night;\nIf we\u2019re faithful we shall go there by and by,\nIt\u2019s a city, where the Lamb is the light.","n":1},{"p":"c","t":"In that city, where the Lamb is the light,\nThe city where there cometh no night;\nI\u2019ve a mansion over there, and when free from all toil and care,\nI am going where the Lamb is the light.","n":1},{"p":"v","t":"Here we have our days of sunshine, but we know,\nThat the sun, which shines upon us now so bright,\nWill be changed to clouds and rain until we go,\nTo the city where the Lamb is the light.","n":2},{"p":"v","t":"There the flowers bloom forever and the day\nShall be one eternal day without a night;\nAnd our tears shall be forever wiped away,\nIn that city where the Lamb is the light.","n":3},{"p":"v","t":"Here we have our disappointment all the while,\nAnd our fondest hopes but meet with bitter blight;\nThough by night we weep, the morning brings a smile.\nIn that city where the Lamb is the light.","n":4},{"p":"v","t":"Then let sunshine fade, let twilight bring its gloom,\nNot a shadow can my blissful soul affright,\nFor I know that up in heaven there is room,\nIn that city where the Lamb is the light.","n":5}]},{"n":107,"t":"Jesus set me free","k":"Ab","s":[{"p":"v","t":"I\u2019m so glad Jesus set me free,\nI\u2019m so glad Jesus set me free,\nI\u2019m so glad Jesus set me free,","n":1},{"p":"v","t":"Glory Hallelujah, Jesus set me free.\n(I\u2019m so glad Jesus lifted me\u2026)\nI\u2019m on my way to heaven, shouting victory\u2026)","n":2}]},{"n":108,"t":"When I take my vacation","k":"","s":[{"p":"v","t":"Here so many are taking vacation,\nTo the mountains, the lakes or the sea;\nWhere they rest from their cares and their worries;\nWhat a wonderful time that must be!\nBut it seems not my lot to be like them,\nI must toil thru the heat and the cold,\nSeeking out the lost sheep on the mountain,\nBringing, wanderers back to the fold.","n":1},{"p":"c","t":"When I take my vacation in heaven,\nWhat a wonderful time that will be;\nHearing concerts by the heavenly Chorus,\nAnd the face of my Saviour I\u2019ll see;\nSitting down by the banks of the river;\n'Neath the shade of the ever green tree,\nI shall rest from my burdens forever,\nWon't you spend your vacation with me.","n":1},{"p":"v","t":"Now some day I shall take my vacation\nTo the City John tells us about;\nWith its foundation walls all so precious,\nWhere from gladness of heart I shall shout!\nO no sights ever witness by mortals,\nCan compare with the glories up there\nI shall spend my vacation with Jesus,\nIn the place He went to prepare.","n":2},{"p":"v","t":"There the weather will always be perfect,\nNot a cloud shall sweep over the sky;\nAnd no earthquakes or cyclones shall threaten,\nIn the land of Sweet by and by\",\nSoon there's going to be an excursion,\nI am booked for a ride in air,\nYou're invited to share my vacation\nAnd the feast with the Bridegroom to share.","n":3},{"p":"v","t":"Here on earth when we take our vacation,\nWe return to our homes by and by;\nWhen I take my vacation in heaven,\nIn those mansions, of gold in the sky\nI shall dwell with my Saviour forever,\nWith Him sit on His Heavenly Throne;\nAll the days will be one long vacation,\nWhen my Saviour takes me to His home.","n":4}]},{"n":109,"t":"Oh, it is Jesus","k":"C","s":[{"p":"v","t":"Oh, it is Jesus! It is Jesus!\nIt is Jesus in my soul;\nFor I have touched the hem of His garment,\nAnd His blood had made me whole.","n":1}]},{"n":110,"t":"What then","k":"F","s":[{"p":"v","t":"When the great plants of our cities have turned out their last finished work,\nWhen our merchants have sold their last yard of goods and dismissed the last tired clerk,\nWhen our banks have raked in their last dollar and paid the last dividends,\nWhen the judge, of the earth \u201cclosed for the night,\u201d and asks for a balance \u2013 What Then?","n":1},{"p":"c","t":"What then? What then?\nWhen the great Book is opened, what then?\nWhen the ones that\u2019s rejecting this Message tonight\nWill be asked to give a reason-\nWhat Then?","n":1},{"p":"v","t":"When the choir has sung it\u2019s last song and the preacher has said his last prayer,\nWhen the people have heard their last sermon and the sound has died out in the air,\nWhen the Bible lies closed on the altar and the pews are all empty of folks,\nAnd each one stands facing his record and the great Book is opened-\nWhat Then?","n":2},{"p":"v","t":"When the actors have played their last drama and the mimic has made his last fun,\nWhen the film has flashed its last film and the billboard displayed its last run,\nWhen the crowds seeking pleasure have vanished and all the liquor stores and beer joints have been closed,\nAnd the salesman sold his last drink and gone out in the darkness,\nWhen the trumpet of ages in sounded and we stand before Him-\nWhat Then?","n":3},{"p":"v","t":"When the bugle calls sinks into silence and the long marching columns stand still,\nAnd the captain repeats his last orders,\nAnd the flag has been hauled from the mast,\nAnd the wounded afield checked in and a world that rejects its Saviour is asked for a reason-\nWhat Then?","n":4}]},{"n":111,"t":"Faith in Jehovah","k":"F","s":[{"p":"v","t":"Faith in the Father, faith in the Son,\nFaith in the Holy Ghost, these three are One;\nDemons will tremble, and sinners awake;\nFaith in Jehovah makes anything shake.","n":1}]},{"n":112,"t":"Leave it there","k":"G","s":[{"p":"v","t":"If the world from you withhold of its silver and its gold,\nAnd you have to get along with meager fare,\nJust remember in His Word, how He feeds the little birds,\nTake your burden to the Lord and leave it there.","n":1},{"p":"c","t":"Leave it there, (Leave it there), leave it there, (Leave it there)\nTake your burden to the Lord and leave it there,\nIf you trust and never doubt, He will surely bring you out,\nTake your burden to the Lord and leave it there.","n":1},{"p":"v","t":"If your body suffers pain and your health you can\u2019t regain,\nAnd your soul is almost sinking in despair,\nJesus knows the pain you feel, He can save and He can heal;\nTake your burden to the Lord and leave it there.","n":2},{"p":"v","t":"When your enemies assail and your heart begins to fail,\nDon\u2019t forget that God in heaven answers prayers,\nHe will make a way for you and will lead you safely through,\nTake your burden to the Lord and leave it there.","n":3},{"p":"v","t":"When your youthful age is gone and old age is stealing on,\nAnd your body bends beneath the weight of care;\nHe will never leave you then, He\u2019ll go with you to the end,\nTake your burden to the Lord and leave it there.","n":4}]},{"n":113,"t":"I can, I will, I do believe","k":"Ab","s":[{"p":"v","t":"I can, I will, I do believe;\nI can, I will, I do believe;\nI can, I will, I do believe;\nThat Jesus heals me now.\n(I\u2019m trusting only in the Lord\u2026)","n":1}]},{"n":114,"t":"Isn\u2019t he wonderful","k":"Bb","s":[{"p":"v","t":"Isn\u2019t He wonderful, wonderful, wonderful?\nIsn\u2019t Jesus my Lord wonderful?\nEyes have seen, ears have heard what\u2019s recorded in His word,\nIsn\u2019t Jesus my Lord wonderful.","n":1}]},{"n":115,"t":"The life-boat","k":"G","s":[{"p":"v","t":"We are floating down the stream of time,\nWe have not long to stay;\nThe stormy clouds of darkness,\nWill turn to brightest day,\nThen let us all take courage,\nFor we\u2019re not left alone,\nThe life-boat soon is coming,\nTo gather the jewels home.","n":1},{"p":"c","t":"Then cheer, my brother, cheer,\nOur trials will soon be o\u2019er,\nOur loved ones we shall meet, shall meet,\nUpon the golden shore,\nWe are pilgrims and we are strangers here,\nWe are seeking a city to come,\nThe life-boat soon is coming,\nTo gather the jewels home.","n":1},{"p":"v","t":"Sometime the devil tempts me,\nAnd says it\u2019s all in vain,\nTo try to live a Christian life,\nAnd walk in Jesus\u2019 name,\nBut then we hear the Master say,\nI\u2019ll lend you a helping hand,\nAnd if you\u2019ll only trust Me,\nI\u2019ll guide you to that land.","n":2},{"p":"v","t":"The life-boat soon is coming,\nBy eyes of faith I see,\nAs she sweeps through the waters,\nTo rescue you and me,\nAnd land us safely in the port,\nWith friends we love so dear,\n\u201cGet ready\u201d, cries the Captain,\nOh, look, she\u2019s almost here.","n":3},{"p":"v","t":"Oh, now\u2019s the time to get on board,\nWhile she is passing by;\nBut if you stand and wait too long,\nYou shall forever die;\nThe fare is paid for one and all,\nThe Captain bids you come,\nAnd get on board the life-boat,\nShe\u2019ll carry you safely home.","n":4}]},{"n":116,"t":"It shall flow like a river","k":"C","s":[{"p":"v","t":"It shall flow like a river,\nIt shall fall like the rain,\nIt shall rise as the dew in morning o\u2019er the plain;","n":1},{"p":"v","t":"For the knowledge of the Lord shall fill all the earth\nWhen the Spirit of the Lord shall fall.","n":2},{"p":"v","t":"Flow, river, flow, river, flow\nFlow out through the nations wherever man may go,","n":3},{"p":"v","t":"Cause life to spring forth, that all men may know\nThat you\u2019re the river of the spirit\noh, flow, river, flow.","n":4}]},{"n":117,"t":"The great judgement","k":"C","s":[{"p":"v","t":"I dreamt that the great judgment morning\nHad dawned, and the trumpet had blown,\nI dreamt that the nations had gathered\nTo judgment before the white throne,\nFrom the throne came a bright shinning angel\nAnd stood on the land and the sea,\nAnd swore with his hand raised to heaven.\nThat time was longer to be.","n":1},{"p":"c","t":"And O, what a weeping and wailing\nAs the Lost were told of their fate;\nThey cried for the rocks and the mountains,\nThey prayed but their pray'r were too late.","n":1},{"p":"v","t":"The rich man was there, but his money\nHad melted and vanished away;\nA pauper he stood in the judgment,\nHis debts were too heavy to pay\nThe great man was there, but his greatness,\nWhen death came, was left far behind.\nThe angel that opened the records.\nNot a trace of his greatness could find.","n":2},{"p":"v","t":"The widow was there with the orphans,\nGod heard and remembered their cries;\nNo sorrow in heaven for ever,\nGod wiped all tears from their eyes;\nThe gambler was there and the drunkard\nAnd the man that had sold them the drink,\nWith the people who gave him the license,\nAt last they had found time to die.","n":3}]},{"n":118,"t":"I have crossed the riven veil","k":"Ab","s":[{"p":"v","t":"I\u2019ve believed the true report,\nHallelujah of the Lamb,\nI have passed the outer court,\nO glory be to God\nI am all on Jesus\u2019 side on the altar sanctified,\nTo the world and sin I\u2019ve died,\nHallelujah to the Lamb.","n":1},{"p":"c","t":"I have crossed the riven veil where the glory never fails.\nHallelujah, Hallelujah,\nI have crossed the riven veil where the glory never fails,\nFor I'm living in the presence of the King.","n":1},{"p":"v","t":"I\u2019m a king and priest of God\nHallelujah to the Lamb,\nBy the cleansing of the Blood\nO glory be to God\nBy the Spirit\u2019s pow\u2019r and Light\nI am living day and night\nIn the holiest place so bright,\nHallelujah to the Lamb.","n":2},{"p":"v","t":"I have passed the outer veil,\nHallelujah to the Lamb,\nWhich did once God\u2019s light conceal,\nO glory be to God\nBut the Blood has brought me in,\nTo God\u2019s holiness so clean,\nWhere there\u2019s death to self and sin\nHallelujah to the Lamb","n":3},{"p":"v","t":"I\u2019m within the holiest place\nHallelujah to the Lamb,\nI have passed the inner veil,\nO glory be to God\nBy the power of the Blood,\nI am sanctified to God,\nNow the Lord is my abode,\nHallelujah to the Lamb.","n":4}]},{"n":119,"t":"Room at the fountain","k":"F","s":[{"p":"v","t":"I heard my loving Saviour say,\nThere\u2019s room at the fountain for thee,\nCome, wash the stains of sin away,\nThere\u2019s room at the fountain for thee.","n":1},{"p":"c","t":"Room, room, yes, there is room,\nRoom at the fountain for thee,\nRoom, room, yes, there is room,\nThere\u2019s room at the fountain for thee.","n":1},{"p":"v","t":"I came to Him, my sins confessed,\nThere\u2019s room at the fountain for me;\nWhen I gave up, my heart was blest,\nThere\u2019s room at the fountain for me.","n":2},{"p":"v","t":"I plunged beneath the crimson tide,\nThere was room at the fountain for me,\nAnd now by faith I\u2019m sanctified,\nThere\u2019s room at the fountain for me.","n":3},{"p":"v","t":"I found the crimson stream I know,\nThere was room at the fountain for me,\nHis blood has washed me white as snow,\nThere was room at the fountain for me.","n":4},{"p":"v","t":"He cleansed my heart from inbred sin,\nThere was room at the fountain for me,\nAnd now He keeps me pure within,\nThere\u2019s room at the fountain for me.","n":5},{"p":"v","t":"I\u2019ll praise Him while He gives me breath,\nThere was room at the fountain for me,\nHe saved me from an awful death,\nThere\u2019s room at the fountain for me.","n":6},{"p":"v","t":"His blood was shed but once for all,\nThere was room at the fountain for thee,\nOh, don\u2019t reject sweet Mercy\u2019s call,\nThere\u2019s room at the fountain for thee.","n":7},{"p":"v","t":"We\u2019ll sing with all the saints above,\nThere was room at the fountain for thee,\nAnd praise Him for redeeming love,\nThere\u2019s room at the fountain for thee.","n":8}]},{"n":120,"t":"Come and go with me","k":"Ab","s":[{"p":"v","t":"Come and go with me to my Father\u2019s house,\nTo my Father\u2019s house, to my Father\u2019s house.\nCome and go with me to my Father\u2019s house,\nWhere there\u2019s peace, peace, peace.","n":1}]},{"n":121,"t":"Just another touch, Lord","k":"Eb","s":[{"p":"v","t":"Just another touch, Lord from You,\nTo help in hard trials I go through,\nThough dark may be the night,\nYou\u2019ve sent a ray of light,\nWhen I get another touch, Lord from You.","n":1}]},{"n":122,"t":"The pearly white city","k":"Eb","s":[{"p":"v","t":"There's a HoIy and beautiful city,\nWhose builder and ruIer is God,\nJohn saw it descend-ing from Heaven,\nWhen Patmos, in exile, he trod,\nIts high, massive wall is of jasper,\nThe city itself is pure gold,\nAnd when my frail tent here is folded\nMine eyes shall its glory behold.","n":1},{"p":"c","t":"In that bright city, pearly white city,\nI have a mansion, a harp and a crown;\nNow I am waiting and longing,\nFor the white city John saw coming down.","n":1},{"p":"v","t":"No sin is allowed in that city,\nAnd nothing defiling nor mean;\nNo pain and no sickness can enter;\nNo crape on the doorknob is seen,\nEarth's sorrows and cares are forgotten,\nNo tempter is there to annoy,\nNo parting words ever are spoken,\nThere's nothing to hurt and destroy.","n":2},{"p":"v","t":"No heartaches are known in that city\nNo tears ever moisten the eye,\nThere's no disappointment in Heaven,\nNo envy and strife in the sky,\nThe saints are all sanctified wholly,\nThey live in sweet harmony there;\nMy heart is now set on that city,\nAnd some day is blessing I'll share.","n":3},{"p":"v","t":"My loved ones are gathered yonder,\nMy friends, too are passing away;\nAnd soon I shall join their bright number,\nAnd dwell in eternity's day;\nThey're safe now in glory with Jesus,\nTheir trials and battles are past;\nThey overcome sin and the tempter,\nThey've reached that fair city at last.","n":4}]},{"n":123,"t":"Just a closer walk","k":"C","s":[{"p":"v","t":"Just a closer walk with Thee,\nGrant it Jesus is my plea,\nDaily, walking close to Thee,\nLet it be, dear Lord, let it be.\nThrough this world of toils and snares,\nIf I falter, Lord, who cares?\nWho with me my burden share?\nNone but Thee, dear Lord, none but Thee.","n":1},{"p":"c","t":"I am weak but Thou art strong,\nJesus keeps me from all wrong,\nI\u2019ll be satisfied as long\nAs I walk, let me walk close to Thee.","n":1},{"p":"v","t":"Just a closer walk with Thee,\nGrant it Jesus is my plea,\nDaily, walking close to Thee,\nLet it be, dear Lord, let it be.\nWhen my feeble life is o\u2019er,\nTime for me will be no more,\nGuide me gently, safely o\u2019er,\nTo Thy kingdom\u2019s shore, to Thy shore.","n":2},{"p":"v","t":"Just a closer walk with Thee,\nGrant it Jesus is my plea,\nDaily, walking close to Thee,\nLet it be, dear Lord, let it be.","n":3}]},{"n":124,"t":"The message of his coming","k":"C","s":[{"p":"v","t":"We\u2019re looking for His coming, in the clouds of heaven,\nComing back to earth to catch away His own;\nThen may we all be ready,\nWhen midnight cry is given,\nTo go and reign with Christ on His Throne.","n":1},{"p":"c","t":"Gladly may we herald the message of His blessed appearing,\nSoon He\u2019s coming in glory,\ntell to one and all;\nThen awake ye saints of the Lord, why slumber when the end is nearing,\nBut get ready for the final call.","n":1},{"p":"v","t":"We\u2019re longing for the glory that awaits the faithful,\nWho shall overcome, and every conflict win,\nPress ever bravely onward, the prize is life eternal,\nTo all who win the fight over sin.","n":2},{"p":"v","t":"We\u2019re praying for the advent, of our blessed Saviour,\nWho has promised life to all who trust His grace,\nHis coming now is pending,\nThe message being given,\nAnd soon we\u2019ll see our Lord face to face.","n":3},{"p":"v","t":"We see the signs appearing, of His blessed coming,\nLo, behold the fig leaves now becoming green;\nThe gospel of His kingdom has gone to every nation;\nThat we are near the end can be seen.","n":4}]},{"n":125,"t":"The sheep of his pasture","k":"F","s":[{"p":"v","t":"The sheep of His pasture have gathered\nTo hear what the Shepherd would say,\nHis voice like the sound of slow waters,\nCame rippling through vessels of clay.","n":1},{"p":"v","t":"\u2018Tis the voice that brought forth creation\nAnd set all the stars in array,\nAnd speaks words of Life and of wisdom,\nIn the midst of His people today.","n":2},{"p":"v","t":"Through prophets, by precious blood purchased,\nCleansed and surrendered and filled\nAnd set in the Body for service\nAs the Head of the Body hath willed.","n":3}]},{"n":126,"t":"Are you washed in the blood?","k":"Ab","s":[{"p":"v","t":"Have you been to Jesus for the cleansing power?\nAre you washed in the blood of the Lamb?\nAre you fully trusting in His grace this hour?\nAre you washed in the blood of the Lamb?","n":1},{"p":"c","t":"Are you washed in the blood,\nIn the soul-cleansing blood of the Lamb?\nAre your garments spotless? Are they white as snow?\nAre you washed in the blood of the Lamb?","n":1},{"p":"v","t":"Are you walking daily by the Saviour\u2019s side?\nAre you washed in the blood of the Lamb?\nAre you resting each moment in the Crucified?\nAre you washed in the blood of the Lamb?","n":2},{"p":"v","t":"When the Bridegroom cometh,\nwill your robes be white?\nPure and white in the blood of the Lamb?\nWill your soul be ready for the mansions bright?\nAnd be washed in the blood of the Lamb?","n":3},{"p":"v","t":"Lay aside the garments that are stained with sin,\nAnd be washed in the blood of the Lamb;\nThere\u2019s a fountain flowing for the soul unclean,\nOh, be washed in the blood of the Lamb.","n":4}]},{"n":127,"t":"Jesus loves me","k":"Eb","s":[{"p":"v","t":"Jesus loves me! This I know,\nFor the Bible tells me so,\nLittle ones to Him belong,\nThey are weak but He is strong.","n":1},{"p":"c","t":"Yes, Jesus loves me,\nYes, Jesus loves me,\nYes, Jesus loves me,\nThe Bible tells me so.","n":1},{"p":"v","t":"Jesus loves me! Loves me still,\nThough I\u2019m very weak and ill;\nFrom His shining throne on high,\nComes to watch me where I lie.","n":2},{"p":"v","t":"Jesus loves me! He who died,\nHeaven\u2019s gates to open wide,\nHe will wash away my sin,\nLet His little child come in.","n":3},{"p":"v","t":"Jesus loves me! He will stay,\nClose beside me all the way,\nThou hast bled and died for me,\nI will henceforth live for Thee.","n":4}]},{"n":128,"t":"Baptized into the body","k":"G","s":[{"p":"v","t":"Have you been baptized into the Body?\nBaptized with the Holy Ghost;\nThere is but one way to enter in it,\nJust as they did on Pentecost.","n":1},{"p":"c","t":"Are you in the Church Triumphant?\nAre you in the Saviour\u2019s Bride?\nCome and be baptized into the Body,\nAnd forever more abide.","n":1},{"p":"v","t":"There is but one Church, Bride or Body,\nAnd into it we\u2019re all baptized.\nBy the one, true promised Holy Spirit;\nThough by the world we\u2019re all despised.","n":2},{"p":"v","t":"Every creed has claimed to be the Body,\nTill the \u201cplumb line\u201d proved untrue.\nAll their dreams, for God was so determined,\nTo bring His Son\u2019s true Bride to view.","n":3},{"p":"v","t":"Many thought that they were in the Body,\nTill the Holy Ghost had come;\nWhen the Word of God was opened to them,\nThey entered in, and yet there\u2019s room.","n":4},{"p":"v","t":"Those who died before the Holy Spirit,\nCame upon us from on high;\nMay, by faith with saints of old departed\nArise to meet Him in the sky.","n":5},{"p":"v","t":"When the Bridegroom comes, will you be ready?\nAnd your vessel all filled and bright?\nYou will be among the foolish virgins\nIf you do not walk in the light.","n":6}]},{"n":129,"t":"This is like heaven to me","k":"F","s":[{"p":"v","t":"We find many people who can\u2019t understand,\nWhy we are so happy and free;\nWe\u2019ve crossed over Jordan to Canaan\u2019s fair land\nAnd this is like Heaven to me.","n":1},{"p":"c","t":"This is like Heaven to me (praise God!)\nYes, this is like Heaven to me;\nI\u2019ve crossed over Jordan to Canaan\u2019s fair land\nAnd this is like Heaven to me.","n":1},{"p":"v","t":"Oh, when I get happy, I sing and I shout,\nThe devil don\u2019t believe I see;\nBut I\u2019m filled with the Spirit, there isn\u2019t a doubt,\nAnd that\u2019s what\u2019s the matter with me.","n":2}]},{"n":130,"t":"What would you give in exchange","k":"G","s":[{"p":"v","t":"Brother afar from the Saviour today,\nRisking your soul from the things that decay,\nOh, if today, God should call it away,\nWhat would you give in exchange for your soul?","n":1},{"p":"c","t":"What would you give?\nWhat would you give?\nWhat would you give in\nexchange for your soul?\nOh, if today, God should call it\naway,\nWhat would you give in\nexchange for your soul?","n":1},{"p":"v","t":"Mercy is calling you, won\u2019t you give heed?\nMust the dear Saviour still tenderly plead?\nRisk not your soul, it is precious indeed;\nWhat would you give in exchange for your soul?","n":2},{"p":"v","t":"More than the silver and gold of the earth,\nMore than all jewels thy spirit is worth!\nGod, the Creator has given it birth!\nWhat would you give in exchange for your soul?","n":3},{"p":"v","t":"If, when you stand at the bar by and by,\nWhen you are weighed in the balance on high,\nYou should be sentenced forever to die,\nWhat would you give in exchange for your soul?","n":4}]},{"n":131,"t":"A wonderful time","k":"Bb","s":[{"p":"v","t":"A wonderful time is just ahead,\nThe Lord whom, we love and own;\nWill open the gates of glory land,\nRevealing His glory throne.","n":1},{"p":"c","t":"A wonderful time for you,\nA wonderful time for you,\nIf we are prepared to meet Jesus the King,\nA wonderful time it will be.","n":1},{"p":"v","t":"A wonderful time is just ahead,\nOur conflicts and trials passed;\nOur wilderness journey has an end,\nSafe home everyone at last.","n":2},{"p":"v","t":"A wonderful time is just ahead,\nThe groans of creation cease;\nAnd all that is held in bondage now,\nThe Lord will that day release.","n":3}]},{"n":132,"t":"When the Saviour reached down for me","k":"C","s":[{"p":"v","t":"Once my soul was astray from the heavenly way,\nAnd was wretched and vile as could be;\nBut my Saviour above, gave me peace, joy and love,\nWhen He reached down His hand for me, for me.","n":1},{"p":"c","t":"When He reached down His hand for me,\nWhen He reached down His hand for me,\nI was lost and undone, without God or His Son,\nWhen my Saviour reached down for me, for me.","n":1},{"p":"v","t":"I was nearing despair, when He came to me there,\nAnd He showed me that I could be free;\nThen He lifted my feet, gave me glory complete;\nWhen He reached down His hand for me.","n":2},{"p":"v","t":"How my heart doth rejoice, since I made Him my choice,\nFrom the tempest to Him now I flee;\nNow I lean on His arm, I\u2019m secure from all harm,\nSince He reached down His hand for me.","n":3},{"p":"v","t":"Since the Lord gave me peace, heavenly joys never cease,\nLord, I give all my life unto Thee;\nGuide my feet, hold my hand, grant with Thee I may stand,\nFor He reached down His hand for me.","n":4}]},{"n":133,"t":"Bring them in","k":"Ab","s":[{"p":"v","t":"Hark! \u2018Tis the Shepherd\u2019s voice I hear,\nOut in the desert dark and drear,\nCalling the sheep who\u2019ve gone astray,\nFar from the Shepherd\u2019s fold away.","n":1},{"p":"c","t":"Bring them in, Bring them in,\nBring them in, from the fields of sin;\nBring them in, Bring them in,\nBring the wandering ones to Jesus.","n":1},{"p":"v","t":"Who\u2019ll go and help the Shepherd\u2019s kind\nHelp Him the wandering ones to find?\nWho\u2019ll bring the lost ones to the fold,\nWhere they\u2019ll be sheltered from the cold?","n":2},{"p":"v","t":"Out in the desert hear their cry,\nOut on the mountains wild and high;\nHark! \u2018Tis the Master speak to thee,\n\u201cGo find My sheep wherever they be\u201d.","n":3}]},{"n":134,"t":"Old time power","k":"F","s":[{"p":"v","t":"They were in the upper chamber,\nThey were all in one accord,\nWhen the Holy Ghost descended\nAs was promised by our Lord.","n":1},{"p":"c","t":"O Lord, send the power just now,\nO Lord, send the power just now,\nO Lord, send the power just now,\nAnd baptize everyone.","n":1},{"p":"v","t":"Yes, this pow\u2019r from heaven descended,\nWith the sound of rushing wind;\nTongues of fire came down upon them,\nAs the Lord said He would send.","n":2},{"p":"v","t":"Yes, this \u201cold-time\u201d pow\u2019r was given,\nTo our fathers who were true;\nThis is promised to believers,\nAnd we all may have it too.","n":3}]},{"n":135,"t":"There is power in the blood","k":"Bb","s":[{"p":"v","t":"Would you be free from your burden of sin?\nThere is power in the blood, power in the blood;\nWould you o\u2019er evil a victory win?\nThere is wonderful power in the blood.","n":1},{"p":"c","t":"There is power, power, wonder-working power,\nIn the blood of the Lamb;\nThere is power, power, wonder-working power,\nIn the precious blood of the Lamb.","n":1},{"p":"v","t":"Would you be free from your passion and pride?\nThere is power in the blood, power in the blood;\nCome, for a cleansing to Calvary\u2019s tide,\nThere is wonderful power in the blood.","n":2},{"p":"v","t":"Would you be whiter,\nmuch whiter than snow?\nThere is power in the blood, power in the blood;\nSin\u2019s stains are lost in its life-giving flow,\nThere is wonderful power in the blood.","n":3},{"p":"v","t":"Would you do service for Jesus your King?\nThere is power in the blood, power in the blood;\nWould you live daily, His praises to sing?\nThere is wonderful power in the blood.","n":4}]},{"n":136,"t":"The solid rock","k":"F","s":[{"p":"v","t":"My hope is built on nothing less\nThan Jesus\u2019 blood and righteousness;\nI dare not trust the sweetest frame,\nBut wholly lean on Jesus\u2019 name.","n":1},{"p":"c","t":"On Christ, the solid Rock, I stand;\nAll other ground is sinking sand;\nAll other ground is sinking sand.","n":1},{"p":"v","t":"When darkness seems to hide his face,\nI rest on His unchanging grace;\nIn every high and stormy gale,\nMy anchor holds within the veil.","n":2},{"p":"v","t":"His oath, His covenant, His blood,\nSupport me in the whelming flood;\nWhen all around my soul gives way,\nHe then is all my hope and stay.","n":3},{"p":"v","t":"When He shall come with trumpet sound,\nOh, may I then in Him be found;\nDressed in His righteousness alone,\nFaultless to stand before the throne.","n":4}]},{"n":137,"t":"He abides","k":"G","s":[{"p":"v","t":"I\u2019m rejoicing night and day\nAs I walk the narrow way;\nFor the hand of God in all my life I see,\nAnd the reason of my bliss,\nYes, the secret all is this;\nThat the Comforter abides with me.","n":1},{"p":"c","t":"He abides, He abides,\nHallelujah, He abides with me!\nI\u2019m rejoicing night and day\nAs I walk the narrow way,\nFor the Comforter abides with me.","n":1},{"p":"v","t":"Once my heart was full of sin,\nOnce I had no peace within,\nTill I heard how Jesus died upon the tree;\nThen I fell down at His feet,\nAnd there came a peace so sweet,\nNow the Comforter abides with me.","n":2},{"p":"v","t":"He is with me everywhere,\nAnd He knows my every care;\nI\u2019m as happy as a bird and just as free,\nFor the Spirit has control,\nJesus satisfies my soul,\nSince the Comforter abides with me.","n":3},{"p":"v","t":"There\u2019s no thirsting for the things of the world they\u2019ve taken wings,\nLong ago I gave them up and instantly,\nAll my night was turned to day\nAll my burdens rolled away,\nNow the Comforter abides with me.","n":4}]},{"n":138,"t":"Redeemed","k":"Ab","s":[{"p":"v","t":"Redeemed, how I love to proclaim it!\nRedeemed by the blood of the Lamb;\nRedeemed through His infinite mercy,\nHis child, and forever, I am.","n":1},{"p":"c","t":"Redeemed, redeemed,\nRedeemed by the blood of the Lamb;\nRedeemed, redeemed,\nHis child, and forever,\nI am.","n":1},{"p":"v","t":"Redeemed and so happy in Jesus,\nNo language my rapture can tell;\nI know that the light of His presence,\nWith me doth continually dwell","n":2},{"p":"v","t":"I think of my blessed Redeemer,\nI think of Him all the day long;\nI sing, for I cannot be silent;\nHis love is the theme of my song.","n":3},{"p":"v","t":"I know I shall see in His beauty;\nThe King in whose law I delight;\nWho lovingly guardeth my footsteps,\nAnd giveth me song in the night.","n":4}]},{"n":139,"t":"Nothing but the blood","k":"F","s":[{"p":"v","t":"What can wash away my sin?\nNothing but the blood of Jesus;\nWhat can make me whole again?\nNothing but the blood of Jesus.","n":1},{"p":"c","t":"Oh, precious is the flow,\nThat makes me white as snow;\nNo other fount I know;\nNothing but the blood of Jesus.","n":1},{"p":"v","t":"For my cleansing this I see,\nNothing but the blood of Jesus;\nFor my pardon this my plea,\nNothing but the blood of Jesus.","n":2},{"p":"v","t":"Nothing can for sin atone,\nNothing but the blood of Jesus;\nNaught of good that I have done,\nNothing but the blood of Jesus.","n":3},{"p":"v","t":"This is all my hope and peace,\nNothing but the blood\nof Jesus;\nThis is all my righteousness,\nNothing but the blood\nof Jesus.","n":4},{"p":"v","t":"Now by this I\u2019ll overcome,\nNothing but the blood of Jesus;\nNow by this I\u2019ll reach my home,\nNothing but the blood of Jesus.","n":5},{"p":"v","t":"Glory! Glory! Thus I sing,\nNothing but the blood of Jesus,\nAll my praise for this I bring,\nNothing but the blood of Jesus.","n":6}]},{"n":140,"t":"Jesus, the light","k":"F","s":[{"p":"v","t":"All ye saints of light proclaim,\nJesus, the light of the world;\nLife and mercy in His name,\nJesus, the light of the world.","n":1},{"p":"c","t":"We\u2019ll walk in the light, beautiful light,\nCome where the dewdrops of mercy are bright;\nShine all around us by day and by night,\nJesus, the light of the world.","n":1},{"p":"v","t":"Hear the Saviour\u2019s earnest call,\nJesus, the light of the world;\nSend the Gospel truth to all,\nJesus, the light of the world.","n":2},{"p":"v","t":"Why not seek Him then today,\nJesus, the light of the world;\nGo with truth the narrow way,\nJesus, the light of the world.","n":3},{"p":"v","t":"Come, confess Him as your King,\nJesus, the light of the world;\nThen the bells of heav\u2019n will ring,\nJesus, the light of the world.","n":4}]},{"n":141,"t":"When we see Christ","k":"D","s":[{"p":"v","t":"Oft-times the day seems long, our trials hard to bear;\nWe\u2019re tempted to complain, to murmur and despair;\nBut Christ will soon appear to catch His bride away,\nAll tears forever over, in God\u2019s eternal day.","n":1},{"p":"c","t":"It will be worth it all, when we see Jesus;\nLife\u2019s trials will seem so small, when we see Christ,\nOne glimpse of His dear face, all sorrow will erase,\nSo bravely run the race till we see Christ.","n":1},{"p":"v","t":"Sometimes the sky looks dark, with not a ray of light;\nWe\u2019re tossed and driven on, no human help in sight,\nBut there is One in heaven, who knows our deepest care,\nLet Jesus solve your problem, just go to Him in prayer.","n":2},{"p":"v","t":"Life\u2019s day will soon\nbe o\u2019er, all storms forever past,\nWe\u2019ll cross the great divide, to glory safe at last,\nWe\u2019ll share the joys of heaven, a harp, a home, a crown;\nThe tempter will be banished, we\u2019ll lay our burden down.","n":3}]},{"n":142,"t":"Blessed be the fountain","k":"D","s":[{"p":"v","t":"Blessed be the fountain of blood,\nTo a world of sinners revealed;\nBlessed be the dear Son of God,\nOnly by His stripes we are healed,\nThough, I\u2019ve wandered far from His fold,\nBringing to my heart pain and woe,\nWash me in the blood of the Lamb\nAnd I shall be whiter than snow.","n":1},{"p":"c","t":"Whiter than the snow!\nWhiter than the snow!\nWash me in the blood of the Lamb,\nAnd I shall be whiter than snow.","n":1},{"p":"v","t":"Thorny was the crown that He wore,\nAnd the cross the body overcame;\nGrievous were the sorrows He bore,\nBut He suffered thus not in vain.\nMay I to that fountain led,\nMade to cleanse my sins here below,\nWash me in the blood that He shed\nAnd I shall be whiter than snow.","n":2},{"p":"v","t":"Father, I have wandered from Thee,\nOften has my heart gone astray,\nCrimson do my sins seem to me,\nWater cannot wash them away,\nJesus, to that fountain of Thine,\nLeaning on Thy promise, I go,\nCleanse me, by Thy washing divine,\nAnd I shall be whiter than snow.","n":3}]},{"n":143,"t":"All hail the power of Jesus name","k":"Bb","s":[{"p":"v","t":"All hail the pow\u2019r of Jesus\u2019 name,\nLet angels prostrate fall;\nBring forth the royal diadem,\nAnd Crown Him Lord of all.","n":1},{"p":"v","t":"Ye chosen seed of Israel\u2019s race,\nYe ransomed from the fall,\nHail Him Who saves you by His grace,\nAnd Crown Him Lord of all.","n":2},{"p":"v","t":"Sinners, whose love can ne\u2019er forget,\nThe wormwood and the gall,\nGo spread your trophies at His feet,\nAnd Crown Him Lord of all.","n":3},{"p":"v","t":"Let every kindred, every tribe,\nOn this terrestrial ball,\nTo Him all majesty ascribe,\nAnd Crown Him Lord of all.","n":4},{"p":"v","t":"O that with yonder sacred throng,\nWe at His feet may fall;\nWe\u2019ll join the everlasting song,\nAnd Crown Him Lord of all.","n":5}]},{"n":144,"t":"At the cross","k":"Eb","s":[{"p":"v","t":"Alas! And did my Saviour bleed,\nAnd did my Sovereign die?\nWould He devote the sacred heed,\nFor such a worm as I?","n":1},{"p":"c","t":"At the cross, at the cross, where I first saw the light,\nAnd the burden of my heart rolled away,\nIt was there by faith I received my sight,\nAnd now I am happy all the day.","n":1},{"p":"v","t":"Was it for crimes that I have done,\nHe groaned upon the tree?\nAmazing pity, grace unknown,\nAnd love beyond degree!","n":2},{"p":"v","t":"Well might the sun in darkness hide,\nAnd shut His glories in,\nWhen Christ, the mighty Maker died,\nFor man, the creature\u2019s sin.","n":3},{"p":"v","t":"But drops of grief can ne\u2019er repay,\nThe debt of love I owe;\nHere, Lord I give myself away;\n\u2018Tis all that I can do.","n":4}]},{"n":145,"t":"The great I am","k":"Ab","s":[{"p":"v","t":"I AM that spoke to Moses in the burning bush of fire,\nI AM the God of Abraham, the Bright and Morning Star,\nI AM the Rose of Sharon, from beginning whence I came,\nI AM the whole creation, and Jesus is my name.","n":1},{"p":"c","t":"Oh, who do you say I am, and whence do you say I came,\nDo you know the Father, and can you tell His name?\nIn Jesus dwells the fullness of the God-head, don\u2019t you see;\nJesus is the great I AM, and the Lord of lords is He.","n":1},{"p":"v","t":"I AM was before old Abraham, He rejoiced to see My day;\nWhen Jesus spoke these precious words,\nThey stoned Him right away,\n\u201cWhy do you stone Me?\u201d Jesus said, in a holy sweet command,\n\u201cBecause you say you\u2019re the great I AM, we believe you\u2019re just a man.","n":2},{"p":"v","t":"It was on the Day of Pentecost, oh, how the fire did fall;\nThe Holy Ghost descended and filled them one and all,\nThen Peter told the multitude, \u201cRepent of all your sins\u201d.\nAbout three thousand souls were buried in Jesus precious name.","n":3}]},{"n":146,"t":"Almost persuaded","k":"","s":[{"p":"v","t":"Almost persuaded, now to believe,\nAlmost persuaded, Christ to receive;\nSeem.s now some souls to say, \u2018go, Spirit, Go Thy way\nSome more convenient day, on Thee I\u2019ll call","n":1},{"p":"v","t":"Almost persuaded, come, come today,\nAlmost persuaded, turn not away\nJesus invites you here, angels are lingering near\nPrayers rise from hearts so dear;\nO wanderer, come.","n":2},{"p":"v","t":"Almost persuaded, harvest is past!\nAlmost persuaded, doom, comes at last!\nAlmost cannot avail, Almost, it is but to fail!\nSad, sad, that bitter wail, Almost \u2013 but \u2013 lost!","n":3}]},{"n":147,"t":"No disappointment","k":"Eb","s":[{"p":"v","t":"There\u2019s no disappointment in heaven,\nNo weariness, sorrow or pain,\nNo hearts that are bleeding and broken;\nNo song with a minor refrain,\nThe clouds of our earthly horizon\nWill never appear in the sky,\nFor all will be sunshine and gladness,\nWith never a sob nor a sigh.","n":1},{"p":"c","t":"I\u2019m bound for the beautiful city\nMy Lord has prepared for His own,\nWhere all the redeemed of all ages,\nSing \u201cGlory\u201d around the white throne;\nSome times I grow homesick for Heaven\nAnd the glories, I there shall behold,\nWhat a joy that will be when my Saviour I see;\nIn that beautiful city of gold.","n":1},{"p":"v","t":"We\u2019ll never pay rent for our mansion,\nThe taxes will never come due;\nOur garments will never grow threadbare,\nBut always be fadeless and new.\nWe\u2019ll never be hungry nor thirsty;\nNor languish in poverty there\nFor all the rich bounties of heaven,\nHis sanctified children will share.","n":2},{"p":"v","t":"There\u2019ll never be crape on the doorknob\nNo funeral train in the sky;\nNo graves on the hillsides of glory;\nFor there we shall never more die.\nThe old will be young there forever,\nTransformed in a moment of time;\nImmortal we\u2019ll stand in His likeness,\nThe stars and the sun to outshine.","n":3}]},{"n":148,"t":"Happy day","k":"G","s":[{"p":"v","t":"O happy day, that fixed my choice,\nOn Thee my Saviour and my God,\nWell may this glowing heart rejoice,\nAnd tell its raptures all abroad.","n":1},{"p":"c","t":"Happy day, Happy day,\nWhen Jesus washed my sins away!\nHe taught me how to watch and pray,\nAnd live rejoicing everyday,\nHappy day, Happy day,\nWhen Jesus washed my sins away!","n":1},{"p":"v","t":"O happy bond, that seals my vows,\nTo Him who merits all my love!\nLet cheerful anthems fill His house,\nWhile to that sacred shrine I move.","n":2},{"p":"v","t":"\u2018Tis done, the great transaction done!\nI am my Lord\u2019s and He is mine;\nHe drew me, and I followed on;\nCharmed to confess the voice divine.","n":3},{"p":"v","t":"High heaven, that heard the solemn vow,\nThat vow renewed shall daily hear\nTill in life\u2019s latest hour I bow\nAnd bless in death a bond so dear.","n":4}]},{"n":149,"t":"One of them","k":"Ab","s":[{"p":"v","t":"There are people almost everywhere,\nWhose hearts are all aflame,\nWith the fire that fell at Pentecost,\nWhich cleansed and made them clean;\nIt is burning now within my heart,\nAll glory to His name!\nI\u2019m so glad that I can say I am one of them.","n":1},{"p":"c","t":"One of them, One of them,\nI\u2019m so glad that I can say I am one of them,\nOne of them, one of them,\nI\u2019m so glad that I can say I am one of them.","n":1},{"p":"v","t":"Though these people may not learned be,\nNor boast of worldly fame,\nThey have all received their Pentecost,\nBaptized in Jesus\u2019 name,\nAnd are telling now, both far and wide,\nHis pow\u2019r is yet the same,\nI\u2019m so glad that I can say I am one of them.","n":2},{"p":"v","t":"They were gathered in the upper room,\nAll praying in His name\nThey were baptized with the Holy Ghost,\nAnd pow\u2019r for service came,\nNow what He did for them that day,\nHe\u2019ll do for you the same,\nI\u2019m so glad that I can say I\u2019m one of them.","n":3},{"p":"v","t":"Come, my brother, seek this blessing,\nThat will cleanse your heart from sin,\nThat will start the joy-bells ringing,\nAnd will keep the soul aflame,\nIt is burning now within my heart,\nAll glory to His name!\nI\u2019m so glad that I can say I am one of them.","n":4}]},{"n":150,"t":"I\u2019ll be listening","k":"G","s":[{"p":"v","t":"When the Saviour calls, I will answer;\nWhen He calls for me, I will hear,\nWhen the Saviour calls, I will answer;\nI\u2019ll be somewhere list\u2019ning for my name.","n":1},{"p":"c","t":"I\u2019ll be somewhere list\u2019ning,\nI\u2019ll be somewhere list\u2019ning,\nI\u2019ll be somewhere list\u2019ning,\nfor my name,\nI\u2019ll be somewhere list\u2019ning,\nI\u2019ll be somewhere list\u2019ning,\nI\u2019ll be somewhere list\u2019ning,\nfor my name.","n":1},{"p":"v","t":"If my heart is right when He calls me,\nIf my heart is right I will hear,\nIf my heart is right when He calls me,\nI\u2019ll be somewhere list\u2019ning for my name.","n":2},{"p":"v","t":"If my robe is white when He calls me,\nIf my robe is white I will hear,\nIf my robe is white when He calls me,\nI\u2019ll be somewhere list\u2019ning for my name.","n":3}]},{"n":151,"t":"The home coming week","k":"G","s":[{"p":"v","t":"Upon our journey here below we meet with pain and loss,\nSometimes there is crown of thorns,\nSometimes the heavy cross,\nThe dreary road to calvary, the bitter goad and sting\nBut what\u2019s inside those gates of pearl will be worth everything.","n":1},{"p":"c","t":"When we\u2019re inside the gate of pearl\nWe\u2019ll learn a lot of things\nWe\u2019ll have a harp that\u2019s made of gold,\nPerhaps a thousand strings,\nWe\u2019ll sing and shout and dance about,\nThe Lamb will dry out tears,\nWe\u2019ll have a grand home-coming week,\nThe first ten thousand years.","n":1},{"p":"v","t":"The shadows now begin to fall, the time is drawing nigh,\nWhen Christ our Lord shall come again like lightning from the sky,\nAnd while we wait and suffer here, praise God, we\u2019ll shout and sing,\nFor one glimpse through those gates of pearl will be worth everything.","n":2},{"p":"v","t":"The precious blood of God\u2019s own\nSon has saved and sanctified,\nA wondrous people for His name and they are called the bride.\nThough here neglected and despised, one day the Lord will bring\nHis chosen ones within the gates, and that\u2019s worth everything.","n":3}]},{"n":152,"t":"Just as I am","k":"Eb","s":[{"p":"v","t":"Just as I am without one plea,\nBut that Thy blood was shed for me,\nAnd that thou bidd\u2019st me come to Thee,\nO Lamb of God, I come!\nI come!","n":1},{"p":"v","t":"Just as I am, and waiting not,\nTo rid my soul of one dark blot,\nTo Thee, whose blood can cleanse each spot,\nO Lamb of God, I come!\nI come!","n":2},{"p":"v","t":"Just as I am, Thou will receive,\nWilt welcome, pardon, cleanse, relieve;\nBecause Thy promise I believe,\nO Lamb of God, I come!\nI come!","n":3},{"p":"v","t":"Just as I am, Thy love unknown,\nHath broken every barrier down;\nNow to be Thine, yea, Thine alone,\nO Lamb of God, I come!\nI come!","n":4}]},{"n":153,"t":"Peace in the valley","k":"Eb","s":[{"p":"v","t":"Well, I\u2019m tired and so weary, but I must go along;\nTill the Lord comes and calls me away, oh yes;\nWell the morning is bright, and the Lamb is the Light;\nAnd the night, night is as fair as the day, oh yes.","n":1},{"p":"c","t":"There\u2019ll be peace in the valley for me some day;\nThere\u2019ll be peace in the valley for me, oh Lord, I pray;\nThere will be no sadness, no sorrow, no troubles I\u2019ll see,\nThere\u2019ll be peace in the valley for me.","n":1},{"p":"v","t":"There the flow\u2019rs will be blooming, and the grass will be green,\nAnd the skies will be clear and serene, oh yes,\nWell the sun ever beams, in this valley of dreams,\nAnd no clouds there will ever be seen, oh yes.","n":2},{"p":"v","t":"Well, the bear will be gentle, and the wolf will be tame;\nAnd the lion shall lay down by the Lamb, oh yes,\nWell the beast from the wild, shall be led by a little child;\nAnd I\u2019ll be changed, changed from this creature that I am, oh yes.","n":3}]},{"n":154,"t":"I\u2019ve anchored in Jesus","k":"Bb","s":[{"p":"v","t":"Upon life\u2019s boundless ocean where mighty billows roll,\nI\u2019ve fixed my hope in Jesus, blest anchor of my soul;\nWhen trials fierce assail me as storms are gathering o\u2019er,\nI rest upon His mercy and trust Him more.","n":1},{"p":"c","t":"I\u2019ve anchored in Jesus,\nthe storms of life I\u2019ll brave,\nI\u2019ve anchored in Jesus,\nI fear no wind or wave;\nI\u2019ve anchored in Jesus,\nfor He hath pow\
