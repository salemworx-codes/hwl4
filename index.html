rful story of love;\nThough you are far away.\nWonderful story of love;\nStill He doth call to day\nCalling from Calvary\u2019s mountain\nDown from the crystal bright fountain\nEve\u2019 from the dawn of creation\nWonderful story of love.","n":2},{"p":"v","t":"Wonderful story of\nlove,\nJesus provides a rest;\nWonderful story of love;\nFor all the pure and blest;\nRest in those mansions above us,\nWith those who\u2019ve gone before us,\nSinging the rapturous chorus\nWonderful story of love.","n":3}]},{"n":510,"t":"I want to be a worker","k":"Ab","s":[{"p":"v","t":"I want to be a worker for the Lord,\nI want to love and trust His Holy word;\nI want to sing and pray, and be busy everyday\nIn the kingdom of the Lord.\n1.","n":1},{"p":"c","t":"I will work (and pray),\nI will pray (work and pray)\nIn the vineyard, in the vineyard of the Lord; (of the Lord)\nI will work, I will pray,\nI will labour everyday in the vineyard of the Lord.","n":1},{"p":"v","t":"I want to be a worker everyday,\nI want to lead the erring in the way\nThat leads to heaven above, where all is peace and love,\nIn the kingdom of the Lord.\n2.","n":2},{"p":"v","t":"I want to be a worker strong and brave,\nI want to trust in Jesus\u2019 power to save;\nAll who will truly come, shall find a happy home\nIn the kingdom of the Lord.\n3.","n":3},{"p":"v","t":"I want to be a worker, help me, Lord,\nTo lead the lost and erring to Thy word;\nThat points to joys on high, where pleasures never die\nIn the kingdom of the Lord.\nI will work (and pray),\nI will pray (work and pray)\nIn the vineyard, in the vineyard of the Lord; (of the Lord)\nI will work, I will pray,\nI will labour everyday in the vineyard of the Lord.\nChorus:","n":4}]},{"n":511,"t":"It\u2019s not an easy road","k":"E","s":[{"p":"v","t":"It\u2019s not an easy road,\nWe are going to heaven\nFor many are the thorns on the way;\nIt\u2019s not an easy road\nBut the Saviour is with us\nHis presence gives us joy everyday.","n":1},{"p":"c","t":"No, no, it\u2019s not an easy road No, no, it\u2019s not an easy road\nBut Jesus walks beside us\nAnd brightens the journey\nHis presence gives us joy everyday.","n":1},{"p":"v","t":"It\u2019s not an easy road,\nThere are trials and troubles\nAnd many other dangers we meet,\nBut Jesus guides and keeps us\nSo nothing can harm us,\nAnd smooth the rugged path for our feet.","n":2},{"p":"v","t":"Though I am often tired\nAnd weary of troubles\nThough I am often bowed down with care\nA blessed day is coming\nIn the morning of glory\nWe\u2019ll rest in perfect peace over there.\nNo, no, it\u2019s not an easy road\nNo, no, it\u2019s not an easy road\nBut Jesus walks beside us\nAnd brightens the journey\nHis presence gives us joy everyday.","n":3}]},{"n":512,"t":"We all shall meet in heaven","k":"","s":[{"p":"v","t":"How sweet the hour of praise and prayer,\nWhen our devotions blend,\nAnd on the wings of faith divine,\nOur songs of joy ascend!\n\u2018Tis then we hear in tones more clear\nThe gracious promise given,\nThat, though we part from friends on earth,\nWe all shall meet in heaven.\n1.","n":1},{"p":"c","t":"We all shall meet in heaven at last,\nWe all shall meet in heaven;\nThrough faith in Jesus\u2019 precious blood,\nWe all shall meet in heaven.","n":1},{"p":"v","t":"How sweet the tie of hallowed love\nThat binds our hearts in one;\nWhen gathered in the blessed name\nOf Christ, the Father\u2019s Son!\nAnd though the parting soon may come\nYet in His word is given\nThe blessed hope that by and by\nWe all shall meet in heaven.\n2.","n":2},{"p":"v","t":"Yes, soon our worn and weary feet\nWill reach the golden strand,\nWhere those we love our coming wait\nIn yonder summer land;\nA few more days, a few more years,\nBy storm and tempest driven,\nWith songs and everlasting joy,\nWe all shall meet in heaven.","n":3}]},{"n":513,"t":"A God like you","k":"","s":[{"p":"v","t":"Who can touch like you\nOr heal us like you do\nWe stumble and we stray\nTill you always get us through,\n1.\nWho makes all things new and comes to our rescue\nDeath, hell and the grave\nThey could not conquer.","n":1},{"p":"c","t":"Everybody wanna be like they\nWant power and praise like you but\nSee there is no God like our God,\nThere\u2019s no one like you and\nWho paid a price like you see\nThere\u2019s only one God that\u2019s our God\nThere\u2019s no one like you.","n":1},{"p":"v","t":"You became just like me\nTo unlock and set free\nThis prisoner that was deeply\nwounded and redeemed\nthe me I could not see\nBridge:","n":2},{"p":"v","t":"Some may worship things\nBut what joy do they bring\nThey try and hide the stains\nbut can they set us free,\n2.\nSee where would we be\nwithout Calvary\na king upon a tree\nso the whole world can see.","n":3},{"p":"v","t":"Healer, Father, Saviour\nCounselor, friend, provider\nWas, is and forever\nThat\u2019s why I just wanna be where you are\nI\u2019ll travel life with you no matter how far\nBridge 2:\nYou became just like me\nTo unlock and set free\nThis prisoner that was deeply\nwounded and redeemed\nthe me I could not see\nBridge:","n":4},{"p":"v","t":"There\u2019s no one like you 2x\nThere\u2019s no God like our God\nThere\u2019s no one like you 3x\nThere\u2019s no God like our God\nThere\u2019s no one like you\n-\n(Repeat\u2026)\nCODA:","n":5}]},{"n":514,"t":"A gift to you","k":"","s":[{"p":"v","t":"For whosoever will save his life shall lose it: and whosoever will lose his life for my sake shall find it.\n\nMatthew 16:25\nEverything I am\neverything I\u2019ll be;\nI give it to You Lord\nand do it thankfully","n":1},{"p":"c","t":"Every song I sing\nevery praise I bring,\nEverything I do\nis a gift to You","n":1},{"p":"v","t":"While I was with them in the world, I kept them in thy name: those that thou gavest me I have kept, and none of them is lost, but the son of perdition; that the scripture might be fulfilled.\n\nJohn 17:12\nEverything I am\neverything I\u2019ll be\nI give it to You Lord\nand do it thankfully","n":2},{"p":"v","t":"And they said unto Moses, Thy servants have taken the sum of the men of war which are under our charge, and there lacketh not one man of us.\n\nNumbers 31:49\nEverything I have\nall You\u2019ve given me;\nI give it to You Lord\nand do it thankfully","n":3},{"p":"v","t":"Is a Gift to You.","n":4}]},{"n":515,"t":"A song of peace","k":"","s":[{"p":"v","t":"{SOLO}\nIf I could write a magic song\nthat everyone could sing,\nI would write of love,\nof hope and joy, and\nthings that peace could bring.\nAnd when we sang\nmy magic song, all\nhate and war would\ncease,\nIf I could write a\nmagic song, I\u2019d write\na song of peace.","n":1},{"p":"c","t":"{ALL}\nOne song for all of us\nOne song could bring\nus peace\nOne song could\nmake a miracle for\nall of us\nA song of peace.","n":1},{"p":"v","t":"With just one song,\none magic song that\neveryone could sing,\nWe could sing of\nlove, of hope and\njoy, and things that\npeace could bring.\nAnd when we sang\nour magic song, all\nhate and war would\ncease\nWith just one song,\none magic song, the\nworld could fill with\npeace.","n":2}]},{"n":516,"t":"Absent from the body","k":"Bb","s":[{"p":"v","t":"I\u2019m going home one day\nI\u2019m going home to stay\nI am going home, yes home\nlet us go\u2026","n":1},{"p":"v","t":"I \u2018ll be absent from the body\npresent with the Lord.","n":2},{"p":"v","t":"Halleluyah, present with the Lord\nThank You Jesus, present with the Lord\nEverybody talking about Heaven\nAin\u2019t you going there you\npresent with the Lord.","n":3},{"p":"v","t":"Do you know what it is\nCan I tell you how it is\nOh to know how it feels to be in the presence of the King\nSweet presence, God\u2019s presence\nExperience fullness of Joy, God presence.\nIt\u2019s an honour and privilege to be in the presence of the King.\nI\u2019m so honour to be in the presence of the King(2ce).","n":4}]},{"n":517,"t":"All power all glory all honour belongs to God","k":"","s":[{"p":"v","t":"GBOGBO AGBARA\nGBOGBO AGBARA\nGBOGBO AGBARA\nTI JESU NI","n":1},{"p":"v","t":"IKE O\nIKE NILE\nIKE O\nBULU NKE YA","n":2},{"p":"v","t":"LA PUISSANCE\nLA PUISSANCE\nLA PUISSANCE\nDE JEHOVAH","n":3},{"p":"v","t":"DUKAR KARFI\nDUKAR KARFI\nDUKAR KARFI\nNA YESU NE","n":4}]},{"n":518,"t":"All the way to Calvary","k":"","s":[{"p":"v","t":"Although I had so many sins\nJesus took the all away\nAnd He pardoned me (2ce)","n":1},{"p":"c","t":"All the way to Calvary He went for me,\nHe went for me,\nHe went for me,\nAll the way to Calvary He went for me,\nHe died to set me free.","n":1}]},{"n":519,"t":"Almighty God","k":"","s":[{"p":"v","t":"Almighty God (4x)\nYou are worthy to receive all our praise\nYou reign forevermore","n":1},{"p":"v","t":"You reign forevermore","n":2}]},{"n":520,"t":"Always","k":"","s":[{"p":"v","t":"I love to sing Your praise\nmy sweet Savior\nI remind my heart of all You've\ndone for me\nwhen I think of all\nthe ways that You've been faithful I rejoice to know\nthat\u2019s how You\u2019ve always been","n":1},{"p":"v","t":"Always forever and forever\nYou will be my God\nYou will always be the Shepherd of my soul","n":2},{"p":"v","t":"Always forever and ever\nYou will be my God\nYou will always be the same\nand forever You will reign\nI will live to praise Your name always","n":3}]},{"n":521,"t":"Amen (it is so)","k":"","s":[{"p":"v","t":"He has saved us\u2026Amen!\nHe has redeemed us\u2026Amen!\nHe will heal us\u2026Amen!\nWhen we call\u2026Amen!\nAnd when affliction\u2026Amen!\nCome on the righteous\u2026Amen!\nHe will deliver us out of them all.","n":1},{"p":"c","t":"Amen!(4ce)\nIt is so(2ce)","n":1},{"p":"v","t":"He is Alpha\u2026Amen!\nAnd Omega\u2026Amen!\nHe\u2019s the Beginning\u2026Amen!\nAnd the End\u2026Amen!\nThough every trial\u2026Amen!\nTribulation\u2026Amen!\nHe always causes His people to win.","n":2},{"p":"v","t":"(And we say)\n\nYes! (repeat)\nYes!!!\n(Every promises)\n-\nYes and Amen(3ce)\nIt is so(2ce)","n":3}]},{"n":522,"t":"And praise","k":"","s":[{"p":"v","t":"When We will Stand Before His Throne\nMillions Who Have Heard\nWell Done\nThen We Will Take His Name\nAnd Praise And Praise","n":1},{"p":"c","t":"There Will Be No More\nPain Nor Sorrow or shame\nthen we will take his name and praise, and praise","n":1},{"p":"v","t":"See How Beautiful He Looks\nFinally The Bride And Groom\nWill Meet\nThen We Will Take His Name\nAnd Praise And Praise\n,","n":2},{"p":"v","t":"There will be a wedding feast\nfinally the Bride and Groom will meet\nThen we will take His name\nand praise and praise","n":3}]},{"n":523,"t":"Angel voices, ever singing","k":"C","s":[{"p":"v","t":"Angel voices, ever singing, round Thy throne of light,\nAngel harps, forever ringing,\nRest not day or night;\nThousands only live to bless Thee,\nAnd confess Thee Lord of might.\n1.","n":1},{"p":"v","t":"Thou who art beyond the farthest mortal eye can scan,\nCan it be that Thou regardest songs of sinful man?\nCan we feel that Thou art near us and wilt hear us? Yes, we can.\n2.","n":2},{"p":"v","t":"Lord, we know Thy love rejoices o\u2019er each work of Thine;\nThou didst ears and heads and voices for Thy praise combine;\nCraftsman\u2019s art and music\u2019s measure\nFor Thy pleasure didst design.\n3.","n":3},{"p":"v","t":"Here, great God, today we offer of Thine own to Thee,\nand for Thine acceptance proffer, all unworthily\nHearts and minds, and hands and voices,\nIn our choicest melody.\n4.","n":4},{"p":"v","t":"Honour, glory, might and merit,\nThine shall ever be,\nJesus Christ the God of heaven blessed be Thy name,\nOf the best that Thou hast given\nEarth and Heaven render Thee.\nLast Verse\nEnd . . .","n":5}]},{"n":524,"t":"Another year with God","k":"","s":[{"p":"v","t":"Another year is drawing:\nDear Father, let it be,\nIn working or in waiting,\nAnother year with Thee.","n":1},{"p":"v","t":"Another year of progress,\nAnother year of praises,\nAnother year of proving,\nThy presence all the days.","n":2},{"p":"v","t":"Another year of mercies,\nOf faithfulness and grace,\nAnother year of gladness,\nIn the shining of Thy face.","n":3},{"p":"v","t":"Another year of leaning,\nUpon Thy loving breast,\nAnother year of trusting,\nOf quiet happy rest.","n":4},{"p":"v","t":"Another year of service,\nOf witness of Thy love,\nAnother year of training,\nFor holier work above.","n":5},{"p":"v","t":"Another year is drawing,\nDear Father, let it be,\nOn earth or else in heaven,\nAnother year for Thee.","n":6}]},{"n":525,"t":"Arugbo ojo","k":"","s":[{"p":"v","t":"The heavens declare your power and loyalty\nLord you reign,\nKing of all ages you are the ancient of days Lord You reign\nYour throne is established in justice and righteousness\nLord You reign\nGreat are You Lord and greatly to be praise\nLord you reign\nI cry Holy Holy is my God\nLet Your power and Glory fill this place","n":1},{"p":"v","t":"Arugbo ojo (2ce)\niwo la seda la weda laseda ooo\nArugbo ojo(2ce)\niwo lo ni iyin kabo kabo\nma ro ra arugbo ojo","n":2},{"p":"v","t":"Ooooo\u2026..\nLord we praise you,\nyour majesty.","n":3}]},{"n":526,"t":"As the hart panteth","k":"","s":[{"p":"v","t":"With my whole heart\nHave I sought Thee\nOh, let me not wander from\nThy commandment (2ce)\nThy word have I hid in my heart\nThat I might not sin against Thee\nMy soul thirst Lord\nMore after Thee","n":1},{"p":"v","t":"As the hart panteth for water\nSo my soul panteth after Thee\nOh! Lord my God\nIn Thee I trust\nMy soul thirsteth for my God\nHe\u2019s my shield and my defender\nMy soul thirst Lord more after Thee.","n":2}]},{"n":527,"t":"As we gather","k":"","s":[{"p":"v","t":"As we gather, may Your Spirit work within us,\nAs we gather, may we glorify Your name,","n":1},{"p":"c","t":"Knowing well that as our hearts begin to worship,\nWe\u2019ll be blessed because we came.","n":1},{"p":"v","t":"We\u2019ll be blessed because we came.\nThe steadfastness of the Lord never ceaseth,\nHis mercies shall never come to an end;\nThey are new every morning; new every morning;\nGreat is Thy faithfulness oh Lord\nGreat is Thy faithfulness.","n":2}]},{"n":528,"t":"Awesome God","k":"","s":[{"p":"v","t":"God is awesome God\nHe reigns from Heaven above,\nWith wisdom and power and love,\nOur God is an awesome God.","n":1},{"p":"c","t":"Our God is an awesome God He\nReigns from Heaven above\nWith wisdom, pow\u2019r and love Our God is\nan awesome God\nOur God is an awesome God","n":1},{"p":"v","t":"Down when He rolls up sleeves\nHe ain\u2019t just putting on the ritz\n\nOur God is an awesome God\n\nThere\u2019s thunder in His Footsteps,\nlightning in His fists\nOur God is an awesome God\nSOLO:\nSOLO:\nRESPONSE:\nRESPONSE:\nAnd the Lord wasn\u2019t joking\nWhen He kicked them out of Eden\nIt wasn\u2019t for no reason that\nHe shed His blood\nHis return is very close and\nSo you\u2019d better be believing that\n\nOur God is an awesome\nSOLO:\nRESPONSE:","n":2},{"p":"v","t":"Now when the sky was starless\nin the dead of night\n(Our God is an awesome)\nHe spoke into the darkness and created light\n(Our God is an awesome)\nThe judgement what he power\nout on Sodom\nThe mercy and grace he gave us\nat the cross\nI hope that we have not too quickly\nforgotten that\n(Our God is an awesome).","n":3}]},{"n":529,"t":"Awesome love","k":"F#","s":[{"p":"v","t":"Before I spoke a word,\nYou were singing over me,\nYou\u2019ve been so good to me,\nbefore I took a breath,\nYou breathed Your life in me,\nYou have been so so kind to me.","n":1},{"p":"c","t":"O the overwhelming never ending awesome love of God,\nO it chases me down fight till I\u2019m found,\nleaves the ninety nine,\nI couldn\u2019t earn it and I don\u2019t deserve it,\nstill, You give Yourself away,\nO the overwhelming never ending awesome love of God.","n":1},{"p":"v","t":"When I was Your foe, still Your love fought for me,\nYou have been so so good to me,\nWhen I felt no worth, You paid it all for me,\nYou have been so so good to me.","n":2},{"p":"v","t":"There\u2019s no shadow You won\u2019t light up,\nMountain You won\u2019t climb up,\nComing after me,\nThere\u2019s no wall You won\u2019t kick down,\nLie You won\u2019t tear down,\nComing after me. (4ce)\nBridge:","n":3}]},{"n":530,"t":"Be bold","k":"","s":[{"p":"v","t":"I\u2019m bold I'm strong, for the lord our God is with me 2x\nI am not afraid, I am not Ashamed because I work in faith and victory 2x\nFor the lord our God he is with me","n":1}]},{"n":531,"t":"Be thankful","k":"","s":[{"p":"v","t":"I\u2019m thankful for my daily bread,\nI\u2019m thankful for Your protection,\nI\u2019m thankful for journey mercies,\nCause Jesus is good to me.\n1.","n":1},{"p":"c","t":"Be thankful, for all He has done,\nBe thankful, from the bottom of your heart,\nBe thankful, come on everyone if Jesus is good to you.","n":1},{"p":"v","t":"I\u2019m thankful, for my brand new shirt,\nI\u2019m thankful, for the trousers on my legs,\nI\u2019m thankful, for the shoes on my feet,\nCause Jesus is good to me.\n2.","n":2}]},{"n":532,"t":"Be unto your name","k":"","s":[{"p":"v","t":"We are a moment, You are forever Lord of ages,\nGod before time\nWith a vapor, You are eternal,\nLove everlasting, reigning on high.","n":1},{"p":"c","t":"Holy, holy Lord God Almighty,\nWorthy is the lamb Who was slain,\nHighest praises, honor and glory,\nBe unto Your name, be unto Your name.","n":1},{"p":"v","t":"We are broken, You are the healer,\nJesus, Redeemer, mighty to save,\nYou are the love song we\u2019ll sing forever,\nBowing before You, blessing Your name.","n":2},{"p":"v","t":"Be unto Your name.","n":3}]},{"n":533,"t":"Beautiful feet","k":"E","s":[{"p":"v","t":"Beautiful are the feet of those who carry this gospel. They go were they are sent without a compliment. Yet they still smile. Sometimes crying inside. Beautiful(3x).They have beautiful feet","n":1},{"p":"c","t":"So don\u2019t give up on this gospel,\nDon\u2019t let life destroy your faith,\nSo don\u2019t give up on this message. Beautiful(3x).They have beautiful feet.","n":1},{"p":"v","t":"Beautiful are the feet of those who carry this gospel. Oh if you only knew the things that they go through. Yet they still care. They inspire others to live. Beautiful(3x).They have beautiful feet.","n":2},{"p":"v","t":"Beautiful(3x).They have beautiful feet.","n":3}]},{"n":534,"t":"Because of who you are","k":"","s":[{"p":"v","t":"Because of who You are\nI will lift my hands,\nI will lift my heart\nAnd sing a song of love to You\nBecause of who You are\nI offer You my life\nSurrendering my all\nA living sacrifice to You\nBecause of who You are\nEverything You are","n":1},{"p":"v","t":"I give You all the glory\nI give You all the praise\nI pledge to You each moment\nfor the length of all my days\nmy rock and my redeemer\nmy savior and my strength\nOh, I will ever praise YOU\nYES, I will ever praise You(2x)\nLord because of who You are","n":2},{"p":"v","t":"Because of Who You are.","n":3}]},{"n":535,"t":"Behold our God . (choir ministration)","k":"","s":[{"p":"v","t":"Who has held the oceans in His hands?\nWho has numbered every grain of sand?\nKings and nations tremble at His voice,\nAll creations rises to rejoice.","n":1},{"p":"c","t":"Behold our God, sitted on His throne,\nCome let us adore Him,\nBehold our King, nothing can compare,\nCome let us adore Him.","n":1},{"p":"v","t":"Who has given counsel to the Lord?\nWho can question any of His Words?\nWho can teach the one who\nknows all things?\nWho can fatom all His wondrous deeds?","n":2},{"p":"v","t":"Who has felt the nails upon His hands?\nBearing all the guilt of sinful mark,\nGod eternal, humble to the grave,\nJesus, Saviour, risen now to reign.","n":3},{"p":"v","t":"You will reign forever,\nLet Your glory fill the earth.\nBridge:","n":4}]},{"n":536,"t":"Behold,behold","k":"","s":[{"p":"v","t":"Behold, Behold, I stand at the door and knock,knock,knock.\nBehold, Behold, I stand at the door and knock,knock,knock.\nIf any one hears my voice, If any one hears my voice.\nAnd will open,open,open the door,and I\u2019ll come in.","n":1},{"p":"v","t":"Jesus bids us shine, with a clear, pure light,\nlike a little candle burning in the night;\nIn this world of darkness we must shine,\nYou in your small corner and I in mine.","n":2},{"p":"v","t":"Jesus bids us shine, first of all for him,\nwell he sees and knows it if our light is dim;\nHe looks down from Heaven\nsees us shine,\nYou in your small corner and I in mine.","n":3},{"p":"v","t":"Jesus bids us shine ,then, for all around,\nMany kinds of darkness in the world around,\nSin and want and sorrow, we must shine;\nYou in your small corner and I in mine","n":4},{"p":"v","t":"Jesus bids us shine, as we work for Him,\nBringing those that wander from the paths of sin,\nHe will ever help us if we shine,\nYou in your small corner and I in mine.","n":5}]},{"n":537,"t":"Beneath the cross of Jesus","k":"Db","s":[{"p":"v","t":"Beneath the Cross of Jesus\nI fain to take my stand\nThe shadow of a mighty Rock,\nWithin a weary land\nA home within the wilderness,\nA rest upon the way,\nFrom the burning of the noontide heat,\nAnd the burden of the day.\n1.","n":1},{"p":"v","t":"O safe and happy shelter,\n\tO refuge tried and sweet,\nO trysting place where heaven\u2019s love\nAnd heaven\u2019s justice meet,\nAs to the holy patriarch\n\tThat wondrous dream was given,\nSo seems my Saviour\u2019s cross to me,\nA ladder up to heaven\n2.","n":2},{"p":"v","t":"There lies, beneath its shadow\nBut on the farther side,\nThe darkness of an awful grave\nThat gapes both deep and wide;\nAnd there between us stands the cross,\nTwo arms outstretched to save;\nLike a watchman set to guard the way\nfrom that eternal death.","n":3},{"p":"v","t":"Upon that cross of Jesus\nmine eyes at times can see\nThe very dying form of one\nWho suffered there for me\nAnd from my smitten heart, with tears,\nTwo wonders I confess\nThe wonder of his glorious love,\nAnd my own worthlessness.","n":4},{"p":"v","t":"I take, O cross, thy shadow\nfor my abiding place\nI ask no other sunshine than\nthe sunshine of his face\ncontent to let the world go by\nto know no gain nor loss\nmy sinful self my only shame,\nmy glory all the cross.\nLast verse","n":5}]},{"n":538,"t":"Bind us together","k":"","s":[{"p":"v","t":"There is only one God,\nThere is only one King;\nThere is only one Body,\nThat is why we sing:","n":1},{"p":"c","t":"Bind us together, Lord,\nBind us together\nWith cords that cannot be broken.\nBind us together, Lord,\nBind us together, Lord,\nBind us together with love.","n":1},{"p":"v","t":"Made for the glory of God,\nby His precious Son;\nBorn with the right to be clean,\nFor Jesus the victory has won.","n":2},{"p":"v","t":"You are the family of God,\nYou are the promise Divine;\nYou the God\u2019s chosen desire,\nYou are the glorious new wine.","n":3}]},{"n":539,"t":"Blessed are you","k":"G","s":[{"p":"v","t":"Blessed are You O Lord our God\nEternity\u2019s holy King\nBlessed are You O Lord our God\nWhose Word brings on the evening\nBar\u2019chu et Adonai ham\u2019vorch l\u2019olam vaed\nBar\u2019chu et Adonai ham\u2019vorch l\u2019olam vaed","n":1},{"p":"c","t":"By wisdom O Lord\nHeaven\u2019s gates open up\nWith understanding You order the seasons\nCreating day and night\nTurning darkness into light\nArranging the stars to Your pleasing","n":1},{"p":"v","t":"O blessed be the King\nTo the Holy One we sing\nLord of Hosts is Your name\nO everliving God rule over us\nNow and forever the same.","n":2}]},{"n":540,"t":"Blessed be the Lord God","k":"","s":[{"p":"v","t":"And let the whole earth be filled With His glory","n":1},{"p":"v","t":"Amen, Amen, Amen, Amen.","n":2},{"p":"v","t":"Blessed be the name,\nBlessed be the name,\nBlessed be the name\nOf the Lord(2ce)","n":3}]},{"n":541,"t":"Blessing and honor","k":"","s":[{"p":"v","t":"Blessing and honor and glory and power,\nWisdom and riches and strength evermore\nGive ye to him who our battle hath won,\nWhose are the kingdom, the crown, and the throne.","n":1},{"p":"v","t":"Ever ascendeth the song and the joy;\nEver descendeth the love from on high;\nBlessing and honor and glory and praise\nThis is the theme of the hymns that we raise.","n":2},{"p":"v","t":"Give we the glory and praise to the Lamb;\nTake we the robe and the harp and the palm;\nSing we the song of the Lamb that was slain,\nDying in weakness, but rising to reign.\nEnd.","n":3}]},{"n":542,"t":"Blow ye the trumpet blow","k":"","s":[{"p":"v","t":"Blow ye the trumpet blow,\nThe gladly solemn sound,\nLet all the nations know,\nTo earth\u2019s remotest bound,","n":1},{"p":"c","t":"The year of jubilee is come!\nReturn, ye ransomed sinners, home.","n":1},{"p":"v","t":"Extol the lamb of God,\nThe all-atoning lamb;\nRedemption by His blood,\nThroughout the world proclaim.","n":2},{"p":"v","t":"Ye who have sold for nought,\nYour heritage above,\nReceive it back unbought,\nThe gift of Jesus\u2019 love.","n":3},{"p":"v","t":"Jesus is our Great High Priest,\nHath full atonement made;\nYe weary spirit, rest;\nYe mournful souls, be glad.","n":4},{"p":"v","t":"Hearts that are weary, come,\nRest on the Saviour\u2019s breast,\nDisconsolate heart, come,\nBe cheerful and rejoice.","n":5}]},{"n":543,"t":"Bo ekom do","k":"","s":[{"p":"v","t":"Sia fomu tieghe\ninte owoo (2ce),\nBor ekom do o,\nAyanga owo ke mfon,\nBor ekom do o,","n":1},{"p":"v","t":"Ukpono eyene fi,\nBor ekom do o,\nAyanga owoo nke nfon,\nBor ekom do o,\nUkpono eyene fi.","n":2}]},{"n":544,"t":"Bring in the children","k":"","s":[{"p":"v","t":"Bring the children, O bring them today;\nSpeak to them gently, and show them the way;\nCareless they wander, and thoughtless they roam;\nBring the children, for here is their home","n":1},{"p":"c","t":"Bring, O bring the children, O bring them today\nO bring them today; bring, O bring the children,\nO bring them in today.","n":1},{"p":"v","t":"Bring in the children, O seek them abroad,\nwin them from evil, and train them for God;\nGladly our mission O let us fulfill, knowing that Jesus will be with us still","n":2},{"p":"v","t":"Bring in the children, so friendless and poor;\nJoy to their hearts will the Savior restore\nBring the children, compel them to come\nJesus invites them, and yet there is room","n":3}]},{"n":545,"t":"Call Jesus my wonderful councellor","k":"","s":[{"p":"v","t":"I call on Jesus wonderful councellor,\nOh, Glory Hallelujah(2ce), Glory Hallelujah to the risen King (3ce)","n":1},{"p":"v","t":"Living he loved me,\nDying he saved me,\nBuried he carried my sins far away,\nRising He justified, freed me forever,\nOne day he\u2019s coming back,\nGlorious day.","n":2},{"p":"v","t":"Oh, Glory Hallelujah, Glory Hallelujah to the risen King (3ce)","n":3},{"p":"v","t":"Send it on down (2ce)\nLord, let thy Holy Ghost come on down,\nSend it on down (2ce)\nLord, let thy Holy Ghost come on down.","n":4},{"p":"v","t":"Glory Hallelujah to the risen King,\nGlory Hallelujah to the risen King.","n":5}]},{"n":546,"t":"Called me higher","k":"","s":[{"p":"v","t":"I could just sit,\nI could just sit and wait,\nFor all Your goodness,\nHope to feel Your presence,\nAnd I could just stay,\nI could stay right where I am,\nAnd hope to feel You,\nHope to feel something again,\nAnd I could hold on,\nI could hold on to who I am,\nAnd never let you, change me from the inside,\nAnd I could be safe,\noh, I could be safe here in Your arms,\nAnd never leave home,\nNever let these walls down.","n":1},{"p":"c","t":"But You have called me higher,\nYou have called me deeper,\nAnd I\u2019ll go where You lead me Lord,\nBut You have called me higher,\nYou have called me deeper,\nAnd I\u2019ll go where You lead me Lord,\nYou lead me Lord.","n":1}]},{"n":547,"t":"Cast me not away from thy presence","k":"","s":[{"p":"v","t":"Cast me not away from thy presence; and take not thy holy spirit from me.","n":1},{"p":"v","t":"Restore unto me the joy of thy salvation;","n":2},{"p":"v","t":"And renew right spirit within me.","n":3}]},{"n":548,"t":"Casting crowns","k":"","s":[{"p":"v","t":"Casting crowns, Lifting hands,\nBowing hearts is all we\u2019ve come to do.","n":1},{"p":"v","t":"Adonai! Adonai! Adonai!\nYou reign on high","n":2},{"p":"v","t":"We will rise in Your name,\nAdonai! You reign on high.","n":3}]},{"n":549,"t":"Children of the heavenly king","k":"G","s":[{"p":"v","t":"Children of the heav\u2019nly King,\nAs you journey, sweetly sing;\nSing your Saviour\u2019s worthy praise,\nGlorious in His works and ways.","n":1},{"p":"v","t":"We are trav\u2019ling home to God,\nIn the way the pilgrims trod;\nThey are happy now, and we,\nSoon their happiness shall see.","n":2},{"p":"v","t":"Lift your eyes and see the light,\nZion\u2019s city is in sight!\nThere our endless home shall be;\nThere our Lord we soon shall see.","n":3},{"p":"v","t":"Fear not, children, joyful stand,\nOn the borders of your land;\nJesus Christ, your Father\u2019s Son,\nBids you undismayed go on.","n":4},{"p":"v","t":"Lord, obediently we go,\nGladly leaving all\nbelow;\nLead us now in all we do,\nAnd we still will follow You.\nLast verse","n":5}]},{"n":550,"t":"Chorus hallelujah!","k":"D","s":[{"p":"v","t":"Hallelujah! Hallelujah!\nHallelujah! Hallelujah! Hallelujah!\nHallelujah! Hallelujah!\nHallelujah! Hallelujah! Hallelujah!","n":1},{"p":"c","t":"For the Lord God omnipotent reigneth,\nHallelujah! Hallelujah!\nHallelujah! Hallelujah!","n":1},{"p":"v","t":"Hallelujah! Hallelujah!\nHallelujah! Hallelujah!\nHallelujah! Hallelujah!\nHallelujah! Hallelujah!\nHallelujah! Hallelujah!\nThe kingdom of this world is become the kingdom of our Lord and of His Christ, and of His Christ.\nAnd He shall reign forever and ever,\nAnd He shall reign forever and ever,\nAnd He shall reign forever and ever.\nAnd He shall reign forever and ever,\nKing of kings\u2026..\nForever and ever, Hallelujah, Hallelujah,\nAnd Lord of lords\u2026..\nForever and ever, Hallelujah, Hallelujah.\nKing of kings\u2026..\nForever and ever, Hallelujah, Hallelujah,\nAnd Lord of lords\u2026..\nForever and ever, Hallelujah, Hallelujah.\nKing of kings\u2026..\nForever and ever, Hallelujah, Hallelujah,\nAnd Lord of lords\u2026..\nForever and ever, Hallelujah, Hallelujah.\nAnd He shall reign, And He shall reign, And He shall reign,\nAnd He shall reign forever and ever.\nKing of kings\u2026..\nForever and ever,\nAnd Lord of lords\u2026..\nHallelujah, Hallelujah,\nAnd He shall reign forever, forever and ever.\nKing of kings, and Lord of lords,\nHallelujah, Hallelujah,\nHallelujah, Hallelujah.\nHallelujah.","n":2}]},{"n":551,"t":"Christ receiveth sinful men","k":"D","s":[{"p":"v","t":"Sinners, Jesus will receive,\nSound this word of grace to all\nWho the heavenly pathway leave\nAll who linger, all who fall.\n1.","n":1},{"p":"c","t":"Sing it o\u2019er and o\u2019er again\nChrist receiveth sinful men\nMake the message clear and plain\nChrist receiveth sinful men.","n":1},{"p":"v","t":"Come and He will give you rest\nTrust Him, for His word is plain\nHe will take the sinfulest\nChrist receiveth sinful men\n2.","n":2},{"p":"v","t":"Now my heart condemns me not\nPure before the law I stand\nHe who cleansed me from all spots\nSatisfied its last demand.\n3.","n":3},{"p":"v","t":"Christ receiveth sinful men,\nEven me with all my sin\nPurged from every spot and stain\nHeaven with Him I enter in.","n":4}]},{"n":552,"t":"Chukwoma","k":"Eb","s":[{"p":"v","t":"My life was crowned with misery,\nMy hopes were drowned as in the sea;\nMy God is good\u2026 Chiobi omim\nEh yes there is a name that\u2026\nSent His word with healing,\nMy life gave a meaning\nChineke oma Chiobioma\u2019m eh","n":1},{"p":"c","t":"Chukwoma onye oma nna,\nChukwoma onye oma nna;\nChukwoma haha Chi obi oma.","n":1},{"p":"v","t":"Let every tongue and tribe,\nSing His praise with all your mind;\nProclaim His grace,\nMy God is good Chiobi oma\u2019m eh\nIgbo, Hausa, Yoruba, Benin, Ijo\nCome lets give Him praise,\nFor all He has done\nChineke oma Chiobi oma\u2019m\nCall: That is why we call His name\u2026\nResp: Chineyenwa, Chinazamekpere, Chidinma, Chinazanjo, Chineyem ike, Chibu udo, Chineke oma, Chiobioma.","n":2}]},{"n":553,"t":"Come to Jesus","k":"C","s":[{"p":"v","t":"Weak and wounded sinner,\nLost and left to die,\nRaise your hands,\nFor Love is passing by,","n":1},{"p":"v","t":"Come to Jesus,\nCome to Jesus,\nCome to Jesus, And live.","n":2},{"p":"v","t":"Now your burdens lifted and carried far away,\nAnd precious blood has washed away the sins,","n":3},{"p":"v","t":"So sing to Jesus,\nSing to Jesus,\nSing to Jesus,\nAnd live.","n":4},{"p":"v","t":"And like a new born baby,\nDon't be afraid to crawl,\nAnd remember when you walk, sometimes we fall,","n":5},{"p":"v","t":"So fall on Jesus,\nFall on Jesus,\nFall on Jesus,\nAnd live.","n":6},{"p":"v","t":"Sometimes the way is lowly and steep and filled with pain,\nSo if your sky is dark and pours the rain,","n":7},{"p":"v","t":"Then cry to Jesus,\nCry to Jesus,\nCry to Jesus,\nAnd live.","n":8},{"p":"v","t":"Oh, and when the Love spills over,\nAnd music fills the night,\nAnd when you can\u2019t contain the joy inside,","n":9},{"p":"v","t":"Then dance for Jesus,\nDance for Jesus,\nDance for Jesus,\nAnd live.","n":10},{"p":"v","t":"With your final heartbeat,\nKiss the world goodbye,\nThen go in peace and laugh on glory side,","n":11},{"p":"v","t":"And fly to Jesus,\nFly to Jesus,\nFly to Jesus,\nAnd live.","n":12}]},{"n":554,"t":"Come unto me","k":"","s":[{"p":"v","t":"My heart lifts for You\nWhen I behold Your love\nTake me as I am my Lord\nlet me fall in Your hands","n":1},{"p":"c","t":"Come unto me\nTake me as I am\nCome onto me my Lord","n":1},{"p":"v","t":"My lips will sing praises all about You\nCome unto me\nTake me just I am\nIf man wishes could be horses forever\nI will ride to places all over in Your name\nTake me as just I am","n":2},{"p":"v","t":"My lips will sing praises all about You\nCome unto me\nTake me just I am\nIf thou shouldest mark iniquities O Lord\nWho shall stand before Thee2x\nTake me as just I am2x","n":3}]},{"n":555,"t":"Come, christians, join to sing","k":"A","s":[{"p":"v","t":"Come, Christian join to sing, Alleluia! Amen!\nLoud praise to Christ our King; Alleluia! Amen!","n":1},{"p":"v","t":"Let all with heart and voice,\nBefore His throne rejoice;\nPraise is His gracious choice; Alleluia! Amen!","n":2},{"p":"v","t":"Come, lift your hearts on high;\nAlleluia! Amen!\nLet praises fill the sky; Alleluia! Amen!","n":3},{"p":"v","t":"He is our Guide and Friend;\nTo us He\u2019ll condescend;\nHis love shall never end:\nAlleluia! Amen!","n":4},{"p":"v","t":"Praise yet our Christ again; Alleluia! Amen!\nLife shall not end the strain; Alleluia! Amen!","n":5}]},{"n":556,"t":"Communion","k":"Bb","s":[{"p":"v","t":"O the blood of Jesus\nO the blood of Jesus\nO the blood of Jesus\nIt washes white as snow","n":1},{"p":"v","t":"Wash me in the fountain of thy blood\nNothing else can save me\nbut your love\nJesus Saviour lamb of God above\nCome and wash me in the fountain of your blood","n":2},{"p":"v","t":"Oh, precious is the flow,\nThat makes me white as snow;\nNo other fount I know;\nNothing but the blood of Jesus.","n":3},{"p":"v","t":"Oh oh oh\u2026\nOh oh oh\nNothing but the blood of Jesus","n":4}]},{"n":557,"t":"Day is dying in the west","k":"Ab","s":[{"p":"v","t":"Day is dying in the west,\nHeav\u2019n is touching earth with rest;\nWait and worship while the night\nSets her evening lamps alight,\nThro all the sky.","n":1},{"p":"c","t":"Holy, holy, holy, Lord God of Host!\nHeav\u2019n and earth are full of thee!\nHeav\u2019n and earth are praising Thee,\nOh Lord most high.","n":1},{"p":"v","t":"Lord of life, beneath the dome of the universe,\nThy home\nGather us who seek Thy face;\nTo the fold of Thy embrace,\nFor Thou art nigh.","n":2},{"p":"v","t":"While the deepening shadows fall,\nHeart of love, enfolding all;\nThro the glory and the grace,\nOf The stars That veil Thy face,\nOur hearts ascend.","n":3},{"p":"v","t":"When forever from our sight pass the stars, the day, the night,\nLord of angels, on our eyes;\nLet eternal morning rise,\nAnd shadows end.","n":4}]},{"n":558,"t":"Do you know my Jesus","k":"","s":[{"p":"v","t":"Have you a heart that\u2019s weary\nTending a load of care\nAre you a soul that\u2019s seeking\nrest from the burden you bear?","n":1},{"p":"v","t":"Do you know my Jesus?\nDo you know my friend\nHave you heard He loves you\nAnd that He will abide till the end?","n":2},{"p":"v","t":"Who knows your disappointment?\nWho hears each time you cry?\nWho understands your heartaches?\nWho dries the tears from your eyes?","n":3},{"p":"v","t":"Do you know my Jesus?\nDo you know my friend\nHave you heard He loves you\nAnd that He will abide till the end?\nChorus:","n":4}]},{"n":559,"t":"Don\u2019t cry for me","k":"","s":[{"p":"v","t":"Don\u2019t cry for me,\nDon\u2019t shed tears,\nI am being set free,\nYou need not to feel,\nGod spoke to me,\nMy time has come,\nHe make a way to bring me home.","n":1},{"p":"c","t":"Don\u2019t cry for me,\nMy pain is gone forever,\nDon\u2019t cry for me, my body has been made whole,\nDon\u2019t cry for me, we\u2019ll soon be back together,\nDon\u2019t cry for me, I\u2019m well within my soul.","n":1},{"p":"v","t":"I saw a light,\nI took His hand,\nHe flew on high to promise land,\nMy soul is in a better place,\nWith all His glory,\nWith all His grace.","n":2},{"p":"v","t":"My pain is gone,\nPlease understand,\nMy passing once in God\u2019s great plan.\nI\u2019m with you each day and night,\nJust close your eye I will hold you tighter.","n":3},{"p":"v","t":"I feel your pain,\nDon\u2019t give up hope,\nOur love remains,\nI\u2019ll wait for you at heaven\u2019s door,\nWe\u2019ll meet again one day for sure.","n":4}]},{"n":560,"t":"Draw me close to you bb","k":"","s":[{"p":"v","t":"Draw me close to You.\nNever let me go.\nI lay it all down again,\nto hear you say that am your friend.\nYou are my desire.\nNo one else will do.\nCause nothing else can take Your place,\nTo feel the warmth of Your embrace.\nHelp me find a way,\nbring me back to You.","n":1},{"p":"v","t":"You\u2019re all I want,\nyou\u2019re all I\u2019ve ever needed,\nyou\u2019re all I want,\nHelp me know You are near.","n":2}]},{"n":561,"t":"Draw me nearer draw me nearer, Lord\u2026 draw me nearer, nearer to thee\u2026","k":"","s":[{"p":"v","t":"I need you every moment\nDraw me closer\u2026\nDraw me closer, closer to Thee\u2026","n":1},{"p":"c","t":"My song everyday\u2026Father draw me nearer,\nDraw me nearer, nearer to Thee\u2026","n":1}]},{"n":562,"t":"Eluwa o me bi go","k":"","s":[{"p":"v","t":"Eluwa o me bi go,\no lu ninanyi lu lua gwuo\n(o lu ninanyi lu lua gwuo)\nLo te kwa nu I fe me lu na mbu\n(me lu na mbu)\nI kea gwu, e goa gwuo\n(e goa gwuo)\no gini ka ma du ga agwu chi ya naa zu\n(ogini nu)\no ri ka kwa o jo ka kwa\neluwa si ka kwa n\u2019l ke u wa di na chi\u2026.","n":1},{"p":"v","t":"o nwe luo fu nwa a mu wa mu\n(o nwe luo fu nwa a mu wa mu)\nma a fa ya bu (o no nu gbu)\no nwe ro nne,\no nwe roi nna\non we r\u2019i gwu\non we ri be\non we ro nwa nne m\u2019o bu nwa nna\nya ne sia anya mao ma roi fe o gae\np o ko ko ko ko ko ko ko ko ko\nu wa di na chi","n":2},{"p":"v","t":"O no nu gbu yara ni meo fia we reo nou gu\no no nu gbu gara we rio rou gu\no no nu gbu we rio reu gu\nu gu di mma, (u gu di mma)\nu gu di mma, (u gu di mma)\nu gu bu lu bu bu o no nu gbu\no gi ni kpa ta lu nwa ji bi li pio\no gi ni kpa ta lu nwa ji\nbi li no fia","n":3},{"p":"v","t":"E lu wa di jo nezia\ne lu wa di jo\nu waa jo lka","n":4}]},{"n":563,"t":"Every move I make","k":"F","s":[{"p":"v","t":"Na Na Na Na Na Na Na\nEvery move I make in You\nYou make me move Jesus\nEvery breath I take, I breathe in You.\nEvery step I take, I take in You.\nYou are my way Jesus\nEvery breath I take, I take in You.\nNa Na Na Na Na Na Na","n":1},{"p":"v","t":"Wares of mercy, wares of grace\nEverywhere I look I see Your face\nYour love has captured me\nOh my God\nThis love how can it be\nNa Na Na Na Na Na Na","n":2}]},{"n":564,"t":"Every praise","k":"Db","s":[{"p":"v","t":"God my Saviour,\nGod my Healer,\nGod my Deliverer,\nYes He is. (2ce)","n":1},{"p":"c","t":"Every praise is to our God,\nEvery word of worship with one accord,\nEvery praise.\nEvery praise is to our God.\nSing Halleluyah to our God,\nGlory Halleluyah is to our God,\nEvery praise.\nEvery praise is to our God.","n":1}]},{"n":565,"t":"Every time that we are gathered together","k":"","s":[{"p":"v","t":"Every time that we are gathered together in His name,\nThere is also in power and in strength;\nSo let us continually offer the sacrifice to Him,\nFor it is good to sing praises to our God.","n":1},{"p":"v","t":"For He inhabits the praises of His people,\nSo let our praises be sweet incense unto Him;\nAnd may the lifting of our hands be as a pleasing sacrifice,\nLord, we love You, Oh Yes! We love You, Yes we do.","n":2},{"p":"v","t":"Lord, we love You, Oh Yes! We love You, Yes we do.","n":3}]},{"n":566,"t":"Face to face","k":"","s":[{"p":"v","t":"Face to face with Christ, my Saviour,\nFace to face what will it be,\n1.\nWhen with rapture I behold Him,\nJesus Christ Who died for me.","n":1},{"p":"c","t":"Face to face I shall behold Him,\nFar beyond the starry sky;\nFace to face in all His glory,\nI shall see Him by and by!","n":1},{"p":"v","t":"Only faintly now I see Him,\nWith the darkling veil between,\n2.\nBut a blessed day is coming,\nWhen His glory shall be seen.","n":2},{"p":"v","t":"What rejoicing in His presence,\nWhen are banished grief and pain;\n3.\nWhen the crooked ways are straightened,\nAnd the dark things shall be plain.","n":3},{"p":"v","t":"Face to face oh, blissful moment!\nFace to face to see and know;\nFace to face with my Redeemer,\nJesus Christ Who loves me so.","n":4}]},{"n":567,"t":"Fairest Lord Jesus","k":"Eb","s":[{"p":"v","t":"Fairest Lord Jesus, Ruler of all nature,\nO Thou of God and man the Son,\nThee will I cherish, Thee will I honor,\nThou, my soul\u2019s glory, joy and crown.","n":1},{"p":"v","t":"Fair are the meadows, fairer still the woodlands,\nRobed in the blooming garb of spring;\nJesus is fairer, Jesus is purer,\nWho makes the woeful heart to sing.","n":2},{"p":"v","t":"Fair is the sunshine, fairer still the moonlight,\nAnd all the twinkling starry host;\nJesus shines brighter, Jesus shines purer\nThan all the angels heav\u2019n can boast.","n":3},{"p":"v","t":"Beautiful Saviour! Lord of all the nations!\nSon of God and Son of Man!\nGlory and honor, praise, adoration,\nNow and forevermore be Thine.\nEnd...","n":4}]},{"n":568,"t":"Faith","k":"","s":[{"p":"v","t":"Brothers don\u2019t be weary don\u2019t give up\nFor He knows (for He knows all your cares),\nAnd in God\u2019s own time He\u2019ll see you through;\nHe\u2019ll lead you through your darkest times,\nPut your trust in Him, He\u2019s never failed,\nSo cast your cares upon Him and have\u2026","n":1},{"p":"c","t":"Faith, faith only have faith if you only believe Him, only receive Him;\nFaith, faith only have faith\nJesus will change your story,\nLead you to glory\nJesus will make your path right\nIt\u2019s not by your power nor by might\nBut you\u2019ll only receive Him, only believe Him,\nWhy don\u2019t you only have faith\nWhy don\u2019t you only believe.","n":1},{"p":"v","t":"Trials and temptations bring you down,\nHold your stand (hold your stand with the Lord),\nOn the solid Rock He\u2019ll set your feet;\nSo never fear, while with the Lord and in God\u2019s own time,\nHe\u2019ll see you through, so cast your cares upon Him and have\u2026","n":2},{"p":"v","t":"But you\u2019ll only receive Him, only believe Him,\nWhy don\u2019t you only have faith\nWhy don\u2019t you only believe.\nEnd . . .","n":3}]},{"n":569,"t":"Faith will win the victory","k":"Bb","s":[{"p":"v","t":"Have you met sin\u2019s mighty host in stern array?\nHave you grown faint-hearted in the fearful fray?\nDo the pow\u2019rs of evil seem to gain the day?\nFaith will win the victory every time.","n":1},{"p":"c","t":"Faith will stand amid the wreck of time,\nFaith unto eternal glories climb;\nOnly count the promise true and the Lord will stand by you,\nFaith will win the victory every time.","n":1},{"p":"v","t":"All the ills that vex you Jesus\u2019 blood can cure,\nBe thou brave and hopeful, steadfast to endure;\nFor Jehovah\u2019s promise standeth firm and sure,\nFaith will win the victory every time.","n":2},{"p":"v","t":"Ne\u2019er give o\u2019er the struggle, valiant be and true,\nGod is strong to conquer and your foes subdue;\nAnd the fiery furnace He will walk with you,\nFaith will win the victory every time.","n":3},{"p":"v","t":"O there\u2019s naught but blessing Father waits to give,\nAnd there\u2019s naught but blessing we can e\u2019er receive;\nIf we fully trust Him and His word believe,\nFaith will win the victory every time.","n":4}]},{"n":570,"t":"Family","k":"","s":[{"p":"v","t":"When it\u2019s family,\nYou forgive them for they know not what they do,\nWhen it\u2019s family,\nYou accept them cause you have no choice but to,\nWhen it\u2019s family,\nThey\u2019re a mirror of the worst and best in you,\nAnd they always put you to the test,\nAnd you always try to do your best,\nAnd just pray for God to do the rest when it\u2019s family.","n":1},{"p":"v","t":"Some are preachers, Some are gay,\nSome are addicts, drunks and strays,\nBut not a one is turned away when it\u2019s family,\nSome are lucky, others aint,\nSome are fighters, others faint,\nWinners, losers, sinners, saints,\nIt\u2019s all family.","n":2},{"p":"v","t":"And when it\u2019s family,\nYou trust them and your heart\u2019s an open door,\nWhen it\u2019s family,\nYou tolerate what you\u2019d kill others for,\nWhen it\u2019s family,\nYou love and hate and take,\nThen give some more.","n":3}]},{"n":571,"t":"Father I place into your hands","k":"Eb","s":[{"p":"v","t":"Father I place into Your hands,\nThe things I cannot do,\nFather I place into Your hands,\nThe things that I\u2019ve been through,\nFather I place into Your hands,\nThe way that I should go,\nFor I know I always can trust You,\nFor I know I always can trust You.\n1.","n":1},{"p":"v","t":"Father I place into Your hands,\nMy friends and family,\nFather I place into Your hands,\nThe things that trouble me,\nFather I place into Your hands,\nThe person I would be,\nFor I know I always can trust You,\nFor I know I always can trust You.\n2.","n":2},{"p":"v","t":"Father we love see your face,\nWe love to hear your voice,\nFather we love to sing your praise,\nAnd in your name rejoice,\nFather, we love to walk with you,\nAnd in your presence rest,\nFor we know we always can trust You,\nFor we know we always can trust You.\n3.","n":3},{"p":"v","t":"Father I want to be with You,\nand do the things You do,\nFather, I want to speak the words\nThat You are speaking too.\nFather, I want to love the ones\nThat You will draw to You,\nFor I know that I am one with You,\nFor I know that I am one with You.\nLast verse","n":4}]},{"n":572,"t":"Father we adore you","k":"g","s":[{"p":"v","t":"Gracious God we worship Thee\nfor salvation full and free\nJesus Christ, our only plea\nfather we adore thee","n":1},{"p":"v","t":"For thy love so vast and wide\nshown to us by him who died\nonly justice satisfied\nfather we adore thee","n":2},{"p":"v","t":"Now we bow before thy face\nlet thy presence fill this place\nOh the wonders of your grace\nfather we adore thee","n":3},{"p":"v","t":"Now again thy song we raise\nsound of deep enduring praise\nsoon will sing through endless day\nfather we adore the","n":4},{"p":"v","t":"Jesus Christ our only plea\nfather we adore Thee","n":5}]},{"n":573,"t":"Gospel medley","k":"","s":[{"p":"v","t":"The devil he don\u2019t like it talking about this good old way\nThe devil he don\u2019t like it talking about the Lord.\nSo, Let\u2019s go on, let\u2019s go on talking about this good old way\nLet\u2019s go on, let\u2019s go on talking about the Lord.","n":1},{"p":"v","t":"Let\u2019s talk about Jesus,\nThe King of kings is He\nThe Lord of lords Supreme\nThrough all eternity;\nThe great I AM, the Way,\nThe Truth, the Life, the Door,\nLet\u2019s talk about Jesus more and more.","n":2},{"p":"v","t":"Oh, I love that Man from Galilee,\nFor He has done so very much for me,\nHe has forgiven me all my sins, and placed the Holy Ghost within,\nOh, I love, that Man from Galilee.","n":3},{"p":"v","t":"Sunlight, sunlight in my soul today,\nSunlight, sunlight all along the way,\nSince my Saviour found me took away my sin,\nI have had the sunlight of His love within.","n":4},{"p":"v","t":"I saw the light (2ce)\nNo more in darkness (2ce)\nI am so happy, sorrow is gone\nPraise the Lord\nI saw the light.","n":5},{"p":"v","t":"Are you washed in the blood,\nIn the soul-cleansing blood of the Lamb?\nAre your garments spotless? Are they white as snow?\nAre you washed in the blood of the Lamb?","n":6},{"p":"v","t":"There is power, power, wonder-working power,\nIn the blood of the Lamb;\nThere is power, power, wonder-working power,\nIn the precious blood of the Lamb.","n":7},{"p":"v","t":"By and by when the morning comes,\nWhen the saints of God are gathered home,\nWe will tell the story how we\u2019ve overcome,\nWe will understand it better by and by.","n":8},{"p":"v","t":"Some glad morning when this life is over\nI\u2019ll fly away,\nTo my home where joy shall never end\nI\u2019ll fly away.","n":9},{"p":"v","t":"I\u2019ll fly away, oh glory!\nI\u2019ll fly away,\nWhen I\u2019m changed, hallelujah! By and by\nI\u2019ll fly away.","n":10},{"p":"v","t":"When we all get to heaven,\nWhat a day of rejoicing that will be,\nWhen we all see Jesus,\nWe\u2019ll sing and shout the victory.","n":11}]},{"n":574,"t":"Fight the good fight","k":"D","s":[{"p":"v","t":"Fight the good fight with all thy might! Christ is thy strength,\nAnd Christ thy right;\nLay hold on life,\nAnd it shall be\nThy joy and crown eternally.","n":1},{"p":"v","t":"Run thou the race thro` God`s good grace,\nLift up thine eyes,\nAnd seek his face;\nLife with its way before us lie,\nChrist is the path,\nThe Christ the prize.","n":2},{"p":"v","t":"Cast care aside,\nLean on thy guide,\nThy ev`ry need He will provide;\nTrusting in him will ever prove Christ is Thy life,\nThy hope, Thy love.","n":3},{"p":"v","t":"Faint not nor fear,\nHis arms are near,\nHe changeth not and thou art dear; Only believe,\nAnd thou shalt see\nthat Christ is all in all to thee.","n":4}]},{"n":575,"t":"Fill the earth with music","k":"","s":[{"p":"v","t":"Fill the earth with music\nSound aloud His praise\nGive to all Your witness\nJesus Christ will save\nPsalms and hymns and heart songs in you richly dwell\nCentered on the Saviour\nChrist who does well","n":1},{"p":"c","t":"Fill the earth with music\nSound aloud His praise\nGive to all Your witness\nJesus Christ will save.","n":1},{"p":"v","t":"Ring you bell with gladness\nSing you choir with joy\nTake to heart your mission\nAll your tunes employ\nWith your hearts united\nAll with common voice each in your own language\nIn your lord rejoice","n":2},{"p":"v","t":"In Your lofty anthems by Your hymns of peace\nGive the prince of goodness\nHis own right for place\nRaise the cross of Jesus\nLift it high above\nThat the world may find there\nChrist the lord of love","n":3}]},{"n":576,"t":"Fill your heart with joy","k":"","s":[{"p":"v","t":"Fill your heart with joy and gladness,\nSing and praise your God and mine,\nGreat the Lord in love and wisdom,\nMight and majesty divine.","n":1},{"p":"v","t":"He who framed the starry heavens,\nKnows and names them as they\nshine.","n":2},{"p":"v","t":"Praise the Lord, His people, praise Him!\nWounded soul His comfort know,\nThose who fear Him find His mercies,\nPeace for pain and joy for woe,","n":3},{"p":"v","t":"Humble hearts are high exalted,\nHuman pride and power made low.","n":4},{"p":"v","t":"Praise the Lord for times and seasons,\nCloud and sunshine, wind and rain,\nSpring to melt the snow of winter,\nTill the waters flow again,","n":5},{"p":"v","t":"Grass upon the mountain pastures,\nGolden valleys thick with grain.","n":6},{"p":"v","t":"Fill your hearts with joy and gladness,\npeace and plenty crown your days,\nLove His laws, declare His judgement,\nWork in all His Words and ways,","n":7},{"p":"v","t":"He the Lord and we His children,\nPraise the Lord, all people praise!","n":8}]},{"n":577,"t":"For his truth is everlasting","k":"","s":[{"p":"v","t":"We will praise our Lord and Saviour,\nBow before His awesome power,\nWe will sing of all His mercies,\nFor His truth is everlasting.","n":1},{"p":"c","t":"Give Him praise, honour and might,\nPower, Dominion and authority,\nPraise the Lord for all His goodness,\nFor His truth is everlasting.","n":1},{"p":"v","t":"Lift your voice in adoration,\nPraise His holy name on high,\nWorship with all that\u2019s within you,\nFor His truth is everlasting.","n":2},{"p":"v","t":"Praise Him for His awesome wonders,\nPraise Him, morning, noon and night,\nGive Him glory all ye people,\nFor His truth is everlasting.","n":3}]},{"n":578,"t":"For your glory","k":"G","s":[{"p":"v","t":"Lord if I find favor in Your sight,\nLord please hear my heart cry,\nI\u2019m desperately waiting to be where You are,\nI\u2019ve cross the hardest desert,\nTravel near and far.","n":1},{"p":"v","t":"For Your glory,\nI will do anything,\nJust to see You,\nTo behold You as my King.","n":2},{"p":"v","t":"I want to be where You are,\nGot to be where You are.","n":3}]},{"n":579,"t":"Four days late","k":"","s":[{"p":"v","t":"The news came to Jesus:\nplease come fast,\nLazarus is sick and without your help,\nHe will not last,\nMary and Martha watched their brother die,\nThey waited for Jesus,\nHe did not come,\nAnd they wondered why.\nThe death watch was over,\nBuried four days,\nSomebody said; He\u2019ll soon be here,\nThe Lord\u2019s on His way,\nMartha ran to Him,\nAnd then she cried;\nLord if You had been here,\nYou could have healed him,\nHe\u2019d still be alive\nBut You\u2019re four days late,\nAnd all hope is gone,\nLord we don\u2019t understand why You\u2019ve waited so long,","n":1},{"p":"c","t":"But His way is God\u2019s way,\nNot yours or mine,\nAnd isn\u2019t it great,\nwhen he\u2019s four days late,\nAnd He\u2019s still on time?","n":1},{"p":"v","t":"Jesus said Martha: show me the grave,\nBut she said: Lord you don\u2019t understand,\nHe\u2019s been there four days,\nThe grave stone was rolled back,\nThen Jesus cried:\n\u201cLazarus come forth\u201d,\nThen somebody said:\n\u201cHe\u2019s alive! He\u2019s alive!\u201d\nYou may be fighting a battle of fear,\nYou\u2019ve cried to the Lord:\n\u201cI need you now\u201d\nBut He has not appeared,\nFriend don\u2019t be discouraged,\nHe\u2019s still the same,\nHe\u2019ll soon be here,\nHe\u2019ll roll out the stone,\nAnd He\u2019ll call out Your name.\nWhen He\u2019s four days late,\nAnd all hope is gone,\nLord we don\u2019t understand why You\u2019ve waited so long,","n":2}]},{"n":580,"t":"Fruit of the Spirit","k":"","s":[{"p":"v","n":1,"t":"The fruit of the Spirit's not a coconut!\nThe fruit of the Spirit's not a coconut!\nIf you wanna be a coconut,\nYou might as well hear it,\nYou can't be a fruit of the Spirit,\n'Cause the fruit is..."},{"p":"c","n":1,"t":"Love, joy, peace, patience,\nKindness, goodness,\nFaithfulness, gentleness and\nSelf-control."},{"p":"v","n":2,"t":"The fruit of the Spirit's not a banana!\nThe fruit of the Spirit's not a banana!\nIf you wanna be a banana,\nYou might as well hear it,\nYou can't be a fruit of the Spirit,\n'Cause the fruit is..."},{"p":"v","n":3,"t":"The fruit of the Spirit's not a lemon!\nThe fruit of the Spirit's not a lemon!\nIf you wanna be a lemon,\nYou might as well hear it,\nYou can't be a fruit of the Spirit,\n'Cause the fruit is..."},{"p":"v","n":4,"t":"The fruit of the Spirit's not a cherry!\nThe fruit of the Spirit's not a cherry!\nIf you wanna be a cherry,\nYou might as well hear it,\nYou can't be a fruit of the Spirit,\n'Cause the fruit is..."},{"p":"v","n":5,"t":"The fruit of the Spirit's not a grape!\nThe fruit of the Spirit's not a grape!\nIf you wanna be a grape,\nYou might as well hear it,\nYou can't be a fruit of the Spirit,\n'Cause the fruit is..."}]},{"n":581,"t":"Glorify your name","k":"f","s":[{"p":"v","t":"If You have been so Good in my life\nWhy can\u2019t I glorify Your Name everyday","n":1},{"p":"c","t":"Glorify Your name\nOh my Lord,\nGlorify Your name\u2026\nGlorify Your name\nOh my Lord,\nIn my life.","n":1},{"p":"v","t":"You have clothed me in Righteousness\nAnd You have covered My nakedness in grace.","n":2},{"p":"v","t":"You have spared my Life to this moment\nLord I will glorify You Till end.","n":3},{"p":"v","t":"You\u2019ve never let us Down in this Church\nOur soul will never Leave Your presence Dear Lord","n":4},{"p":"v","t":"You\u2019re been faithful To me Oh my Lord\nI\u2019ll always glorify Your name all the Day.","n":5},{"p":"v","t":"For Your mercy and Your grace toward me\nI\u2019ll sing to glorify Your Name blessed King.","n":6},{"p":"v","t":"If You answer my Prayer today\nWhy won\u2019t I praise Your Holy name till The end.","n":7},{"p":"v","t":"We thank You Lord For sending Your Prophet His message Has led us back to the faith.","n":8},{"p":"v","t":"If You can provide all Our needs for us\nMy household will Bless Your name all The time.","n":9},{"p":"v","t":"We thank You Lord For giving us Your Word\nAnd making us to Read and understand Your way.","n":10},{"p":"v","t":"Sara re l\u2019ogo Olorun mi\nSara re l\u2019ogo\u2026\nSara re l\u2019ogo Olorun mi\nL\u2019aye mi.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\nGlorife ton nom Oh seigneur\nGlorife ton nom\u2026\nGlorife ton nom Oh Seigneur\nDans ma vie.","n":11}]},{"n":582,"t":"Glory, honour, power and majesty be unto God (amen)","k":"","s":[{"p":"v","t":"Wonderful, marvelous, are the works of Thy hands,\nGreat is Thy name.","n":1}]},{"n":583,"t":"Go down Moses","k":"Bb","s":[{"p":"v","t":"When Israel was in Egypt's land:\nLet my people go,\nOppress'd so hard they could not stand,\nLet my People go.","n":1},{"p":"c","t":"Go down, Moses,\nWay down in Egypt's land,\nTell old Pharaoh,\nLet my people go.","n":1},{"p":"v","t":"No more shall they in bondage toil\nLet my people go\nLet them come out with Egypt\u2019s spoil\nLet my people go","n":2},{"p":"v","t":"O \u2018twas a dark and dismal night\nLet my people go\nWhen Moses led the Israelites\nPharaoh let them go","n":3},{"p":"v","t":"The Lord told Moses what to do\nLet my people go\nTo lead the children of Israel\nPharaoh let them go","n":4},{"p":"v","t":"Let my people go (3ce)\nPharaoh! Let my people go\nLet them go (2ce)\nMoses (2ce),\nLead my people home\u2026\nLead the Israelites home Moses (2ce)\u2026\nLead the Israelites\nhome,\nMoses lead my people home,\nMoses lead my people home.","n":5}]},{"n":584,"t":"God of grace and God of glory","k":"G","s":[{"p":"v","t":"God of grace and God of glory,\nOn Thy people pour Thy pow\u2019r;\nCrown Thine ancient church\u2019s story,\nBring her bud to glorious flow\u2019r.\nGrant us wisdom, Grant us courage,\nFor the facing of this hour, For the facing of this hour.","n":1},{"p":"v","t":"Lo! The host of evil round us,\nScorn Thy Christ, assail his ways!\nFears and doubts too long have bound us,\nFree our hearts to work and praise.\nGrant us wisdom, Grant us courage,\nFor the living of these days, For the living of these days.","n":2},{"p":"v","t":"Set our feet on lofty places;\nGird our lives that they may be Armored with all Christ-like graces\nIn the fight to set men free.\nGrant us wisdom, Grant us courage,\nThat we fail not man nor Thee! That we fail not man nor Thee.","n":3}]},{"n":585,"t":"God of the day","k":"","s":[{"p":"v","t":"Life is easy\nWhen you\u2019re up on the mountain\nAnd you\u2019ve got Peace of mind\nLike you\u2019ve never know\nBut things changed\nWhen you\u2019re down in the valley\nDon\u2019t lose faith\nFor you\u2018re never alone.","n":1},{"p":"v","t":"For the God on the mountain\nIs still God in the valley\nWhen things go wrong\nHe\u2019ll make them right\nAnd the God of the good times\nIs still the God in the bad times\nThe God of the day\nIs still God in the night","n":2},{"p":"v","t":"You talk of faith\nwhen you\u2019re upon the mountain\nBut talk comes so easy\nWhen life\u2019s at its best\nNow its down, in the valley\nOf trials and temptations\nThat\u2019s where your faith\nIs really put to the test","n":3},{"p":"v","t":"For the God on the mountain\nIs still God in the valley\nWhen things go wrong\nHe\u2019ll make them right\nAnd the God of the good times\nIs still the God in the bad times\nThe God of the day\nIs still God in the night","n":4}]},{"n":586,"t":"God\u2019s choir","k":"","s":[{"p":"v","t":"Last night when I was lonely,\nI looked up at the sky,\nThe stars looked like notes in the sky,\nLike a mighty piece of music,\nPenned by God\u2019s own hand,\nWritten for a choir way up there.\nSolo:\nI heard the angels sing,\n\u201cGlory Halleluyah\u201d\nA mighty chorus way up high;\nI heard the angels sing\n\u201cPraise the name of Jesus\u201d,\nSinging in God\u2019s choir in the sky.\n1.","n":1},{"p":"c","t":"I heard a thousand trumpets\nsounding out His glory,\ntelling the story;\nHow he came to earth to die;\nI heard a million voices\npraise the name of Jesus\nsinging in God\u2019s choir in the sky.","n":1},{"p":"v","t":"I heard the glorious song\nComing out of Heaven,\nThe sweetest music ever heard;\nI heard a mighty song,\nSung by all the angels,\nMy soul thrilled at ev-ry loving word.\n2.","n":2},{"p":"v","t":"I fell down on my knees\nWhen that chorus ended,\nThey shouted out a glad AMEN\nI fell down on my knees,\nPrayed that when in Heaven,\nI would hear that choir once again.\n3.","n":3}]},{"n":587,"t":"God\u2019s not dead","k":"G","s":[{"p":"v","t":"God\u2019s not dead, He\u2019s alive,\nGod\u2019s not dead, He\u2019s alive;\nGod\u2019s not dead, He\u2019s alive,\nI feel Him all over me.\nI feel Him in my hands,\nI feel Him in my feet;\nI feel Him in my hands,\nI feel Him in my feet\nI feel Him all over me.\nAIYERAYE","n":1},{"p":"c","t":"Aiyeraye,\nAiyeraye\nNibo ni\u2019po re\nL\u2019aiyerare.","n":1},{"p":"v","t":"Tim\u2019ba d\u2019orun l\u2019ohun\nT\u2019emi o ba ri o\nYio dun ni pupo\nAiyeraye.","n":2},{"p":"v","t":"T\u2019oba d\u2019orun l\u2019ohun\nT\u2019iwo o ba ri mi\nYio dun ni pupo\nAiyeraye.","n":3},{"p":"v","t":"Arakunrin, Arabinrin,\nT\u2019emi o ba ri o\nYio dun ni pupo\nAiyeraye\nArakunrin, Arabinrin,\nT\u2019iwo ko ba ri mi\nYio dun ni pupo\nAiyeraye","n":4},{"p":"v","t":"Eyin ara o, t\u2019emi o bari yin\nYio dun ni pupo\nAiyeraye,\nEyin ara o, t\u2019emi o bari yin\nYio dun ni pupo\nAiyeraye.","n":5}]},{"n":588,"t":"Goodness of God","k":"Ab","s":[{"p":"v","t":"I love You, Lord,\nFor Your mercy never failed me,\nAll my days, I\u2019ve been held in Your hands,\nFrom the moment that I wake up,\nUntil I lay my head,\nOh, I will sing of the goodness of God.","n":1},{"p":"c","t":"And all my life You have been faithful,\nAnd all my life You have been so, so good,\nWith every breath that I am able,\nOh, I will sing of the goodness of God.","n":1},{"p":"v","t":"I love Your voice,\nYou have led me through the fire,\nAnd in the darkest night You are close like no other,\nI\u2019ve known You as a Father,\nI\u2019ve known You as a Friend,\nAnd I have lived in the goodness of God,","n":2},{"p":"v","t":"\u2018Cause Your goodness is running after, it\u2019s running after me,\nYour goodness is running after, it\u2019s running after me,\nWith my life laid down, I\u2019m surrendered now,\nI give You everything,\n\u2018Cause Your goodness is running after, it\u2019s running after me, oh-oh,\n\u2018Cause Your goodness is running after, it\u2019s running after me,\nYour goodness is running after, it\u2019s running after me,\nWith my life laid down, I\u2019m surrendered now,\nI give You everything,\n\u2018Cause Your goodness is running after, it keeps running after me.","n":3},{"p":"v","t":"I\u2019m gonna sing, I\u2019m gonna sing,\n\u2018Cause all my life You have been faithful,\nAnd all my life You have been so, so good,\nWith every breath that I am able,\nOh, I\u2019m gonna sing of the goodness of God,\nOh, I\u2019m gonna sing of the goodness of God.","n":4}]},{"n":589,"t":"Gracious God we worship Thee","k":"","s":[{"p":"v","t":"For thy love so vast and wide\nshown to us by him who died\nonly justice satisfied\nfather we adore thee","n":1},{"p":"v","t":"Now we bow before thy face\nlet thy presence fill this place\noh the wonders of your grace\nfather\u2026\u2026\u2026\u2026","n":2},{"p":"v","t":"Now again thy song we raise\nsound of deep enduring praise\nsoon will sing through endless day\nfather we adore the","n":3},{"p":"v","t":"Jesus Christ our only plea\nfather we adore the","n":4}]},{"n":590,"t":"Grateful medley","k":"","s":[{"p":"v","t":"Once was lost,\nBut now I\u2019m found,\nAll praise to God(2ce),\nWas born in sin,\nBut now redeemed,\nAll praise to God(2ce).","n":1},{"p":"c","t":"Oh Lord my God,\nI\u2019ll bless your name(3ce)","n":1},{"p":"v","t":"Once was blind,\nBut now can see,\nAll praise to God(2ce)\nWas born in sin,\nBut now redeemed,\nAll praise to God(2ce).","n":2},{"p":"v","t":"For your goodness and your mercy,\nFor your faithfulness towards me,\nIt\u2019s a wonder that an immortal God\nwould die for a mortal me,\nYou surround me with your power\nand your Love has overwhelmed me\nTo the faithful God I sing\nMy Lord and my King,\nHow will I not sing?,\nHow will I not praise your name?(2ce)\n\nHow will I not sing?,\nHow will I not praise your name?(3ce)","n":3}]},{"n":591,"t":"Great are you Lord","k":"F","s":[{"p":"v","t":"Holy, Holy, God Almighty,\nIt\u2019s a privilege to worship You,\nMaker of all universe,\nIt\u2019s an honor just to stand before You.","n":1},{"p":"v","t":"With a grateful heart I lift my hands to You,\nproclaim that Lord You reign,\nWith a grateful heart I lift my hands to You,\nproclaim that Lord You reign,","n":2},{"p":"v","t":"Great are You Lord,\nYou\u2019re greatly to be praised,\ngreatly to be praised,\nFather You reign (2ce)","n":3},{"p":"v","t":"Great are You Lord (4ce)","n":4},{"p":"v","t":"With a grateful heart I lift my hands to You,\nProclaiming\u2026\nDeclaring\u2026\nAnnouncing\u2026\nShouting\u2026\nSinging\u2026\nLord You reign\u2026\nWith a grateful heart I lift my hands to You,\nRejoicing\u2026\nDancing\u2026\nLord You reign\u2026","n":5},{"p":"v","t":"Great are You Lord,\nYou\u2019re greatly to be praised,\nYou\u2019re greatly to be praised,\nFather You reign(2ce)","n":6},{"p":"v","t":"You came from heaven to earth\nTo show the way,\nFrom the earth to the cross\nMy debts You paid,\nFrom the cross to the grave\nFrom the grave to the sky,\nLord, I lift Your name on high.","n":7},{"p":"v","t":"Lord, I lift Your name on high,\nLord, I love to sing Your praises\nI\u2019m so glad You reign in my life\nI\u2019m so glad You came to save me.","n":8}]},{"n":592,"t":"Great is the Lord","k":"C","s":[{"p":"v","t":"Great is the Lord\u2026","n":1},{"p":"c","t":"Great is the Lord He is Holy and Just\nBy His power we trust in His word\nGreat is the Lord, He is faithful and true\nBy His mercies He proves He is love.\nGreat is the Lord and worthy of glory,\nGreat is the Lord and worthy of praise;\nGreat is the Lord now lift up your voice,\nNow lift up your voice\nGreat is the Lord, Great is the Lord.","n":1}]},{"n":593,"t":"Great is the Lord (Psalm 48)","k":"","s":[{"p":"v","t":"Beautiful for situation, The joy of the whole earth,\nIs mount Zion,\nOn the sides of the north, The city of the great King.","n":1}]},{"n":594,"t":"Great is your mercy","k":"","s":[{"p":"v","t":"Great is your mercy towards you\nYour loving kindness towards you\nYour tender mercy I see\nDay after day\nForever faithful towards me\nAlways providing for me\nGreat is your mercy towards me\nGreat is your grace","n":1},{"p":"v","t":"It\u2019s grace, Your grace\nAm nothing without You;\nYour grace, Your grace\nshines on me","n":2},{"p":"v","t":"Shines on me, Shines on me,\nYour grace shines on me;\nShines on me, Shines on me,\nIt\u2019s Your grace\u2026","n":3},{"p":"v","t":"From beginning to the end\nit has always been\nit\u2019s always been you\nJesus/4ce","n":4}]},{"n":595,"t":"Great is your mercy towards me","k":"","s":[{"p":"v","t":"Great is Your mercy towards me,\nYour loving kindness towards me,\nYour tender mercies I see,\nGreat is Your grace,\nForever faithful towards me,\nAlways providing for me,\nGreat is Your mercy towards me,\nGreat is Your grace\u2026","n":1},{"p":"v","t":"From beginning to the end\nIt has always been,\nit\u2019s always been You Jesus,\nJesus\u2026.","n":2},{"p":"v","t":"Jesus at the Centre of it all,\nJesus at the Centre of it all,\nFrom beginning to the end,\nit has always been, it\u2019s always been You Jesus,\nJesus\u2026..","n":3},{"p":"v","t":"Nothing else matters,\nNothing in this world will do,\nJesus You\u2019re the centre, everything revolves around You.","n":4},{"p":"v","t":"From my heart to the heavens\nJesus be the centre,\nIt\u2019s all about You,\nYes it\u2019s all about You","n":5}]},{"n":596,"t":"Hail Jesus you're my king","k":"","s":[{"p":"v","t":"Hail Jesus You are my king\nYour life frees me to sing\nI will praise You all my days\nPerfect in all Your ways","n":1},{"p":"v","t":"Hail Jesus you're my lord\nI will obey Your word\nI want to see Your Kingdom come\nNot my will but Yours be done","n":2},{"p":"v","t":"Glory, glory to the lamb\nYou take me into the land\nWe will conquer in Your name\nAnd proclaim that Jesus reigns","n":3},{"p":"v","t":"Hail hail lion of Judah\nHow wonderful You are\nHail hail lion of Judah\nHow powerful You are\nHow wonderful You are\nHow powerful You are","n":4},{"p":"v","t":"Hail hail lion of Judah\nHail hail lion of Judah\nHail hail lion of Judah\nHow powerful You are","n":5}]},{"n":597,"t":"Halleluiah","k":"","s":[{"p":"v","t":"Halleluiah, halleluiah, for the Lord God almighty reigns,\nHalleluiah, halleluiah\u2026","n":1},{"p":"v","t":"Holy, holy, are you Lord God almighty,\nworthy is the Lamb,\nworthy is the Lamb,\nAmen\u2026","n":2}]},{"n":598,"t":"Hallelujah to God most high","k":"","s":[{"p":"v","t":"Hallelujah\nTo God Most High\nHallelujah\nTo God Most High","n":1},{"p":"c","t":"Most High\nGod of Heavens\nMost High\nRuler of the earth\nMost High\nKing of Nations","n":1},{"p":"v","t":"Hallelujah\nTo God Most High\nHallelujah\nTo God Most High\nHallelujah\nTo God Most High","n":2},{"p":"v","t":"Hallelujah\nTo God Most High","n":3},{"p":"v","t":"Hallelujah\u2026","n":4}]},{"n":599,"t":"Halleluyah","k":"E","s":[{"p":"v","t":"Halleluyah! Salvation and glory\nHonour and power unto the lamb of God\nFor the Lord our God is mighty\nYes the Lord our God is Omnipotent,\nThe lord our God is wonderful\nFor the Lord Our God is powerful.","n":1},{"p":"v","t":"Halleluyah, halleluyah\nO Lord we praise your name,\nAll the glory, all the praise\nO lord we praise your name","n":2},{"p":"v","t":"Halleluyah,\nYou have won the victory\nHalleluyah,\nYou have won it all for me\nDeath could not hold you down,\nYou are the risen King\nSitted in majesty\nYou are the risen King.","n":3}]},{"n":600,"t":"Hark ten thousand harps and voices","k":"G","s":[{"p":"v","t":"Hark! Ten thousand harps and voices,\nSound the note of praise above,\nJesus reigns and heaven rejoices,\nSee, He sits on higher Throne,\nJesus rules the world alone.","n":1},{"p":"c","t":"Alleluiah! /3x\nAmen","n":1},{"p":"v","t":"Jesus, hail whose glory brightens,\nAll above and sins it worth,\nLord of life, Thy smile enlightens,\nCheers and charms Thy saints on earth,\nWhen we think of love like that,\nLord, we own it love divine.","n":2},{"p":"v","t":"King of glory, reign forever,\nThine everlasting crown,\nNothing from Thy love shall severe,\nThose whom Thou hast made Thine own,\nHappy objects of Thy grace,\nDestined to behold Thy face.","n":3},{"p":"v","t":"Saviour hasten Thine appearing,\nBring O bring the glorious day,\nWhen the awful summons hearing,\nHeaven and earth shall pass away,\nThen with golden harps we\u2019ll sing,\nGlory, glory to our King.","n":4}]},{"n":601,"t":"He gave to me a seal","k":"F","s":[{"p":"v","t":"He gave to me a seal\nOf the great debt I owe\nAnd as He gave, He smiled and said,\n\u201cAlways, remember Me\u201d.","n":1},{"p":"v","t":"He gave to me a seal,\nAll of my debts He paid,\nAnd as He gave,\nHe smiled and said,\n\u201cAlways, remember Me\u201d.","n":2},{"p":"v","t":"I shall treasure the seal,\nThough, the debt is all paid,\nThe seal told of the Love of One,\nWho paid the debt for me.","n":3},{"p":"v","t":"I looked at it and smiled,\nAgain, I looked and wept,\nThe earnest of His Love for me,\nI\u2019ll ever treasure it","n":4},{"p":"v","t":"It is more than a seal,\nIt is in remembrance,\nThat all the debt of sin was paid,\nBy Lord, Emmanuel.\nEnd","n":5}]},{"n":602,"t":"He gives joy","k":"","s":[{"p":"v","t":"Did you know that there\u2019s someone\nWho can hear your fainted cry,\nSomeone who can hear your heart\u2019s\ndeepest cry,\nHe\u2019s the one who Made you through and through\nSo give a chance And let Him speak to You.\nHe gives joy to the hopeless,\nPeace to the weary\nAnd He binds up the broken hearted(2ce)\nDid you know that Jesus want to be Your greatest friend,\nHe knows all about You and His Love for You cannot end,\nHe made you for a purpose,\nHe\u2019s interested in\nyou,\nSo give a chance and Let His love shine through.","n":1},{"p":"c","t":"He gives joy to the hopeless,\nPeace to the weary\nAnd He binds up the broken hearted (2ce)","n":1},{"p":"v","t":"Maybe you think there isn\u2019t a God\nOr if there is, He makes no difference anyway\nBut He want to guide you,\nTo live right inside you and wrap you and bath you\nAnd fill you completely with His love\nBridge:\nWhy then does God sometimes seem so far away?\nWe have grieved His heart by the things.\nWe do and say, you just have to tell Him\nYou can\u2019t make it on your own,\nAnd He\u2019ll come close to you and He\u2019ll Himself known.","n":2}]},{"n":603,"t":"He keeps me singing","k":"Ab","s":[{"p":"v","t":"There\u2019s within my heart a melody\nJesus whispers sweet and low:\nFear not I am with thee, peace, be still.\nIn all of life\u2019s ebb and flow.","n":1},{"p":"c","t":"Jesus, Jesus, Jesus Sweetest name I know,\nFills my every longing, keeps me singing as I go.","n":1},{"p":"v","t":"All my life was wrecked By sin and strife,\nDiscord filled my heart with pain,\nJesus swept across the broken strings,\nStirred the slumbering chords again.","n":2},{"p":"v","t":"Feasting on the riches of His grace,\nResting \u2018neath His sheltering wing,\nAlways looking on His smiling face,\nThat is why I shout and sing.","n":3},{"p":"v","t":"Though sometimes He leads through waters deep.\nTrials fall across the way\nThough sometimes the path seems rough and steep,\nSee His footprints all the way:","n":4},{"p":"v","t":"Soon He\u2019s coming back to welcome me\nFar beyond the starry sky;\nI shall wing my flight to worlds unknown\nI shall reign with him on high","n":5}]},{"n":604,"t":"He knows my name","k":"","s":[{"p":"v","t":"I have a maker\nHe formed my heart\nBefore even time began\nMy life was in His hand","n":1},{"p":"v","t":"I have a father,\nHe calls me his own\nHe\u2019ll never leave me\nNo matter where I go","n":2},{"p":"v","t":"He knows my name, He knows my every thought\nHe sees me each tears that falls\nAnd hears me when I call","n":3},{"p":"v","t":"Grace, grace, God\u2019s grace,\nGrace that will pardon and cleanse within;\nGrace, grace, God\u2019s grace,\nGrace that is greater than all our sin.","n":4}]},{"n":605,"t":"He never sleeps he never slumbers","k":"C","s":[{"p":"v","t":"When you\u2019ve prayed any prayer that you know how to pray,\njust remember the Lord will hear and the answer is on it\u2019s way,\nOur God is able,\nHe is mighty, He is faithful\u2026","n":1},{"p":"c","t":"And He never sleeps, He never slumbers,\nHe never tires of hearing our prayers,\nWhen we are weak, He become stronger,\nSo rest in His love and cast all of Your cares on Him. (2ce)","n":1},{"p":"v","t":"Casting all your care upon him; for He careth for you.\n\nI Peter 5:7\nHe will not suffer thy foot to be moved: he that keepeth thee will not slumber.\n\nPsalm 121:3","n":2},{"p":"v","t":"So rest in His love and cast all of Your cares (3ce)\nOn Him.","n":3}]},{"n":606,"t":"Hear my prayer, o Lord","k":"","s":[{"p":"v","t":"I need you\nI need You once again","n":1},{"p":"v","t":"I need You beside me\nI need You to guild me\nI need You\nplease lead me\nI need You be near me","n":2}]},{"n":607,"t":"Hear my song, Lord","k":"","s":[{"p":"v","t":"Hear my song, Lord,\nYou fill me with music,\nHear my words, Lord,\nYou fill me with praise,","n":1},{"p":"v","t":"Take this moment,\nI just can\u2019t waste it,\nThis one is Yours, Lord,\nI give You this\nday.","n":2},{"p":"v","t":"When I am hungry,\nYou feed me living bread,\nWhen I am thirsty,\nWater of life,","n":3},{"p":"v","t":"I will not fear,\nYou are always with me,\nEvery need I have,\nYou satisfy.","n":4},{"p":"v","t":"Hear Your children, O Lord,\nWe are lifting our praise to You,\nLet singing, like incense,\nNow rise to Your\nthrone,","n":5},{"p":"v","t":"Come, dwell in the place,\nShallowed out for Your Spirit,\nCome make of our praises,\nYour temple, Your home.","n":6}]},{"n":608,"t":"Hear our prayer","k":"","s":[{"p":"v","t":"O! Hear our prayer\nO! God of host,\nAs on our knee we cry,\nWe humbly seek before Thy Throne,\nFor mercy on our way,","n":1},{"p":"v","t":"Our guilt we never hide from Thee,\nBut ask for Thy pardon,\nNever reject our prayer O! God,\nBe merciful unto us.","n":2},{"p":"v","t":"Our fathers sinned and we too sinned,\nBe merciful to us,\nThis weakness of our dusty flesh,\nWe pray Thee help us Lord,","n":3},{"p":"v","t":"When dangers come when trouble near,\nDeliver us Good Lord,\nNever reject our Prayers O! God,\nBe merciful unto us.","n":4},{"p":"v","t":"In one Spirit we kneel for Thee,\nBe merciful to us,\nBefore Thee we confess our sin,\nBeseech thee gracious Lord,","n":5},{"p":"v","t":"We\u2019re fasting for our sin O! God,\nForgive and make us clean,\nThine Holy blood enough for us,\nRedeem us with Thy grace.","n":6}]},{"n":609,"t":"Heart of worship","k":"Eb","s":[{"p":"v","t":"When the music fades\nAll are stripped away and I simply come\nlonging just to bring something that\u2019s of worth\nThat will bless Your heart\nI\u2019ll bring You more than a song\nfor a song in itself\nit\u2019s not what You have required\nYou search much deeper within\nThrough the way things appear\nYou\u2019re looking into my heart","n":1},{"p":"c","t":"I\u2019m coming back to the Heart of Worship\nAnd it\u2019s all about You\nIt\u2019s all about You Jesus\nI\u2019m sorry Lord for the thing I\u2019ve made it\nWhen it\u2019s all about You,\nIt\u2019s all about You JESUS","n":1},{"p":"v","t":"King of endless worth\nNo one could express how much You deserve\nThough I\u2019m week and poor\nAll I have is Yours\nEvery single I breath\nI\u2019ll bring You more than a song\nfor a song in itself\nIt\u2019s not what You have required,\nYou search more deeper within,\nThrough the way things appear,\nYou\u2019re looking into my heart.","n":2},{"p":"v","t":"I\u2019ll bring You more than a song,\nmore than a song (3ce).\nYou\u2019re looking into my heart,\ninto my heart.","n":3},{"p":"v","t":"It\u2019s all about You (6x)\nJesus.","n":4}]},{"n":610,"t":"Heaven medley","k":"","s":[{"p":"v","t":"I\u2019ve got a home prepared where the saints abide\njust over in the glory land\nand I long to be by my savior\u2019s side\njust over the glory land\njust over the glory land\nI\u2019ll join the happy angel band\njust over the glory land\njust over the glory land\nthere with the mighty host I\u2019ll stand\njust over the glory land","n":1},{"p":"v","t":"(it\u2019s a highway to heaven)\nit\u2019s a highway to heaven\nnone can walk up there\nbut the pure in heart\nit\u2019s a high way to heaven
