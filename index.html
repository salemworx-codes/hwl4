<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Hymns We Love">
<meta name="theme-color" content="#12132E">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png">
<link rel="apple-touch-icon" sizes="60x60" href="/icons/icon-60.png">
<link rel="apple-touch-icon" sizes="76x76" href="/icons/icon-76.png">
<link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<title>Hymns We Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --bg:#fff;--txt:#0A0F1E;--txt2:#4A5568;--txt3:#A0AEC0;
  --bdr:rgba(0,0,0,.06);--red:#C41E3A;--blue:#2A2B60;--dblue:#12132E;
  --surf:rgba(58,59,129,.03);--surfH:rgba(58,59,129,.06);
  --numBg:rgba(196,30,58,.05);--listBg:#F5F6FA;
  --choBg:rgba(196,30,58,.03);--choBdr:rgba(196,30,58,.1);
  --vLbl:rgba(58,59,129,.04);--lyric:#1A1F35;
  --headGrad:linear-gradient(135deg,#12132E,#2A2B60,#3A3B81);
  --glass:rgba(255,255,255,.06);--glassBdr:rgba(255,255,255,.08);
}
.dark{
  --bg:#12132E;--txt:#E8EAF0;--txt2:#7B849A;--txt3:#3D4556;
  --bdr:rgba(255,255,255,.05);--surf:rgba(255,255,255,.03);--surfH:rgba(255,255,255,.06);
  --numBg:rgba(196,30,58,.1);--listBg:rgba(255,255,255,.04);
  --choBg:rgba(196,30,58,.06);--choBdr:rgba(196,30,58,.12);
  --vLbl:rgba(255,255,255,.05);--lyric:#C5CAD8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;background:#12132E;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#app{max-width:960px;margin:0 auto;min-height:100vh;min-height:100dvh;overflow:hidden}
.view{display:none}.view.active{display:block}
.safe-top{padding-top:max(20px,env(safe-area-inset-top,20px))}
.safe-bot{padding-bottom:max(20px,env(safe-area-inset-bottom,20px))}
button{font-family:inherit;-webkit-appearance:none}
input{font-family:inherit;-webkit-appearance:none}
::-webkit-scrollbar{width:0;display:none}

/* Home page */
.home-wrap{min-height:100vh;min-height:100dvh;position:relative;overflow:hidden;background:#12132E;color:#fff}
.home-grain{position:absolute;inset:0;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");pointer-events:none;z-index:1}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4;z-index:0}
.orb1{width:300px;height:300px;background:radial-gradient(circle,#3A3B81,transparent);top:-60px;right:-80px;animation:orbFloat 8s ease-in-out infinite alternate}
.orb2{width:250px;height:250px;background:radial-gradient(circle,#C41E3A,transparent);bottom:20%;left:-100px;opacity:.2;animation:orbFloat 10s ease-in-out 1s infinite alternate-reverse}
.orb3{width:200px;height:200px;background:radial-gradient(circle,#4A4B95,transparent);bottom:-40px;right:-60px;opacity:.25;animation:orbFloat 7s ease-in-out 2s infinite alternate}
@keyframes orbFloat{0%{transform:translate(0,0) scale(1)}50%{transform:translate(15px,-20px) scale(1.1)}100%{transform:translate(-10px,15px) scale(.95)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 30px rgba(196,30,58,.15),0 0 60px rgba(196,30,58,.05)}50%{box-shadow:0 0 40px rgba(196,30,58,.25),0 0 80px rgba(196,30,58,.1)}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Glass card */
.glass-card{background:rgba(255,255,255,.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);border-radius:20px;transition:all .25s ease}
.glass-card:active{transform:scale(.98);background:rgba(255,255,255,.07)}

/* Browse & Detail */
.hrow{display:flex;align-items:center;padding:14px 20px;gap:12px;cursor:pointer;border-bottom:1px solid var(--bdr);transition:background .12s}
.hrow:active{background:var(--surfH)!important}
.htitle{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.hmeta{display:flex;align-items:center;gap:5px;margin-top:2px;font-size:11px;color:var(--txt3)}
.badge{font-size:9px;padding:2px 6px;border-radius:5px;font-weight:600;letter-spacing:.3px}
.ctrl-btn{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:transform .15s}
.ctrl-btn:active{transform:scale(.9)}

/* ═══ TABLET / IPAD RESPONSIVE ═══ */
@media(min-width:600px){
  /* Browse: 2-column grid for hymn list */
  #hymn-list{display:grid!important;grid-template-columns:1fr 1fr;gap:0 1px}
  .hrow{border-right:1px solid var(--bdr)}
  
  /* Larger fonts and spacing */
  .htitle{font-size:16px}
  .hmeta{font-size:12px}
  
  /* Home: wider glass cards */
  .glass-card{padding:24px!important}
  
  /* Browse header wider padding */
  #v-browse>div:first-child>div:nth-child(2){padding:20px 32px!important}
  
  /* Search bar wider */
  #v-browse input[type="text"]{font-size:15px!important}
  
  /* Detail: wider lyric area with better reading width */
  #lyrics-area{max-width:680px;margin:0 auto}
  
  /* Tabs: larger tap targets */
  #tabs>div{padding:14px 0!important;font-size:13px!important}
  
  /* Font sheet wider */
  #font-sheet{max-width:600px!important}
  
  /* Controls bar */
  .ctrl-btn{width:48px;height:48px}
}

@media(min-width:768px){
  /* iPad and larger */
  #hymn-list{grid-template-columns:1fr 1fr 1fr}
  
  /* Home page: center content better */
  .home-wrap>div:last-child{max-width:720px;margin:0 auto}
  
  /* Detail: even more reading space */
  #lyrics-area{max-width:720px;padding:0 40px!important}
  
  /* Orbs scale up */
  .orb1{width:400px;height:400px}
  .orb2{width:350px;height:350px}
  .orb3{width:300px;height:300px}
  
  /* Browse gradient header taller */
  #v-browse>div:first-child{min-height:auto}
}

@media(min-width:960px){
  body{background:var(--bg,#12132E)}
  #app{border-left:1px solid rgba(255,255,255,.05);border-right:1px solid rgba(255,255,255,.05);box-shadow:0 0 80px rgba(0,0,0,.3)}
}

</style>
</head>
<body>
<div id="app">
<!-- ═══ HOME ═══ -->
<div id="v-home" class="view active">
<div class="home-wrap">
  <div class="home-grain"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  
  <!-- Subtle staff lines -->
  <svg style="position:absolute;left:0;right:0;top:30%;opacity:.03;z-index:0" width="100%" height="60" viewBox="0 0 960 60" preserveAspectRatio="none"><line x1="0" y1="0" x2="960" y2="0" stroke="#fff" stroke-width=".5"/><line x1="0" y1="15" x2="960" y2="15" stroke="#fff" stroke-width=".5"/><line x1="0" y1="30" x2="960" y2="30" stroke="#fff" stroke-width=".5"/><line x1="0" y1="45" x2="960" y2="45" stroke="#fff" stroke-width=".5"/><line x1="0" y1="60" x2="960" y2="60" stroke="#fff" stroke-width=".5"/></svg>

  <div style="position:relative;z-index:2;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh" class="safe-top">
    
    <!-- Top bar -->
    <div style="display:flex;justify-content:space-between;align-items:center;padding:0 28px 0">
      <div style="font-size:10px;letter-spacing:3px;opacity:.2;text-transform:uppercase;font-weight:500">757 hymns</div>
      <div style="width:6px;height:6px;border-radius:50%;background:#C41E3A;box-shadow:0 0 8px #C41E3A"></div>
    </div>

    <!-- Hero -->
    <div style="padding:40px 32px 0;text-align:center;animation:fadeUp .8s ease both">
      <!-- Animated logo mark -->
      <div style="display:inline-block;position:relative;margin-bottom:28px">
        <div style="width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,rgba(196,30,58,.15),rgba(196,30,58,.05));border:1px solid rgba(196,30,58,.12);display:flex;align-items:center;justify-content:center;animation:glow 4s ease infinite">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#C41E3A" stroke-width="1.3" stroke-linecap="round">
            <path d="M9 18V5l12-2v13" stroke-dasharray="60" stroke-dashoffset="60" style="animation:dash 1.5s ease .5s forwards"/>
            <circle cx="6" cy="18" r="3" opacity=".8"/><circle cx="18" cy="16" r="3" opacity=".8"/>
          </svg>
        </div>
        <!-- Decorative ring -->
        <div style="position:absolute;inset:-6px;border-radius:28px;border:1px solid rgba(196,30,58,.06);animation:glow 4s ease 1s infinite"></div>
      </div>
      
      <!-- Title with mixed weights -->
      <div style="font-family:'Instrument Serif',Georgia,serif;font-size:58px;font-weight:400;letter-spacing:-2px;line-height:.95">Hymns</div>
      <div style="font-family:'Instrument Serif',Georgia,serif;font-size:58px;font-weight:400;font-style:italic;color:#C41E3A;line-height:.95;margin-top:-2px">We Love</div>
      
      <!-- Divider -->
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin:20px 0">
        <div style="width:32px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2))"></div>
        <div style="font-size:8px;letter-spacing:5px;text-transform:uppercase;opacity:.25;font-weight:600">A Sacred Collection</div>
        <div style="width:32px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.2),transparent)"></div>
      </div>
    </div>

    <!-- Search bar - glass morphism -->
    <div style="padding:8px 28px 0;animation:fadeUp .8s ease .2s both">
      <div onclick="setTab('all');showView('browse');focusSearch()" style="display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.05);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:16px;padding:16px 20px;border:1px solid rgba(255,255,255,.06);cursor:pointer;transition:all .2s">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span style="opacity:.25;font-size:14.5px;font-weight:400">Search all hymns — English &amp; Yorùbá</span>
      </div>
    </div>

    <!-- Category cards -->
    <div style="padding:24px 28px 0;display:flex;flex-direction:column;gap:10px">
      <!-- English Hymns -->
      <div onclick="setTab('english');showView('browse')" class="glass-card" style="padding:18px 20px;cursor:pointer;display:flex;align-items:center;gap:16px;animation:fadeUp .6s ease .3s both">
        <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#2A2B60,#3A3B81);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M4 19.5v-15A2.5 2.5 0 016.5 2H20v20H6.5a2.5 2.5 0 010-5H20"/><path d="M12 6v7l3-2" opacity=".6"/></svg>
        </div>
        <div style="flex:1">
          <div style="font-family:'Instrument Serif',serif;font-size:19px;font-weight:400">English Hymns</div>
          <div style="font-size:12px;opacity:.35;margin-top:2px;font-weight:400" id="eng-count"></div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>

      <!-- Yoruba Hymns -->
      <div onclick="setTab('yoruba');showView('browse')" class="glass-card" style="padding:18px 20px;cursor:pointer;display:flex;align-items:center;gap:16px;border-color:rgba(196,30,58,.1);animation:fadeUp .6s ease .4s both">
        <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#7A1024,#C41E3A);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div style="flex:1">
          <div style="font-family:'Instrument Serif',serif;font-size:19px;font-weight:400">Yorùbá Hymns</div>
          <div style="font-size:12px;opacity:.35;margin-top:2px;font-weight:400" id="yor-count"></div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>

      <!-- Favorites -->
      <div onclick="setTab('favorites');showView('browse')" class="glass-card" style="padding:18px 20px;cursor:pointer;display:flex;align-items:center;gap:16px;animation:fadeUp .6s ease .5s both">
        <div style="width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="rgba(196,30,58,.3)" stroke="#C41E3A" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        </div>
        <div style="flex:1">
          <div style="font-family:'Instrument Serif',serif;font-size:19px;font-weight:400">Favorites</div>
          <div style="font-size:12px;opacity:.35;margin-top:2px;font-weight:400" id="fav-count"></div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>

    <!-- Piano visualization -->
    <div style="padding:28px 28px 0;animation:fadeUp .6s ease .6s both">
      <div style="position:relative;height:36px;border-radius:0 0 14px 14px;overflow:hidden;display:flex;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-top:none" id="piano-keys"></div>
    </div>

    <!-- Bottom -->
    <div style="flex:1;min-height:16px"></div>
    <div style="text-align:center;padding:12px 28px;opacity:.1;font-size:9.5px;letter-spacing:3px;font-weight:500" class="safe-bot">
      HYMNS WE LOVE
    </div>
  </div>
</div>
</div>

<!-- ═══ BROWSE ═══ -->
<div id="v-browse" class="view">
<div id="browse-wrap" style="min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--txt);transition:background .3s,color .3s">
<div style="position:sticky;top:0;z-index:10;background:var(--bg);transition:background .3s">
<div style="height:2px;background:linear-gradient(90deg,var(--red),var(--blue),var(--red))"></div>
<div class="safe-top" style="display:flex;align-items:center;padding-left:20px;padding-right:20px;padding-bottom:10px;gap:10px">
<button onclick="showView('home')" style="background:var(--surf);border:1px solid var(--bdr);border-radius:11px;cursor:pointer;color:var(--txt);padding:8px;display:flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
<div id="browse-title" style="flex:1;font-family:'Instrument Serif',serif;font-size:24px"></div>
<button onclick="toggleDark()" style="background:var(--surf);border:1px solid var(--bdr);border-radius:11px;padding:7px;cursor:pointer;color:var(--txt);display:flex" id="theme-btn-browse"></button>
</div>
<div style="display:flex;padding:0 20px;border-bottom:1px solid var(--bdr)" id="tabs"></div>
<div style="display:flex;align-items:center;margin:10px 20px;gap:8px;background:var(--listBg);border-radius:13px;padding:11px 15px;border:1px solid var(--bdr)">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--txt3)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
<input id="sinp" type="text" placeholder="Search all hymns…" oninput="onSearch(this.value)" style="flex:1;background:none;border:none;outline:none;font-size:15px;color:var(--txt)">
<button id="sclear" onclick="clearSearch()" style="background:none;border:none;cursor:pointer;color:var(--txt3);display:none;padding:2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
</div>
</div>
<div id="hymn-list"></div>
<div id="load-more" style="text-align:center;padding:20px;display:none">
<button onclick="loadMore()" style="background:var(--surf);border:1px solid var(--bdr);border-radius:12px;padding:11px 32px;cursor:pointer;color:var(--txt2);font-size:14px;font-weight:500">Load more hymns</button>
</div>
<div id="empty-state" style="text-align:center;padding:70px 24px;display:none">
<div style="font-size:48px;margin-bottom:12px;opacity:.1">♪</div>
<div style="font-size:16px;font-family:'Instrument Serif',serif;color:var(--txt2)" id="empty-msg"></div>
</div>
<div style="height:30px"></div>
</div></div>

<!-- ═══ DETAIL ═══ -->
<div id="v-detail" class="view">
<div id="detail-wrap" style="min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--txt);transition:background .3s,color .3s">
<div id="detail-header" class="safe-top" style="position:relative;overflow:hidden;background:var(--headGrad);color:#fff;padding-left:22px;padding-right:22px;padding-bottom:28px">
<div style="position:absolute;inset:0;opacity:.03;background-image:url(&quot;data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E&quot;)"></div>
<div style="position:absolute;right:-20px;top:-25px;font-size:140px;font-family:serif;opacity:.03;color:#C41E3A">𝄞</div>
<div style="position:relative;z-index:1">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
<button onclick="showView('browse')" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px 14px;cursor:pointer;color:#fff;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:500;backdrop-filter:blur(8px)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>Back</button>
<div style="display:flex;gap:5px" id="detail-nav"></div>
<button id="detail-fav-btn" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px;cursor:pointer;color:#fff;display:flex;backdrop-filter:blur(8px)"></button>

<script>
const HYMN_RAW_DATA = {"e":[{"n":1,"t":"Only believe","k":"Ab","s":[{"p":"v","t":"Fear not little flock, from the cross to the throne,\nFrom death into life He went for His own;\nAll power in earth, all power above,\nIs given to Him for the flock of His love.","n":1},{"p":"c","t":"Only believe, only believe,\nAll things are possible,\nonly believe,\nOnly believe, only believe,\nAll things are possible,\nonly believe.","n":1},{"p":"v","t":"Fear not, little flock, He goeth ahead,\nYour Shepherd selecteth the path you must tread;\nThe waters of Marah He\u2019ll sweeten for thee,\nHe drank all the bitter in Gethsemane.","n":2},{"p":"v","t":"Fear not, little flock, whatever your lot,\nHe enters all rooms, \u201cthe doors being shut\u201d,\nHe never forsakes, He never is gone\nSo count on His presence in darkness and dawn.","n":3},{"p":"v","t":"Lord, I believe, Lord, I believe,\nAll things are possible,\nLord, I believe,\nLord, I believe, Lord, I believe,\nAll things are possible,\nLord, I believe.\nLord, I believe\u2026\nLord, I receive\u2026","n":4}]},{"n":2,"t":"They come","k":"Eb","s":[{"p":"v","t":"They come from the east and west,\nThey come from the land afar,\nTo feast with the King,\nTo dine as His guest;\nHow blessed these pilgrims are!\nBeholding His hallowed face\nAglow with the light divine;\nBlest partakers of His grace,\nAs gems in His crown to shine.","n":1},{"p":"c","t":"Since Jesus has set me free,\nI\u2019m happy as heart can be;\nNo longer I bear the burden of care,\nHis yoke is so sweet to me,\nMy soul was as black as night,\nBut darkness has taken flight;\nNow I have the victory\nFor Jesus has set me free.","n":1},{"p":"v","t":"I\u2019ll look on the great white throne,\nBefore it the ransomed stand;\nNo longer are tears,\nNo sorrow is known\nNor death in that goodly land.\nMy Saviour has gone before,\nPreparing the way for me;\nSoon we\u2019ll meet to part no more,\nThru time or eternity.","n":2},{"p":"v","t":"The gates of that holy place\nStand open by night and day;\nO look to the Lord who giveth more grace\nWhose love has prepared the way.\nA home in those mansions fair\nHis hand has reserved for all\nFor the wedding feast prepare,\nObeying the gracious call.","n":3},{"p":"v","t":"O, Jesus is coming soon,\nOur trials will then be o\u2019er,\nO, what if our Lord this moment should come\nFor those who are free from sin?\nO, then would it bring you joy,\nOr sorrow and deep despair?\nWhen our Lord in glory comes,\nWe\u2019ll meet Him up in the air.","n":4}]},{"n":3,"t":"I love him","k":"C","s":[{"p":"v","t":"Gone from my heart the world and all its charm;\nGone are my sins and all that would alarm;\nGone evermore,\nAnd by His grace I know,\nThe precious blood of Jesus cleanses white as snow.","n":1},{"p":"c","t":"I love Him, I love Him,\nBecause He first loved me,\nand purchased my salvation,\nOn Calvary\u2019s tree.","n":1},{"p":"v","t":"Once I was lost, upon the plains of sin;\nOnce was a slave to passions fierce within;\nOnce was afraid to trust a loving God,\nBut now my guilt is washed away in Jesus\u2019 blood.","n":2},{"p":"v","t":"Once I was bound, but now I am set free;\nOnce I was blind,\nBut now the light I see;\nOnce I was dead, but now in Christ I live,\nTo tell the world the peace that He alone can give.","n":3}]},{"n":4,"t":"Sweet hour of prayer","k":"Eb","s":[{"p":"v","t":"Sweet hour of prayer! Sweet hour of prayer!\nThat calls me from a world of care,\nAnd bids me at my Father\u2019s throne,\nMake all my wants and wishes known;","n":1},{"p":"v","t":"In seasons of distress and grief,\nMy soul has often found relief,\nAnd oft escaped the tempter\u2019s snare,\nBy thy return, sweet hour of prayer.","n":2},{"p":"v","t":"Sweet hour of prayer!\nSweet hour of prayer!\nThe joy I feel, the bliss I share,\nOf those whose anxious spirit burn,\nWith strong desire for Thy return!","n":3},{"p":"v","t":"With such I hasten to the place,\nWhere God my Saviour shows His face,\nAnd gladly take my station there,\nAnd wait for thee, sweet hour of prayer.","n":4},{"p":"v","t":"Sweet hour of prayer! Sweet hour of prayer!\nThy wings shall my petition bear\nTo Him whose truth and faithfulness,\nEngage the waiting soul to bless;","n":5},{"p":"v","t":"And since He bids me seek His face\nBelieve His Word and trust His grace,\nI\u2019ll cast on Him my every care,\nAnd wait for thee, sweet hour of prayer.","n":6},{"p":"v","t":"Sweet hour of prayer! Sweet hour of prayer!\nMay I thy consolation share,\nTill from mount Pisgah\u2019s lofty height,\nI view my home and take my flight;","n":7},{"p":"v","t":"This robe of flesh I\u2019ll drop and rise\nTo seize the everlasting prize;\nAnd shout while passing thru the air,\nFarewell, farewell, sweet hour of prayer.","n":8}]},{"n":5,"t":"Oh, how I love Jesus","k":"Ab","s":[{"p":"v","t":"There is a name I love to hear,\nI love to sing its worth;\nIt sounds like music in mine ear,\nThe sweetest name on earth.","n":1},{"p":"c","t":"Oh, how I love Jesus\nOh, how I love Jesus\nOh, how I love Jesus\nBecause He first loved me.","n":1},{"p":"v","t":"It tells me of a Saviour\u2019s love\nWho died and set me free;\nIt tells me of His precious blood;\nThe sinner\u2019s perfect plea.","n":2},{"p":"v","t":"It tells me what my Father hath\nIn store for everyday,\nAnd though I tread a darksome path,\nYields sunshine all the way.","n":3},{"p":"v","t":"It tells of One whose loving heart\nCan feel my deepest woe,\nWho in each sorrow bears a part,\nThat none can bear below.","n":4}]},{"n":6,"t":"When the redeemed are gathering in","k":"G","s":[{"p":"v","t":"I am thinking of the rapture in our blessed home on high,\nWhen the redeemed are gathering in;\nHow we\u2019ll raise the heavenly anthem in that city in the sky,\nWhen the redeemed are gathering in.","n":1},{"p":"c","t":"When the redeemed are gathering in;\nWashed like snow, and free from sin;\nHow we\u2019ll shout, and how we\u2019ll sing,\nWhen the redeemed are gathering in.","n":1},{"p":"v","t":"There will be a great procession over on the street of gold,\nWhen the redeemed are gathering in;\nO what music, O what singing o\u2019er the city will be rolled,\nWhen the redeemed are gathering in.","n":2},{"p":"v","t":"Saints will sing redemption story with their voices clear and strong,\nWhen the redeemed are gathering in;\nThen the angels all will listen, for they cannot join that song,\nWhen the redeemed are gathering in.","n":3},{"p":"v","t":"Then the Saviour will give orders to prepare the banquets\u2019\nboard,\nWhen the redeemed are gathering in;\nAnd we\u2019ll hear His invitation, \u201cCome, ye blessed of the Lord\u201d,\nWhen the redeemed are gathering in.","n":4}]},{"n":7,"t":"Oh, I want to see him","k":"Ab","s":[{"p":"v","t":"As I journey thru the land, singing as I go,\nPointing souls to Calvary, to the crimson flow.\nMany arrows pierce my soul from without within;\nBut my Lord leads me on thru Him I must win.","n":1},{"p":"c","t":"Oh, I want to see Him, look upon His face,\nThere to sing forever of His saving grace;\nOn the street of glory let me lift my voice;\nCares all past, home at last, ever to rejoice.","n":1},{"p":"v","t":"When in service for my Lord, dark may be the night,\nBut I cling more close to Him, He will give me light;\nSatan\u2019s snares may vex my soul, turn my thought aside,\nBut my Lord goes ahead, leads whate\u2019er betide.","n":2},{"p":"v","t":"When in valleys low I look towards the mountain height,\nAnd behold my Saviour there, leading in the fight,\nWith a tender hand outstretched towards the valley low;\nGuiding me, I can see as I onward go.","n":3},{"p":"v","t":"When before me billows rise from the mighty deep,\nThen my Lord directs my path, He doth safely keep,\nAnd He leads me gently on thru this world below;\nHe\u2019s a real friend to me, Oh I love Him so.","n":4}]},{"n":8,"t":"Feeling so much better","k":"F","s":[{"p":"v","t":"Feeling so much better, talking about this good old way;\nFeeling so much better, talking about the Lord","n":1},{"p":"c","t":"So, Let\u2019s go on, let\u2019s go on talking about this good old way\nLet\u2019s go on, let\u2019s go on talking about the Lord.","n":1},{"p":"v","t":"The devil he don\u2019t like it talking about this good old way\nThe devil he don\u2019t like it talking about the Lord.","n":2},{"p":"v","t":"Let\u2019s go on, let\u2019s go on talking about this good old way\nLet\u2019s go on, let\u2019s go on talking about the Lord.","n":3}]},{"n":9,"t":"Teach me Lord to wait","k":"F","s":[{"p":"v","t":"Teach me Lord to wait down on my knees,\nTill in Your own good time You answer my pleas;\nTeach me not to rely on what\nothers do,\nBut to wait in prayer, for an answer from You.","n":1},{"p":"c","t":"They that wait upon the Lord, Shall renew their strength,\nThey shall mount up with wings as an eagle,\nThey shall run and\nnot be weary,\nThey shall walk and not faint;\nTeach me Lord, Teach me Lord to wait.","n":1},{"p":"v","t":"Teach me Lord to wait, while hearts are aflame,\nHelp me humble\nmy pride and call\non Your name;\nKeep my faith renewed, keep my eyes on Thee,\nHelp me be on this earth what You\nwant me to be.","n":2}]},{"n":10,"t":"Hallelujah, we shall rise","k":"Bb","s":[{"p":"v","t":"In the resurrection morning\nWhen the trump of God shall sound\nWe shall rise (hallelujah), we shall rise!\nThen the saints will come rejoicing\nAnd no tears will e\u2019er be found\nWe shall rise (hallelujah), we shall rise!","n":1},{"p":"c","t":"We shall rise (hallelujah), we shall rise, (Amen)\nWe shall rise (hallelujah),\nIn the resurrection morning when death\u2019s prison bars are broken,\nWe shall rise (hallelujah), we shall rise!","n":1},{"p":"v","t":"In the resurrection morning\nWhat a meeting it shall be\nWe shall rise (hallelujah), we shall rise!\nWhen our fathers and our mothers,\nAnd our loved ones we shall see,\nWe shall rise (hallelujah), we shall rise!","n":2},{"p":"v","t":"In the resurrection morning\nBlessed thought it is to me,\nWe shall rise (hallelujah), we shall rise!\nI shall see my Blessed Saviour\nWho so freely died for me\nWe shall rise (hallelujah), we shall rise!","n":3},{"p":"v","t":"In the resurrection morning\nWe shall meet Him in the air\nWe shall rise (hallelujah), we shall rise!\nAnd be carried up to glory,\nTo our home so bright and fair,\nWe shall rise (hallelujah), we shall rise!","n":4}]},{"n":11,"t":"When the battle\u2019s over","k":"G","s":[{"p":"v","t":"Am I a soldier of the cross,\nA follower of the Lamb,\nAnd shall I fear to own His cause,\nOr blush to speak His name,","n":1},{"p":"c","t":"And when the battle\u2019s over\nWe shall wear a crown!\nYes, We shall wear a crown!\nYes, We shall wear a crown!\nAnd when the\nbattle\u2019s over,\nWe shall wear a crown!\nIn the new Jerusalem.","n":1},{"p":"v","t":"Wear a crown, wear a crown,\nWear a bright and shining crown,\nAnd when the battle\u2019s over\nWe shall wear a crown!\nIn the new Jerusalem.\nMust I be carried to the skies\nOn flowery beds of ease,\nWhile others fought to win the prize,\nAnd sailed thru bloody seas?","n":2},{"p":"v","t":"Wear a crown, wear a crown,\nWear a bright and shining crown,\nAnd when the battle\u2019s over\nWe shall wear a crown!\nIn the new Jerusalem.\nAre there no foes for me to face?\nMust I not stem the flood?\nIs this vile world a friend to grace\nTo help me unto God?","n":3},{"p":"v","t":"Wear a crown, wear a crown,\nWear a bright and shining crown,\nAnd when the battle\u2019s over\nWe shall wear a crown!\nIn the new Jerusalem.\nSure I must fight if I would reign,\nIncrease my courage Lord,\nI\u2019ll bear the toil, endure the pain,\nSupported by Thy Word","n":4},{"p":"v","t":"Wear a crown, wear a crown,\nWear a bright and shining crown,\nAnd when the battle\u2019s over\nWe shall wear a crown!\nIn the new Jerusalem.","n":5}]},{"n":12,"t":"Grace greater than our sins","k":"G","s":[{"p":"v","n":1,"t":"Marvelous grace of our loving Lord,\nGrace that exceeds our sin and our guilt,\nYonder on Calvary's mount out-poured,\nThere where the blood of the Lamb was spilt."},{"p":"c","n":1,"t":"Grace, grace, God's grace,\nGrace that will pardon and cleanse within;\nGrace, grace, God's grace,\nGrace that is greater than all our sin."},{"p":"v","n":2,"t":"Sin and despair like the sea waves cold,\nThreaten the soul with infinite loss;\nGrace that is greater, yes, grace untold,\nPoints to the Refuge, the Mighty Cross."},{"p":"v","n":3,"t":"Dark is the stain that we cannot hide,\nWhat can avail to wash it away?\nLook! There is flowing a crimson tide;\nWhiter than snow you may be today."},{"p":"v","n":4,"t":"Marvelous, infinite, matchless grace,\nFreely bestowed on all who believe;\nAll who are longing to see His face,\nWill you this moment His grace receive?"}]},{"n":13,"t":"Zion\u2019s hill","k":"Ab","s":[{"p":"v","t":"There waits for me a glad tomorrow,\nWhere gates of pearl swing open wide,\nAnd when I\u2019ve passed this vale of sorrow,\nI\u2019ll camp upon the other side.","n":1},{"p":"c","t":"Someday beyond the reach of mortal ken,\nSomeday, God only knows just where and when,\nThe wheels of mortal life shall all stand still,\nAnd I shall go to dwell on Zion\u2019s Hill.","n":1},{"p":"v","t":"Someday I\u2019ll hear the angels singing,\nBeyond the shadows of the tomb,\nAnd all the bells of heaven ringing,\nWhile saints are singing \u201cHome, sweet home.\u201d","n":2},{"p":"v","t":"Someday my labours will be ended,\nAnd all wanderings will be o\u2019er,\nAnd all earth\u2019s broken ties be mended,\nAnd I shall sing and weep no more.","n":3},{"p":"v","t":"Someday the dark cloud will be lifted,\nAnd all the night of gloom be past;\nAnd all life\u2019s burden will be lifted,\nThe day of rest shall dawn at last.","n":4}]},{"n":14,"t":"We are marching to Zion","k":"G","s":[{"p":"v","t":"Come, we that love the Lord,\nAnd let our joys be known,\nJoin in a song with sweet accord,\nJoin in a song with sweet accord,\nAnd thus surround the throne,\nAnd thus surround the throne.","n":1},{"p":"c","t":"We are marching to\nZion,\nBeautiful, beautiful\nZion,\nWe are marching\nupward to Zion,\nThe beautiful city of God.","n":1},{"p":"v","t":"Let those refuse to sing,\nWho never knew our God,\nBut children of the heavenly King,\nBut children of the heavenly King,\nMay speak their joys abroad,\nMay speak their joys abroad.","n":2},{"p":"v","t":"The hill of Zion yields,\nA thousand sacred sweets,\nBefore we reach the heavenly fields,\nBefore we reach the heavenly fields,\nOr walk the golden street,\nOr walk the golden street.","n":3},{"p":"v","t":"Then let our songs abound,\nAnd every tear be dry;\nWe are marching thru Emmanuel\u2019s ground,\nWe are marching thru Emmanuel\u2019s ground,\nTo fairer worlds on high,\nTo fairer worlds on high.","n":4}]},{"n":15,"t":"Cleanse me","k":"F","s":[{"p":"v","t":"Search me O God, and know my heart today,\nTry me, O Saviour, Know my thoughts I pray;\nSee if there be some wicked way in me,\nCleanse me from every sin, and set me free.","n":1},{"p":"v","t":"I praised Thee, Lord, for cleansing me from sin,\nFulfill Thy Word, and make me pure within,\nFill me with fire, where once I burned with shame,\nGrant my desire to magnify Thy name.","n":2},{"p":"v","t":"Lord, take my life, and make it wholly Thine,\nFill my poor heart with Thy great love divine;\nTake all my will, my passion, self and pride,\nI now surrender, Lord, in me abide.","n":3},{"p":"v","t":"O Holy Ghost, revival comes from Thee,\nSend a revival, start the work in me;\nThy word declares Thou will supply our needs;\nFor blessing now, O Lord, I humbly plead.","n":4}]},{"n":16,"t":"My sheep know my voice","k":"Bb","s":[{"p":"v","t":"My sheep know my voice,\nAnd the path that I take,\nThey follow wherever I go;\nMy sheep know my voice,\nAnd come at My\ncall,\nBut a stranger\u2019s voice do they not know.","n":1},{"p":"c","t":"My sheep know my voice,\nAnd day by day,\nThey abide in the fold,\nAnd go not astray,\nThey love me because\nI have made them My choice,\nAnd they follow My call,\nFor My sheep know my voice.","n":1},{"p":"v","t":"My sheep know my voice,\nAnd the pastures of green,\nWhere I lead them so often to feed;\nMy sheep know my voice,\nAnd the cool sparkling stream,\nWhere beside its still waters I lead.","n":2},{"p":"v","t":"My sheep know my voice,\nAnd the valley of death,\nThrough which I shall lead them someday;\nBut no danger nor\nharm,\ncan touch\none of them,\nfor I will be with them always.","n":3}]},{"n":17,"t":"Onward, christian soldiers","k":"Eb","s":[{"p":"v","t":"Christ the Royal Master,\nLeads against the foe;\nForward into battle,\nSee, His banner go!","n":1},{"p":"c","t":"Onward, Christian Soldiers,\nMarching as to war,\nWith the cross of Jesus,\nGoing on before!","n":1},{"p":"v","t":"Like a mighty army,\nmoves the Church of God,\nBrothers, we are treading,\nWhere the saints have trod,\nWe are not divided,\nAll one body we,\nOne in hope and doctrine,\nOne in charity.","n":2},{"p":"v","t":"Crowns and thrones may perish,\nKingdoms rise and wane,\nBut the Church of Jesus,\nConstant will remain,\nGates of hell can never\n\u2018Gainst the Church prevail,\nWe have Christ\u2019s own promise,\nWhich can never fail.","n":3},{"p":"v","t":"At the sign of triumph,\nSatan\u2019s hosts doth flee,\nOn, then, Christian soldiers,\nOn to victory!\nHell\u2019s foundation quiver\nAt the shout of praise;\nBrothers, lift your voices,\nLoud your anthems raise.","n":4},{"p":"v","t":"Onward, then, ye people,\nJoin our happy throng,\nBlend with ours your voices\nIn the triumph song;\nGlory, laud, and honour,\nUnto Christ the King;\nThis through countless ages\nMen and angels sing.","n":5}]},{"n":18,"t":"Let\u2019s talk about Jesus","k":"Bb","s":[{"p":"v","t":"Let\u2019s talk about Jesus,\nThe King of kings is He\nThe Lord of lords Supreme\nThrough all eternity;\nThe great I AM, the Way,\nThe Truth, the Life, the Door,\nLet\u2019s talk about Jesus more and more.","n":1},{"p":"v","t":"Let\u2019s talk about Jesus\nLet all the world proclaim\nThe pow\u2019r and majesty,\nOf such a wondrous name\nThe babe of Bethlehem\nThe Bright and Morning Star\nLet\u2019s sing His praises near and far.","n":2},{"p":"v","t":"Let\u2019s talk about Jesus\nThe Bread of Life is He\nThe Saviour of the world\nThe Man of Galilee\nThe Prophet, Priest and King,\nThe Mighty God is He,\nThe Well of Living water free.","n":3},{"p":"v","t":"Let\u2019s talk about Jesus\nThe Prince of Peace is He,\nThe Great Physician too,\nDown through all history\nThe Lily pure and white\nThe Rose and Sharon fair\nThe Shepherd of such tender care.","n":4},{"p":"v","t":"Let\u2019s talk about Jesus\nThe Rock of Ages is He\nThe Lamb for sinners slain,\nThat Man of Calvary,\nThe Great Emmanuel,\nThe Word of God sublime,\nHe is our Bridegroom so Divine.","n":5}]},{"n":19,"t":"When our Lord shall come again","k":"G","s":[{"p":"v","t":"When upon the clouds of heaven,\nChrist shall come to earth again,\nWill the world be glad to see Him,\nWhen our Lord shall come again.","n":1},{"p":"c","t":"There\u2019ll be singing, there\u2019ll be shouting,\nThere\u2019ll be sorrow, there\u2019ll be pain,\nThere\u2019ll be weeping, there\u2019ll be praying,\nWhen our Lord shall come again.","n":1},{"p":"v","t":"Will His coming bring rejoicing?\nOr will it bring tears and pain?\nAre you ready to receive Him?\nWhen our Lord shall come again.","n":2},{"p":"v","t":"Will you join in lamentation?\nOr the angels\u2019 glad refrain?\nWill you help His people crown Him?\nWhen our Lord shall come again.","n":3},{"p":"v","t":"Work and pray till Jesus calls you,\nHelp to gather in the grain,\nThen with joy you\u2019ll meet the Saviour,\nWhen our Lord shall come again.","n":4}]},{"n":20,"t":"The fight is on","k":"Bb","s":[{"p":"v","t":"The fight is on,\nThe trumpet sound is ringing out,\nThe cry to arms! Is heard afar and near,\nThe Lord of hosts is Marching on to victory,\nThe triumph of the right will soon appear.","n":1},{"p":"c","t":"The fight is on, O Christian soldier!\nAnd face to face in stern array,\nWith armour gleaming, and colours streaming,\nThe right and wrong engage today;\nThe fight is on, but be not weary,\nBe strong and in His might hold fast;\nIf God be for us, His banner o\u2019er us,\nWe\u2019ll sing the victor\u2019s song at last.","n":1},{"p":"v","t":"The fight is on, arouse ye soldiers brave and true,\nJehovah leads and vict\u2019ry will assure,\nGo buckle on the armour God has given you,\nAnd in His strength unto the end endure.","n":2},{"p":"v","t":"The Lord is leading unto certain victory,\nThe bow of promise spans the eastern sky,\nHis glorious name in every land shall honour be,\nThe morn will break, the dawn of peace is nigh.","n":3}]},{"n":21,"t":"Victory in Jesus","k":"F","s":[{"p":"v","t":"I heard an old, old story,\nHow a Saviour came from glory,\nHow He gave His life on Calvary,\nTo save a wretch like me;\nI heard about His groaning,\nOf His precious blood\u2019s atoning,\nThen I repented of my sins,\nAnd won the victory.","n":1},{"p":"c","t":"O victory in Jesus\nMy Saviour, forever,\nHe sought me and bought me,\nWith His redeeming blood,\nHe loved me, ere I knew Him,\nAnd all my love is due Him,\nHe plunged me to victory,\nBeneath the cleansing flood.","n":1},{"p":"v","t":"I heard about His healing,\nOf His cleansing pow\u2019r revealing,\nHow He made the lame to walk again,\nAnd caused the blind to see.\nAnd then I cried \u201cdear Jesus,\nCome and heal my broken spirit\u201d,\nAnd somehow Jesus came and brought\nTo me the victory.","n":2},{"p":"v","t":"I heard about a mansion,\nHe has built for me in glory,\nAnd I heard about the streets of gold\nBeyond the crystal sea,\nAbout the angels singing,\nAnd the old redemption story,\nAnd some sweet day\nI\u2019ll sing up there,\nThe song of victory.","n":3}]},{"n":22,"t":"My faith looks up to thee","k":"Eb","s":[{"p":"v","t":"My faith looks up to\nThee,\nThou Lamb of Calvary,\nSaviour divine,","n":1},{"p":"v","t":"Now hear me while I pray,\nTake all my guilt away,\nO let me from this day\nBe wholly Thine!","n":2},{"p":"v","t":"May Thy rich grace impart\nStrength to my fainting heart,\nMy zeal inspire,","n":3},{"p":"v","t":"As Thou hast died for me,\nO may my love to Thee,\nPure, warm and changeless be\nA living fire.","n":4},{"p":"v","t":"While life\u2019s dark maze I tread,\nAnd griefs around me spread,\nBe Thou my\nGuide,","n":5},{"p":"v","t":"Bid darkness turn to day,\nWipe sorrow\u2019s tears away,\nNor let me ever stray\nFrom Thee aside.","n":6},{"p":"v","t":"When ends life\u2019s transient dream,\nWhen death\u2019s cold sullen stream,\nShall o\u2019er me roll,","n":7},{"p":"v","t":"Blest Saviour, then in love,\nFear and distrust remove,\nO bear me safe abode,\nA ransomed soul.","n":8}]},{"n":23,"t":"Living by faith","k":"C","s":[{"p":"v","t":"I care not today what the morrow may bring,\nIf shadow or sunshine or rain;\nThe Lord I know ruleth o\u2019er everything,\nAnd all of my worry is vain.","n":1},{"p":"c","t":"Living by faith, in Jesus\nabove,\nTrusting, confiding in His great love,\nFrom all harms safe in His sheltering arm;\nI\u2019m living by faith and feel no alarm.","n":1},{"p":"v","t":"Though tempest may blow and the storm-clouds arise,\nObscuring the brightness of life,\nI\u2019m never alarmed by the overcast skies,\nThe Master looks on at the strife.","n":2},{"p":"v","t":"I know that He safely will carry me thru,\nNo matter what evil betide,\nWhy should I then care, though the tempest may blow,\nIf Jesus walks close to my side.","n":3},{"p":"v","t":"Our Lord will return to this earth some sweet day,\nOur troubles will then all be over,\nThe Master so gently will lead us away,\nBeyond the blest\nheavenly shore.","n":4}]},{"n":24,"t":"I surrender all","k":"D","s":[{"p":"v","t":"All to Jesus I surrender,\nAll to Him I freely give;\nI will ever love and trust Him,\nIn His presence daily live.","n":1},{"p":"c","t":"I surrender all,\nI surrender all,\nAll to Thee my blessed Saviour,\nI surrender all.","n":1},{"p":"v","t":"All to Jesus I surrender,\nHumbly at His feet I bow,\nWorldly pleasures all forsaken,\nTake me, Jesus, take me now.","n":2},{"p":"v","t":"All to Jesus I surrender,\nMake me Saviour wholly Thine;\nLet me feel the Holy Spirit,\nTruly know that Thou art mine.","n":3},{"p":"v","t":"All to Jesus I surrender,\nLord I give myself to Thee;\nFill me with Thy love and power,\nLet Thy blessing fall on me.","n":4},{"p":"v","t":"All to Jesus I surrender,\nNow I feel the sacred flame,\nO, the joy of full salvation!\nGlory, glory to His name.","n":5}]},{"n":25,"t":"When I reach that city","k":"F","s":[{"p":"v","t":"On the top of mount Zion is a city\nAnd the earth with glory it doth fill;\nI shall look on its beauty in the morning,\nWhen I reach that city on the hill.","n":1},{"p":"c","t":"Oh, that city on mount Zion,\nThough a pilgrim, yet I love thee still,\nI\u2019ll not leave thee, through the ages,\nWhen I reach that city on the hill.","n":1},{"p":"v","t":"I\u2019m invited to come home to that city,\nFor the Word says \u201cwhosoever will\u201d,\nAnd I\u2019ll find there a mansion for me waiting,\nWhen I reach that city on the hill.","n":2},{"p":"v","t":"Death will never molest me in that city,\nNever leave me lying cold and chill;\nAnd I\u2019ll enter to live up there forever\nWhen I reach that city on the hill.","n":3},{"p":"v","t":"So I\u2019ll stay here until my Saviour calls me,\nTrying daily to perform His will;\nThen He\u2019ll say unto me, \u201cWell done,\u201d up yonder,\nWhen I reach that city on the hill.","n":4}]},{"n":26,"t":"Farther along","k":"F","s":[{"p":"v","t":"Tempted and tried we\u2019re oft made to wonder,\nWhy it should be thus all the day long,\nWhile there are others living about us,\nNever molested though in the wrong.","n":1},{"p":"c","t":"Farther along we\u2019ll know\nall about it,\nFarther along we\u2019ll understand why;\nCheer up my brother,\nlive in the sunshine,\nWe\u2019ll understand it all by and by.","n":1},{"p":"v","t":"When death has come and taken our loved ones,\nIt leaves our home so lonely and drear,\nthen do we wonder why others prosper,\nLiving so wicked year after year.","n":2},{"p":"v","t":"Faithful till death said our loving Master,\nA few more days to labour and wait,\nToils of the road will then seem as nothing,\nAs we sweep thru the beautiful gate.","n":3},{"p":"v","t":"When we see Jesus coming in glory,\nWhen He comes from His home in the sky,\nThen we shall meet Him in that bright mansion,\nWe\u2019ll understand it all by and by.","n":4}]},{"n":27,"t":"Fill my way with love","k":"Ab","s":[{"p":"v","t":"Let me walk blessed Lord, in the way Thou hast gone,\nLeading straight to the land above;\nGiving cheer everywhere,\nto the sad and the lone,\nFill my way everyday with love.","n":1},{"p":"c","t":"Fill my way everyday with love,\nAs I walk with the heavenly dove,\nLet me go all the while with a song and a smile,\nFill my way\neveryday with love.","n":1},{"p":"v","t":"Keep me close to the side of my Saviour and Guide,\nLet me never in darkness rove,\nKeep my path free from wrath, and my soul satisfied,\nFill my way everyday with love.","n":2},{"p":"v","t":"Soon the race will be o\u2019er, and I\u2019ll travel no more,\nBut abide in my home above;\nLet me sing, Blessed King, all the way to the shore,\nFill my way everyday with love.","n":3}]},{"n":28,"t":"I am resolved","k":"Bb","s":[{"p":"v","t":"I am resolved no longer\nto linger,\nCharmed by the world\u2019s delight,\nThings that are higher, things that are nobler,\nThese have allured my sight.","n":1},{"p":"c","t":"I will hasten to Him,\nHasten so glad and free,\nJesus greatest, highest,\nI will come to Thee.","n":1},{"p":"v","t":"I am resolved to go to the Saviour,\nLeaving my sin and strife;\nHe is the true One, He is the just One,\nHe hath the words of life.","n":2},{"p":"v","t":"I am resolved to follow the Saviour,\nFaithful and true each day,\nHeed what He sayeth, do what He willeth,\nHe is the living Way.","n":3},{"p":"v","t":"I am resolved to enter the Kingdom,\nLeaving the paths of sin;\nFriends may oppose me, foes may beset me,\nStill will I enter in.","n":4},{"p":"v","t":"I am resolved and who will go with me?\nCome, friends, without delay;\nTaught by the Bible, led by the Spirit,\nWe\u2019ll walk the heavenly way.","n":5}]},{"n":29,"t":"Higher ground","k":"Ab","s":[{"p":"v","t":"I\u2019m pressing on the upward way,\nNew heights I\u2019m gaining everyday,\nStill praying as I\u2019m onward bound,\n\u201cLord plant my feet on higher ground\u201d.","n":1},{"p":"c","t":"Lord, lift me up and let me stand,\nBy faith on heaven\u2019s table land,\nA higher plain than I have found,\nLord plant my feet on higher ground.","n":1},{"p":"v","t":"My heart has no desire to stay,\nWhere doubts arise and fears dismay,\nThough some may dwell where this abound,\nMy prayer, my aim is higher ground.","n":2},{"p":"v","t":"I want to live above the world,\nThough Satan\u2019s darts at me are hurled,\nFor faith has caught the joyful sound,\nThe song of saints on higher ground.","n":3},{"p":"v","t":"I want to scale the utmost height,\nAnd catch a gleam of glory bright;\nBut still I pray till heaven I\u2019ve found,\n\u201cLord, lead me on to higher ground\u201d.\nLord, lift me up and let me stand,\nBy faith on heaven\u2019s table land,\nA higher plain than I have found,\nLord plant my feet on\nhigher ground.","n":4}]},{"n":30,"t":"Standing on the promises","k":"Bb","s":[{"p":"v","t":"Standing on the promises of Christ my King,\nThru eternal ages let His praises ring,\nGlory in the highest I will shout and sing,\nStanding on the promises of God.","n":1},{"p":"c","t":"Standing, standing,\nstanding on the promises of God my Saviour;\nStanding, standing,\nI am standing on the promises of God.","n":1},{"p":"v","t":"Standing on the promises that cannot fail,\nWhen the howling storms of doubt and fear assail,\nBy the living Word\nof God I shall prevail,\nStanding on the\npromises of God.","n":2},{"p":"v","t":"Standing on the promises\nI now can see,\nPerfect, present, cleansing in the blood for me;\nStanding in the liberty where Christ makes free,\nStanding on the\npromises of God.","n":3},{"p":"v","t":"Standing on the promises of Christ the Lord,\nBound to Him eternally\nby love\u2019s strong cord,\nOvercoming daily with\nthe Spirit\u2019s sword,\nStanding on the\npromises of God.","n":4},{"p":"v","t":"Standing on the\npromises I cannot fall,\nListening every moment\nto the Spirit\u2019s call,\nResting in my Saviour\nas my all in all,\nStanding on the promises of God.","n":5}]},{"n":31,"t":"By and by, when the morning comes","k":"Eb","s":[{"p":"v","t":"We are often tossed and driven on the restless sea of time,\nSomber skies and howling tempest oft succeed a bright sunshine,\nIn that land of perfect day,\nWhen the mists have rolled away,\nWe will understand it better by and by.","n":1},{"p":"c","t":"By and by when the morning comes,\nWhen the saints of God are gathered home,\nWe will tell the story how we\u2019ve overcome,\nWe will understand it better by and by.","n":1},{"p":"v","t":"We are often destitute of the things that life demands,\nWants of food and want of shelter, thirsty hills and barren lands,\nBut we\u2019re trusting in the Lord, and according to His Word,\nWe will understand it better by and by.","n":2},{"p":"v","t":"Trials dark on every hand, and we cannot understand,\nAll the ways that God will lead us to that blessed Promised Land,\nBut He\u2019ll guide us with His eye, and we\u2019ll follow till we die,\nWe will understand it better by and by.","n":3},{"p":"v","t":"Temptations, hidden snares often take us unawares,\nAnd our hearts are made to bleed, for each a thoughtless word or deed,\nAnd we wonder why the test, when we try to do our best,\nBut we\u2019ll understand it better by and by.","n":4}]},{"n":32,"t":"Rock of ages","k":"Bb","s":[{"p":"v","n":1,"t":"Rock of Ages, cleft for me,\nLet me hide myself in Thee;\nLet the water and the blood,\nFrom Thy wounded side which flowed,\nBe of sin the double cure,\nSave from wrath and make me pure."},{"p":"v","n":2,"t":"Not the labour of my hands\nCan fulfill Thy law's demands;\nCould my zeal no respite know,\nCould my tears forever flow,\nAll for sin could not atone,\nThou must save, and Thou alone."},{"p":"v","n":3,"t":"Nothing in my hand I bring,\nSimply to Thy cross I cling;\nNaked, come to Thee for dress,\nHelpless, look to Thee for grace;\nFoul, I to the fountain fly,\nWash me, Saviour, or I die."},{"p":"v","n":4,"t":"While I draw this fleeting breath,\nWhen my eyelids close in death,\nWhen I soar to worlds unknown,\nAnd behold Thee on Thy throne,\nRock of Ages, cleft for me,\nLet me hide myself in Thee."}]},{"n":33,"t":"When I see the blood","k":"Bb","s":[{"p":"v","n":1,"t":"Christ our Redeemer died on the cross,\nDied for the sinner, paid all His due;\nSprinkle your soul with the blood of the Lamb,\nAnd I will pass, will pass over you."},{"p":"c","n":1,"t":"When I see the blood,\nWhen I see the blood,\nWhen I see the blood,\nI will pass, will pass over you."},{"p":"v","n":2,"t":"Chiefest of sinners, Jesus will save;\nAll He has promised, that will He do;\nWash in the fountain opened for sin,\nAnd I will pass, will pass over you."},{"p":"v","n":3,"t":"Judgment is coming, all will be there,\nEach one receiving justly his due;\nHide in the saving, sin-cleansing blood,\nAnd I will pass, will pass over you."},{"p":"v","n":4,"t":"Oh, great compassion! O boundless love!\nO loving kindness, faithful and true!\nFind peace and shelter under the blood,\nAnd I will pass, will pass over you."}]},{"n":34,"t":"Love lifted me","k":"Bb","s":[{"p":"v","t":"I was sinking deep in sin,\nFar from the peaceful shore,\nVery deeply stained within,\nSinking to rise no more,\nBut the Master of the sea,\nHeard my despairing cry,\nFrom the waters lifted me\nNow safe am I.","n":1},{"p":"c","t":"Love lifted me! Love lifted me!\nWhen nothing else could help,\nLove lifted me!\nLove lifted me! Love lifted me!\nWhen nothing else could help,\nLove lifted me!","n":1},{"p":"v","t":"All my heart to Him I give,\nEver to Him I\u2019ll cling,\nIn His blessed presence live,\nEver His praises sing,\nLove so mighty and so true,\nMerits my soul\u2019s best songs,\nFaithful, loving, service, too,\nTo Him belongs.","n":2},{"p":"v","t":"Souls in danger, look above,\nJesus completely saves,\nHe will lift you by His love\nOut of the angry waves,\nHe\u2019s the Master of the sea,\nBillows His will obey,\nHe your Saviour wants to be,\nBe saved today.","n":3}]},{"n":35,"t":"There shall be showers of blessing","k":"Bb","s":[{"p":"v","t":"There shall be showers of blessing,\nThis is the promise of love,\nThere shall be seasons refreshing,\nSent from the Saviour above.","n":1},{"p":"c","t":"Showers of blessing,\nShowers of blessing we need,\nMercy drops round us are falling,\nBut for the showers we plead.","n":1},{"p":"v","t":"There shall be showers of blessing,\nPrecious reviving again;\nOver the hills and the valleys,\nSounds of abundance of rain.","n":2},{"p":"v","t":"There shall be showers of blessing,\nSend them upon us O Lord,\nGrant to us now a refreshing,\nCome and now honour Thy word.","n":3},{"p":"v","t":"There shall be showers of blessing,\nOh, that today they might fall,\nNow as to God we\u2019re confessing,\nNow as on Jesus we call","n":4}]},{"n":36,"t":"Have thine own way, Lord","k":"Eb","s":[{"p":"v","t":"Have Thine own way, Lord!\nHave Thine own way!\nThou art the potter,\nI am the clay;\nMould me and make me,\nAfter Thy will,\nWhile I am waiting,\nYielded and still.","n":1},{"p":"v","t":"Have Thine own way, Lord!\nHave Thine own way!\nSearch me and try me,\nMaster today!\nWhiter than snow, Lord,\nWash me just now,\nAs in Thy presence,\nHumbly I bow.","n":2},{"p":"v","t":"Have Thine own way, Lord!\nHave Thine own way!\nWounded and weary,\nHelp me, I pray,\nPower, all power, Surely is Thine!\nTouch me and heal me,\nSaviour divine!","n":3},{"p":"v","t":"Have Thine own way, Lord!\nHave Thine own way!\nHold o\u2019er my being,\nAbsolute sway!\nFill with Thy Spirit,\nTill all shall see,\nChrist only, always,\nLiving in me.","n":4}]},{"n":37,"t":"Draw me nearer","k":"Ab","s":[{"p":"v","t":"I am Thine, O Lord, I have heard Thy voice,\nAnd it told Thy love to me;\nBut I long to rise in the arms of faith,\nAnd be closer drawn to Thee.","n":1},{"p":"c","t":"Draw me nearer, nearer blessed Lord,\nTo the cross where Thou hast died,\nDraw me nearer, nearer, nearer blessed Lord,\nTo Thy precious bleeding side.","n":1},{"p":"v","t":"Consecrate me now to Thy service, Lord,\nBy the power of grace divine;\nLet my soul look up with a steadfast hope,\nAnd my will be lost in Thine.","n":2},{"p":"v","t":"Oh, the pure delight of a single hour,\nThat before Thy throne I spend,\nWhen I kneel in prayer, and with Thee, my God,\nI commune as friend with friend.","n":3},{"p":"v","t":"There are depths of love that I cannot know,\nTill I cross the narrow sea,\nThere are heights of joy that I may not reach,\nTill I rest in peace with Thee.","n":4}]},{"n":38,"t":"I am marked","k":"Ab","s":[{"p":"v","t":"I have lost my reputation since I turned my back to sin,\nAnd a lot of friends went from me\nSince I let my Saviour in,\nNow they passed me by unknown\nWhen they once passed me with a smile\nNow they say I\u2019m very foolish,\nAnd they say I\u2019m not out of style.","n":1},{"p":"c","t":"I am marked, marked, marked,\nI am marked now wherever I go,\nI am marked, marked, marked,\nJust what I am everyone seems to know\nI am sealed, sealed, sealed,\nI am sealed by His Spirit divine;\nO glory to God! Hallelujah! Amen!\nI am His, and I know He is mine.","n":1},{"p":"v","t":"Well they say my life is ruined,\nAnd my talent thrown away,\nAnd they cannot understand it,\nFor I had such plans one day;\nBut I know what I surrendered when I promised I\u2019d go through\nAnd I gained far more glory since God made me ever new.","n":2}]},{"n":39,"t":"Won\u2019t it be wonderful there?","k":"C","s":[{"p":"v","t":"When with the Saviour we enter the glory land,\nWon\u2019t it be wonderful there?\nEnded the troubles and cares of the story land,\nWon\u2019t it be wonderful there?","n":1},{"p":"c","t":"Won\u2019t it be wonderful there?\nHaving no burden to bear?\nJoyously singing with heart-bells all ringing,\nOh, won\u2019t it be wonderful there?","n":1},{"p":"v","t":"Walking and talking with Christ, the Supernal One,\nWon\u2019t it be wonderful there?\nPraising, adoring the Matchless Eternal One,\nWon\u2019t it be wonderful there?","n":2},{"p":"v","t":"There, where the tempest will never be sweeping us,\nWon\u2019t it be wonderful there?\nSure that forever the Lord will be keeping us,\nWon\u2019t it be wonderful there?","n":3}]},{"n":40,"t":"Wings of a dove","k":"Eb","s":[{"p":"v","t":"Noah had drifted,\nOn the floods many days,\nHe searched for land,\nIn various ways;\nTroubles he had some,\nBut not from above,\nGod gave him His sign,\nOn the wings of a dove.","n":1},{"p":"c","t":"On the wings of a snow white dove,\nGod sends down His pure, sweet love,\nA sign from above,\nOn the wings of a dove.","n":1},{"p":"v","t":"Jesus, our Saviour,\nCame to earth one day;\nHe was born in a stable;\nIn a manger of hay;\nThough here rejected,\nBut not from above,\nGod gave us His\nsign,\nOn the wings of a dove.","n":2},{"p":"v","t":"Though I have suffered,\nIn many a way,\nI cried for healing,\nBoth night and day;\nFaith wasn\u2019t forgotten,\nBy the Father above,\nHe gave me His sign,\nOn the wings of a dove.","n":3}]},{"n":41,"t":"I feel like traveling on","k":"G","s":[{"p":"v","t":"My heavenly home is bright and fair,\nI feel like traveling on,\nNor pain, nor death can enter there,\nI feel like traveling on.","n":1},{"p":"c","t":"Yes, I feel like traveling on,\nI feel like traveling on,\nMy heavenly home is bright and fair,\nI feel like traveling on.","n":1},{"p":"v","t":"It\u2019s glittering tow\u2019rs the sun out-shine,\nI feel like traveling on,\nThat heavenly mansion shall be mine,\nI feel like traveling on.","n":2},{"p":"v","t":"Let others seek a home below,\nI feel like traveling on,\nWhich flames devour, or waves o\u2019erflow,\nI feel like traveling on.","n":3},{"p":"v","t":"The Lord has been so good to me,\nI feel like traveling on,\nUntil the blessed home I see,\nI feel like traveling on.","n":4}]},{"n":42,"t":"Come and dine","k":"C","s":[{"p":"v","t":"Jesus has a table spread, where the saints of God are fed,\nHe invites His chosen people \u201cCome and dine\u201d!\nWith His manna He doth feed, and supplies our every need;\nO, \u2018tis sweet to sup with Jesus all the time.","n":1},{"p":"c","t":"\u201cCome and dine\u201d the Master calleth \u201ccome and dine\u201d,\nYou may feast at Jesus\u2019 table all the time,\nHe who fed the multitude, turned the water into wine,\nTo the hungry calleth now, \u201cCome and dine\u201d.","n":1},{"p":"v","t":"The disciples came to land, thus obeying Christ\u2019s command,\nFor the Master called to them, \u201cCome and dine\u201d,\nThere they found their heart desire, bread and fish upon the fire;\nThus He satisfies the hungry every time.","n":2},{"p":"v","t":"Soon the Lamb will take His bride\nTo be ever at His side,\nAll the host of heaven will assembled be;\nO \u2018twill be a glorious sight, all the saints in spotless white,\nAnd with Jesus they will feast eternally.","n":3}]},{"n":43,"t":"God leads us along","k":"Eb","s":[{"p":"v","t":"In shady, green pastures, so rich and so sweet,\nGod leads His dear children along,\nWhere the water\u2019s cool flow bathes the weary one\u2019s feet,\nGod leads His dear children along.","n":1},{"p":"c","t":"Some through the waters, some through the flood,\nsome through the fire, but all through the blood,\nSome through great sorrow,\nBut God gives a\nsong,\nIn the night season and all the day long.","n":1},{"p":"v","t":"Sometimes on the mount where the sun shines so bright,\nGod leads His dear children along,\nSometimes in the valley in the darkest of night,\nGod leads His dear children along.","n":2},{"p":"v","t":"Though sorrows befall us, and Satan oppose,\nGod leads His dear children along,\nThrough grace we can conquer, defeat all our foes,\nGod leads His dear children along.","n":3},{"p":"v","t":"Away from the mire, and away from the clay,\nGod leads His dear children along,\nAway up in glory, eternity\u2019s day,\nGod leads His dear children along.","n":4}]},{"n":44,"t":"Leaning on the everlasting arms","k":"A","s":[{"p":"v","t":"What a fellowship, what a joy divine,\nLeaning on the everlasting arms;\nWhat a blessedness, what a peace is mine,\nLeaning on the everlasting arms.","n":1},{"p":"c","t":"Leaning, leaning,\nSafe and secure from all alarms,\nLeaning, leaning,\nLeaning on the everlasting arms.","n":1},{"p":"v","t":"Oh, how sweet to walk in this pilgrim way,\nLeaning on the everlasting arms;\nOh, how bright the path grows from day to day,\nLeaning on the everlasting arms.","n":2},{"p":"v","t":"What have I to dread, what have I to fear,\nLeaning on the everlasting arms;\nI have blessed peace with my Lord so near,\nLeaning on the everlasting arms.\nLeaning, leaning,\nSafe and secure from all alarms,\nLeaning, leaning,\nLeaning on the everlasting arms.","n":3}]},{"n":45,"t":"Sunlight","k":"Eb","s":[{"p":"v","t":"I wandered in the shade of night,\nTill Jesus came to me,\nAnd with the sunlight of His love,\nBid all my darkness flee.","n":1},{"p":"c","t":"Sunlight, sunlight in my soul today,\nSunlight, sunlight all along the way,\nSince my Saviour found me took away my sin,\nI have had the sunlight of His love within.","n":1},{"p":"v","t":"Though clouds may gather in the sky,\nAnd billows round me roll,\nHowever dark the world may be,\nI\u2019ve sunlight in my soul.","n":2},{"p":"v","t":"While walking in the light of God,\nI Sweet communion find;\nI press with holy vigour on,\nAnd leave the world behind.","n":3},{"p":"v","t":"I cross the wide extended fields,\nI Journey o\u2019er the plains,\nAnd in the sunlight of His love,\nI reap the golden grain.","n":4},{"p":"v","t":"Soon I shall see Him as He is,\nThe light that came to me,\nBehold the brightness of His face,\nThroughout eternity.","n":5}]},{"n":46,"t":"I know whom I believed","k":"Eb","s":[{"p":"v","t":"I know not why God\u2019s wondrous grace,\nTo me He hath made known,\nNor why, unworthy, Christ in love,\nRedeemed me for His own.","n":1},{"p":"c","t":"But I know whom I have believed,\nAnd I\u2019m persuaded that He is able,\nTo keep that which I\u2019ve committed,\nUnto Him against that day.","n":1},{"p":"v","t":"I know not how this saving faith,\nTo me He did impart,\nNor how believing in His Word,\nWrought peace within my heart.","n":2},{"p":"v","t":"I know not how the Spirit moves,\nConvincing men of sin,\nRevealing Jesus through the Word,\nCreating faith in Him.","n":3},{"p":"v","t":"I know not what of good or ill,\nMay be reserved for me,\nOf weary ways or golden days,\nBefore His face I see.","n":4},{"p":"v","t":"I know not when my Lord may come,\nAt night or noonday fair,\nNor if I\u2019ll walk the vale with Him,\nOr \u201cmeet Him in the air.\u201d","n":5}]},{"n":47,"t":"Bringing in the sheaves","k":"C","s":[{"p":"v","t":"Sowing in the morning, sowing\nseeds of kindness,\nSowing in the noontide and the\ndewy eve;\nWaiting for the harvest and the time of reaping,\nWe shall come rejoicing, bringing in the sheaves.","n":1},{"p":"c","t":"Bringing in the sheaves, bringing in the sheaves,\nWe shall come rejoicing, bringing in the sheaves;\nBringing in the sheaves, bringing in the sheaves,\nWe shall come rejoicing, bringing in the sheaves.","n":1},{"p":"v","t":"Sowing in the sunshine, Sowing in the shadows,\nFearing neither clouds nor winter\u2019s chilling breeze;\nBy and by the harvest and the labour ended,\nWe shall come rejoicing, bringing in the sheaves.","n":2},{"p":"v","t":"Going forth with weeping, sowing for the Master,\nThough the loss sustained, our spirit often grieves,\nWhen our weeping\u2019s over, He will bid us welcome,\nWe shall come rejoicing, bringing in the sheaves.","n":3}]},{"n":48,"t":"Some golden day break","k":"F","s":[{"p":"v","t":"Some glorious morning, sorrow will cease,\nSome glorious morning all will be peace;\nHeartaches all ended, school-days all done,\nHeaven will open, Jesus will come.","n":1},{"p":"c","t":"Some golden day-break, Jesus will come,\nSome golden day-break, battles are won,\nHe\u2019ll shout the victory, break through the blue,\nSome golden day-break, for me, for you.","n":1},{"p":"v","t":"Sad hearts will gladden, all shall be bright,\nGoodbye forever to earth\u2019s dark night;\nChanged in a moment, like Him to be,\nOh, glorious day-break, Jesus I\u2019ll see.","n":2},{"p":"v","t":"Oh, what a meeting there in the skies,\nNo tears nor crying shall dim our eyes;\nLoved ones united eternally,\nOh, what a day-break that morn will be.","n":3}]},{"n":49,"t":"Shall we gather at the river","k":"Ab","s":[{"p":"v","t":"Shall we gather at the river,\nWhere bright angel\u2019s feet have trod,\nWith its crystal tide forever,\nFlowing by the throne of God?","n":1},{"p":"c","t":"Yes, we\u2019ll gather at the river,\nThe beautiful, the beautiful river,\nGather with the saints at the river,\nThat flows by the throne of God.","n":1},{"p":"v","t":"On the bosom of the river,\nWhere the Saviour-King we own,\nWe shall meet and sorrow never,\nNeath the glory of the throne.","n":2},{"p":"v","t":"On the margin of the river,\nWashing up its silver spray,\nWe will walk and worship ever,\nAll the happy, golden day.","n":3},{"p":"v","t":"Ere we reach the shining river,\nLay we every burden down;\nGrace our spirits will deliver,\nAnd provide a robe and a crown.","n":4},{"p":"v","t":"At the smiling of the river,\nMirror of the Saviour\u2019s face,\nSaints whom death will never sever,\nLift their songs of saving grace.","n":5},{"p":"v","t":"Soon we\u2019ll reach the shining river,\nSoon our pilgrimage will cease,\nSoon our happy hearts will quiver,\nWith the melody of peace.","n":6}]},{"n":50,"t":"Glory to his name","k":"Ab","s":[{"p":"v","t":"Down at the cross where my Saviour died,\nDown where for cleansing from sin I cried;\nThere to my heart was the blood applied,\nGlory to His name!","n":1},{"p":"c","t":"Glory to His name!\nGlory to His name!\nThere to my heart\nwas the blood applied;\nGlory to His name!\nI am so wondrously saved from sin,\nJesus so sweetly abides within,\nThere at the cross where He took me in,\nGlory to His name!","n":1},{"p":"v","t":"Glory to His name!\nGlory to His name!\nThere to my heart was the blood applied;\nGlory to His name!","n":2},{"p":"v","t":"Oh, precious fountain that saves from sin!\nI am so glad I have entered in,\nThere Jesus saves me and keeps me clean,\nGlory to His name!\nGlory to His name!\nGlory to His name!\nThere to my heart was the blood applied;\nGlory to His name!","n":3},{"p":"v","t":"Come to the fountain so rich and sweet,\nCast thy poor soul at the Saviour\u2019s feet,\nPlunge in today and be made complete;\nGlory to His name!\nGlory to His name!\nGlory to His name!\nThere to my heart was the blood applied;\nGlory to His name!","n":4}]},{"n":51,"t":"He brought me out","k":"C","s":[{"p":"v","n":1,"t":"My heart was distressed neath Jehovah's dread frown,\nAnd low in the pit where my sins dragged me down,\nI cried to the Lord from the deep miry clay,\nWho tenderly brought me out to golden day."},{"p":"c","n":1,"t":"He brought me out of the miry clay,\nHe set my feet on the Rock to stay;\nHe puts a song in my soul today,\nA song of praise, hallelujah!"},{"p":"v","n":2,"t":"He placed me upon the strong rock by His side,\nMy steps were established and here I'll abide,\nNo danger of falling while here I remain,\nBut stand by His grace until the crown I gain."},{"p":"v","n":3,"t":"He gave me a song, 'twas a new song of praise,\nBy day and by night its sweet notes I will raise;\nMy heart's overflowing, I'm happy and free,\nI'll praise my Redeemer, who has rescued me."},{"p":"v","n":4,"t":"I'll sing of His wonderful mercy to me,\nI'll praise Him till all men His goodness shall see,\nI'll sing of salvation at home and abroad,\nTill many shall hear the truth and trust in God."}]},{"n":52,"t":"In the sweet by and by","k":"G","s":[{"p":"v","t":"There\u2019s a land that is fairer than day,\nAnd by faith we can see it afar,\nFor the Father waits over the way,\nTo prepare us a dwelling place there.","n":1},{"p":"c","t":"In the sweet by and by,\nWe shall meet on the beautiful shore,\nIn the sweet by and by,\nWe shall meet on the beautiful shore.","n":1},{"p":"v","t":"We shall sing on that beautiful shore,\nThe Melodious songs of the blest,\nAnd our spirits shall sorrow no more,\nNot a sigh for the blessing of rest.","n":2},{"p":"v","t":"To our bountiful Father above,\nWe will offer our tribute of praise,\nFor the glorious gift of His love,\nAnd the blessings that hallow our days.","n":3}]},{"n":53,"t":"There is a fountain","k":"C","s":[{"p":"v","t":"There is a fountain filled with blood,\nDrawn from Emmanuel\u2019s veins,\nAnd sinners plunged beneath that flood,","n":1},{"p":"v","t":"Lose all their guilty stains,\nLose all their guilty stains,\nLose all their guilty stains,\nAnd sinners plunged beneath that flood,\nLose all their guilty stains.","n":2},{"p":"v","t":"The dying thief rejoiced to see,\nThat fountain in his day,\nAnd there may I, though vile as he,","n":3},{"p":"v","t":"Wash all my sins away,\nWash all my sins away,\nWash all my sins away,\nAnd there may I, though vile as he,\nWash all my sins away.","n":4},{"p":"v","t":"Dear dying Lamb, Thy precious blood,\nShall never lose its power,\nTill all the ransomed Church of God","n":5},{"p":"v","t":"Be saved to sin no more;\nBe saved to sin no more;\nBe saved to sin no more;\nTill all the ransomed Church of God\nBe saved to sin no more.","n":6},{"p":"v","t":"E\u2019er since by faith I saw the stream,\nThy flowing wounds supply,\nRedeeming love has been my theme,","n":7},{"p":"v","t":"And shall be till I die;\nAnd shall be till I die;\nAnd shall be till I die;\nRedeeming love has been my theme,\nAnd shall be till I die.","n":8},{"p":"v","t":"Then in a nobler sweeter song,\nI\u2019ll sing Thy power to save,\nWhen this poor lisping stammering tongue,","n":9},{"p":"v","t":"Lies silent in the grave,\nLies silent in the grave,\nLies silent in the grave,\nWhen this poor lisping stammering tongue,\nLies silent in the grave.","n":10}]},{"n":54,"t":"Oh, what precious love","k":"F","s":[{"p":"v","t":"Oh, what precious love the Father\nHad for Adam\u2019s fallen race\nGave His only Son to suffer\nAnd redeem us by His grace.","n":1}]},{"n":55,"t":"Jesus never fails","k":"Ab","s":[{"p":"v","t":"Jesus never fails,\nJesus never fails,\nHeaven and earth shall pass away,\nBut Jesus never fails.","n":1}]},{"n":56,"t":"Battle hymns of republic","k":"Bb","s":[{"p":"v","t":"Mine eyes have seen the glory of the coming of the Lord,\nHe is trampling out the vintage where the grapes of wrath are stored;\nHe hath loosed the fateful lightning of his terrible swift sword,\nHis Truth is marching on.","n":1},{"p":"c","t":"Glory, glory, hallelujah!\nGlory, glory, hallelujah!\nGlory, glory, hallelujah!\nHis truth is marching on.","n":1},{"p":"v","t":"I have seen Him in the watch-fire of a hundred circling camps;\nThey have builded Him an altar in the evening dews and damps;\nI can read His righteous sentence by the dim and flaring lamps;\nHis day is marching on.","n":2},{"p":"v","t":"He has sounded forth the trumpet that shall never sound retreat,\nHe is sifting out the hearts of men before His judgement seat,\nO be swift, my soul to answer Him!\nBe jubilant my feet,\nOur God is marching on.","n":3},{"p":"v","t":"In the beauty of the lilies Christ was born across the sea,\nWith a glory in His bosom that transfigures you and me,\nAs He died to make men holy, let us die to make men free,\nWhile God is marching on.","n":4}]},{"n":57,"t":"Amen","k":"F","s":[{"p":"v","t":"Amen! Amen! Amen! Amen! Amen! Amen!","n":1},{"p":"v","t":"Are you going to love Him? Amen!\nAre you going to praise Him? Amen!\nAre you going to worship Him? Amen!\nAmen! Amen!","n":2},{"p":"v","t":"Do you love Him? Amen!\nWill you serve Him? Amen!\nDo you believe Him? Amen!\nAmen! Amen!","n":3},{"p":"v","t":"The Bible\u2019s true! Amen!\nI believe it! Amen!\nIt\u2019s the Word of God! Amen!\nAmen! Amen!","n":4},{"p":"v","t":"We believe you are coming, Amen!\nWe are ready to meet you, Amen!\nCome, Lord Jesus, Amen!\nAmen! Amen!","n":5}]},{"n":58,"t":"The circuit rider","k":"Bb","s":[{"p":"v","t":"The circuit rider preacher went riding through the land,\nWith his rifle on his shoulder and a Bible in his hand,\nHe told the prairie people of a blessed Promised Land,\nAs he went riding, singing along.","n":1},{"p":"c","t":"Leaning, leaning,\nLeaning on the everlasting arm;\nLeaning, leaning,\nLeaning on the everlasting arm.\nHe preached the coming judgement of fire and brimstone;\nAnd a glorious, endless Heaven of the justified alone;","n":1},{"p":"v","t":"As he rode across the mountains you could hear him sing this song,\nAs he went riding on.\nThere is power, power, wonder-working,\nIn the blood of the Lamb,\nThere is power, power, wonder-working,\nIn the precious blood of the Lamb.\nHis rifle\u2019s old and rusty, and it\u2019s hanging on the wall;\nHis Bible\u2019s worn and dusty and it\u2019s seldom touched at all;\nBut his message from this Bible will meet us at Judgement Day,\nFor God\u2019s truth keeps marching on.\nGlory, glory, hallelujah!\nGlory, glory, hallelujah!\nGlory, glory, hallelujah!\nHis Truth is marching on.","n":2}]},{"n":59,"t":"Each step of the way","k":"F","s":[{"p":"v","t":"I\u2019m following Jesus\nOne step at a time,\nI live for the moment\nIn His love divine","n":1},{"p":"v","t":"Why think of tomorrow\nJesus live for today\nI\u2019m following Jesus\nEach step of the way.","n":2},{"p":"v","t":"The pathway is narrow\nBut He leads me on,\nI walk in His shadow\nMy fears are all gone","n":3},{"p":"v","t":"My spirit grows stronger\nEach moment, each day,\nFor Jesus is leading\nEach step of the way.","n":4}]},{"n":60,"t":"I shall not be moved","k":"Ab","s":[{"p":"v","n":1,"t":"Jesus is my Saviour,\nI shall not be moved;\nIn His love and favour,\nI shall not be moved;\nJust like a tree that\u2019s planted by the waters,\nI shall not be moved."},{"p":"c","t":"I shall not be, I shall not be moved;\nI shall not be, I shall not be moved;\nJust like a tree that's planted by the waters,\nI shall not be moved.","n":1},{"p":"v","n":2,"t":"In my Christ abiding,\nI shall not be moved;\nIn His love I\u2019m hiding,\nI shall not be moved,\nJust like a tree that\u2019s planted by the waters,\nI shall not be moved."},{"p":"v","n":3,"t":"If I trust Him ever,\nI shall not be moved;\nHe will fail me never,\nI shall not be moved,\nJust like a tree that\u2019s planted by the waters,\nI shall not be moved."},{"p":"v","n":4,"t":"On His Word I\u2019m feeding,\nI shall not be moved;\nHe\u2019s the One that\u2019s leading, I shall not be moved;\nJust like a tree that\u2019s planted by the waters,\nI shall not be moved."},{"p":"v","n":5,"t":"Glory hallelujah,\nI shall not be moved;\nAnchored in Jehovah,\nI shall not be moved;\nJust like a tree that\u2019s planted by the waters,\nI shall not be moved."},{"p":"v","n":6,"t":"In His love abiding,\nI shall not be moved;\nAnd in Him confiding,\nI shall not be moved;\nJust like a tree that\u2019s planted by the waters,\nI shall not be moved."},{"p":"v","n":7,"t":"Though all hell assail me, I shall not be moved;\nJesus will not fail me, I shall not be moved;\nJust like a tree that\u2019s planted by the waters,\nI shall not be moved."},{"p":"v","n":8,"t":"Though the tempest raging,\nI shall not be moved;\nOn the Rock of Ages,\nI shall not be moved;\nJust like a tree that\u2019s planted by the waters,\nI shall not be moved."}]},{"n":61,"t":"Yesterday, t
