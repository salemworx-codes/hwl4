o the Lamb,\nWho all my sorrows took.","n":2},{"p":"v","t":"Grace taught my wandering feet\nTo tread the heavenly road;\nAnd new supplies each hour I meet,\nWhile pressing on to God.","n":3},{"p":"v","t":"Grace taught my soul to pray,\nAnd made mine eyes to o\u2019erflow;\n\u2018Twas grace which kept me to this day,\nAnd will not let me go.","n":4},{"p":"v","t":"Oh, let Thy grace inspire\nMy soul with strength divine!\nMy all my powers to Thee aspire,\nAnd all my days be Thine.\nLast verse:","n":5}]},{"n":421,"t":"Come and worship","k":"","s":[{"p":"v","t":"Angels, from the realms of glory,\nWing your flight o\u2019er all the earth;\nYe who sang creation\u2019s story,\nNow proclaim Messiah\u2019s birth:\nCome and worship!\nWorship Christ, the new-born King!","n":1},{"p":"v","t":"Shepherds in the field abiding,\nWatching o\u2019er their flocks by night;\nGod with man is now residing,\nYonder shines the Infant-light:\nCome and worship!\nWorship Christ, the new-born King!","n":2},{"p":"v","t":"Sages, leave your contemplations;\nBrighter visions beam afar!\nSeek the great Desire of nations,\nYe have seen His natal star:\nCome and worship!\nWorship Christ, the new-born King!","n":3},{"p":"v","t":"Saints before the altar bending,\nWatching long in hope and fear,\nSuddenly the Lord, descending,\nIn His temple shall appear:\nCome and worship!\nWorship Christ, the new-born King!","n":4}]},{"n":422,"t":"Hark! The herald angels sing","k":"","s":[{"p":"v","t":"Hark! The herald angels sing,\n\u201cGlory to the new-born King,\nPeace on earth and mercy mild,\nGod and sinners reconciled!\u201d\nJoyful, all ye nations, rise,\nJoin the triumph of the skies;\nWith th\u2019angelic host proclaim,\n\u201cChrist is born in Bethlehem,\u201d\nHark! The herald angels sing,\n\u201cGlory to the new-born King.\u201d","n":1},{"p":"v","t":"Christ, by highest heaven adored,\nChrist, the everlasting Lord,\nLate in time behold Him come,\nOffspring of a virgin\u2019s womb;\nVeiled in flesh the Godhead see;\nHail th\u2019incanate Deity,\nPleased as Man with men to dwell,\nJesus our Immanuel!\nHark! The herald angels sing,\n\u201cGlory to the new-born King.\u201d","n":2},{"p":"v","t":"Hail, the heavenly Prince of Peace!\nHail, the Sun of Righteousness!\nLight and life to all He brings,\nRisen with healing in His wings;\nMild, He lays His glory by,\nBorn that man no more may die,\nBorn to raise the sons of earth,\nBorn to give them second birth.\nHark! The herald angels sing,\n\u201cGlory to the new-born King.\u201d","n":3}]},{"n":423,"t":"While shepherd watched their flocks","k":"","s":[{"p":"v","t":"While shepherds watched their flocks by night,\nAll seated on the ground;\nThe angel of the Lord came down,\nAnd glory shone around.","n":1},{"p":"v","t":"\u201cFear not!\u201d said He, for mighty dread\nHad seized their troubled mind,\n\u201cGlad tidings of great joy I bring\nTo you and all mankind.","n":2},{"p":"v","t":"\u201cTo you, in David\u2019s town, this day,\nIs born of David\u2019s like\nThe Saviour, who is Christ the Lord;\nAnd this shall be the sign.","n":3},{"p":"v","t":"\u201cThe heavenly Babe you there shall find\nTo human view displayed,\nAll meanly wrapped in swathing bands,\nAnd in a manger laid.\u201d","n":4},{"p":"v","t":"Thus spake the seraph \u2013 and forthwith\nAppeared a shining throng\nOf angels, praising God, who thus\nAddressed their joyful song.","n":5},{"p":"v","t":"\u201cAll glory be to God on high!\nAnd to the earth be peace!\nGoodwill henceforth from heaven to men,\nBegin, and never cease!\u201d","n":6}]},{"n":424,"t":"Who is he in yonder stall","k":"","s":[{"p":"v","t":"Who is He in yonder stall,\nAt whose feet the shepherds fall?","n":1},{"p":"c","t":"\u2018Tis the Lord! O wondrous story!\n\u2018Tis the Lord, the King of Glory!\nAt His feet we humbly fall \u2013\nCrown Him! Crown Him Lord of all.","n":1},{"p":"v","t":"Who is He in deep distress,\nFasting in the wilderness?","n":2},{"p":"v","t":"Who is He the people bless\nFor His words of gentleness?","n":3},{"p":"v","t":"Who is He to whom they bring\nAll the sick and sorrowing?","n":4},{"p":"v","t":"Who is He who stands and weeps\nAt the grave where Lazarus sleeps?","n":5},{"p":"v","t":"Who is He the gathering throng\nGreet with loud triumphant song?","n":6},{"p":"v","t":"Lo, at midnight, who is He\nPrays in dark Gethsemane?","n":7},{"p":"v","t":"Who is He on yonder tree\nDies in grief and agony?","n":8},{"p":"v","t":"Who is He who from the grave\nComes to succour, help, and save?","n":9},{"p":"v","t":"Who is He who from His throne\nRules through all the worlds alone?","n":10}]},{"n":425,"t":"Hallelujah! Thine the glory","k":"","s":[{"p":"v","t":"My God, I have found the thrice-blessed ground,\nWhere life and where joy and true comfort abound.","n":1},{"p":"c","t":"Hallelujah! Thine the glory!\nHallelujah! Amen.\nHallelujah! Thine the glory!\nRevive us again.","n":1},{"p":"v","t":"\u2018Tis found in the blood of Him who once stood\nMy refuge and safety, my Surety with God.","n":2},{"p":"v","t":"He bore on the tree the sentence for me,\nAnd now both the Surety and sinner are free.","n":3},{"p":"v","t":"Accepted I am in the once-offered Lamb;\nIt was God who Himself had devised the plan.","n":4},{"p":"v","t":"And though here below, \u2018mid sorrow and woe,\nMy place is in heaven with Jesus, I know.","n":5},{"p":"v","t":"And this I shall find, for such is His mind,\n\u201cHe\u2019ll not be in glory, and leave me behind.\u201d","n":6},{"p":"v","t":"For soon He will come, and take me safe home,\nAnd make me to sit with Himself on His throne.","n":7}]},{"n":426,"t":"All ye that pass by","k":"","s":[{"p":"v","t":"All ye that pass by,\nTo Jesus draw nigh;\nTo you is it nothing\nThat Jesus should die?\nYour ransom and peace,\nYour surety He is,\nCome, see if there ever\nWas sorrow like His.","n":1},{"p":"v","t":"For what you have done\nHis blood must atone:\nThe Father hath punished\nFor you His dear Son:\nThe Lord, in the day\nOf His anger did lay\nYour sins on the Lamb,\nAnd He bore them away.","n":2},{"p":"v","t":"He died to atone\nFor sins not His own;\nYour debt He hath paid\nAnd your work He hath done:\nYe all may receive\nThe peace He did leave,\nWho made intercession,\n\u201cMy Father, forgive!\u201d","n":3},{"p":"v","t":"For you and for me\nHe prayed on the tree;\nThe prayer is accepted,\nThe sinner is free;\nThe sinner am I,\nWho on Jesus rely,\nAnd come for the pardon\nGod cannot deny.","n":4},{"p":"v","t":"His death is my plea;\nMy Advocate see,\nAnd hear the blood speak\nThat hath answered for me:\nHe purchased the grace\nWhich now I embrace;\nO Father, Thou know\u2019st\nHe hath died in my place!","n":5}]},{"n":427,"t":"Praise the king of glory","k":"","s":[{"p":"v","t":"Praise the King of glory,\nHe is God alone;\nPraise Him for the wonders He to us hath shown;\nFor His promised presence all the pilgrim way,\nFor the flaming pillar,\nAnd the cloud by day.","n":1},{"p":"c","t":"Praise\u2026Him, shining angels,\nStrike\u2026your harps of gold\u2026\nAll\u2026His hosts adore Him,\nWho\u2026His face behold\u2026\nThrough\u2026His great dominion,\nWhile\u2026the ages roll,\u2026\nAll His works shall praise Him, all His works shall praise Him,\nAll His works shall praise Him; bless the Lord, my soul!","n":1},{"p":"v","t":"Praise Him for redemption, free to every soul;\nPraise Him for the Fountain that can make us whole;\nFor His gifts of kindness and His loving care,\nFor the blest assurance that He answers prayer.","n":2},{"p":"v","t":"Praise Him for the trials sent as cords of love,\nBinding us more closely to the things above;\nFor the faith that conquers,\nHope, that naught can dim,\nFor the land where loved ones gather unto Him.","n":3}]},{"n":428,"t":"Hark! Hark! My soul! Angelic songs","k":"","s":[{"p":"v","t":"Hark, hark! My soul! Angelic songs are swelling\nO\u2019er earth\u2019s green fields and ocean\u2019s wave-beat shore;\nHow sweet the truth those blessed strains are telling\nOf that new life when sin shall be no more.","n":1},{"p":"c","t":"Angels, sing on! Your faithful watches keeping;\nSing us sweet fragments of the songs above;\nTill morning\u2019s joy shall end the night of weeping,\nAnd life\u2019s long shadows break in cloudless love.","n":1},{"p":"v","t":"Far, far away, like bells at evening pealing,\nThe voice of Jesus sounds o\u2019er land and sea,\nAnd laden souls, by thousands meekly stealing,\nKind Shepherd, turn their weary steps to Thee.","n":2},{"p":"v","t":"Onward we go, for still we hear them singing,\n\u201cCome, weary souls! For Jesus bids you come\u201d;\nAnd though the dark, its echoes sweetly ringing,\nThe music of the Gospel leads us home.","n":3}]},{"n":429,"t":"I to the hills will lift mine eyes","k":"","s":[{"p":"v","t":"I to the hills will lift mine eyes,\nFrom whence doth come mine aid;\nMy safety cometh from the Lord,\nWho heaven and earth hath made.","n":1},{"p":"v","t":"Thy foot He\u2019ll not let slide, nor will\nHe slumber that thee keeps:\nBehold, He that keeps Israel,\nHe slumbers not nor sleeps.","n":2},{"p":"v","t":"The Lord thee keeps, the Lord thy shade\nOn thy right hand doth stay:\nThe moon by night thee shall not smite,\nNor yet the sun by day.","n":3},{"p":"v","t":"The Lord shall keep thy soul; He preserve thee from all ill:\nHenceforth thy going out and in shall\nGod keep for ever will.","n":4}]},{"n":430,"t":"Come, let us join our cheerful songs","k":"","s":[{"p":"v","t":"Come, let us join our cheerful songs\nWith angels round the throne;\nTen thousand thousand are their tongues,\nBut all their joys are one.","n":1},{"p":"v","t":"\u201cWorthy the Lamb that died,\u201d they \u201cTo be exalted thus\u201d;\n\u201cWorthy the Lamb,\u201d our lips reply,\n\u201cFor He was slain for us.\u201d","n":2},{"p":"v","t":"Jesus is worthy to receive\nHonour and power divine;\nAnd blessings more than we can give,\nBe, Lord, for ever Thine.","n":3},{"p":"v","t":"Let all that dwell above the sky,\nAnd air, and earth, and seas,\nConspire to lift Thy glories high,\nAnd speak Thine endless praise.","n":4},{"p":"v","t":"Let all creation join in one,\nTo bless the sacred name\nOf Him that sits upon the throne,\nAnd to adore the Lamb.","n":5}]},{"n":431,"t":"Awake, my soul, in joyful lays","k":"","s":[{"p":"v","t":"Awake, my soul, in joyful lays,\nAnd sing thy great Redeemer\u2019s praise;\nHe justly claims a song from me:\nHis loving-kindness, oh, how free!","n":1},{"p":"v","t":"He saw the ruined by the Fall,\nYet loved me, notwithstanding all;\nHe saved me from my lost estate:\nHis loving-kindness, oh, how great!","n":2},{"p":"v","t":"Though numerous hosts of mighty foes,\nThough earth and hell my way oppose,\nHe safely leads my soul along:\nHis loving-kindness, oh, how strong!","n":3}]},{"n":432,"t":"Before jehovah\u2019s awful throne","k":"","s":[{"p":"v","t":"Before Jehovah\u2019s awful throne,\nYe nations, bow with sacred joy:\nKnow that the Lord is God alone,\nHe can create, and He destroy.","n":1},{"p":"v","t":"His sovereign power, without our aid,\nMade us of clay, and formed us men;\nAnd when like wandering sheep we strayed,\nHe brought us to His fold again.","n":2},{"p":"v","t":"We\u2019ll crowd Thy gates with thankful songs,\nHigh as the heavens our voices raise;\nAnd earth, with her ten thousand tongues,\nShall fill Thy courts with sounding praise.","n":3},{"p":"v","t":"Wide as the world is Thy command,\nVast as eternity Thy love;\nFirm as a rock Thy truth must stand,\nWhen rolling years shall cease to move.","n":4}]},{"n":433,"t":"Cling to the Bible","k":"","s":[{"p":"v","t":"Cling to the Bible, though all else be taken;\nLose not its precepts so precious and pure;\nSouls that are sleeping its tidings awaken:\nLife from the dead in its promises sure.","n":1},{"p":"c","t":"Cling to the Bible! Cling to the Bible!\nCling to the Bible \u2013 Our Lamp and our Guide!","n":1},{"p":"v","t":"Cling to the Bible! This jewel and treasure\nBrings life eternal, and saves fallen man;\nSurely its value no mortal can measure:\nSeek for its blessing, O soul, while you can!","n":2},{"p":"v","t":"Lamp for the feed that in by-ways have wandered,\nGuide for the youth that would otherwise fall;\nHope for the sinner whose life has been squandered,\nStaff for the aged, and best book of all.","n":3}]},{"n":434,"t":"Now the day is over","k":"F","s":[{"p":"v","t":"Now the day is over,\nNight is drawing nigh,\nShadows of the evening\nSteal across the sky.","n":1},{"p":"v","t":"Jesus, give the weary\nCalm and sweet repose;\nWith Thy tenderest blessing\nMay our eyelids close.","n":2},{"p":"v","t":"Through the long night-watches\nMay Thine angels spread\nTheir white wings above us,\nWatching round each bed.","n":3},{"p":"v","t":"When the morning wakens,\nThen may I arise\nPure, and fresh, and sinless\nIn Thy holy eyes.","n":4}]},{"n":435,"t":"Lord, teach us how to pray","k":"","s":[{"p":"v","t":"Lord, teach us how to pray aright,\nWith reverence and with fear;\nThough dust and ashes in Thy sight,\nWe may, we must draw near.","n":1},{"p":"v","t":"Burdened with guilt, convinced of sin,\nIn weakness, want, and woe,\nFightings without, and fears within,\nLord, whither shall we go?","n":2},{"p":"v","t":"God of all grace, we come to Thee\nWith broken, contrite hearts;\nGive, what Thine eye delights to see,\nTruth in the inward parts.","n":3},{"p":"v","t":"Give deep humility; the sense\nOf godly sorrow give;\nA strong, desiring confidence\nTo hear Thy voice and live.","n":4},{"p":"v","t":"Faith in the holy sacrifice\nThat can for sin atone;\nTo cast our hopes, to fix our eyes,\nOn Christ, on Christ alone.","n":5},{"p":"v","t":"Patience to watch, and wait, and weep,\nThough mercy long delay;\nCourage, our fainting souls to keep,\nAnd trust Thee, though Thou slay.","n":6},{"p":"v","t":"Give these, and then Thy will be done;\nThus strengthened with all might,\nWe by Thy Spirit, and Thy Son,\nShall pray, and pray aright.","n":7}]},{"n":436,"t":"Weeping will not save me","k":"","s":[{"p":"v","t":"Weeping will not save me!\nThough my face were bathed in tears,\nThat could not allay my fears,\nCould not wash the sins of years:\nweeping will not save me!","n":1},{"p":"c","t":"Jesus wept and died for me;\nJesus suffered on the tree;\nJesus waits to make me free:\nHe alone can save me!","n":1},{"p":"v","t":"Working will not save me!\nPurest deeds that I can do,\nHoliest thoughts and feelings too,\nCannot form my soul anew;\nWorking will not save me!","n":2},{"p":"v","t":"Waiting will not save me!\nHelpless, guilty, lost, I lie;\nIn my ear is Mercy\u2019s cry;\nIf I wait I can but die:\nWaiting will not save me!","n":3},{"p":"v","t":"Faith in Christ will save me!\nLet me trust Thy weeping Son,\nTo His arms, Lord, help me run:\nFaith in Christ will save me!","n":4}]},{"n":437,"t":"There are angels hovering round","k":"","s":[{"p":"v","t":"There are angels hovering round,\nThere are angels hovering round,\nThere are angels, angels hovering round.","n":1},{"p":"v","t":"To carry the tidings home","n":2},{"p":"v","t":"To the new Jerusalem","n":3},{"p":"v","t":"Poor sinners are coming home","n":4},{"p":"v","t":"And Jesus bids them come","n":5},{"p":"v","t":"And children too may come","n":6},{"p":"v","t":"All heaven is full of joy","n":7},{"p":"v","t":"For Jesus loves to save","n":8},{"p":"v","t":"Come, children, trust Him now.","n":9}]},{"n":438,"t":"Why do you wait, dear brother","k":"","s":[{"p":"v","t":"Why do you wait, dear brother?\nOh, why do you tarry so long?\nYour Saviour is waiting to give you\nA place in His sanctified throng.","n":1},{"p":"c","t":"Why not? Why not?\nWhy not come to Him now?","n":1},{"p":"v","t":"What do you hope, dear brother,\nTo gain by a further delay?\nThere\u2019s no one to save you but Jesus;\nThere\u2019s no other way but His way.","n":2},{"p":"v","t":"Do you not feel, dear brother,\nHis Spirit now striving within?\nOh, why not accept His salvation,\nAnd throw off thy burden of sin?","n":3},{"p":"v","t":"Why do you wait, dear brother?\nThe harvest is passing away;\nYour Saviour is longing to bless you;\nThere\u2019s danger and death in delay.","n":4}]},{"n":439,"t":"Oh, hear my cry","k":"","s":[{"p":"v","t":"Oh, hear my cry, be gracious now to me,\nCome, Great Deliverer, come!\nMy soul bowed down, is longing now for Thee,\nCome, Great Deliverer, come!","n":1},{"p":"c","t":"I\u2019ve wandered far away o\u2019er mountains cold,\nI\u2019ve wandered far away from home;\nOh, take me now, and bring me to Thy fold,\nCome, Great Deliverer, come!","n":1},{"p":"v","t":"I have no place, no shelter from the night,\nCome, Great Deliverer, come!\nOne look from Thee would give me life and light,\nCome, Great Deliverer, come!","n":2},{"p":"v","t":"My path is lone, and weary are my feet,\nCome, Great Deliverer, come!\nMine eyes look up Thy loving smile to meet,\nCome, Great Deliverer, come!","n":3},{"p":"v","t":"Thou wilt not spurn contrition\u2019s broken sigh;\nCome, Great Deliverer, come!\nRegard my prayer, and hear my humble cry,\nCome, Great Deliverer, come!","n":4}]},{"n":440,"t":"Jesus, I will trust thee","k":"","s":[{"p":"v","t":"Jesus, I will trust Thee,\nTrust Thee with my soul;\nGuilty, lost, and helpless,\nThou canst make me whole.\nThere is none is heaven\nOr on earth like Thee:\nThou hast died for sinners\nTherefore, Lord, for me.","n":1},{"p":"c","t":"In Thy love confiding,\nI will seek Thy face,\nWorship and adore Thee\nFor Thy wondrous grace.\nJesus, I will trust Thee,\nTrust Thee with my soul!\nGuilty, lost, and helpless,\nThou canst make me whole.","n":1},{"p":"v","t":"Jesus, I can trust Thee,\nTrust Thy written Word;\nSince Thy voice of mercy\nI have often heard.\nWhen Thy Spirit teacheth,\nTo my taste how sweet!\nOnly may I hearken,\nSitting at Thy feet.","n":2},{"p":"v","t":"Jesus, I do trust Thee,\nTrust Thee without doubt;\n\u201cWhosoever cometh\u201d\nThou \u201cwilt not cast out:\u201d\nFaithful is Thy promise,\nPrecious is Thy blood\nThese my soul\u2019s salvation,\nThou my Saviour God!","n":3}]},{"n":441,"t":"I am coming to the cross","k":"","s":[{"p":"v","t":"I am coming to the cross;\nI am poor, and weak, and blind;\nI am counting all but dross;\nI shall full salvation find.\nI am trusting, Lord, in Thee,\nBlessed Lamb of Calvary;\nHumbly at thy cross I bow:\nSave me, Jesus, save me now.\nLong my heart has sighed for Thee,\nLong has evil reigned within;\nJesus sweetly speaks to me\n\u201cI will cleanse you from all sin.\u201d\nI am trusting, Lord, in Thee,\nBlessed Lamb of Calvary;\nHumbly at thy cross I bow:\nSave me, Jesus, save me now.\nHere I give my all to Thee,\nFriends, and time, and earthly store,\nSoul and body thine to be\nWholly thine for evermore.\nI am trusting, Lord, in Thee,\nBlessed Lamb of Calvary;\nHumbly at thy cross I bow:\nSave me, Jesus, save me now.\nJesus comes! He fills my soul!\nPerfected in Him I am;\nI am every whit made whole;\nGlory, glory to the Lamb!","n":1},{"p":"c","t":"Still I\u2019m trusting, Lord, in Thee,\nBlessed Lamb of Calvary;\nHumbly at thy cross I bow:\nSave me, Jesus, save me now.","n":1}]},{"n":442,"t":"I do believe","k":"","s":[{"p":"v","t":"Father, I stretch my hands to Thee;\nNo other help I know;\nIf Thou withdraw Thyself from me,\nAh, whither shall I go?","n":1},{"p":"c","t":"I do believe, I do believe\nThat Jesus died for me;\nAnd through His blood, His precious blood,\nI shall from sin be free.","n":1},{"p":"v","t":"What did Thine only Son endure,\nBefore I drew my breath;\nWhat pain, what labour, to secure\nMy soul from endless death!","n":2},{"p":"v","t":"O Jesus, could I this believe,\nI now should feel Thy power;\nAnd all my wants Thou wouldst relieve\nIn this accepted hour.","n":3},{"p":"v","t":"Author of faith, to Thee I lift\nMy weary, longing eyes;\nOh, let me now receive that gift;\nMy soul without it dies.","n":4}]},{"n":443,"t":"When all thy mercies","k":"","s":[{"p":"v","t":"When all Thy mercies, O my God,\nMy rising soul surveys,\nTransported with the view, I\u2019m lost\nIn wonder, love, and praise.","n":1},{"p":"v","t":"Unnumbered comforts on my soul\nThy tender care bestowed,\nBefore my infant heart conceived\nFrom whom these comforts flowed.","n":2},{"p":"v","t":"When worn with sickness, oft hast Thou\nWith health renewed my face;\nAnd when in sins and sorrows sunk,\nRevived my soul with grace.","n":3},{"p":"v","t":"Ten thousand thousand precious gifts\nMy daily thanks employ;\nNor is the least a cheerful heart\nThat tastes those gifts with joy.","n":4},{"p":"v","t":"Through every period of my life\nThy goodness I\u2019ll pursue;\nAnd after death, in distant worlds,\nThe glorious theme renew.","n":5},{"p":"v","t":"Through all eternity to Thee\nA joyful song I\u2019ll raise;\nBut oh, eternity\u2019s too short\nTo utter all Thy praise!","n":6}]},{"n":444,"t":"Guide me, o thou great Jehovah","k":"G","s":[{"p":"v","t":"Guide me, O Thou great Jehovah,\nPilgrim through this barren land;\nI am weak, but Thou art mighty;\nHold me with Thy powerful hand;\nBread of heaven,\nFeed me till I want no more.","n":1},{"p":"v","t":"Open now the crystal fountain,\nWhence the healing waters flow;\nLet the fiery, cloudy pillar,\nLead me all my journey through:\nStrong Deliverer,\nBe Thou my strength and my shield.","n":2},{"p":"v","t":"When I tread the verge of Jordan,\nBid my anxious fears subside;\nBear me through the swelling current,\nLand me safe on Canaan\u2019s side;\nSongs of praises\nI will ever give to Thee!","n":3}]},{"n":445,"t":"Follow! Follow! I will follow Jesus","k":"F","s":[{"p":"v","t":"Down in the valley with my Saviour I will go,\nWhere the flowers are blooming and the sweet waters flow;\nEverywhere He leads me I will follow, follow on,\nWalking in His footsteps till the crown be won.","n":1},{"p":"c","t":"Follow! Follow! I will follow Jesus!\nAnywhere, everywhere, I will follow on!\nFollow! Follow! I will follow Jesus!\nEverywhere He leads me I will follow on.","n":1},{"p":"v","t":"Down in the valley with my Saviour I will go,\nWhere the storms are sweeping and the dark waters flow;\nWith His hand to lead me I will never, never fear;\nDangers cannot fright me if my Lord is near.","n":2},{"p":"v","t":"Down in the valley, or upon the mountain steep,\nClose beside my Saviour, will my soul ever keep;\nHe will lead me safely, in the path that He has trod,\nUp to where they gather on the hills of God.","n":3}]},{"n":446,"t":"Lead us, heavenly father","k":"","s":[{"p":"v","t":"Lead us, Heavenly Father, lead us\nO\u2019er the world\u2019s tempestuous sea;\nGuide us, guard us, keep us, feed us,\nFor we have no help but Thee;\nYet possessing every blessing,\nIf our God our Father be.","n":1},{"p":"v","t":"Saviour, breathe forgiveness o\u2019er us,\nAll our weakness Thou dost know;\nThou didst feet its keenest woe;\nLone and dreary, faint and weary,\nThrough the desert Thou didst go.","n":2},{"p":"v","t":"Spirit of our God descending,\nFill our hearts with heavenly joy;\nLove with every feeling blending,\nPleasures that can never cloy;\nThus provided, pardoned, guided,\nNothing can our peace destroy.","n":3}]},{"n":447,"t":"He leadeth me","k":"D","s":[{"p":"v","t":"He leadeth me!\nO blessed thought!\nO words with heavenly comfort fraught!\nWhate\u2019er I do, where\u2019er I be,\nStill \u2018tis God\u2019s hand that leadeth me.","n":1},{"p":"c","t":"He leadeth me! He leadeth me!\nBy His own hand He leadeth me;\nHis faithful follower I would be,\nFor by His hand He leadeth me.","n":1},{"p":"v","t":"Sometimes \u2018mid scenes of deepest gloom,\nSometimes where Eden\u2019s bowers bloom,\nBy waters calm,\no\u2019er troubled sea\nStill \u2018tis God\u2019s hand that leadeth me.\nHe leadeth me! He\nleadeth me!\nBy His own hand He leadeth me;\nHis faithful follower I would be,\nFor by His hand He\nleadeth me.","n":2},{"p":"v","t":"Lord, I would clasp Thy hand in mine,\nNor ever murmur, nor repine;\nContent, whatever lot I see,\nSince \u2018tis my God that leadeth me.","n":3},{"p":"v","t":"And when my task on earth is done\nWhen, by Thy grace, the victory\u2019s won,\nE\u2019en death\u2019s cold wave I will not flee,\nSince Thou through Jordan leadeth me.","n":4}]},{"n":448,"t":"Where my Saviour leads","k":"","s":[{"p":"v","t":"Where my Saviour\u2019s hand is guiding,\nAnd for all my wants providing In His precious love confiding,\nI\u2019ll go with Him all the way.","n":1},{"p":"c","t":"Where my Saviour leads I\u2019ll follow,\nWhere my Saviour leads I\u2019ll follow,\nWhere my Saviour leads I\u2019ll follow,\nI will follow all the way.","n":1},{"p":"v","t":"Though my path be dark and dreary,\nAnd my steps be faint and weary,\nWith His loving voice to cheer me,\nI\u2019ll go with Him all the way.","n":2},{"p":"v","t":"Though the ills of earth may wound me,\nAnd the storms of life confound me,\nWith His loving arms around me,\nI\u2019ll go with Him all the way.","n":3},{"p":"v","t":"When the ties of earth shall sever,\nAnd He calls me home for ever,\nTo the loved beyond the river,\nI\u2019ll go with Him all the way.","n":4}]},{"n":449,"t":"When this passing world is done","k":"","s":[{"p":"v","t":"When this passing world is done,\nWhen has sunk yon radiant sun,\nWhen the pearly gate I gain,\nNever to go our again;\nThen, Lord, shall I fully know.\nNot till then \u2013 how much I owe.","n":1},{"p":"v","t":"When I stand before the throne,\nDressed in beauty not my own;\nWhen I see Thee as Thou art,\nLove Thee with unsinning heart:\nThen, Lord, shall I fully know.\nNot till then \u2013 how much I owe.","n":2},{"p":"v","t":"Chosen, not for good in me,\nWakened up from wrath to flee,\nHidden in the Saviour\u2019s side,\nBy the Spirit sanctified:\nTeach me, Lord, on earth to show,\nBy my love, how much I owe.","n":3}]},{"n":450,"t":"My times are in thy hand","k":"","s":[{"p":"v","t":"\u201cMy times are in Thy hand:\u201d\nMy God, I wish them there;\nMy life, my friends, my soul \u2013 I leave\nEntirely to Thy care.","n":1},{"p":"v","t":"\u201cMy times are in Thy hand:\u201d\nWhatever they may be;\nPleasing, or painful, dark or bright,\nAs best may seem to Thee.","n":2},{"p":"v","t":"\u201cMy times are in Thy hand:\u201d\nWhy should I doubt or fear?\nMy Father\u2019s hand will never cause\nHis child a needless tear.","n":3},{"p":"v","t":"\u201cMy times are in Thy hand:\u201d\nJesus, the crucified!\nThe hand my cruel sins had pierced,\nIs now my guard and guide.","n":4}]},{"n":451,"t":"Hark! Hark! The song the ransomed sing","k":"Eb","s":[{"p":"v","t":"Hark! Hark! The song the ransomed sing,\nA new-made song of praise.\nThe Lord the Lamb they glorify,\nAnd these the strains they raise:","n":1},{"p":"c","t":"\u201cGlory to Him Who loved us,\nAnd washed us in His blood;\nWho cleansed our souls from guilt and sin,\nBy that pure, living flood!\u201d","n":1},{"p":"v","t":"\u201cMade white by His redeeming blood,\nOur heavenly garments shine;\nOur minds, by Him enlightened prove\nThe power of truth divine.","n":2},{"p":"v","t":"\u201cBy Jesus\u2019 blood we overcame\nWhen Satan\u2019s host assailed;\n\u2018Twas by the power of truth divine\nOur feeble arms prevailed.","n":3},{"p":"v","t":"\u201cThen be the Lamb of God adored \u2013\nThe Lord of life and light!\nTo Him be glory, honour, power,\nAnd majesty and might!\u201d","n":4}]},{"n":452,"t":"This is our God","k":"","s":[{"p":"v","t":"From Heaven You came, helpless babe\nEntered our world, Your glory veiled\nNot to be served, but to serve,\nAnd give Your life that we might live.","n":1},{"p":"c","t":"This is our God, The Servant-King\nHe calls us now to follow Him\nTo bring our lives as daily offering,\nAll worship to the Servant-King.","n":1},{"p":"v","t":"There in the garden of tears\nMy heavy load He chose to bear,\nHis heart with sorrow was torn\n\u201cYet not my will but yours\u201d He said.","n":2},{"p":"v","t":"Come see His hands and His feet\nThe scars that speak of sacrifice\nHands that flung stars into space\nTo cruel nails surrendered.","n":3},{"p":"v","t":"So let us learn how to serve\nAnd in our lives enthrone Him,\nEach other\u2019s needs to prefer,\nFor it is Christ we\u2019re serving.","n":4}]},{"n":453,"t":"Joyful, joyful, we adore thee","k":"G","s":[{"p":"v","t":"Joyful, joyful, we adore Thee,\nGod of glory, Lord of love,\nHearts unfold like flowers before Thee,\nOpening to the sun above","n":1},{"p":"v","t":"Melt the clouds of sin and sadness;\nDrive the dark of doubt away,\nGiver of immortal gladness,\nFill us with the light of day.","n":2},{"p":"v","t":"All thy works with joy surround Thee,\nEarth and heaven reflect Thy rays\nStars and angels sing around Thee,\nCenter of unbroken praise,","n":3},{"p":"v","t":"Field and forest, vale and mountain,\nFlowery meadow, flashing sea,\nSinging bird and Flowing fountain Call us to rejoice in Thee.","n":4},{"p":"v","t":"Thou art giving and forgiving,\nEver blessing, ever blest,\nWell-spring of the joy of living, Ocean-depth of happy rest!","n":5},{"p":"v","t":"Thou our father, Christ our Saviour,\nAll who live in love are Thine,\nTeach us how to love each other,\nLift us to the joy divine.","n":6},{"p":"v","t":"Mortal join the mighty chorus,\nwhich the morning stars began,\nLove divine is reigning o\u2019er us,\nBinding all within its span,","n":7},{"p":"v","t":"Ever singing, March we onward,\nVictors in the midst of strife,\nJoyful music leads us onward,\nIn the triumph song of life.","n":8}]},{"n":454,"t":"And can it be","k":"G","s":[{"p":"v","t":"And can it be, that I should gain\nAn interest in the Saviour\u2019s blood?\nDied He for me, who caused His pain?\nFor me, who Him to death pursued?\nAmazing love! How can it be\nThat Thou, my God, shouldst die for me?","n":1},{"p":"c","t":"Amazing love! How can it be\nThat Thou, my God shouldst die for me.","n":1},{"p":"v","t":"\u2018Tis mystery all! The Immortal dies!\nWho can explore His strange design?\nIn vain the first born seraph tries,\nTo sound the depth of love divine!\n\u2018Tis mercy all! Let earth adore,\nLet angel-minds inquire no more.","n":2},{"p":"v","t":"He left His Father\u2019s throne above\n(So free, so infinite His grace!)\nEmptied Himself of all but love,\nAnd bled for Adam\u2019s helpless race:\n\u2018Tis mercy all, immense and free,\nFor, O my God, it found out me!","n":3},{"p":"v","t":"Long my imprisoned spirit lay\nFast bound in sin and nature\u2019s night;\nThine eye diffused a quickening ray,\nI woke, the dungeon flamed with light:\nMy chains fell off, my heart was free,\nI rose, went forth, and followed Thee.","n":4},{"p":"v","t":"No condemnation now I dread,\nJesus, and all in Him, is mine;\nAlive in Him, my living Head,\nAnd clothed in righteousness divine,\nBold I approach the eternal throne,\nAnd claim the crown, through Christ my own.\nAmazing love! How can it be\nThat Thou, my God shouldst die for me.\nChorus:","n":5}]},{"n":455,"t":"Praise to the Lord, the Almighty","k":"G","s":[{"p":"v","t":"Praise to the Lord, the Almighty, the King of creation;\nO my soul, praise Him, for He is thy health and salvation;","n":1},{"p":"v","t":"All ye who hear, Now to His temple draw near,\nPraise Him in glad adoration.","n":2},{"p":"v","t":"Praise to the Lord, who o\u2019er all things so wondrously reigneth,\nShelters thee under His wings, yea, so gently sustaineth;","n":3},{"p":"v","t":"Hast thou not seen? All that is needful hath been\nGranted is what He ordaineth.","n":4},{"p":"v","t":"Praise to the Lord, who doth prosper thy work and defend thee;\nSurely His goodness and mercy here daily attend thee;","n":5},{"p":"v","t":"Ponder anew what the Almighty can do,\nIf with His love He befriend thee.","n":6},{"p":"v","t":"Praise to the Lord, who, when tempests their warfare are waging,\nWho, when the elements madly around thee are raging,","n":7},{"p":"v","t":"Biddeth them cease, Turneth their fury to peace,\nWhirlwinds and waters assuaging.","n":8},{"p":"v","t":"Praise to the Lord, who when darkness and sin is abounding,\nWho, when the godless do triumph, all virtue confounding,","n":9},{"p":"v","t":"Sheddeth His light, Chaseth the horrors of night,\nSaints with His mercy surrounding.","n":10},{"p":"v","t":"Praise to the Lord! O let all that is in me adore Him!\nAll that hath life and breath, come now with praises before Him!","n":11},{"p":"v","t":"Let the Amen sound from His people again:\nGladly for aye we adore Him.","n":12}]},{"n":456,"t":"Let others see Jesus in you","k":"Ab","s":[{"p":"v","t":"While passing through this world of sin,\nAnd others your life shall view,\nBe clean and pure without, within,\nLet others see Jesus in you.","n":1},{"p":"c","t":"Let others see Jesus in you, (in you)\nLet others see Jesus in you; (in you)\nKeep telling the story, be faithful and true,\nLet others see Jesus in you.","n":1},{"p":"v","t":"Your life\u2019s a book before their eyes,\nThey\u2019re reading it through and through;\nSay, does it point them to the skies,\nDo others see Jesus in you?","n":2},{"p":"v","t":"What joy \u2018twill be at set of sun,\nIn mansions beyond the blue,\nTo find some souls that you have won;\nLet others see Jesus in you.","n":3},{"p":"v","t":"Then live for Christ both day and night,\nBe faithful, be brave, and true,\nAnd lead the lost to life and light;\nLet others see Jesus in you.","n":4}]},{"n":457,"t":"Stand by me","k":"Eb","s":[{"p":"v","t":"When the storms of life are raging,\nStand by me;\nWhen the storms of life are raging,\nStand by me;","n":1},{"p":"v","t":"When the world is tossing me, like a ship upon the sea;\nThou Who rulest wind and water, Stand by me,","n":2},{"p":"v","t":"In the midst of tribulation\nStand by me;\nIn the midst of tribulation\nStand by me;","n":3},{"p":"v","t":"When the host of hell assail, and my strength begins to fail;\nThou Who never lost a battle\nStand by me.","n":4},{"p":"v","t":"In the midst of faults and failure,\nStand by me;\nIn the midst of faults and failure,\nStand by me,","n":5},{"p":"v","t":"When I do the best I can, And my friends misunderstand;\nThou Who knowest all about me,\nStand by me.","n":6},{"p":"v","t":"In the midst of\npersecution\nStand by me;\nIn the midst of\npersecution\nStand by me;","n":7},{"p":"v","t":"When my foes in battle array undertake to stop my way;\nThou Who saved Paul and Silas\nStand by me.","n":8},{"p":"v","t":"When I\u2019m growing old and feeble\nStand by me;\nWhen I\u2019m growing old and feeble\nStand by me;","n":9}]},{"n":458,"t":"We will see Jesus","k":"D","s":[{"p":"v","t":"When He appears in the sky,\nWith the shout of acclamation,\nThere shall be trembling on that day,\nWe will be caught up,\nIf we are ready,\nIn a twinkling of an eye,\nWe\u2019ll all be changed,\nWe will see Jesus, when we meet in the sky.","n":1},{"p":"c","t":"We will see Jesus, no more shadows descend,\nWe will see Jesus, across the landscape of time,\n(All the sorrows come to the end)\nWe will see Jesus, when we meet in the sky.","n":1},{"p":"v","t":"We will be changed,\nFrom mortal to immortal,\nIn the light, forevermore,\nNo more crying, barrenness, fighting, malice, pain, hunger, corruption, sadness, fashion,\nNo more sickness,\nNo more dying in that place,\nWe\u2019ll all be changed,\nWe will see Jesus,\nwhen we meet in the sky.","n":2}]},{"n":459,"t":"Oh remember thy creator","k":"","s":[{"p":"v","t":"Oh remember thy Creator, in the days of thy youth,\nWhile the evil days come not,\nNor the years draw nigh.","n":1},{"p":"c","t":"Oh remember, now remember, that an eye is watching you,\nDo not let the word of God depart from thy soul.","n":1},{"p":"v","t":"Let thy life His love reveal,\nAnd thy deed His grace,\nLet thy heart His word receive,\nAnd His peace proclaim.","n":2},{"p":"v","t":"Then rejoice O! Youth rejoice,\nLet thy heart be glad,\nFor the Lord, thy soul shall bless,\nLet thine heart rejoice.","n":3}]},{"n":460,"t":"I\u2019ll wait for thee, Lord","k":"","s":[{"p":"v","t":"Out of the depth have I cried unto Thee, O Lord, O Lord,\nHear my voice, let Thine ear be attentive\nTo the voice of my supplication.","n":1},{"p":"c","t":"I\u2019ll wait on Thee, Lord,\nI\u2019ll wait with my soul upon Thee (2ce)\nWe will trust in Thee, Lord,\nFor our hope in Thee, Lord is redemption,\nWe will praise Thy name, O Lord,\nWe will praise Thee forever and ever.","n":1},{"p":"v","t":"In Thee there\u2019s forgiveness always,\nThat Thou mayest be feard, O Lord,\nMy soul waiteth for Thee, O Lord,\nMore than they that watch for the morning.","n":2},{"p":"v","t":"Call: Let Israel hope in Thee, Lord\nResp: Let Israel hope in Thee Lord.\nFor in Thee, O Lord there is mercy,\nAnd with Thee there is plenteous redemption.\nBrigde:","n":3}]},{"n":461,"t":"A penitent sinner\u2019s plea on the altar","k":"Ab","s":[{"p":"v","t":"I come as a sinner, into Your presence,\nPleading and crying O Lord my God,\nHave mercy on me.\nLord, You are Holy,\nI am not worthy,\nDue to my sinful life, O my God,\nHave mercy on me.","n":1},{"p":"c","t":"O Lord my God, don\u2019t cast me away,\nI\u2019m crying O Lord, have mercy on me,\nO Lord my God, don\u2019t cast me aside,\nI\u2019m crying O Lord, have mercy on me.","n":1},{"p":"v","t":"In sin I was conceived, born as a sinner,\nGrew in this sinful world, O my God,\nHave mercy on me.\nMy thoughts are so filthy,\nMy wisdom so earthly,\nMy soul and my spirit seems far from You\nHave mercy on me.","n":2},{"p":"v","t":"I know I am guilty, my sins are before me,\nAs time of grace is almost gone, O my Lord,\nI\u2019m down on my knees.\nPleading and crying, Have mercy on me,\nAs I surrender all of my sins into Your hands.","n":3},{"p":"v","t":"O Lord, I pray\u2026\nEnd . . .","n":4}]},{"n":462,"t":"Sing unto him","k":"Ab","s":[{"p":"v","t":"O give thanks unto the Lord,\nCall upon His name,\nMake known His deeds among His people,\nLet the heart of them rejoice,\nThat seek the Lord,\nSing unto Him.","n":1},{"p":"c","t":"Sing unto Him,\nSing psalms unto Him,\nTalk ye of all His wondrous works,\nSing unto Him,\nSing psalms unto Him,\nGlory ye in His Holy name.","n":1},{"p":"v","t":"Seek the Lord and His strength,\nSeek His face evermore.\nO ye seeds of Abraham,\nHe\u2019s the Lord our God,\nHe\u2019s the Lord of all the earth,\nSing unto Him.","n":2}]},{"n":463,"t":"Fear the Lord","k":"","s":[{"p":"v","t":"In this last age, a lot is happening,\nYouth of our age! Hearts are so unclean,\nWith Your help Lord,\nWe can conquer sin\n(Fear the Lord, He\u2019s our guide with His Word 2ce)\nSatan\u2019s fighting, and youths are his aim,\nWe\u2019ll bind him in Jesus name,\nWith Satan conquered,\nWe\u2019ll never be the same\n(Fear the Lord, He\u2019s our guide with His Word 2ce)","n":1},{"p":"c","t":"Fear the Lord and keep His word,\nHe\u2019s our guide, lead us with Your word,\nFear the Lord, remember Your God,\n(Fear the Lord, He\u2019s our guide with His Word 2ce)","n":1},{"p":"v","t":"Blind our eyes Lord, to all material things,\nLord arise and take Your place as King,\nIn our hearts and joyfully we\u2019ll sing,\n(Fear the Lord, He\u2019s our guide with His Word 2ce)\nOn that day when we\u2019ll come before You,\nLord, You\u2019ll say we\u2019ve all been so true,\nSo shall it be, then we\u2019ll be made brand new\n(Fear the Lord, He\u2019s our guide with His Word 2ce)","n":2}]},{"n":464,"t":"The lord\u2019s my shepherd","k":"F","s":[{"p":"v","t":"The LORD\u2019s my Shepherd, I\u2019ll not want.\nHe makes me down to lie\nIn pastures green; He leadeth me\nThe quiet waters by.","n":1},{"p":"v","t":"My soul He doth restore again;\nAnd me to walk doth make\nWithin the paths of righteousness,\nE\u2019en for His own name\u2019s sake.","n":2},{"p":"v","t":"Yea, though I walk thro' death\u2019s dark vale,\nYet will I fear no ill;\nFor Thou art with me, and Thy rod\nAnd staff me comfort still.","n":3},{"p":"v","t":"My table Thou hast furnish\u00e9d\nIn presence of my foes;\nMy head Thou dost with oil anoint,\nAnd my cup overflows.","n":4},{"p":"v","t":"Goodness and mercy all my life\nShall surely follow me:\nAnd in God\u2019s house forevermore\nMy dwelling place shall be.\nLast verse","n":5}]},{"n":465,"t":"Remember thy creator","k":"","s":[{"p":"v","t":"O remember thy Creator in the days of thy youth,\nWhile the evil days come not nor the years draw nigh,\nWhen thou shalt say \u2013 I have no pleasure in them","n":1},{"p":"c","t":"O remember thy Creator, remember Him all the day.","n":1},{"p":"v","t":"Let us hear the conclusion of the whole matter,\nFear the Lord and keep His laws, this is man\u2019s whole duty,\nWhen thy work is accomplished, He is ready to reward.","n":2}]},{"n":466,"t":"Christ came to show us the true way","k":"","s":[{"p":"v","t":"We were scattered abroad,\nNever knew who to follow:\nChrist came to show us the true way\nBut when God saw our troubles\nHe sent His only begotten Son,\nChrist came to show us the true way.","n":1},{"p":"c","t":"Christ came to show us the true way,\nAnd as Christians we have to follow Him (2ce)\nThe way of life, the way of truth of the prophets\nChrist came to show us the true way.","n":1},{"p":"v","t":"The Word was sent and made flesh,\nThe Word is a lamp unto our feet\nChrist came to show us the true way,\nThe Word is a light unto our pathways\nSo there\u2019s no reason to be lost,\nChrist came to show us the true way.","n":2},{"p":"v","t":"The true way is the way of Christ,\nOther ways are sinking sands,\nChrist came to show us the true way,\nSo let\u2019s follow Him and be sheep\nJesus is God there\u2019s no other god,\nChrist came to show us the true way.","n":3}]},{"n":467,"t":"None like him","k":"","s":[{"p":"v","t":"There is no Saviour but Him,\nThere is no Saviour but Him,\nHe came from Him throne unto the cross,\nThere is no Saviour like Him.","n":1},{"p":"c","t":"So sing Hallelujah,\nAnd shout praise the Lord, (3ce)\nThere is no Savour but Him.","n":1},{"p":"v","t":"There is none who died like Him\nThere is none who died like Him\nWas wounded for our sins and nailed to the cross\nThere is none who died like Him","n":2},{"p":"v","t":"There is none who rose but Him\nThere is none who rose but Him\nWas laid in the tomb and on the third day He rose,\nThere is none who rose but Him","n":3}]},{"n":468,"t":"Sing alleluia forth","k":"","s":[{"p":"v","t":"Sing alleluia forth in duteous praise,\nYe citizens of heaven;\nO sweetly raise,\nAn endless Alleluia.","n":1},{"p":"v","t":"Ye powers who stand before the eternal light,\nIn hymning choirs re-echo to the height\nAn endless Alleluia.","n":2},{"p":"v","t":"The holy city shall take up your strain,\nAnd with glad songs resounding wake again,\nAn endless Alleluia.","n":3},{"p":"v","t":"In blissful antiphons ye this rejoice,\nTo render to the Lord with thankful voice,\nAn endless Alleluia.","n":4},{"p":"v","t":"Ye who have gained at length your palms in bliss,\nVictorious ones, your chant shall still be this\nAn endless Alleluia.","n":5},{"p":"v","t":"There, in one grand acclaim, forever ring,\nThe strains which tell the honour of your King,\nAn endless Alleluia.","n":6},{"p":"v","t":"This is sweet rest for weary ones brought back\nThis is glad food and drink which ne\u2019er shall lack\nAn endless Alleluia.","n":7},{"p":"v","t":"While Thee, by whom were all things made, we praise\nForever, and tell out in sweetest lays,\nAn endless Alleluia.","n":8},{"p":"v","t":"Almighty Christ, to Thee our voices sing,\nGlory forevermore to Thee we bring,\nAn endless Alleluia.","n":9}]},{"n":469,"t":"Heavenly father","k":"","s":[{"p":"v","t":"Heavenly Father, may Thy blessing\nRest upon Thy children now,\nWhen in praise Thy name we hallow,\nWhen in prayer to Thee we bow.","n":1},{"p":"v","t":"In the wondrous story reading\nOf the Lord of truth and grace,\nMay we see Thy love reflected\nIn the light of His dear face.","n":2},{"p":"v","t":"May we learn from this great story\nAll the arts of friendliness,\nTruthful speech and honest action,\nCourage, patience, steadfastness.","n":3},{"p":"v","t":"How to master self and temper,\nHow to make our conduct fair, -\nWhen to speak and when be silent,\nWhen to do and when forbear.","n":4},{"p":"v","t":"May His Spirit, wise and holy,\nWith His gifts our spirits bless,\nMake us loving, joyous, peaceful,\nRich in goodness, gentleness,","n":5},{"p":"v","t":"Strong in self-control, and faithful,\nKind in thought and deed; for He \u2013\nSayeth, \u201cWhat ye do for others\nYe are doing unto Me.\u201d","n":6}]},{"n":470,"t":"Jesus, lamb of God","k":"F","s":[{"p":"v","t":"You are my strength when I am weak,\nYou are the treasure that I seek,\nYou are my all in all;\nSeeking You as a precious jewel,\nLord, to give up, I\u2019d be a fool,\nYou are my all in all.","n":1},{"p":"c","t":"Jesus, Lamb of God,\nWorthy is Your name;\nJesus, Lamb of God,\nWorthy is Your name.","n":1},{"p":"v","t":"Taking my sin, my cross, my shame,\nrising again, I bless Your name,\nYou are my all in all;\nWhen I fall down, You pick me up,\nWhen I am dry, You fill my cup,\nYou are my all in all.","n":2}]},{"n":471,"t":"More than a man","k":"Ab","s":[{"p":"v","t":"God Who made the world,\nmade all things alright,\nGave He power to men and Dominion over earth to subdue and control,\nSatan came through Eve,\nBrought sin, death and corruption,\nJesus had to come to reclaim us through His blood\nthat was shed on the cross of Calvary,\nWon\u2019t you believe this?","n":1},{"p":"c","t":"He was more than a man, Jesus was our God in His temple,\nMore than a son, Jesus Christ is our God,\nThis you must testify\nbelieve it in your heart for this is true,\nHe made the world.","n":1},{"p":"v","t":"When we call Him Son,\nThe whole earth is for Sonship,\nWe must understand up above\nHe\u2019s the Father of all,\nThe King of kings,\nWho made and use the flesh that was named Christ Jesus,\nto contact the earth-to redeem all His children from death\nThrough His blood He was God,\nWon\u2019t you believe this?","n":2},{"p":"v","t":"He Who spoke to Moses in the burning bush,\nSpeaks today in Jesus\n\u201cThe same yesterday, today and forever He\u2019s God\u201d,\nThree in one God is a lie,\nAllahu aku bar is a noise,\nThese shall pass away but we shall reign with our Lord God forever and ever Amen...\nwon\u2019t you believe this?","n":3}]},{"n":472,"t":"Ho, everyone that thirsteth","k":"","s":[{"p":"v","t":"Ho, every one that thirsteth\nCome ye to the water\nYe that hath no money,\nCome ye buy and eat.","n":1},{"p":"v","t":"Wherefore do ye spend money\nFor that which is not bread,\nAnd your labour for that\nWhich satisfieth not.","n":2}]},{"n":473,"t":"I am the truth","k":"","s":[{"p":"v","t":"Let not your heart,\nLet not your heart be trouble,\nYou believe God, believe also in me,\nIn my Father\u2019s house\nThere are many mansions,\nI go prepare a place for you.","n":1},{"p":"c","t":"I am the truth and the life,\nNo man cometh unto the\nFather but by me,\nIf it\u2019s not so,\nI would have told you,\nI go to prepare a place for you.","n":1},{"p":"v","t":"And if I go and prepare a place for you\nI will come again\nTo receive you unto myself,\nThat where I am, there you may be also\nAnd where I go and the way you know.","n":2},{"p":"v","t":"Thomas said \u201cLord, where will you go\u201d\nAnd how can we know the way,\nBut Phillip said \u201cLord, show us the Father and it sufficient for us\u201d.","n":3}]},{"n":474,"t":"I saw the Lord","k":"","s":[{"p":"v","t":"I saw the Lord (2ce)\n\nHigh and lifted up\nAnd His train filled the temple (2ce)","n":1},{"p":"v","t":"The angels cried Holy,\nThe angels cried Holy,\nThe angels cried HOLY IS THE LORD!","n":2}]},{"n":475,"t":"God will take care of you","k":"","s":[{"p":"v","t":"Be not dismayed whatever betide\n\u00a0God will take care of you\nBeneath His wings of love abide,\nGod will take care of you.","n":1},{"p":"c","t":"God will take care of you\nThrough every day\nO\u2019er all the way\nHe will take care of you\nGod will take care of you.","n":1},{"p":"v","t":"Through days of toil when heart doth fail,\nGod will take care of you;\nwhen dangers fierce your path assail,\nGod will take care of you.","n":2},{"p":"v","t":"All you may need, He will provide,\nGod will take care of you;\nNothing you ask will be denied\nGod will take care of you.","n":3},{"p":"v","t":"No matter what may be the test,\nGod will take care of you;\nLean, weary one upon His breast,\nGod will take care of you.","n":4}]},{"n":476,"t":"If the same Spirit","k":"","s":[{"p":"v","t":"If the same Spirit\nThat raised Christ from the dead\nDwells in you\t(2ce)\nHe will quicken\nYour mortal body\nIf the Spirit dwells in you. (2ce)","n":1}]},{"n":477,"t":"I\u2019m living on the mountain","k":"F","s":[{"p":"v","t":"Far away the noise of strife upon my ear is falling,\nThen I know the sins of earth be set on every hand:\nDoubt and fear and things of earth in vain to me are calling,\nNone of these shall move me from Beulah Land.","n":1},{"p":"c","t":"I\u2019m living on the mountain,\nUnderneath a cloudless sky,\nI\u2019 m drinking at the fountain that never shall run dry;\nYes! I\u2019m feasting on the manna from a bountiful supply,\nFor I am dwelling in Beulah Land.","n":1},{"p":"v","t":"Far below the storm of doubt upon the world is bearing,\nSon of men in battle long the enemy withstand;\nSafe am I within the castle of God\u2019s work retreating,\nNothing then can reach me \u2018tis Beulah Land.","n":2},{"p":"v","t":"Let the stormy breezes blow, their cry cannot alarm me;\nI am safely sheltered here, protected by God\u2019s hand;\nHere the sun is always shining, here there\u2019s naught can harm me,\nI am safe for ever in Beulah Land.","n":3},{"p":"v","t":"Viewing here the works of God, I sink in contemplation,\nHearing now His blessed voice, I see the way He planned;\nDwelling in the spirit, here I learn of full salvation,\nGladly will I tarry in Beulah Land.","n":4}]},{"n":478,"t":"Brighten the corner","k":"Eb","s":[{"p":"v","t":"Do not wait until some deed of greatness\nYou may do.\nDo not wait to shed your light afar;\nTo the many duties ever near you\nNow be true,\nBrighten the corner, where you are.","n":1},{"p":"c","t":"Brighten the corner,\nWhere you are,\nBrighten the corner where you here,\nSomeone far from\nthe harbor you may guide a-cross the bar,\nBrighten the corner\nWhere you are.","n":1},{"p":"v","t":"Just above are clouded skies that,\nYou may help to clear,\nLet not narrow self your way debar;\nThough into one heart alone may fall\nYour song of cheer\nBrighten the corner where you are.","n":2},{"p":"v","t":"Here for all your talent you will\nSurely find a need,\nHere reflect the Bright and Morning Star;\nEven from you humble land\nThe bread of life may feed,\nBrighten the corner where you are.","n":3}]},{"n":479,"t":"Make me a channel of your peace","k":"","s":[{"p":"v","t":"Make a channel of your peace.\nWhere there is hatred\nLet me bring your love\nWhere there is injury,\nYour pardon, Lord.\nAnd where there\u2019s doubt\nTrue faith in you.","n":1},{"p":"c","t":"O Master, grant that\nI may never seek\nSo much to be consoled\nAs to console;\nTo be understood\nAs to understand,\nTo be loved\nAs to love with all soul.","n":1},{"p":"v","t":"Make me a channel of your peace\nWhere there\u2019s despair in life,\nLet me bring hope\nWhere there is darkness only light,\nand where there sadness ever joy.","n":2},{"p":"v","t":"Make me a channel of your peace\nIt is in pardoning that we are pardoned,\nIn giving of ourselves that we receive\nAnd in dying that we\u2019re born\nTo eternal life.\nO Master, grant that\nI may never seek\nSo much to be consoled\nAs to be console;\nTo be understood\nAs to understand,\nTo be loved\nAs to love with all soul.","n":3}]},{"n":480,"t":"On canaan\u2019s shore","k":"C","s":[{"p":"v","t":"Storms do not alarm me,\nThey sometime must come;\nTrials cannot harm me,\nfor I have blessed peace;\nAll I\u2019ve left behind me\nI long for no more,\nBetter things shall find me on Canaan\u2019s shore","n":1},{"p":"c","t":"Let those who will\nStay in Egypt land\nI am bound for Canaan\nWhere milk and honey flowing\nShall every need supply\nAll battles fought and\nThe victory won\nPeace and joy my portion\nMy soul shall rest\nOn its shore by and by.","n":1},{"p":"v","t":"Troubles do not fret me\nThey cannot abide\nThough they may beset me\nIn Jesus I will hide\nAll the world\u2019s commotion\nAbout me may roar\nThere\u2019s no stormy ocean\nOn Canaan's shore","n":2},{"p":"v","t":"I in grace abiding\nI\u2019m trying to stay\nIn the shadow hiding\nOf Canaan\u2019s perfect day\nAll my trust may fail me\nIt matter no more\nNothing can assail me\nOn Canaan\u2019s shore","n":3}]},{"n":481,"t":"Our God reigns","k":"Eb","s":[{"p":"v","t":"How lovely on the mountains\nAre the feet of Him,\nWho brings good news, good news,\nProclaiming peace,\nAnnouncing news of happiness\nOur God reigns,\nOur God reigns.","n":1},{"p":"c","t":"Our God reigns, Our God reigns,\nOur God reigns, Our God reigns.","n":1},{"p":"v","t":"You watchmen lift,\nYour voices joyfully as one,\nShout for your King, your King\nSee eye to eye\nThe Lord restoring Zion\nYour God reigns, your God reigns.","n":2},{"p":"v","t":"Waste places of\nJerusalem break forth with joy,\nWe are redeemed, redeemed.\nThe Lord has saved and comforted His people\nYour God reigns, your God reigns.","n":3},{"p":"v","t":"Ends of the Earth\nSee the salvation of your God,\nJesus is Lord, is Lord,\nBefore the Nations,\nHe has bared His Holy arms;\nYour God reigns, your God reigns.","n":4}]},{"n":482,"t":"Come, o thou prophet of the Lord","k":"F","s":[{"p":"v","t":"Come, O Thou Prophet of the Lord,\nThou great Interpreter divine,\nExplain Thine own transmitted word,\nTo teach and to inspire is Thine;\nThou only cast Thyself reveal\nOpen the book and loose the seal.","n":1},{"p":"v","t":"Whate\u2019er the ancient prophets spoke\nConcerning Thee, O Christ, make know;\nChief subject of the sacred book,\nThou fillest all, and Thou alone;\nYet there our Lord we cannot see,\nUnless Thy Spirit lend the key.","n":2},{"p":"v","t":"Now Jesus, now the veil remove,\nThe folly of our darkened heart;\nUnfold the wonders of Thy love,\nThe knowledge of Thyself impart;\nOur ear, our inmost soul, we bow,\nSpeak Lord, Thy servants hearken now.","n":3}]},{"n":483,"t":"Work, for the night is coming","k":"","s":[{"p":"v","t":"Work, for the night is coming\nWork though the morning hours;\nWork while the dew in sparkling,\nWork mid springing flowers;\nWork when the day grows brighter,\nWork in the glowing sun;\nWork, for the night is coming,\nWhen man\u2019s work is done.","n":1},{"p":"v","t":"Work, for the night is coming,\nWork though the sunny noon;\nFill brightest hours with Labour,\nRest comes sure and soon;\nGive every flying minute\nSomething to keep in store\nWork for the night is coming\nWhen man works no more.","n":2},{"p":"v","t":"Work, for the night is coming,\nUnder the sunset skies,\nWhile their bright tints are glowing,\nWork, for day light flies;\nWork till the last beam fadeth,\nFadeth to shine no more;\nWork while the night is darkening,\nWhen man\u2019s work is o\u2019er","n":3}]},{"n":484,"t":"The bond of love","k":"Bb","s":[{"p":"v","t":"We are one in the bond of love;\nWe are one in the bond of love.\nWe have joined our spirit with the Spirit of God;\nWe are one in the bond of love.","n":1},{"p":"v","t":"Let us sing now, everyone;\nLet us feel His love begun.\nLet us join our hands that the world will know\nWe are one in the bond of love.","n":2}]},{"n":485,"t":"A shelter in the time of storm","k":"F","s":[{"p":"v","t":"The Lord\u2019s our rock, in Him we hide:\nA shelter in the time of storm!\nSecure whatever ill betide;\nA shelter in the time of storm!","n":1},{"p":"c","t":"Oh, Jesus is the Rock in a weary land!\nA weary land, A weary land;\nOh, Jesus is the Rock in a weary land,\nA shelter in the time of storm!","n":1},{"p":"v","t":"A shade by day, defence by night;\nA shelter in the time of storm!\nNo fears alarm, no foes affright;\nA shelter in the time of storm!","n":2},{"p":"v","t":"The raging storms may round us beat;\nA shelter in the time of storm!\nWe\u2019ll never leave our safe retreat,\nA shelter in the time of storm!","n":3},{"p":"v","t":"O Rock Divine, O Refuge dear;\nA shelter in the time of storm!\nBe Thou our helper ever near;\nA shelter in the time of storm!","n":4}]},{"n":486,"t":"Immortal, invisible, God only wise","k":"Ab","s":[{"p":"c","t":"Immortal, invisible, God only wise\nIn light inaccessible hid from our eyes,\nMost Blessed, Most Glorious, the Ancient of Days\nAlmighty, victorious, Thy great name we praise.","n":1},{"p":"v","t":"Unresting, unhasting, and silent as light,\nNor wanting, nor wasting,\nThou rulest in might,\nThy justice, like mountains, high soaring above,\nThy clouds, which are fountains of goodness and love.\nTo all, life Thou givest, to both great and small;\nIn all life Thou livest, the true life of all,\nWe blossom and flourish as leaves on the tree,\nAnd wither and perish but naught changeth Thee.\nGreat Father of glory, pure Father of light,\nThine angels adore Thee, All veiling their sight,\nAll praise we would render;\nO help us to see\n\u2018Tis only the splendor of light hideth Thee.","n":1}]},{"n":487,"t":"Jerusalem on high","k":"F","s":[{"p":"v","t":"Jerusalem on high\nMy song and city is,\nMy home whene\u2019er I die,\nThe centre of my bliss:","n":1},{"p":"c","t":"Oh happy place!\nWhen shall I be,\nMy God, with thee,\nto see thy face!","n":1},{"p":"v","t":"There dwells my Lord, my King,\nJudged here unfit to live,\nThere angels to him sing,\nAnd lowly homage give:","n":2},{"p":"v","t":"The patriarchs of old\nThere from their travels cease;\nThe prophets there behold\nTheir long\u2019d\u2013for prince of peace.","n":3},{"p":"v","t":"The prophets I might hear,\nThe mighty men of old\nThe Lord\u2019s apostles there,\nI might with joy behold:","n":4},{"p":"v","t":"The bleeding martyrs, they\nWithin those courts are found,\nClothed in pure array,\nTheir scars with glory crowned.","n":5},{"p":"v","t":"Ah me! Ah me! That I\nin cedar\u2019s tents here stay;\nNo place like that on high\nLord, thither guide my way.","n":6}]},{"n":488,"t":"We have heard the joyful sound","k":"G","s":[{"p":"v","t":"We have heard the joyful sound:\nJesus saves! Jesus saves!\nSpread the tidings all around:\nJesus saves! Jesus saves!","n":1},{"p":"v","t":"Bear the news to every land,\nClimb the steeps and cross the waves;\nOnward! \u2018tis our Lord\u2019s command;\nJesus saves! Jesus saves!","n":2},{"p":"v","t":"Waft it on the rolling tide;\nJesus saves! Jesus saves!\nTell the sinners far and wide:\nJesus saves! Jesus saves!","n":3},{"p":"v","t":"Sing, ye islands of the sea;\nEcho back, ye ocean caves;\nEarth shall keep her jubilee:\nJesus saves! Jesus saves!","n":4},{"p":"v","t":"Sing above the battle strife,\nJesus saves! Jesus saves!\nBy His death and endless life.\nJesus saves! Jesus saves!","n":5},{"p":"v","t":"Sing it softly through the gloom,\nWhen the heart for mercy craves;\nSing in triumph o\u2019er the tomb,\nJesus saves! Jesus saves!","n":6},{"p":"v","t":"Give the winds a mighty voice,\nJesus saves! Jesus saves!\nLet the nations now rejoice,\nJesus saves! Jesus saves!","n":7},{"p":"v","t":"Shout salvation full and free;\nHighest hills and deepest caves;\nThis our song of victory,\nJesus saves! Jesus saves!","n":8}]},{"n":489,"t":"All creatures of our God and king","k":"","s":[{"p":"v","t":"All creatures of our God and King,\nLift up your voice with us and sing,\nAlleluia! Alleluia!\nThou burning sun with golden beam,\nThou silver moon with softer gleam!","n":1},{"p":"c","t":"O praise Him, O praise Him,\nAlleluia! Alleluia!\nAlleluia!","n":1},{"p":"v","t":"Thou rushing wind that art so strong,\nYe clouds that sail in heaven along,\nO praise Him, Alleluia!\nThou rising morn in praise rejoice,\nYe lights of everning, find a voice","n":2},{"p":"v","t":"And all ye men of tender heart,\nForgiving others, take your part,\nO sing ye, Alleluia!\nYe who long pain and sorrow bear,\nPraise God and on Him cast your care!","n":3},{"p":"v","t":"Let all things their Creator bless,\nAnd worship Him in humbleness,\nO praise Him, Alleluia!\nPraise Him above ye heavenly host.\nPraise God from whom all blessings flow!","n":4}]},{"n":490,"t":"Arise, my soul, arise","k":"Bb","s":[{"p":"v","t":"Arise, my soul, arise,\nShake off thy guilty fears;\nThe bleeding sacrifice in my behalf appears;\nBefore the throne my Surety stands;\nBefore the throne my Surety stands;\nMy name is written on His hands.","n":1},{"p":"c","t":"He ever lives above,\nFor me to intercede,\nHis all-redeeming love,\nHis precious blood to plead;\nHis blood atoned for all our race,\nHis blood atoned for all our race,\nAnd sprinkles now the throne of grace.","n":1},{"p":"v","t":"Five bleeding wounds He bears,\nReceived on Calvary;\nThey pour effectual prayers,\nThey strongly plead for me;\n\u201cForgive him, O forgive,\u201d they cry,\n\u201cForgive him, O forgive,\u201d they cry,\n\u201cNor let the ransomed sinner die.\u201d\nMy God is reconciled;\nHis pard\u2019ning voice I hear;\nHe owns me for His child;\nI can no longer fear;\nWith confidence I now draw nigh,\nWith confidence I now draw nigh,\nAnd, \u201cFather, Abba, Father,\u201d cry. (Amen).","n":2}]},{"n":491,"t":"Head of the church triumphant","k":"G","s":[{"p":"v","t":"Head of the church triumphant!\nWe joyfully adore Thee;\nTill Thou appear, Thy members here\nWould sing Thy love and glory.","n":1},{"p":"v","t":"We lift our hearts and voices,\nIn blest anticipation,\nAnd cry aloud, and give to God\nThe praise of our salvation.","n":2},{"p":"v","t":"While in affliction\u2019s furnace\nAnd passing through the fire,\nThe love we praise which tries our ways,\nand ever brings us nigher;","n":3},{"p":"v","t":"We lift our hearts and exulting\nIn Thine almighty favour;\nThe love divine which made us Thine\nShall keep us Thine forever.","n":4},{"p":"v","t":"Thou dost conduct Thy people\nSafely through all temptation;\nNor will we fear, since thou art near,\nThe fire of tribulation;","n":5},{"p":"v","t":"The world with sin and Satan,\nDisplay their strength before us;\nBy Thee we shall break through them all,\nAnd join the heavenly chorus.","n":6},{"p":"v","t":"By faith we see the glory\nOf which Thou dost assure us;\nThe world despise, for that high prize\nWhich Thou hast set before us;","n":7},{"p":"v","t":"And may we, counted worthy\nTo meet the Son from Heaven,\nThere see our Lord, by all adored,\nTo us in glory given.","n":8}]},{"n":492,"t":"Deeper, deeper in the love of Jesus","k":"G","s":[{"p":"v","t":"Deeper, deeper in the love of Jesus\nDaily let me go;\nHigher, higher in the school of wisdom,\nMore of grace to know.","n":1},{"p":"c","t":"O deeper yet, I pray\u2026\nAnd higher every day\u2026\nAnd wiser, blessed Lord\u2026\nIn Thy precious holy Word.","n":1},{"p":"v","t":"Deeper, deeper! Blessed Holy Spirit,\nTake me deeper still,\nTill my life is wholly lost in Jesus,\nAnd His perfect will.","n":2},{"p":"v","t":"Deeper, deeper! Though it cost hard trials,\nDeeper let me go!\nRooted in the holy love of Jesus,\nLet me fruitful grow.","n":3},{"p":"v","t":"Deeper, higher, everyday in Jesus,\nTill all conflict past,\nFinds me conqu\u2019ror,\nAnd in His own image\nPerfected at last.","n":4}]},{"n":493,"t":"Burdens are lifted at Calvary","k":"F","s":[{"p":"v","t":"Days are filled with sorrow and care,\nHearts are lonely and drear;\nBurdens are lifted at Calvary,\nJesus is very near.","n":1},{"p":"c","t":"Burdens are lifted at Calvary,\nCalvary, Calvary,\nBurdens are lifted at Calvary,\nJesus is very near.","n":1},{"p":"v","t":"Cast your care on Jesus today,\nLeave your worry and fear;\nBurdens are lifted at Calvary,\nJesus is very near.","n":2},{"p":"v","t":"Troubled soul, the Saviour can see,\nEvery heartache and tear;\nBurdens are lifted at Calvary,\nJesus is very near.","n":3},{"p":"v","t":"Trust in Him with all of your heart,\nHe is waiting to bless.\nBurdens are lifted at Calvary,\nJesus is very near.","n":4}]},{"n":494,"t":"God is here","k":"C","s":[{"p":"v","t":"God is here,\nand that to bless us,\nWith the Spirit\u2019s quickening power,\nSee, the cloud already bending,\nWaits to drop the grateful shower.","n":1},{"p":"c","t":"Let it come, O Lord, we pray, Thee,\nLet the showers of blessing fall;\nWe are waiting, we are waiting,\nOh, revive the hearts of all.","n":1},{"p":"v","t":"God is here! We feel His presence\nIn this consecrated place;\nBut we need the soul refreshing\nOf His free, unbounded grace.","n":2},{"p":"v","t":"God is here! Oh, then, believing,\nBring to Him our one desire,\nThat His love may now be kindled,\nTill its flame each heart inspire.","n":3},{"p":"v","t":"Saviour, grant the prayer we offer,\nWhile in simple faith we bow,\nFrom the windows of thy mercy\nPour us out a blessing now.","n":4}]},{"n":495,"t":"Crown him with many crowns","k":"Eb","s":[{"p":"v","t":"Crown Him with many crowns,\nThe Lamb upon His throne;\nHark! How the heavenly anthem downs\nAll music but its own:","n":1},{"p":"v","t":"Awake, my soul, and sing,\nOf Him Who died for thee,\nAnd hail Him as thy matchless King through all eternity.","n":2},{"p":"v","t":"Crown Him the Lord\nof love;\nBehold His hands and side,\nThose wounds yet visible above,\nIn beauty glorified:","n":3},{"p":"v","t":"No angel in the sky\nCan fully bear that sight,\nBut downward bends his burning eye\nAt mysteries so bright.","n":4},{"p":"v","t":"Crown Him the Lord of life,\nWho triumphed o\u2019er the grave,\nAnd rose victorious in\nthe strife,\nFor those He came to save;","n":5},{"p":"v","t":"His glories now we sing,\nWho died, and rose on high,\nWho died, Eternal life\nto bring,\nAnd lives, that death may die.","n":6},{"p":"v","t":"Crown Him the Lord of peace,\nWhose Power a scepter sways\nFrom pole to pole, that wars may cease,\nAnd all be prayer and praise;","n":7},{"p":"v","t":"His reign shall know no end,\nAnd round His pierced feet\nFair flowers of Paradise extend\nTheir fragrance ever sweet.","n":8},{"p":"v","t":"Crown Him the Lord of years,\nThe Potentate of time,\nCreator of the rolling spheres,\nIneffably sublime:","n":9},{"p":"v","t":"All hail, Redeemer, hail!\nFor Thou hast died for me;\nThy praise shall never, never fail,\nThroughout Eternity.","n":10},{"p":"v","t":"Crown Him the Lord of Heav\u2019n One with the Father known,\nOne with the Spirit through Him giv\u2019n\nFrom yonder glorious throne!","n":11},{"p":"v","t":"To Thee be endless praise,\nFor Thou for us hast died;\nBe Thou, O Lord, thro\u2019 endless days Adored and magnified.","n":12}]},{"n":496,"t":"Is your all on the altar?","k":"F","s":[{"p":"v","t":"You have longed for sweet peace,\nAnd for faith to increase,\nAnd have earnestly, fervently prayed;\nBut you cannot have rest, or be perfectly blest,\nUntil all on the altar is laid.","n":1},{"p":"c","t":"Is your all on the altar of sacrifice laid?\nYour heart, does the Spirit control?\nYou can only be blest and have peace and sweet rest,\nAs you yield Him your body and soul.","n":1},{"p":"v","t":"Would you walk with the Lord,\nIn the light of His Word,\nAnd have peace and contentment always;\nYou must do His sweet will,\nto be free from all ill,\nOn the altar your all you must lay.","n":2},{"p":"v","t":"Oh, we never can know,\nWhat the Lord will bestow,\nOf the blessings for which we have prayed,\nTill our body and soul He doth fully control,\nAnd our all on the altar is laid.","n":3},{"p":"v","t":"Who can tell all the love,\nHe will send from above,\nAnd how happy our hearts will be made,\nOf the fellowship sweet we shall share at His feet,\nWhen our all on the altar is laid.","n":4}]},{"n":497,"t":"I\u2019d rather have Jesus","k":"Db","s":[{"p":"v","t":"I\u2019d rather have Jesus than silver or gold,\nI\u2019d rather be His than have riches untold;\nI\u2019d rather have Jesus than houses or lands,\nI\u2019d rather be led by His nail pierced hand.","n":1},{"p":"c","t":"Than to be the king of a vast domain\nOr be held in sin\u2019s dread sway;\nI\u2019d rather have Jesus than anything\nThis world affords today.","n":1},{"p":"v","t":"I\u2019d rather have Jesus than men\u2019s applause,\nI\u2019d rather be faithful to His dear cause;\nI\u2019d rather have Jesus than world-wide fame,\nI\u2019d rather be true to His Holy name.","n":2},{"p":"v","t":"He\u2019s fairer than lilies of rarest bloom,\nHe\u2019s sweeter than honey from out of the comb;\nHe\u2019s all that my hungering spirit needs,\nI\u2019d rather have Jesus and let Him lead.","n":3}]},{"n":498,"t":"All I want to see is Jesus","k":"C","s":[{"p":"v","t":"Hurt and self-inflicted pain\nAnd everything that I thought gain\nWill lay before the Holy Consuming Fire\nWords of knowledge in His name\nAnd healing hands that touched the lame\nWill lay before the Holy Consuming fire.","n":1},{"p":"c","t":"All I want to see is Jesus\nAll I want to see is Him in me\nAll I want to see is Jesus\nShining through me.","n":1},{"p":"v","t":"And hear Him say well done my precious one\nWell done, well done, my faithful one.\nOh, I know the time is here\nWhere everything that I hold dear\nWill lay before the Holy Consuming Fire\nAll my works and all my deeds\nAnd every prayer said on my knees\nWill lay before the Holy Consuming Fire.","n":2}]},{"n":499,"t":"Lord, make us vessels of honour","k":"C","s":[{"p":"v","t":"Lord, make us vessels of honour\nIn Your house and cleanse our hearts.\nOpen Thou our lips and mouth to show forth\nYour praise in all the earth","n":1},{"p":"c","t":"Oh, Lord, according to Your loving kindness,\nAccording to Your Word,\nMake our hearts to hear Your joy and gladness,\nAnd fill us with Your love,\nFill us with Your love.","n":1},{"p":"v","t":"Do good unto us in Thy good pleasure,\nUphold us with Thy free Spirit,\nCast us not away from Thy presence,\nAnd take not Thy Spirit from us","n":2},{"p":"v","t":"Hide Thy face from our sins,\nAnd blot out our iniquities,\nPurge and cleanse us with Your blood...\nBridge:","n":3},{"p":"v","t":"Fill us with Your love.\nEnd\u2026","n":4}]},{"n":500,"t":"Have faith in God","k":"C","s":[{"p":"v","t":"Have faith in God when your pathway is lonely,\nHe sees and knows all the way you have trod;\nNever alone are the least of His children;\nHave faith in God, Have faith in God.","n":1},{"p":"c","t":"Have faith in God, He\u2019s on His throne;\nHave faith in God, He watches o\u2019er His own;\nHe cannot fail,\nHe must prevail;\nHave faith in God, Have faith in God.","n":1},{"p":"v","t":"Have faith in God when your pray\u2019rs are unanswered,\nYour earnest plea He will never\nforget;\nWait on the Lord, trust His Word and be patient,\nHave faith in God, He\u2019ll answer yet.","n":2},{"p":"v","t":"Have faith in God in your pain and your sorrow,\nHis heart is touched with your grief and despair;\nCast all your cares and your burdens upon Him,\nAnd leave them there, oh, leave them there.","n":3},{"p":"v","t":"Have faith in God though all else fail about you,\nHave faith in God, He provides for His own;\nHe cannot fail though all kingdoms shall perish,\nHe rules, He reigns upon His throne.","n":4}]},{"n":501,"t":"The strife is o\u2019er","k":"Eb","s":[{"p":"v","t":"The strife is o\u2019er\u2014the battle done,\nThe victory of life is won;\nThe song of triumph has begun:\nAlleluia!","n":1},{"p":"v","t":"The pow\u2019rs of death have done their worst,\nBut Christ their legions hath dispersed;\nLet shouts of holy joy outburst:\nAlleluia!","n":2},{"p":"v","t":"The three sad days have quickly sped,\nHe rises glorious from the dead;\nAll glory to our risen Head!\nAlleluia!","n":3},{"p":"v","t":"He closed the yawning gates of hell,\nThe bars from heav\u2019n\u2019s high portals fell;\nLet hymns of praise His triumphs tell:\nAlleluia!","n":4},{"p":"v","t":"Lord, by the stripes which wounded Thee,\nFrom death\u2019s dread sting Thy servants free,\nThat we may live and sing to Thee:\nAlleluia!","n":5}]},{"n":502,"t":"Check yourself in the mirror","k":"F","s":[{"p":"v","t":"The Word of God is the mirror for Christians to be sure,\nThat your works and your thoughts are true,\nAsk the Saviour to help you,\nAnd to make Himself a part of you.\nIt\u2019s so easy to say,\nThat you\u2019re walking,\nIn the Truth today,\nBut are you really reflecting,\nThe image of Christ I say?\nAnd now\u2026","n":1},{"p":"c","t":"Check yourself in the mirror,\nOf the Word and be sure,\nThat your works and your thoughts are true,\nAsk the Saviour to help you,\nAnd to make Himself a part of you.","n":1},{"p":"v","t":"For we all must be ready,\nTo meet Him when He comes,\nAnd to hear Him say, come up hither,\nTo that place prepared for you,\nAnd now\u2026","n":2}]},{"n":503,"t":"God give us christian homes","k":"Eb","s":[{"p":"v","t":"God give us Christian homes!\nHomes where the Bible is loved and taught,\nHomes where the Master\u2019s will is sought,","n":1},{"p":"v","t":"Homes crowned with beauty Your love has wrought;\nGod give us Christian homes;\nGod give us Christian homes!","n":2},{"p":"v","t":"God give us Christian homes!\nHomes where the father is true and strong,\nHomes that are free from the blight of wrong,","n":3},{"p":"v","t":"Homes that are joyous with love and song;\nGod give us Christian homes;\nGod give us Christian homes!","n":4},{"p":"v","t":"God give us Christian homes!\nHomes where the mother, in caring quest,\nStrives to show others Your way is best,","n":5},{"p":"v","t":"Homes where the Lord is an honoured guest;\nGod give us Christian homes;\nGod give us Christian homes!","n":6},{"p":"v","t":"God give us Christian homes!\nHomes where the children are led to know,\nChrist in His beauty Who loves them so,","n":7},{"p":"v","t":"Homes where the altar fires burn and glow;\nGod give us Christian homes; God give us Christian homes!","n":8}]},{"n":504,"t":"Amazing grace","k":"C","s":[{"p":"v","t":"Amazing grace shall always be my song of praise,\nFor it was grace that bought my liberty,\nI do not know just why He came to love me so,\nHe looked beyond my fault and saw my need.","n":1},{"p":"c","t":"I shall forever lift mine eyes to Calvary\nTo view the cross where Jesus died for me\nHow marvellous the grace that caught my falling soul\nHe looked beyond my fault and saw my need.","n":1},{"p":"v","t":"Amazing grace that saved me from that sin and shame\nTo draw me close and keep me by His side\nForever I\u2019ll sing; All praise, All glory to His name\nIf not for Him, I surely would have died.","n":2},{"p":"v","t":"How sweet it is to walk with Him this narrow way\nFor now I see the light of glory glimpse\nSoon I shall see His lovely face and He will say\nWell done my child! Come be enthroned with me.","n":3},{"p":"v","t":"Until you know the loving hand that reached your soul\nAnd picked you up above the plain you\u2019d trod,\nTo place you where you\u2019d stretch and look the valley low\nCome face to face with God\u2019s own sovereign grace.","n":4}]},{"n":505,"t":"Jesus draw me close","k":"G","s":[{"p":"v","t":"You have called me out of the world of sin\nYou have shown me love like no other\nBy Your grace divine, I know I shall stand\nJesus draw me close to You.\n1.\nYour mercy towards me no one can tell\nYour word keeps ringing in my heart\nAnd it was grace that saved my fainting soul\nDraw me closer Lord to You.","n":1},{"p":"c","t":"Jesus draw me close\nCloser Lord to You,\nLet the world around me fade away,\nJesus draw me close\nCloser Lord to You\nFor I desire to worship and obey.","n":1},{"p":"v","t":"You have given me grace like no other\nYou have covered me under Your wings\nBy Your love divine, I know I am free\nYour word hid I in my heart.\n2.\nIn Your word You said seek and ye shall find\nWe have searched the word and seen Your face\nThere is no other reason why we live\nSo we long to live in You.","n":2},{"p":"v","t":"From the heavens you came out and knew me,\nYou have cleansed me and made me spotless,\nLifting my hands and heart before you Lord\nTo You alone my spirit yield.\nI receive you as my Lord and Saviour\nHumbly I bow now before Your word\nI\u2019ve decided to leave this world of sin\nJesus draw me close to You\nJesus draw me close\nCloser Lord to You,\nLet the world around me fade away,\nJesus draw me close\nCloser Lord to You\nFor I desire to worship and obey.\nChorus:\nFor I desire to worship and obey.","n":3}]},{"n":506,"t":"Lead me Lord, I will follow","k":"Bb","s":[{"p":"v","t":"It\u2019s hard to take the first step\nWhen I don\u2019t know the way\nEach turn is so uncertain\nI learn to walk by faith\n1.\nBut You gave me a promise\nThat You will never leave\nYou will lead and guide me\nLord I do believe.","n":1},{"p":"c","t":"Lead me Lord, I will follow\nLead me Lord, I will go\nYou have called me,\nI have answered,\nLead me Lord, I will go.","n":1},{"p":"v","t":"Your plans for me are perfect\nI never need to fear\nFor though at times I feel alone\nI know that You are near\nMy heart just wants to follow\nI\u2019m willing to obey\nTake my hand and lead me\nI\u2019ll follow all the way.","n":2}]},{"n":507,"t":"Jesus is all the world to me","k":"Ab","s":[{"p":"v","t":"Jesus is all the world to me,\nmy life, my joy, my all;\nHe is my strength from day to day,\nWithout Him I would fall;","n":1},{"p":"v","t":"When I am sad, to Him I go,\nNo other one can cheer me so;\nWhen I am sad, He makes me glad, He\u2019s my friend.","n":2},{"p":"v","t":"Jesus is all the world to me,\nmy friend in trials sore;\nI go to Him for blessings\nAnd He gives them o\u2019er and o\u2019er;","n":3},{"p":"v","t":"He sends the sunshine and the rain, He sends the harvest\u2019s golden grain;\nSunshine and rain, harvest of grain, He\u2019s my friend.","n":4},{"p":"v","t":"Jesus is all the world to me,\nAnd true to Him I\u2019ll be;\nOh, how could I this friend deny, When He\u2019s so true to me?","n":5},{"p":"v","t":"Following Him I know I\u2019m right,\nHe watches o\u2019er me day and night;\nFollowing Him,\nby day and night,\nHe\u2019s my friend.","n":6},{"p":"v","t":"Jesus is all the world to me,\nI want no better friend;\nI trust Him now, I\u2019ll trust Him when life\u2019s fleeting days shall end;\nLast verse:","n":7},{"p":"v","t":"Beautiful life with such a friend;\nBeautiful life that has no end;\nEternal life, eternal joy,\nHe\u2019s my friend.","n":8}]},{"n":508,"t":"Jesus only","k":"Ab","s":[{"p":"v","t":"What though clouds are hovering o\u2019er me,\nAnd I seem to walk alone, longing \u2018mid my cares and crosses\nFor the joys that now are flown.","n":1},{"p":"c","t":"If I\u2019ve Jesus \u201cJesus Only\u201d,\nThen my sky will have a gem;\nHe\u2019s the Son of brightest splendour,\nAnd the star of Bethlehem.\nWhat though all my earthly journey\nBringeth naught but weary hours;\nAnd, in gasping for life\u2019s roses,\nThorns I find instead of flowers.","n":1},{"p":"v","t":"If I\u2019ve Jesus \u201cJesus Only\u201d\nI possess a cluster rare;\nHe\u2019s the lily of the valley?\nAnd the \u201cRose of Sharon\u201d fair.","n":2},{"p":"v","t":"What though, all my heart is yearning,\nFor the love of long ago,\nBetter lessons sadly learning,\nfrom the shadowy page of woe.\nIf I\u2019ve Jesus, \u201cJesus Only\u201d\nHe\u2019ll be with me to the end;\nAnd, unseen by mortal vision,\nAngel\u2019s bands will o\u2019er me blend.","n":3},{"p":"v","t":"When I soar to realms of glory,\nAnd on entrance I wait\nIf I whisper, \u201cJesus Only\u201d will open the pearly gate,\nPrecious Jesus, \u201cJesus Only\u201d\nWill my theme of rapture be\nPrecious Jesus, \u201cJesus Only\u201d\nWill my theme of rapture be","n":4}]},{"n":509,"t":"Wonderful story of love","k":"Ab","s":[{"p":"v","t":"Wonderful story of love,\nTell it to me again;\nWonderful story of love;\nWake the immortal strain!\nAngels with rapture announce it\nShepherds with wonder receive it;\nSinner, O won\u2019t you believe it,\nWonderful Story of love.","n":1},{"p":"c","t":"Won\u2026der\u2026ful! Won\u2026der\u2026ful!\nWon\u2026der\u2026ful\u2026\nWonderful story of love","n":1},{"p":"v","t":"Wonde
