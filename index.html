u2019r to save,\nI\u2019ve anchored to the Rock of Ages.","n":1},{"p":"v","t":"He keeps my soul from evil and gives me blessed peace;\nHis voice has stilled the waters and bid their tumult cease,\nMy Pilot and Deliv\u2019rer to Him, I all confide,\nFor always when I need Him, He\u2019s at my side.","n":2},{"p":"v","t":"He is my Friend and Saviour, in Him my anchor\u2019s cast,\nHe drives away my sorrows and shields me from the blast;\nBy faith I\u2019m looking upward beyond life\u2019s troubled sea,\nThere I behold a haven prepared for me.","n":3}]},{"n":155,"t":"Beyond the sunset","k":"Eb","s":[{"p":"v","t":"Beyond the sunset, O blissful morning,\nWhen with our Saviour heaven\u2019s begun,\nEarth\u2019s toiling ended, O glorious dawning,\nBeyond the sunset, when day is come.","n":1},{"p":"v","t":"Beyond the sunset, no clouds will gather,\nNo storms will threaten, no fears annoy,\nO day of gladness, O day unending,\nBeyond the sunset, eternal joy.","n":2},{"p":"v","t":"Beyond the sunset, a hand will guide me,\nTo God, the Father, whom I adore,\nHis glorious presence, His words of welcome,\nWill be my portion on that fair shore.","n":3},{"p":"v","t":"Beyond the sunset, O glad\nre-union,\nWith our dear loved ones who\u2019ve gone before\nIn that fair home land, we\u2019ll know no parting,\nBeyond the sunset forever more.","n":4}]},{"n":156,"t":"A child of the king","k":"Eb","s":[{"p":"v","t":"My Father is rich in houses and lands\nHe holdeth the wealth of the world in His hands!\nOf rubies and diamonds, of silver and gold;\nHis coffers are full, He has riches untold.","n":1},{"p":"c","t":"I\u2019m a child of the King!\nA child of the King!\nWith Jesus my Saviour,\nI\u2019m a child of the King!","n":1},{"p":"v","t":"My Father\u2019s own Son, the Saviour of men,\nOnce wandered on earth as the poorest of them;\nBut now He is reigning forever on high,\nAnd will give me a home in heaven by and by.","n":2},{"p":"v","t":"I once was an out-cast, sinner on earth,\nA sinner by choice, and an alien by birth!\nBut I\u2019ve been adopted, my name\u2019s written down,\nAn heir to a man-sion, a robe, and a crown!","n":3},{"p":"v","t":"A tent or a cot-tage, why should I care?\nThey\u2019re building a palace for me over there!\nThough exiled from home, yet still I may sing;\nAll glory to God, I\u2019m a child of the King.","n":4}]},{"n":157,"t":"Hold to god\u2019s unchanging hand","k":"Ab","s":[{"p":"v","t":"Time is filled with swift transition,\nNaught of earth unmoved can stand,\nBuild your hopes on things eternal\nHold to God\u2019s unchanging hand!","n":1},{"p":"c","t":"Hold to God\u2019s unchanging hand!\nHold to God\u2019s unchanging hand!\nBuild your hopes on things eternal\nHold to God\u2019s unchanging hand!","n":1},{"p":"v","t":"Trust in Him who will not leave you,\nWhatsoever years may bring,\nIf by earthly friends forsaken,\nStill more closely to Him cling!","n":2},{"p":"v","t":"Covet not this world\u2019s vain riches,\nThat so rapidly decay,\nSeek to gain the heav\u2019nly treasures,\nThey will never pass away!","n":3},{"p":"v","t":"When your journey is completed,\nIf to God you have been true,\nFair and bright the home in glory,\nYour enraptured soul will view!","n":4}]},{"n":158,"t":"The day of redemption","k":"F","s":[{"p":"v","t":"The day of redemption is near (so near),\nMen\u2019s hearts are failing for fear (for fear),\nBe filled with the Spirit,\nyour lamps trimmed and clear,\nLook up!\nYour redemption is near.\nThe fig tree is growing, Jerusalem\u2019s restoring\nHer national life, long dethroned,\nToday she is calling, her latter rain\u2019s falling,\n\u201cReturn, O dispersed, to your own\u201d.","n":1},{"p":"c","t":"The nations are breaking, And Israel\u2019s awaking,\nThe signs in the Bible foretold,\nThe Gentile days numbered, with horrors encumbered,\nEternity soon will unfold.","n":1},{"p":"v","t":"The day of redemption is near (so near),\nMen\u2019s hearts are failing for fear (for fear),\nBe filled with the Spirit,\nyour lamps trimmed and clear,\nLook up!\nYour redemption is near.\nHeaven\u2019s pow\u2019rs are shaking, and many are mistaking\nGod\u2019s meaning to be of the sky;\nGod\u2019s church is the power that\u2019s shaking this hour,\nThe day of redemption is nigh.","n":2},{"p":"v","t":"The day of redemption is near (so near),\nMen\u2019s hearts are failing for fear (for fear),\nBe filled with the Spirit,\nyour lamps trimmed and clear,\nLook up!\nYour redemption is near.\nFalse prophets are lying,\nAnd men are denying,\nThat Jesus the Christ is our God,\nTho\u2019 this generation spurns God\u2019s revelation,\nWe\u2019ll walk where th\u2019 apostles have trod.\nThe day of redemption is near (so near),\nMen\u2019s hearts are failing for fear (for fear),\nBe filled with the Spirit,\nyour lamps trimmed and clear,\nLook up!\nYour redemption is near.","n":3}]},{"n":159,"t":"One day","k":"C","s":[{"p":"v","t":"One day when heaven was filled with His praises,\nOne day, when sin was as black as could be,\nJesus came forth to be born of a virgin,\nDwelt amongst men, my example is He!","n":1},{"p":"c","t":"Living, He loved me, dying, He saved me,\nBuried, He carried my sins far away,\nRising, He justified freely forever,\nOne day, He\u2019s coming, oh, glorious day!","n":1},{"p":"v","t":"One day, they led Him up Calvary\u2019s mountain,\nOne day, they nailed Him to die on the tree;\nSuffering anguish, despised and rejected,\nBearing our sins, my Redeemer is He!","n":2},{"p":"v","t":"One day, they left Him alone in the garden,\nOne day, He rested, from suffering free;\nAngels came down o\u2019er His tomb to keep vigil,\nHope of the hopeless, my Saviour is He!","n":3},{"p":"v","t":"One day, The grave could conceal Him no longer,\nOne day, the stone rolled away from the door;\nThen He arose, o\u2019er the death He had conquered,\nNow He\u2019s ascended, my Lord evermore!","n":4},{"p":"v","t":"One day, the trumpet will sound for His coming;\nOne day, the skies with His glory will shine;\nWonderful day, my beloved ones bringing;\nGlorious Saviour, this Jesus is mine!","n":5}]},{"n":160,"t":"Swing low, sweet chariot","k":"F","s":[{"p":"v","t":"I looked over Jordan and what did I see,\nComing for to carry me home:\nA band of Angels coming for me,\nComing for to carry me home.","n":1},{"p":"c","t":"Swing low, sweet chariot,\nComing for to carry me home,\nSwing low, sweet chariot,\nComing for to carry me home.","n":1},{"p":"v","t":"If you get there before I do\nComing for to carry me home,\nTell all my friends I\u2019m coming too,\nComing for to carry me home.","n":2}]},{"n":161,"t":"When they ring the golden bells","k":"F","s":[{"p":"v","t":"There\u2019s a land beyond the river,\nThat we call the sweet forever;\nAnd we only reach that shore by faith decree;\nOne by one we gain the portals,\nThere to dwell with the immortals,\nWhen they ring the golden bells for you and me.","n":1},{"p":"c","t":"Don\u2019t you hear the bells now ringing?\nDon\u2019t you hear the Angels singing?\n\u2018Tis the glory hallelujah jubilee,\nIn that far-off sweet forever,\nJust beyond the shining river,\nWhen they ring the golden bells for you and me.","n":1},{"p":"v","t":"We shall know no sin or sorrow,\nIn the haven of tomorrow,\nWhen our barque shall sail beyond the silver sea,\nWe shall only know the blessing,\nOf our Father\u2019s sweet caressing,\nWhen they ring the golden bells for you and me.","n":2},{"p":"v","t":"When our days shall know their number,\nWhen in death we sweetly slumber,\nWhen the King commands the spirit to be free,\nNevermore with anguish laden\nWe shall reach the sweetly aiden\nWhen they ring the golden bells for you and me.","n":3}]},{"n":162,"t":"When we all get to heaven","k":"C","s":[{"p":"v","t":"Sing the wondrous love of Jesus,\nSing His mercy and His grace,\nIn the mansions, bright and blessed,\nHe\u2019ll prepare for us a place.","n":1},{"p":"c","t":"When we all get to heaven,\nWhat a day of rejoicing that will be,\nWhen we all see Jesus,\nWe\u2019ll sing and shout the victory.","n":1},{"p":"v","t":"While we walk the pilgrim pathway,\nClouds will overspread the sky,\nBut when traveling days are over,\nNot a shadow, not a sigh.","n":2},{"p":"v","t":"Let us then be true and faithful,\nTrusting, serving, everyday,\nJust one glimpse of Him in glory,\nWill the toils of life repay.","n":3},{"p":"v","t":"Onward to the prize before us,\nSoon His beauty will behold,\nSoon the pearly gates will open,\nWe shall tread the streets of gold.","n":4}]},{"n":163,"t":"The old rugged cross","k":"Bb","s":[{"p":"v","t":"On a hill far away stood an old rugged cross,\nThe emblem of suffering and shame,\nAnd I love that old cross, where the dearest and best,\nFor a world of lost sinners was slain.","n":1},{"p":"c","t":"So I\u2019ll cherish the old rugged cross,\nTill my trophies at last I lay down,\nI will cling to the old rugged cross,\nAnd exchange it someday for a crown.","n":1},{"p":"v","t":"Oh, that old rugged cross, so despised by the world,\nHas a wondrous attraction for me,\nFor the dear Lamb of God left His glory above,\nTo bear it to dark Calvary.","n":2},{"p":"v","t":"In the old rugged cross, stained with blood so divine,\nA wondrous beauty I see,\nFor \u2018twas on that old cross, Jesus suffered and died,\nTo pardon and sanctify me.","n":3},{"p":"v","t":"To the old rugged cross, I will ever be true,\nIts shame and reproach gladly bear,\nThen He\u2019ll call me someday to my home far away,\nWhere His glory forever I\u2019ll share.","n":4}]},{"n":164,"t":"Where he leads me","k":"F","s":[{"p":"v","t":"I can hear my Saviour calling,\nI can hear my Saviour calling,\nI can hear my Saviour calling,\n\u201cTake thy cross and follow, follow Me\u201d.","n":1},{"p":"c","t":"Where He leads me I will follow,\nWhere He leads me I will follow,\nWhere He leads me I will follow,\nI\u2019ll go with Him, with Him, all the way.","n":1},{"p":"v","t":"I\u2019ll go with Him through the garden,\nI\u2019ll go with Him through the garden,\nI\u2019ll go with Him through the garden,\nI\u2019ll go with Him, with Him, all the way.\nWhere He leads me I will follow,\nWhere He leads me I will\nfollow,\nWhere He leads me I will follow,\nI\u2019ll go with Him, with Him, all the way.","n":2},{"p":"v","t":"I\u2019ll go with Him through the judgment,\nI\u2019ll go with Him through the judgment,\nI\u2019ll go with Him through the judgment,\nI\u2019ll go with Him, with Him, all the way.","n":3},{"p":"v","t":"He will give me grace and glory,\nHe will give me grace and glory,\nHe will give me grace and glory,\nAnd go with me, with me,\nall the way.","n":4}]},{"n":165,"t":"Wonderful","k":"F","s":[{"p":"v","t":"O my heart sings today, sings for joy and gladness,\nJesus saves, satisfies, banishes my sadness, Guilt is gone, peace is mine, peace like to a river,\nJesus is wonderful mighty to deliver.","n":1},{"p":"c","t":"Wonderful, wonderful, Jesus is to me,\nCounselor, Prince of Peace, Mighty God is He;\nSaving me, keeping me from all sins and shame,\nWonderful is my Redeemer, praise His name.","n":1},{"p":"v","t":"Once a slave, now I\u2019m free, free from condemnation,\nJesus gives liberty and a full salvation,\nNow the sins of the past have been all forgiven,\nAnd my name is inscribed on the book of heaven.","n":2},{"p":"v","t":"Living here with my Lord in a holy union,\nDay by day, all the way holding sweet communion,\nO what change grace hath wrought in my lowly station,\nSince my soul has received full and free salvation.","n":3}]},{"n":166,"t":"Where could I go?","k":"G","s":[{"p":"v","t":"Living below in this old sinful world,\nHardly a comfort can afford,\nStriving alone to face temptation sore,\nWhere could I go but to the Lord?","n":1},{"p":"c","t":"Where could I go?\nOh, where could I go?\nSeeking a refuge for my soul,\nNeeding a friend to help me in the end,\nWhere could I go but to the Lord?\nNeighbours are kind,\nI love them everyone,\nWe get along in sweet accord,\nBut when my soul needs manna from above,\nWhere could I go but to the Lord?","n":1},{"p":"v","t":"Where could I go?\nOh, where could I go? Seeking a refuge for my soul,\nNeeding a friend to help me in the end,\nWhere could I go but to the Lord?","n":2},{"p":"v","t":"Life here is grand with friends I love so dear,\nComfort I get from God\u2019s own Word,\nYet when I face the chilling hands of death,\nWhere could I go but to the Lord?\nWhere could I go?\nOh, where could I go? Seeking a refuge for my soul,\nNeeding a friend to help me in the end,\nWhere could I go but to the Lord?","n":3}]},{"n":167,"t":"Wonderful peace","k":"Ab","s":[{"p":"v","t":"Far away in the depth of my spirit tonight\nRolls a melody sweeter than psalm,\nIn celestial-like strains it unceasingly falls,\nO\u2019er my soul like an infinite calm.","n":1},{"p":"c","t":"Peace! Peace! Wonderful peace,\nComing down from the Father above,\nSweep over my spirit forever I pray,\nIn fathomless billows of love.","n":1},{"p":"v","t":"What a treasure I have in this wonderful peace,\nBuried deep in the heart of my soul,\nSo secured that no power can mine it away,\nWhile the years of eternity roll.","n":2},{"p":"v","t":"I am resting tonight in this wonderful peace,\nResting sweetly in Jesus control,\nFor I\u2019m kept from all danger by night and by day,\nAnd His glory is flooding my soul.","n":3},{"p":"v","t":"And I think when I rise to that City of peace,\nWhere the Author of peace I shall see,\nThat one strain of the song, which the ransomed will sing,\nIn that heavenly kingdom shall be.","n":4},{"p":"v","t":"Ah! Soul, are you here without comfort or rest,\nMarching down the rough pathway of time?\nMake Jesus your friend ere the shadows grow dark,\nOh, accept this sweet peace so sublime.","n":5}]},{"n":168,"t":"The sun will never go down","k":"F","s":[{"p":"v","t":"The sun, it will never go down in that city,\nThe sun, it will never go down;\nThe flowers are blooming forever,\nAnd the sun, it will never go down.","n":1},{"p":"v","t":"I feel like traveling on, I do,\nI feel like traveling on,\nThe flowers are blooming forever,\nAnd the sun, it will never go down.","n":2},{"p":"v","t":"I feel like shouting, sometimes I do,\nI feel like shouting, I do;\nThe flowers are blooming forever,\nAnd the sun, it will never go down.","n":3}]},{"n":169,"t":"I bowed down and cried \u201choly\u201d","k":"Bb","s":[{"p":"v","t":"I dreamed of the city called glory,\nSo bright and so fair,\nWhen I entered the gate I cried, \u201cHoly\u201d,\nThe angels all met me there,\nThey showed me from mansion to mansion,\nAnd oh, the sights I saw,\nBut I said \u201cI want to see Jesus\nThe One who died for all\u201d.","n":1},{"p":"c","t":"Then I bowed on my knees and cried \u201cHoly, Holy, Holy\u201d,\nI clapped my hands and sang \u201cGlory\u201d,\n\u201cGlory to the Son of God\u201d.","n":1},{"p":"v","t":"I thought when I entered that city,\nMy friends knew me well,\nThey showed me all through heaven,\nThe scenes are too num\u2019rous to tell,\nThey showed me Abraham, Isaac, Jacob, Mark, Luke and Timothy,\nBut I said, I want to give praise\nTo the One who died for me.","n":2},{"p":"v","t":"I thought when I saw my Saviour,\nOh glory to God,\nI just fell right down before Him,\nSinging, \u201cPraise to the name of the Lord\u201d,\nI bowed down and worshipped Jehovah,\nMy Friend of Calvary,\nFor I wanted to give praise to Jesus,\nFor saving a sinner like me.","n":3}]},{"n":170,"t":"When the saints go marching in","k":"Eb","s":[{"p":"v","t":"I\u2019m a pilgrim and a stranger,\nWandering through this world of sin,\nOn my way to that fair city,\nWhen the saints go marching in.","n":1},{"p":"c","t":"When the saints go marching in,\nWhen the saints go marching in,\nLord I want to be in the number,\nWhen the saints go marching in.","n":1},{"p":"v","t":"Oh, I know I\u2019ll see my Saviour,\nIf my life is free from sin,\nHeaven\u2019s door will open for me,\nWhen the saints go marching in.","n":2},{"p":"v","t":"When we gather round the Throne\nAnd the gates are closed within,\nI\u2019ll be shouting \u201cGlory, Glory\u201d,\nWhen the saints go marching in.","n":3},{"p":"v","t":"I am waiting for the chariots,\nTo swing low and I\u2019ll step in,\nOn the clouds I\u2019ll ride to heaven,\nWhen the saints go marching in.","n":4}]},{"n":171,"t":"I'd rather be an old-time christian","k":"C","s":[{"p":"v","t":"In this world I've tried most everything,\nAnd I'm happy now to say\nThere is no-thing like religion\nIn the good old-fashioned way;\nI am walking in the old-time ways\nAnd I want the world to know\nThat I'd rather be an old-time Christian\nThan any-thing I know.","n":1},{"p":"c","t":"I'd rather be an old-time Christian\nThan any-thing I know,\nThere's no-thing like an old-time Christian\nWith a Christian love to show;\nI'm walking in the grand old high-way,\nAnd I'm telling everywhere I go,\nThat I'd rather be an old time Christian\nThan any-thing I know.","n":1},{"p":"v","t":"There are many things I'd like to be\nAs my journey I pursue,\nI have longed to be a leader\nLike a mortal man would do;\nI would like to be a millionaire,\nWith a million to be-stow,\nBut I'd rather be an old-time Christian\nThan any-thing I know.","n":2},{"p":"v","t":"All the world is bright since I got right,\nNow I sing and pray and shout,\nAll my bur-dens have been lift-ed\nSince the Saviour brought me out;\nI will tell the world both far and near\nAs I travel here below,\nThat I'd rather be an old-time Christian\nThan any-thing I know.","n":3}]},{"n":172,"t":"Blessed assurance","k":"C","s":[{"p":"v","t":"Blessed assurance,\nJesus is mine!\nO, what a foretaste of glory divine!\nHeir of salvation, purchased of God,\nBorn of His Spirit,\nwashed in His Blood.","n":1},{"p":"c","t":"This is my story, this is my song,\nPraising my Saviour all the day long;\nThis is my story, this is my song,\nPraising my Saviour all the day long.","n":1},{"p":"v","t":"Perfect submission, perfect de-light,\nVisions of rapture now burst on my sight;\nAngels descending,\nbring from above\nEchoes of mercy,\nwhispers of love.","n":2},{"p":"v","t":"Perfect submission, all is at rest,\nI in my Saviour am happy and blest;\nWatching and waiting, looking above,\nFilled with His goodness, lost in His love.","n":3}]},{"n":173,"t":"The cloud and fire","k":"C","s":[{"p":"v","t":"As of old, when the hosts of Israel,\nWere compelled in the wilderness to dwell,\nTrusting they in their God to lead the way,\nTo the light of perfect day.","n":1},{"p":"c","t":"So the sign of the fire by night,\nAnd the sign of the cloud by day;\nHovering o'er, just be-fore,\nAs they journey on their way,\nShall a guide and a leader be,\nTill the wilderness be past,\nFor the Lord, our God, in His own good time,\nShall lead to the light at last.","n":1},{"p":"v","t":"To and fro, as a ship without a sail,\nNot a compassion to guide them thro' the vale\nBut the sign of their God was ever near,\nThus their fainting heart to cheer.","n":2},{"p":"v","t":"All the days of their wandering they were fed,\nTo the land of the promise they were led,\nBy the hand of the Lord in guidance sure,\nThey were brought to Canaan's shore","n":3}]},{"n":174,"t":"I won't have to cross Jordan alone","k":"Eb","s":[{"p":"v","t":"When I come to the river at the ending of day,\nWhen the last winds of sorrow have blown;\nThere'll be some-body waiting to show me the way,\nI won't have to cross Jordan alone.","n":1},{"p":"c","t":"I won't have to cross Jordan alone,\nJesus died all my sins to atone\nWhen the darkness I see, He'll be waiting for me,\nI won't have to cross Jordan alone.","n":1},{"p":"v","t":"Oft-en times I'm forsaken, and weary and sad,\nWhen it seems that my friends have all gone;\nThere is one thought that cheers me and makes my heart glad,\nI won't have to cross Jordan alone.","n":2},{"p":"v","t":"Though the billows of sorrow and trouble may sweep,\nChrist the Saviour will care for His own;\nTill the end of the journey, my soul He will keep,\nI won't have to cross Jordan alone.","n":3}]},{"n":175,"t":"Softly and tenderly Jesus is calling","k":"G","s":[{"p":"v","t":"Softly and tenderly Jesus is calling,\nCalling for you, and for me;\nSee on the portals He's waiting and watching,\nWatching for you and for me.","n":1},{"p":"c","t":"Come home, come home,\nYe who are weary, come home,\nEarnestly, tenderly, Jesus is calling,\nCalling, O sinners, come home!","n":1},{"p":"v","t":"Why should we tarry when Jesus is pleading;\nPleading for you and for me;\nWhy should we linger and heed not His mercies,\nMercies for you and for me.","n":2},{"p":"v","t":"Time is now fleeting,\nThe moments are passing,\nPassing for you and for me;\nShadows are gathering, death's night is coming,\nComing for you and for me.","n":3},{"p":"v","t":"Oh! For the wonderful love He has promised,\nPromised for you and for me,\nThough we have sinned; He has mercy and par-don,\nPar-don for you and for me.","n":4}]},{"n":176,"t":"Close to thee","k":"Bb","s":[{"p":"v","t":"Thou, my everlasting portion,\nMore than friend or life to me;\nAll along my pilgrim journey,\nSaviour, let me walk with Thee,","n":1},{"p":"v","t":"Close to Thee, Close to Thee,\nClose to Thee, Close to Thee,\nAll along my pilgrim journey,\nSaviour, let me walk with Thee.","n":2},{"p":"v","t":"Not for ease or worldly pleasure,\nNor for fame my prayer shall be,\nGladly will I toil and suffer,\nOnly let me walk with Thee,","n":3},{"p":"v","t":"Close to Thee, Close to Thee,\nClose to Thee, Close to Thee,\nGladly will I toil and suffer,\nOnly let me walk with Thee.","n":4},{"p":"v","t":"Lead me through the vale of shadows,\nBear me o'er life's fitful sea;\nThen the gate of life eternal,\nMay I enter, Lord, with Thee,","n":5},{"p":"v","t":"Close to Thee, Close to Thee,\nClose to Thee, Close to Thee,\nThen the gate of life eternal,\nMay I enter, Lord with\nThee.","n":6}]},{"n":177,"t":"Got any river?","k":"G","s":[{"p":"v","t":"Be of good courage, \"God spoke unto Joshua.\nWhen o'er the river God pointed the way,\nJordan uncross-able! Things seemed impossible\nWaters divide as they march and obey.","n":1},{"p":"c","t":"Got any rivers you think\nare un-cross-able?\nGot any mountains you\ncan't tunnel through?\nGod specializes in things thought impossible,\nHe does the things others can-not do.","n":1},{"p":"v","t":"Battles to win, They would meet with their obstacles,\nJericho's walls too, must fall to the ground,\nGod never failed; He stood back of His promises,\nWalls had to crumble as they marched around.","n":2},{"p":"v","t":"God is the same and His Word is dependable,\nHe'll make a way through the waters for you;\nLife's situations by Him are amendable,\nMountains and hills He will part for you too.","n":3}]},{"n":178,"t":"Where we\u2019ll never grow old","k":"Eb","s":[{"p":"v","t":"I have heard of a land on the far away strand,\n'Tis a beautiful home of the soul,\nBuilt by Jesus on high, there we never shall die,\n\u2018Tis a land where we\u2019ll never grow old.","n":1},{"p":"c","t":"Never grow old, Never grow old,\nIn a land where we\u2019ll never grow old;\nNever grow old, Never grow old,\nIn a land where we\u2019ll never grow old.","n":1},{"p":"v","t":"In that beautiful home where we'll nevermore roam,\nWe shall be in the sweet by and by;\nHappy praise to the King, through eternity sing,\n'Tis a land where we\u2019ll never shall die.","n":2},{"p":"v","t":"When our work here is done and the life crown is won,\nAnd our troubles and trials are o'er;\nAll our sorrows will end, and our voices will blend,\nWith the loved ones who've gone on before.","n":3}]},{"n":179,"t":"Lift him up","k":"Ab","s":[{"p":"v","t":"How to reach the masses, men of every birth?\nFor an answer Jesus gave a key,\nAnd I, if I be lifted up from the earth\nWill draw all men unto me.","n":1},{"p":"c","t":"Lift Him up, lift Him up,\nStill He speaks from eternity,\nAnd I, if I be lifted up from the earth\nWill draw all men unto me.","n":1},{"p":"v","t":"O the world is hungry for the living bread,\nLift the Saviour up for them to see;\nTrust Him and do not doubt the words that He said,\n\u201cI'll draw all men unto me\u201d.","n":2},{"p":"v","t":"Don't exalt the preacher, don't exalt the pew,\nPreach the Gospel simple, full and fee\nProve Him and you will find that promise is true,\nI'll draw all men unto me.","n":3},{"p":"v","t":"Lift Him up by living as a Christian ought,\nLet the world in you the Saviour see,\nThen men will gladly follow Him who once taught,\nI'll draw all men unto me.","n":4}]},{"n":180,"t":"Beulah land","k":"Eb","s":[{"p":"v","t":"I've reached the land of corn and wine,\nAnd all its riches freely mine,\nHere shines undimmed one blissful day,\nFor all my night has passed away.","n":1},{"p":"c","t":"O Beulah land, sweet Beulah land,\nAs on the highest mount I stand,\nI look away across the sea;\nWhere mansions are prepared for me,\nAnd view the shinning glory-shore,\nMy Heaven, my home forevermore.","n":1},{"p":"v","t":"My Saviour comes and walks with me,\nAnd sweet communion here have we:\nHe gently leads me by His hand\nFor this is Heaven's borderland.","n":2},{"p":"v","t":"A sweet perfume upon the breeze\nIs borne from ever-vernal trees,\nAnd flow'rs that never fading grow\nWhere streams of life forever flow.","n":3},{"p":"v","t":"The zephyrs seem to float to me,\nSweet sounds of Heaven\u2019s melody;\nAs angel with the white-robed throng,\nJoin in the sweet Redemption song.","n":4}]},{"n":181,"t":"The Lord brought me out","k":"Eb","s":[{"p":"v","t":"I'm so glad that the Lord brought me out;\nI'm so glad that the Lord brought me out;\nIf it had not been for Jesus, oh! where would I be?\nI'm so glad that the Lord brought me out.","n":1},{"p":"c","t":"He brought me out of the miry clay,\nHe set my feet on the Rock to stay;\nHe puts a song in my soul today,\nA song of praise, hallelujah!","n":1},{"p":"v","t":"I've been happy since the Lord brought me out,\nI've been happy since the Lord brought me out,\nIf it had not been for Jesus, oh! Where would I be?\nI'm so glad that the Lord brought me out.","n":2},{"p":"v","t":"Aren't you glad, that the Lord brought you out?\nAren't you glad, that the Lord brought you out?\nIf it had not been for Jesus, oh! Where would I be?\nI'm so glad that the Lord brought me out.","n":3},{"p":"v","t":"I've been singing since the Lord brought me out,\nI've been singing since the Lord brought me out,\nIf it had not been for Jesus, oh! Where would I be?\nI'm so glad that the Lord brought me out.","n":4}]},{"n":182,"t":"Gathering sheaves","k":"Ab","s":[{"p":"v","t":"To the harvest field away we will gladly go today,\nGathering sheaves, beautiful sheaves;\nFrom the early dawn till night, we will labour with our might,\nGathering sheaves, beautiful sheaves.","n":1},{"p":"c","t":"Gathering sheaves, beautiful sheaves;\nGathering sheaves, beautiful sheaves;\nPraise the Lord, we're on our way to that\nLand of endless day,\nGathering sheaves, beautiful sheaves","n":1},{"p":"v","t":"On the mountain, hill or plain we will harvest in the grain,\nGathering sheaves, beautiful sheaves;\nYes, we'll labour far and near; never falter; never fear,\nGathering sheaves, beautiful sheaves.","n":2},{"p":"v","t":"We will sing and we will pray, and our master's voice obey,\nGathering sheaves, beautiful sheaves;\nAs we go in foreign lands doing what our Lord commands,\nGathering sheaves, beautiful sheaves.","n":3}]},{"n":183,"t":"Such love","k":"Ab","s":[{"p":"v","t":"That God should love a sinner such as I,\nShould yearn to change my sorrow into bliss,\nNor rest till He planned to bring me nigh,\nHow wonderful is Love like this.","n":1},{"p":"c","t":"Such love, such wondrous love,\nSuch love, such wondrous love,\nThat God should love a sinner such as I,\nHow wonderful is Love like this.","n":1},{"p":"v","t":"That Christ should join so freely in the scheme,\nAI-though it meant His death on Calvary,\nDid ever human tongue find nobler theme,\nThan love divine that ransomed, me?","n":2},{"p":"v","t":"That for a willful outcast such as I,\nThe Father planned, the Saviour bled and died:\nRedemption for a worthless, slave to buy\nHow long had law and grace defied.","n":3},{"p":"v","t":"And now He takes me to His heart, a son,\nHe asks me not to fill a servant's place,\nThe far-off country wanderings all are done,\nWide open are His arms of grace.","n":4}]},{"n":184,"t":"Down from his glory","k":"Eb","s":[{"p":"v","t":"Down from His glory, ever living story,\nMy God and Saviour came, and Jesus was His name,\nBorn in a manger, to His own a stranger,\nA Man of sorrow, tears and agony.","n":1},{"p":"c","t":"O how I love Him! How I adore Him,\nMy breath, my sunshine; my all in all;\nThe great Creator became my Saviour,\nAnd all God's fullness dwelleth in Him.","n":1},{"p":"v","t":"What condescension, bringing us redemption;\nThat in the dead of night, not one faint hope in sight;\nGod\u2019s gracious tender, laid aside His splendour,\nStooping to woo, to win, to save my soul.","n":2},{"p":"v","t":"Without reluctance, flesh and blood His sub-stance,\nHe took the form of man, revealed the hidden plan,\nO glorious mystery, Sacrifice of Calvary,\nAnd now I know Thou wert the great \u201cI AM\u201d.","n":3}]},{"n":185,"t":"I'll meet you","k":"Eb","s":[{"p":"v","t":"I will meet you in the morning by the bright river side,\nWhen all sorrow has drifted away;\nI'll be standing at the portals, when the gates open wide,\nAt the close of life's long, dreary day.","n":1},{"p":"c","t":"I will meet you in the morning, with a 'How do you do;\n'And we'll sit by the river and with rapture\nour old acquaintance renew,\nYou'll know me in the morning, by the smiles that I wear,\nWhen I meet you in the morning, in the city that is built foursquare.","n":1},{"p":"v","t":"I will meet you in the morning, in the sweet by and by,\nAnd exchange the old cross for a crown;\nThere will be no disappointment and\nNobody shall die.\nIn that land, o'er the sun goeth down.","n":2},{"p":"v","t":"I will meet you in the morning, at the end of the way,\nOn the street of that city of gold,\nWhere we all can be together and be happy for aye,\nWhile the years and the ages shall roll.","n":3}]},{"n":186,"t":"Watching you!","k":"F","s":[{"p":"v","t":"All along thru the road to the soul's true abode,\nThere's an eye watching you;\nEvery step that you take, this great Eye is awake,\nThere's an Eye watching you.","n":1},{"p":"c","t":"Watching you, Watching you,\nEveryday mind the course you pursue;\nWatching you, Watching you,\nThere's an all-seeing Eye watching you.","n":1},{"p":"v","t":"As you make life's great flight, keep the pathway of right,\nThere's an Eye watching you.\nGod will warn not to go in the path of the foe,\nThere's an Eye watching you.","n":2},{"p":"v","t":"Fix your mind on the goal, that sweet home of the soul,\nThere's an Eye watching you.\nNever turn from the way to the kingdom of day,\nThere's an Eye watching you.","n":3}]},{"n":187,"t":"Past the curtain of time","k":"","s":[{"p":"v","t":"There's a curtain that\u2019s drawn between earth and Heaven,\nAnd just beyond lies a beautiful clime,\nWhere the evils of this life no longer can touch me,\nLord, let me look past the curtain of time.","n":1},{"p":"c","t":"Lord, let me look past the curtain of sorrows and fear,\nLet me view that sunny bright clime;\nIt would strength-en my faith and would banish all fear,\nLord, let me look past the curtain of time.","n":1},{"p":"v","t":"I'm helpless, alone, and I want to see Jesus,\nAnd hear the sweet harbour bells chime;\nWhere my friends and dear ones are waiting for me\nLord, let me look past the curtain of time.","n":2},{"p":"v","t":"I'm so homesick and blue, and I want to see Jesus,\nI would like to hear those sweet harbour bells chime;\nIt would brighten my path and would vanish all fear;\nLord, let me look past the curtain of time.","n":3}]},{"n":188,"t":"Honey in the rock","k":"F","s":[{"p":"v","t":"O my brother,\ndo you know the Saviour,\nWho is wondrous,\nkind and true?\nHe's the 'Rock of your salvation'\nThere's Honey in the Rock for you.","n":1},{"p":"c","t":"Oh, there's Honey in the rock, my brother,\nThere's Honey in the rock for you,\nLeave your sins for the blood to cover,\nThere's Honey in the rock for you.","n":1},{"p":"v","t":"Have you tasted that the Lord is gracious?\nDo you walk in the way that's new?\nHave you drank from the living Fountain?\nThere's Honey in the Rock for you.","n":2},{"p":"v","t":"Do you pray unto God the Father?\nWhat wilt thou have me to do?\nNever fear He will surely answer,\nThere's Honey in the Rock for you.","n":3},{"p":"v","t":"Then go out through the streets and byways,\nPreach the Word to the many or few;\nSay to every fallen brother,\nThere\u2019s Honey in the Rock for you.","n":4}]},{"n":189,"t":"The unveiled Christ","k":"Eb","s":[{"p":"v","t":"Once our blessed Christ of beauty,\nWas veiled off from human view,\nBut through suffering, death and sorrow,\nHe has rent the veil in two.","n":1},{"p":"c","t":"O behold the man of sorrows,\nO behold Him in plain view,\nLo! He is the mighty conqueror,\nSince He rent the veil in two.\nLo! He is the mighty conqueror,\nSince He rent the veil in two.","n":1},{"p":"v","t":"Yes, He is with God,\nThe Father,\nInterceding there for you;\nFor He is the mighty conqueror,\nSince He rent the veil in two.","n":2},{"p":"v","t":"Holy angels bow before Him,\nMen of earth give praises due,\nFor He is the well beloved,\nSince He rent the veil in two.","n":3},{"p":"v","t":"Throughout time and endless ages,\nHeights and depths of love so true,\nHe alone can be the giver,\nSince He rent the veil in two.","n":4}]},{"n":190,"t":"Jesus breaks every fetter","k":"Bb","s":[{"p":"v","t":"I am now on the altar,\nI am now on the altar,\nI am now on the altar,\nWhich was made for me.","n":1},{"p":"v","t":"Jesus breaks every fetter,\nJesus breaks every fetter,\nJesus breaks every fetter,\nAnd He sets me free.","n":2},{"p":"v","t":"I will never doubt my Saviour,\nI will never doubt my Saviour,\nI will never doubt my Saviour,\nFor He cleanses me.","n":3},{"p":"v","t":"I will rest on His promise,\nI will rest on His promise,\nI will rest on His promise,\nWhich is given to me.","n":4},{"p":"v","t":"On the other side of Jordan,\nIn the sweet fields of Eden,\nWhere the Tree of life is blooming\nThere is rest for me.","n":5},{"p":"v","t":"I will shout Hallelujah!\nI will shout Hallelujah!\nI will shout Hallelujah!\nFor He sets me free.","n":6},{"p":"v","t":"(I will ever, ever praise Him...)\n(I will give God the glory\u2026 )","n":7}]},{"n":191,"t":"Through the love of God","k":"G","s":[{"p":"v","t":"Through the Love of God our Saviour,\nAll will be well;\nFree and changeless is His favour,\nAll, All is well","n":1},{"p":"v","t":"Precious is the blood that healed us,\nPerfect is the grace that sealed us,\nStrong the hand stretched forth to shield us,\nAll will be well.","n":2},{"p":"v","t":"Though we pass through tribulation,\nAll must be well,\nOurs is such a free salvation,\nAll, All is well,","n":3},{"p":"v","t":"Happy still in God confiding,\nFruitful, if in Christ abiding,\nHoly, through the Spirit's guiding\nAll must be well.","n":4},{"p":"v","t":"We expect a bright tomorrow\nAll will be well;\nFaith can sing through days of sorrow\nAll, all is well,","n":5},{"p":"v","t":"On our Father's love relying,\nJesus every need supplying,\nOr in living or in dying,\nAll must be well.","n":6}]},{"n":192,"t":"I will praise him","k":"Eb","s":[{"p":"v","t":"When I saw the cleansing fountain\nO-pen wide for all my sin,\nI obeyed the Spirit's wooing,\nWhen He said,\n''Wilt thou be clean?\"","n":1},{"p":"c","t":"I will praise Him! I will praise Him!\nPraise the Lamb for sinners slain;\nGive Him Glory all ye people,\nFor His blood can wash away each stain.","n":1},{"p":"v","t":"Though the way seemed strait and narrow,\nAll I claimed was swept away;\nMy ambitions, plans and wishes,\nAt my feet in ashes lay.","n":2},{"p":"v","t":"Then God's fire upon the altar\nOf my heart was set aflame;\nI shall never cease to praise Him,\nGlory, glory to His name!","n":3},{"p":"v","t":"Blessed be the name of Jesus!\nI'm so glad He took me in,\nHe's forgiven my transgressions,\nHe has cleansed my heart from sin.","n":4}]},{"n":193,"t":"There's a great day coming","k":"Ab","s":[{"p":"v","t":"There's a great day coming, a great day coming,\nThere's a great day coming, by and by\nWhen the saints and the sinners shall be part-ed right and left.\nAre you read-y for that day to come?","n":1},{"p":"c","t":"Are you ready? Are you ready?\nAre you ready for the judgment day?\nAre you ready? Are you ready?\nFor the judgment day?","n":1},{"p":"v","t":"There's a bright day coming, a bright day coming\nThere's a bright day coming, by and by\nBut its brightness shall only come to them that love the Lord,\nAre you ready for the day to come?","n":2},{"p":"v","t":"There's a sad day coming, a sad day coming\nThere's a sad day coming, by and by\nWhen the sinner shall hear his doom, \"Depart, I Know ye not\"\nAre you ready for that day to come?","n":3}]},{"n":194,"t":"He's coming soon","k":"Ab","s":[{"p":"v","t":"In these, the closing days of time,\nWhat joy the glorious hope affords\nThat soon oh, wondrous truth sublime!\nHe shall reign, King of kings and Lord of lords.","n":1},{"p":"c","t":"He's coming soon,\nHe's coming soon,\nWith joy we welcome His returning;\nIt may be morn,\nIt may be night or noon,\nWe know He's coming soon.","n":1},{"p":"v","t":"The signs around, in earth and air,\nOr painted on the star-lit sky,\nGod's faithful witnesses declare\nThat the coming of the Saviour draweth nigh.","n":2},{"p":"v","t":"The dead in Christ,\nWho neath us lie,\nIn countless numbers,\nAll shall rise,\nWhen through the portals of the sky,\nHe shall come to pre-pare our Paradise.","n":3},{"p":"v","t":"And we who, living, yet remain,\nCaught up, shall meet our faithful, Lord,\nThis hope we cherish not in vain,\nBut we comfort one another by this Word.","n":4}]},{"n":195,"t":"What a friend","k":"F","s":[{"p":"v","t":"What a friend we have in Jesus,\nAll our sins and griefs to bear!\nWhat a privilege to carry\nEverything to God in prayer!\nO what peace we often forfeit,\nO what need-less pain we bear\nAll because we do not carry,\nEverything to God in prayer!","n":1},{"p":"v","t":"Have we trials and temptations!\nIs there trouble anywhere?\nWe should never be discouraged,\nTake it to the Lord in prayer,\nCan we find a friend so faithful,\nWho will all our sorrow share?\nJesus knows our every weakness\nTake it to the Lord in prayer.","n":2},{"p":"v","t":"Are we weak and heavy laden,\nCumbered with a load of care?\nPrecious Saviour, still our refuge,\nTake it to the Lord in prayer,\nDo thy friends despise, for-sake thee?\nTake it to the Lord in prayer,\nIn His arms He'll take and shield thee,\nThou wilt find a solace there.","n":3}]},{"n":196,"t":"I'm bound for the promised land","k":"Eb","s":[{"p":"v","t":"On Jordan's stormy banks I stand,\nAnd cast a wishful eye,\nTo Canaan's fair and happy land,\nWhere my possessions lie.","n":1},{"p":"c","t":"I am bound for the promised land,\nI am bound for the promised land,\nO who will come and go with me?\nI am bound for the promised land.","n":1},{"p":"v","t":"Over all those wide extended plains\nShines one eternal day;\nThere God, the Son, forever reigns,\nAnd scatters night away.","n":2},{"p":"v","t":"No chilling winds, nor pois-'nous breath\nCan reach that healthful shore;\nSick-ness and sorrow, pain and death,\nAre feared and felt no more.","n":3},{"p":"v","t":"When shall I reach that happy place,\nAnd be forever blest?\nWhen shall I see my Father's face,\nAnd in His bosom rest?","n":4}]},{"n":197,"t":"The great physician","k":"Eb","s":[{"p":"v","t":"The great Physician now is near,\nThe sympathizing Jesus,\nHe speaks the drooping heart to cheer,\nOh, hear the voice of Jesus.","n":1},{"p":"c","t":"Sweetest note in seraph song,\nSweetest name on mortal tongue,\nSweetest carol ever sung,\nJesus, blessed Jesus.","n":1},{"p":"v","t":"Your many sins are all forgiven,\nOh, hear the voice of Jesus,\nGo on your way in peace to heaven,\nAnd wear a crown with Jesus.","n":2},{"p":"v","t":"All glory to the dying Lamb!\nI now believe in Jesus;\nI love the blessed Saviour's name,\nI love the name of Jesus.","n":3},{"p":"v","t":"His name dispels my guilt and fear,\nNo other name but Jesus;\nO how my soul delights to hear,\nThe charming name of Jesus.","n":4},{"p":"v","t":"And when to that bright world above,\nWe rise to be with Jesus,\nWe'll sing around the throne of love,\nHis name, the name of Jesus.","n":5}]},{"n":198,"t":"I must tell Jesus","k":"Eb","s":[{"p":"v","t":"I must tell Jesus all of my trials;\nI cannot bear these burdens alone,\nIn my distress He kindly will help me,\nHe ever loves and cares for His own.","n":1},{"p":"c","t":"I must tell Jesus, I must tell Jesus,\nI cannot bear my burdens alone,\nI must tell Jesus, I must tell Jesus\nJesus can help me, Jesus alone.","n":1},{"p":"v","t":"I must tell Jesus all of my troubles,\nHe is a kind compassionate Friend\nIf I but ask Him, He will deliver,\nMake all my troubles quickly an end.","n":2},{"p":"v","t":"Tempted and tried I need a great Saviour,\nOne who can help my burdens to bear,\nI must tell Jesus, I must tell Jesus;\nHe all my cares and sorrows will share.","n":3},{"p":"v","t":"O how the world to evil allures me!\nO how my heart is tempted to sin!\nI must tell Jesus, and He will help me,\nOver the world the victory to win.","n":4}]},{"n":199,"t":"Nothing between","k":"G","s":[{"p":"v","t":"No-thing between my soul and the Saviour,\nNaught of this world's delusive dream;\nI have renounced all sinful pleasure,\nJesus is mine, there's no-thing between.","n":1},{"p":"c","t":"No-thing between my soul and the Saviour,\nSo that His blessed face may be seen;\nNo-thing preventing the least of His favour,\nKeep the way clear! Let nothing between.","n":1},{"p":"v","t":"Nothing between like worldly pleasure,\nHa-bits of life, though harmless they seem,\nMust not my heart from Him ever sever,\nHe is my all, there's nothing between.","n":2},{"p":"v","t":"Nothing between like pride or station;\nSelf or friends shall not intervene;\nThough it may cost me much tribulation,\nI am re-solved, there's nothing between.","n":3},{"p":"v","t":"No-thing between, e'en many hard trials,\nThough the whole world against me convene;\nWatching with prayer and much self-denial,\nI'll triumph at last, with nothing between.","n":4}]},{"n":200,"t":"What a day that will be","k":"Ab","s":[{"p":"v","t":"There is coming a day when no heartaches shall come,\nNo more clouds in the sky, no more tears to dim the eye,\nAll is peace forevermore on that happy golden shore,\nWhat a day, glorious day that will be.","n":1},{"p":"c","t":"What a day that will be when my Jesus I shall see.\nAnd I look upon His face, the one who saved me by His grace;\nWhen He takes me by the hand, and leads me \"through the Promised Land,\nWhat a day, glorious day that will be.","n":1},{"p":"v","t":"There'll be no sorrow there, no more burdens to bear,\nNo sickness, no pain, no more parting over there;\nAnd forever I will be with the One who died for me,\nWhat a day, glorious day that will be.","n":2}]},{"n":201,"t":"Near the cross","k":"F","s":[{"p":"v","t":"Jesus, keep me near the cross,\nThere a precious fountain,\nFree to all a healing stream,\nFlows from Calvary\u2019s mountain.","n":1},{"p":"c","t":"In the cross, In the cross,\nBe my glory ever,\nTill my raptured soul shall find\nRest beyond the river.","n":1},{"p":"v","t":"Near the cross, a trembling soul,\nLove and mercy found me;\nThere the Bright and Morning Star,\nSheds its beams around me.","n":2},{"p":"v","t":"Near the cross, O Lamb of God,\nBring its scenes before me,\nHelp me walk from day to day,\nWith its shadows o\u2019er me.","n":3},{"p":"v","t":"Near the cross, I\u2019ll watch and wait,\nHoping, trusting ever,\nTill I reach the golden strand,\nJust beyond the river.","n":4}]},{"n":202,"t":"Pass me not, o gentle Saviour","k":"Ab","s":[{"p":"v","t":"Pass me not, O gentle Saviour\nHear my humble cry;\nWhile on others Thou art calling,\nDo not pass me by.","n":1},{"p":"c","t":"Saviour, Saviour,\nHear my humble cry;\nWhile on others Thou art calling,\nDo not pass me by.","n":1},{"p":"v","t":"Let me at Thy throne of mercy\nFind a sweet relief;\nKneeling there in deep contrition,\nHelp my unbelief.","n":2},{"p":"v","t":"Trusting only in Thy merit,\nWould I seek Thy face,\nHeal my wounded, broken spirit,\nSave me by Thy grace.","n":3},{"p":"v","t":"Thou the Spring of all my comfort,\nMore than life to me,\nWhom have I on earth beside Thee?\nWhom in heaven but Thee?","n":4}]},{"n":203,"t":"I see a crimson stream","k":"Ab","s":[{"p":"v","t":"On Calv\u2019ry\u2019s hill of sorrow\nWhere sin\u2019s demands were paid\nAnd rays of hope for tomorrow\nAcross our path were laid.","n":1},{"p":"c","t":"I see a crimson stream of blood,\nIt flows from Calvary;\nits waves which reach the throne of God,\nAre sweeping over me.","n":1},{"p":"v","t":"Today no condemnation,\nAbides to turn away\nMy soul from His salvation\nHe\u2019s in my heart to stay.","n":2},{"p":"v","t":"When gloom and sadness whisper\nYou\u2019ve sinned, no use to pray\nI look away to Jesus\nAnd He tells me to say:","n":3},{"p":"v","t":"And when we reach the portal,\nWhere life forever reigns,\nThe ransomed hosts grand final\nWill be this glad refrain.","n":4}]},{"n":204,"t":"Come to the feast","k":"Bb","s":[{"p":"v","t":"\"All things are ready,\" come to the feast!\nCome, for the table now is spread;\nYe famishing, ye weary, come,\nAnd thou shall be richly fed.","n":1},{"p":"c","t":"Hear the invitation,\nCome, \"whosoever will,\"\nPraise God for full salvation\nFor \"whosoever will.\"","n":1},{"p":"v","t":"\"All things are ready,\" come to the feast!\nCome, for the door is open wide:\nA place of honour is re-served\nFor you at the Master's side.","n":2},{"p":"v","t":"\"All things are ready,\" come to the feast!\nCome, while He waits to welcome thee;\nDelay not while this day is thine,\nTomorrow may never be.","n":3},{"p":"v","t":"\"All things are ready, \"come to the feast!\nLeave every care and worldly strife;\nCome, feast upon the love of God,\nAnd drink everIasting life.","n":4}]},{"n":205,"t":"Lord, I'm coming home","k":"Ab","s":[{"p":"v","t":"I've wandered far away from God,\nNow I'm coming home;\nThe paths of sin too long I've trod,\nLord, I'm coming home.","n":1},{"p":"c","t":"Coming home, coming home,\nNevermore to roam;\nOpen wide Thy arms of love,\nLord, I'm coming home.","n":1},{"p":"v","t":"I've wasted many precious years,\nNow I'm coming home,\nI now repent with bitter tears,\nLord, I'm coming home.","n":2},{"p":"v","t":"I'm tired of sin and straying, Lord,\nNow I'm coming home,\nI'll trust Thy love, believe Thy Word,\nLord, I'm coming home.","n":3},{"p":"v","t":"My soul is sick, my heart is sore,\nNow I'm coming home,\nMy strength renew, my hope re-store,\nLord, I'm coming home.","n":4},{"p":"v","t":"My only hope, my only plea,\nNow I'm coming home,\nThat Jesus died, and died for me,\nLord, I'm coming home.","n":5},{"p":"v","t":"I need His cleansing blood, I know,\nNow I'm home,\nO wash me whiter than the snow;\nLord, I'm coming home.","n":6}]},{"n":206,"t":"The eastern gate","k":"Ab","s":[{"p":"v","t":"I will meet you in the morning,\nJust inside the Eastern Gate,\nThen be ready, faithful pilgrim.\nLest with you it be too late.","n":1},{"p":"c","t":"I will meet you, I will meet you,\nJust inside the Eastern Gate over there;\nI will meet you, I will meet you,\nI will meet you in the morning over there.","n":1},{"p":"v","t":"If you hast-en off to glory,\nLinger near the Eastern Gate,\nFor I'm coming in the morning,\nSo you'll not have long to wait.","n":2},{"p":"v","t":"Keep your lamps all trimmed and burning,\nFor the Bridegroom watch and wait,\nHe'll be with us at the meeting,\nJust in-side the Eastern Gate.","n":3},{"p":"v","t":"O the joys of that glad meeting,\nWith the saints who for us wait,\nWhat a blessed, happy meeting,\nJust in-side the Eastern Gate.","n":4}]},{"n":207,"t":"Jesus paid it all","k":"Eb","s":[{"p":"v","t":"I hear the Saviour say,\n\"Thy strength indeed is small,\nChild of weakness, watch and pray,\nFind in Me thine all in all\u201d.","n":1},{"p":"c","t":"Jesus paid it all,\nAll to Him l owe,\nSin had left a crimson stain;\nHe washed it white as snow.","n":1},{"p":"v","t":"Lord, now indeed I find\nThy pow'r and Thine alone,\nCan change the leper's spots,\nAnd melt the heart of stone.","n":2},{"p":"v","t":"And now complete in Him,\nMy robe His righteousness,\nI\u2019ll rejoice with all my might,\nI am now divinely blest.","n":3},{"p":"v","t":"And when before the throne,\nI stand in Him complete,\nJesus died my soul to save,\nMy lips shall still repeat.","n":4},{"p":"v","t":"For nothing good have I\nWhereby Thy grace to claim,\nI'll wash my garments white,\nIn the blood of Calvary's Lamb.","n":5}]},{"n":208,"t":"I believe God","k":"Bb","s":[{"p":"v","t":"I believe God! I believe God!\nIt shall be done, even as He said,\nTrust and obey, look up and say,\nI believe, I believe God.","n":1},{"p":"v","t":"I believe God, I believe God\nAsk what you will and it shall be done;\nTrust and obey, look up and say\nI believe, I believe God","n":2},{"p":"v","t":"And if you want salvation now\nAnd the Holy Ghost and power\nJust trust and obey, look up and say\nI believe, I believe God.","n":3}]},{"n":209,"t":"We'll work till Jesus comes","k":"Fb","s":[{"p":"v","t":"O land of rest, for thee I sigh!\nWhen will the moment come\nWhen I shall lay my armor by,\nAnd dwell in peace at home,","n":1},{"p":"c","t":"We'll work till Jesus comes,\nWe'll work till Jesus comes,\nWe'll work till Jesus comes,\nAnd we'll be gathered home!","n":1},{"p":"v","t":"To Jesus Christ I fled for rest;\nHe bade me cease to roam;\nAnd lean for succor on His breast;\nTill He conduct me home?","n":2},{"p":"v","t":"I sought at once my Saviour's side\nNo more steps shall roam;\nWith Him I'll brave death's chilling tide,\nAnd reach my heavenly home.","n":3},{"p":"v","t":"No tranquil joys on earth I know\nNo peaceful, sheltering dome;\nThis world\u2019s a wilderness of woe,\nThis world is not my home.","n":4}]},{"n":210,"t":"The windows of heaven","k":"Eb","s":[{"p":"v","t":"The windows of heaven are open,\nThe blessings are falling tonight,\nThere's joy, joy, joy, in my heart\nFor Jesus makes everything right;","n":1},{"p":"v","t":"I gave Him my old tattered garment,\nHe gave me a robe of pure white,\nI'm feasting today on the Manna,\nAnd that's why I'm happy tonight.","n":2}]},{"n":211,"t":"Precious memories","k":"Ab","s":[{"p":"v","t":"Precious memories, unseen angels,\nSent from somewhere to my soul;\nHow they linger, ever near me,\nAnd the sacred past untold.","n":1},{"p":"c","t":"Precious memories, how they linger,\nHow they ever flood my soul;\nIn the stillness of the midnight,\nPrecious, sacred scenes unfold.","n":1},{"p":"v","t":"Precious father, loving mother,\nFly across the lonely years;\nAnd old home scenes of my childhood,\nIn fond memory appear.","n":2},{"p":"v","t":"In the stillness of the midnight\nEchoes from the past I hear;\nOld-time singing, gladness bringing,\nFrom that lively land somewhere.","n":3},{"p":"v","t":"As I travel on life's pathway,\nKnow not what the years may hold;\nAs I ponder, hope grows fonder,\nPrecious memories flood my soul.","n":4},{"p":"v","t":"Precious memories of the prophet,\nFlood my soul from, day to day\nI remember scenes so precious\nThat can never pass away.","n":5},{"p":"v","t":"I've heard the message and Its signal\nThat day's end is near at hand,\nBut I remember that He promised\nHe'd return for those who'd stand.","n":6},{"p":"v","t":"Precious memories, glorious meetings,\nAcross this land from sea to sea\nWhere I heard the prophet's message,\nThat brought life and hope to me.","n":7},{"p":"v","t":"Precious memories in this storehouse\nWhere the Food was laid away,\nWe've returned to where he stored It,\nSpiritual Food against this day.","n":8}]},{"n":212,"t":"The end time","k":"","s":[{"p":"v","t":"I look and see earth's sorrowing picture,\nThe hoarding mobs for selfish gain;\nTheir toil of hand for ease find comfort,\nCan they not see their doom is sealed, it's all in vain.","n":1},{"p":"c","t":"The end is here, it's now at hand,\nThe Bride is gathering, the world is falling;\nIsrael's awakening; nations are breaking;\nOur prophet taught us, we believe the end is here.","n":1},{"p":"v","t":"Sirs, this is the time! our prophet spoke of,\nThe Angel came with a Shout,\nThe mountain shook at His voice cried out\n'Time is no more,' loud and clear the Shout went forth.","n":2},{"p":"v","t":"Have you considered the end-time Message?\nHave you considered Malachi 4?\nRevelation10:7 and St Luke 17\nProclaims this Message now, and then forevermore.","n":3}]},{"n":213,"t":"It is no secret","k":"C","s":[{"p":"v","t":"It is not secret, I believe the word\nMy eyes were opened,\nmy heart was stirred.\nI recognized Him the first I heard\nThe prophet brings us the SPOKEN WORD.","n":1},{"p":"c","t":"It is no secret what God can do;\nWhat He's done for others; He'll do for you\nWith arms wide open,\nHe'll pardon you,\nIt is no secret what God can do.","n":1},{"p":"v","t":"It is no secret where I have been;\nI met the prophet and he took me in.\nWith my heart wide open, the Light shone in\nIt is no secret, I follow him.","n":2},{"p":"v","t":"It is no secret of who he is,\nHe is a prophet, I'm convinced of this;\nThe seventh angel, a son of man,\nThe Elijah promised in God's great plan.","n":3}]},{"n":214,"t":"How great is our God!","k":"F","s":[{"p":"v","t":"When I consider the works of my\nGod,\nThe moon and the stars, the path that He trod,\nThe sheep and the oxen, the beast of the field,\nAll of these wonders make me know that He's real.","n":1},{"p":"c","t":"How great is our God! How great is His Word!\nHe's the greatest One that ever was heard,\nHe rolled back the waters of the mighty Red sea,\nAnd He said,\n\"I will lead you,\nPut your trust in Me.\"","n":1},{"p":"v","t":"He used our\nprophet,\nIn many a way,\nTo show forth His greatness in this our day,\nHe never changes; He's always the same,\nSo worship and praise Him and love His dear Name.","n":2},{"p":"v","t":"When I consider the works of my Lord,\nMiracles and wonders, he wrought in His days;\nThe lame walk, the blind see, the dead came to life\nAll of these wonders make me know that He is God.","n":3}]},{"n":215,"t":"So just be faithful","k":"Eb","s":[{"p":"v","t":"In these days of trials so near the end,\nWhen Christ from Glory doth now descend,\nMen's hearts are failing and filled with fear;\nWe know the end time is surely here.","n":1},{"p":"c","t":"So just be faithful, believe His Word\nStay with the Message that you have heard;\nListen to His prophet, his Message heed;\nWalk in the Light where His star doth lead.","n":1},{"p":"v","t":"In every church age a star did share,\nTo help God\u2019s people a Truth to find;\nIn this last church age a star shines bright,\nSe friend receive it, walk in the Light.","n":2},{"p":"v","t":"Do not be fearful or filled with dread,\nYour prophet sleepeth, he is not dead;\nThe Bride is waiting now for that Voice,\nAnd in this hope we can now rejoice.","n":3},{"p":"v","t":"His Word of promise He gave the Bride.\nFrom his White Charger the prophet cried,\n\"Yet one more time shall I ride this trail\u201d\nTHUS SAITH THE LORD can never fail.","n":4}]},{"n":216,"t":"Blest be the tie that binds","k":"F","s":[{"p":"v","t":"Blest be the tie that binds,\nOur hearts in Christian love;\nThe fellowship of kindred minds,\nIs like to that above.","n":1},{"p":"v","t":"Before our Father\u2019s throne.\nWe pour our ardent prayers.\nOur fears, our hopes,\nour aims are one,\nOur comforts and our cares.","n":2},{"p":"v","t":"We share our mutual woes,\nOur mutual burdens bear;\nAnd often for each other flows,\nThe sympathizing tear.","n":3},{"p":"v","t":"When we asunder part,\nIt gives us inward pain;\nBut we shall still be joined in heart,\nAnd hope to meet again.","n":4}]},{"n":217,"t":"God be with you","k":"C","s":[{"p":"v","t":"God be with you till we meet again!\nBy His counsels guide uphold you,\nWith His sheep secureIy fold you;\nGod be with you till we meet again.","n":1},{"p":"c","t":"Till we meet, till we meet,\nTill we meet at Jesus' feet!\nTill we meet, till we meet,\nGod be with you till we meet again!","n":1},{"p":"v","t":"God be with you till we meet again!\n'Neath His wings securely hide you,\nDaily manna still provide you;\nGod be with you till we meet again!","n":2},{"p":"v","t":"God be with you till we meet again!\nWhen life's perils thick confound you,\nPut His arms unfailing round you;\nGod be with you till we meet again!","n":3},{"p":"v","t":"God be with you till we meet again!\nKeep love's banner floating o'er you,\nSmite death's threatening wave before you;\nGod be with you till we meet again!","n":4}]},{"n":218,"t":"Take the name of Jesus","k":"G","s":[{"p":"v","t":"Take the name of Jesus with you,\nChild of sorrow and of woe;\nIt will joy and comfort give you,\nTake it, wherever you go.","n":1},{"p":"c","t":"Precious name, O how sweet!\nHope of earth and joy of Heaven,\nPrecious name, O how sweet!\nHope of earth and joy of Heaven.","n":1},{"p":"v","t":"Take the name of Jesus ever,\nAs a shield from every snare;\nIf temptations round you gather,\nBreathe that holy name in prayer.","n":2},{"p":"v","t":"O the precious name of Jesus!\nHow it thrills our souls with joy,\nWhen His loving arms receive us,\nAnd His songs our tongues employ!","n":3},{"p":"v","t":"At the name of Jesus bowing,\nFalling prostrate at His feet,\nKing of kings in Heav\u2019n we'll crown Him,\nWhen our Journey is complete.","n":4}]},{"n":219,"t":"Break thou the bread","k":"Eb","s":[{"p":"v","t":"Break Thou the bread of life,\nDear Lord, to me,\nAs Thou didst break the loaves\nBe-side the sea,","n":1},{"p":"v","t":"Beyond the sacred page\nI seek Thee, Lord;\nMy spirit pants for Thee,\nO living Word!","n":2},{"p":"v","t":"Break Thou the bread of life,\nO Lord, to me,\nThat hid within my heart\nThy Word may be;","n":3},{"p":"v","t":"Mould Thou each inward thought,\nFrom self set free,\nAnd let my steps be all\nControlled by Thee.","n":4},{"p":"v","t":"Open Thy Word of Truth,\nThat I may see\nThy message written clear\nAnd plain for me;","n":5},{"p":"v","t":"Then in sweet fellowship\nWalking with Thee,\nThine image on my life,\nEngraved will be.","n":6},{"p":"v","t":"Bless Thou the truth, dear Lord,\nTo me, to me,\nAs Thou didst bless the bread\nBy Galilee;","n":7},{"p":"v","t":"Then shall all bondage cease,\nAll fetters fall:\nAnd I shall find my peace\nIn you all the way.","n":8}]},{"n":220,"t":"O God of Bethel","k":"C","s":[{"p":"v","t":"O God of Bethel, by whose hand\nThy people still are fed,\nWho through this weary pilgrimage\nHast all our fathers led.","n":1},{"p":"v","t":"Our vows, our prayers we now present\nBefore Thy throne of grace;\nGod of our fathers! be the God\nOf their succeeding race.","n":2},{"p":"v","t":"Through each perplexing path of life,\nOur wandering footsteps guide;\nGive us each day our daily bread,\nAnd raiment fit provide.","n":3},{"p":"v","t":"O spread Thy covering wings around,\nTill all our wanderings cease,\nAnd at our Father's loved abode,\nOur souls arrive in peace.","n":4},{"p":"v","t":"Such blessings from Thy gracious hand\nOur humble pray'rs implore;\nAnd Thou shalt be our chosen God,\nAnd portion evermore.","n":5}]},{"n":221,"t":"Revive us again","k":"G","s":[{"p":"v","t":"We praise Thee O God for the Son of Thy love;\nFor Jesus, Who died and is now gone above.","n":1},{"p":"c","t":"Hallelujah! Thine the glory!\nHallelujah Amen!\nHallelujah! Thine the glory!\nRevive us again.","n":1},{"p":"v","t":"We praise Thee, O God, for Thy Spirit of light.\nWho has shown us our Saviour, and scattered our night.","n":2},{"p":"v","t":"All glory and praise to the Lamb that was slain.\nWho has borne all our sins, and has cleansed every stain.","n":3},{"p":"v","t":"All glory and praise to the God of all grace,\nWho has sought us, and bought us, and guided our Way.","n":4},{"p":"v","t":"Revive us again;\nFill each heart with Thy love;\nMay each soul be rekindled with fire from above.","n":5}]},{"n":222,"t":"The church has one foundation","k":"Eb","s":[{"p":"v","t":"The Church has one foundation;\nIs Jesus Christ her Lord,\nShe is His new creation,\nBy water and the Word,","n":1},{"p":"v","t":"From heav\u2019n He came and sought her\nTo be His holy bride;\nWith His own blood He bought her,\nAnd for her life He died.","n":2},{"p":"v","t":"Elect from every nation,\nYet one o\u2019er all the earth,\nHer charter of salvation,\nOne Lord, one faith, one birth,","n":3},{"p":"v","t":"One holy name she blesses,\nPartakes one holy food,\nAnd to one hope she presses,\nWith every grace endued.","n":4},{"p":"v","t":"Though with a scornful wonder\nMen see her sore oppressed,\nBy schisms rent asunder,\nBy heresies distressed,","n":5},{"p":"v","t":"Yet saints their watch are keeping,\nTheir cry goes up, \u201cHow long?\u201d\nAnd soon the night of weeping\nShall be the morn of song.","n":6},{"p":"v","t":"Mid toil and tribulation,\nAnd tumult of her\nwar,\nShe waits the consummation\nOf peace for evermore.","n":7},{"p":"v","t":"Till with the vision glorious\nHer longing eyes are blest,\nAnd the great Church victorious\nShall be the Church at rest.","n":8},{"p":"v","t":"Yet she on earth hath union\nWith God the only One,\nAnd mystic sweet communion\nWith those whose rest is won,","n":9},{"p":"v","t":"O happy ones and holy!\nLord, give us grace that we,\nLike them, the meek and lowly,\nOn high may dwell with Thee.","n":10}]},{"n":223,"t":"Revive thy work","k":"G","s":[{"p":"v","t":"Revive Thy work, O Lord!\nThy mighty arm make bare,\nSpeak with the voice that wakes the dead,\nAnd make Thy people hear!","n":1},{"p":"c","t":"Revive Thy work, O Lord!\nWhile here to Thee we bow;\nDescend, O gra-cious Lord. descend\nOh, come and bless us now!","n":1},{"p":"v","t":"Re-vive Thy work, O Lord!\nDisturb this sleep of death;\nQuicken the smoldering embers now\nBy Thine AImighty breath.","n":2},{"p":"v","t":"Re-vive Thy work, O Lord!\nCreate soul-thirst for Thee;\nAnd hungering for the Bread of life,\nOh, may our spirits be!","n":3},{"p":"v","t":"Re-vive Thy work, O Lord!\nExalt Thy precious name;\nAnd by the Holy Ghost, our love\nFor Thee and Thine inflame.","n":4}]},{"n":224,"t":"Holy Bible book divine","k":"F","s":[{"p":"v","t":"Holy Bible book divine\nPrecious treasure thou art mine,\nMine to tell me whence I came,\nMine to teach me what I am.","n":1},{"p":"c","t":"Mine,... Mine,... book divine\nPrecious treasure, thou art mine;\nO thou holy book divine,\nPrecious treasure, thou art mine!","n":1},{"p":"v","t":"Mine to chide me when I rove;\nMine to show a Saviour's love\nMine art thou to guide and guard,\nMine to punish or reward.","n":2},{"p":"v","t":"Mine to comfort in distress;\nSuffering in this Wilderness;\nMine, to show by living faith\nMan can triumph over death.","n":3},{"p":"v","t":"Mine to tell of joys to come\nAnd the rebel sinner's doom;\nO thou holy Bible, Book Divine\nPrecious pleasure, thou art mine.","n":4}]},{"n":225,"t":"What a wonderful Saviour","k":"","s":[{"p":"v","t":"CHRIST has for sin atonement made,\nWhat a wonderful Saviour!\nWe are redeemed! the price is paid;\nWhat a wonderful Saviour!","n":1},{"p":"c","t":"What a wonderful Saviour is Jesus, my Jesus!\nWhat a wonderful Saviour is Jesus, my Lord.","n":1},{"p":"v","t":"I praise Him for the cleansing blood,\nWhat wonderful Saviour!\nThat reconciled my soul to God,\nWhat a wonderful Saviour!","n":2},{"p":"v","t":"He dwells within me day by day,\nWhat a wonderful Saviour!\nAnd keeps me faithful all the way,\nWhat a wonderful Saviour!","n":3},{"p":"v","t":"He gives me overcoming pow'r,\nWhat a wonderful Saviour!\nAnd triumph in each conflict hour,\nWhat a wonderful Saviour!","n":4},{"p":"v","t":"To Him I've given all my heart,\nWhat a wonderful Saviour!\nThe world shall never share a part,\nWhat a wonderful Saviour!","n":5}]},{"n":226,"t":"Redemption oh, wonderful story","k":"C","s":[{"p":"v","t":"Redemption oh, wonderful story,\nGlad message for You and for me,\nThat Jesus has purchased our pardon,\nAnd paid all the debt on the tree.","n":1},{"p":"c","t":"Believe it, O sinner believe it,\nReceive the glad message it\u2019s true;\nTrust now in the crucified Saviour\nSalvation He offers to you.","n":1},{"p":"v","t":"From death unto life He hath brought us,\nAnd make us by grace sons of God,\nAs fountain is opened for sinners,\nOh, wash and be cleansed in the blood.","n":2},{"p":"v","t":"No longer shall sin have dominion,\nThough present to tempt and annoy;\nFor Christ is His blessed redemption,\nThe power of sin shall destroy.","n":3},{"p":"v","t":"Accept now God's offer and mercy,\nTo Jesus, oh hasten today;\nFor He will receive him that cometh,\nAnd never will turn him away.","n":4}]},{"n":227,"t":"No, not one!","k":"F","s":[{"p":"v","t":"There's not a Friend like the lowly Jesus,\nNo, not one! No, not one!\nNone else can heal all our soul's diseases,\nNo, not one! No, not one!","n":1},{"p":"c","t":"Jesus knows all about our struggles\nHe will guide till the day is done,\nThere's not a friend like the lowly Jesus,\nNo, not one! No, not one!","n":1},{"p":"v","t":"No friend like Him is so high and holy,\nNo, not one! No, not one!\nAnd yet no friend is so meek and lowly,\nNo, not one! No, not one!","n":2},{"p":"v","t":"There's not an hour that He is not near us,\nNo, not one! No, not one!\nNo night so dark but His love can cheer us,\nNo, not one! No, not one!","n":3},{"p":"v","t":"Did ever saint find this Friend forsake him?\nNo, not one! No, not one!\nOr, sinner find that He would not take him?\nNo, not one! No, not one!","n":4},{"p":"v","t":"Was ever gift like the Saviour given?\nNo, not one! No, not one!\nWill He re-fuse us a home in heaven?\nNo, not one! No, not one!","n":5}]},{"n":228,"t":"Ye must be born again","k":"Eb","s":[{"p":"v","t":"A ruler once came to Jesus by night,\nTo ask Him the way of salvation and light;\nThe Master made answer in words true and plain,\n\u201cYe must be born again\u201d.","n":1},{"p":"c","t":"\u201cYe must be born again!\nYe must be born again!\nI verily, verily say unto you\nYe must be born again!\u201d","n":1},{"p":"v","t":"Ye children of men, attend to the word\nSo solemnly uttered by Jesus, the Lord,\nAnd let not this message to you be in vain,\n\u201cYe must be born again.\u201d","n":2},{"p":"v","t":"O ye who would enter the glorious rest,\nAnd sing with the ransomed the song of the blest;\nThe life everlasting if ye would obtain,\n\u201cYe must be born again.\u201d","n":3},{"p":"v","t":"A dear one in heaven thy heart yearns to see,\nAt the beautiful gates may be watching for thee;\nThen list\u2019n to the note of this solemn refrain,\n\u201cYe must be born again.\u201d","n":4}]},{"n":229,"t":"Sinful, sighing to be blest","k":"C","s":[{"p":"v","t":"Sinful, sighing to be blest;\nBound and longing to be free\nWeary waiting for my rest\nGod be merciful to me.","n":1},{"p":"v","t":"Goodness I have none to plead,\nSinfulness in all I see,\nI can only bring my need;\nGod be merciful to me.","n":2},{"p":"v","t":"Broken heart and downcast eyes,\nDare not lift themselves to Thee;\nYet Thou canst interpret sighs\nGod be merciful to me.","n":3},{"p":"v","t":"From this sinful heart of mine\nTo thy bosom I would flee\nI am not my own but Thine\nGod be merciful to me.","n":4},{"p":"v","t":"There is one beside the Throne\nAnd my only hope and plea\nAre in Him and Him alone;\nGod be merciful to me.","n":5},{"p":"v","t":"He my cause will undertake,\nMy Interpreter will be;\nHe's my all and for His sake:\nGod be merciful to me.","n":6}]},{"n":230,"t":"Today the Saviour calls","k":"Eb","s":[{"p":"v","t":"To-day the Saviour calls,\nYe wanderers come;\nO ye benighted souls,\nWhy longer roam?","n":1},{"p":"v","t":"Today the Saviour calls,\nO hear Him now;\nBefore your day is gone,\nTo Jesus bow.","n":2},{"p":"v","t":"To-day the Saviour calls;\nFor refuge fly;\nThe storm of vengeance falls;\nRuin is nigh","n":3},{"p":"v","t":"The Spirit calls today;\nYield to His power,\nO grieve Him not away;\n\u2018Tis mercy's hour.","n":4}]},{"n":231,"t":"Art thou weary?","k":"G","s":[{"p":"v","t":"Art thou weary,\nArt thou languid,\nArt thou sore distressed?\n\"Come to Me, \u201csaith One\u201d and coming,\nBe at rest.\"","n":1},{"p":"v","t":"Hath He marks to lead me to Him\nIf He be my Guide?\nIn His feet and hands are wound prints\nAnd His side.","n":2},{"p":"v","t":"Hath He diadem as monarch,\nThat His brow adorns?\nYes, a crown in very surety,\nBut of thorns.","n":3},{"p":"v","t":"If I find Him, If I follow\nWhat shall be my gain?\nMany a sorrow, many a labour.\nMany a tears.","n":4},{"p":"v","t":"If I still hold closely to Him\nWhat hath He at last?\nSorrow vanquished, labour ended,\nJordan passed.","n":5},{"p":"v","t":"If I ask Him to receive me,\nWill He say me nay?\nNot till earth, and not till heaven,\nPass away.","n":6},{"p":"v","t":"Finding, following, keeping, struggling,\nIs He sure to bless?\nAngels, martyrs, saints, and prophets\nAnswer, \"Yes!\"","n":7}]},{"n":232,"t":"Let us with a gladsome mind","k":"C","s":[{"p":"v","t":"Let us with a gladsome mind\nPraise the Lord for He is kind;\nFor His mercies aye endure\nEver faithful, ever sure.","n":1},{"p":"v","t":"Let us blaze His name abroad,\nFor of gods He is the God;\nFor His mercies aye endure\nEver faithful, ever sure.","n":2},{"p":"v","t":"He with all commanding might?\nFilled the new made world with light;\nFor His mercies aye endure\nEver faithful, ever sure.","n":3},{"p":"v","t":"Caused the golden-treasured sun,\nAll day long made-world with light;\nFor His mercies aye endure\nEver faithful, ever sure.","n":4},{"p":"v","t":"And the moon to shine by night\nMade her spangled sisters bright;\nFor His mercies aye endure\nEver faithful, ever sure.","n":5},{"p":"v","t":"All things living He doth feed;\nHis full hand supplies their need;\nFor His mercies aye endure\nEver faithful, ever sure.","n":6},{"p":"v","t":"Let us, therefore warble forth\nHis great majesty and worth;\nFor His mercies aye endure\nEver faithful, ever sure.","n":7},{"p":"v","t":"Who is mansion hath on high\nPassing reach of mortal eye;\nFor His mercies aye endure\nEver faithful, ever sure.","n":8}]},{"n":233,"t":"The Spirit says come","k":"","s":[{"p":"v","t":"A glorious invitation\nNow calls you to the feast;\nEach soul is now invited,\nThe greatest and the least,\nCome, all ye heavy burdened,\nWith sorrow or with care\nToday you are invited,\nYour burden Christ will bear.","n":1},{"p":"c","t":"The Spirit says come,\nThe Bride says come;\nLet him that heareth say, come!\nLet him that thirst-eth come,\nAnd whosoever will, let him take of the water of life freely.","n":1},{"p":"v","t":"That blessed invitation,\nOh, hear today and heed!\nThe Spirit now is calling,\nWhy longer dwell in need?\nThy soul today is fainting\nFor Christ, the living Bread,\nAccept the invitation,\nCome while the feast is spread.","n":2},{"p":"v","t":"Re-peat the invitation!\nPass on the blessed news;\nLet none for-sake His mercy,\nOr pardon now refuse\n\u2018Tis Jesus that is calling\nAll things are read-y, come\nThe Spirit will direct you,\nThe Bride will welcome home.","n":3}]},{"n":234,"t":"In times like this","k":"C","s":[{"p":"v","t":"In times like this\nYou need a Saviour\nIn times like this\nYou need an anchor\nBe very sure, be very sure\nYour anchor holds\nAnd grips the solid rock.","n":1},{"p":"c","t":"This rock is Jesus, Yes He's the one\nThis rock is Jesus, The only one\nBe very sure, be very sure\nYour anchor holds\nAnd grips the solid rock.","n":1},{"p":"v","t":"In times like this\nYou need the Bible\nIn times like this\nOh be not idle,\nBe very sure, be very sure\nYour anchor holds\nAnd grips the solid rock.","n":2},{"p":"v","t":"In times like this\nI have a Saviour\nIn times like this\nI have an anchor\nI'm very sure, I'm very sure\nMy anchor holds\nAnd grips the solid rock.","n":3}]},{"n":235,"t":"No one like my Saviour","k":"A","s":[{"p":"v","t":"There's no one like my Saviour,\nNo friend can be like Him;\nMy never failing sunshine\nWhen earthly lights grow dim;\nWhen summer flowers are blooming,\nThe brightness of my joy,\nOh, may His happy service\nMy heart and life employ!","n":1},{"p":"c","t":"No one, no one like my precious Saviour,\nNo one, no one such a friend can be:\nNo one, no one like my precious Saviour,\nGlory! Glory! Jesus cares for me.","n":1},{"p":"v","t":"There's no one like my Saviour;\nIn seasons of distress,\nHe draws me closer to Him;\nTo comfort and to bless;\nHe gives me, in temptation,\nThe strength of His right arm;\nHis angels camp around me,\nTo keep me from all harm.","n":2},{"p":"v","t":"There's no one like my Saviour;\nHe par-dons all my sin,\nAnd give His Holy Spirit!\nA springing well within;\nHe leads me out to service\nWith gentle touch and mild;\nO wonder of all wonders\nThat I should be His child!","n":3},{"p":"v","t":"There's no one like my Saviour,\nCome now, and find it true,\nHe gave his life a ransom,\nHis blood was shed for you;\nThen, when we reach the city\nOf everlasting light,\nWe'll sing with saints and angels,\nAll honour, power, and might.","n":4}]},{"n":236,"t":"Out of Christ","k":"D","s":[{"p":"v","t":"Out of Christ, without a Saviour,\nOh! can it, can it be?\nLike a ship without a rudder,\nOn a wild and stormy sea!","n":1},{"p":"c","t":"Oh, to be with-out a Saviour,\nWith no hope nor refuge nigh!\nCan it be, O bless-ed Saviour?,\nOne without Thee dares to die.","n":1},{"p":"v","t":"Out of Christ, without a Saviour,\nLonely and dark the way;\nWith no light, no hope in Jesus,\nMaking bright the cheerless day.","n":2},{"p":"v","t":"Out of Christ, with-out a Saviour,\nNo help nor refuge nigh;\nHow can you, my friend and brother,\nDare to live, or dare to die?","n":3},{"p":"v","t":"Out of Christ, without a Saviour\nDark will the voyage be;\nClouds will gather, storms surround you,\nOh to Christ for refuge flee!","n":4},{"p":"v","t":"Out of Christ, without a Saviour,\nGive to Him, now your heart,\nEre the door of mercy closes,\nAnd you hear His word, \"depart\".\nOh, to be with-out a Saviour,\nWith no hope nor refuge nigh!\nCan it be, O blessed Saviour?,\nOne without Thee dares to die.","n":5}]},{"n":237,"t":"Into your heart","k":"A","s":[{"p":"v","t":"If you are tired of the load of your sin,\nLet Jesus come in-to your heart;\nIf you de-sire a new life to begin,\nLet Jesus come into your heart.","n":1},{"p":"c","t":"Just now, your doubting give o'er;\nJust now, reject Him no more;\nJust now, throw open the door;\nLet Jesus come into your heart.","n":1},{"p":"v","t":"If 'tis for purity now that you sigh,\nLet Jesus come into your heart;\nFountains for cleansing are flowing near by,\nLet Jesus come into your heart;","n":2},{"p":"v","t":"If there's a tempest your voice cannot still\nLet Jesus come in-to your heart;\nIf there\u2019s a void this world never can fill\nLet Jesus come into your heart.","n":3},{"p":"v","t":"If friends, once trusted, have proven untrue,\nLet Jesus come into your heart;\nFind what a friend He will be unto you,\nLet Jesus come into your heart.","n":4},{"p":"v","t":"If you would join the glad songs of the blest,\nLet Jesus come into your heart;\nIf you would enter the mansions of rest,\nLet Jesus come into your heart.","n":5}]},{"n":238,"t":"A few more years","k":"","s":[{"p":"v","t":"A few more years shall roll,\nA few more seasons come,\nAnd we shall be with those that rest\nA-sleep within the tomb.","n":1},{"p":"c","t":"Then oh, my Lord, prepare\nMy soul for that great day;\nOh, wash me in Thy precious blood,\nAnd take my sins away.","n":1},{"p":"v","t":"A few more suns shall set\nO'er these dark hills of time,\nAnd we shall be where suns are not,\nA far serener clime.","n":2},{"p":"v","t":"A few more storms shall beat\nOn this wild rocky shore,\nAnd we shall be where tempests cease,\nAnd surges swell no more.","n":3}]},{"n":239,"t":"Thy welcome voice","k":"Eb","s":[{"p":"v","t":"I hear Thy welcome voice,\nThat calls me Lord to Thee,\nFor cleansing in Thy precious blood,\nThat flowed on Calvary.","n":1},{"p":"c","t":"I am coming Lord,\nComing now to Thee,\nTrusting only in Thy blood,\nThat flowed on Calvary.","n":1},{"p":"v","t":"Though coming weak and vile,\nThou dost my strength assure,\nThou dost my vileness fully cleansed,\nTill spotless all and pure.","n":2},{"p":"v","t":"All hail, atoning blood!\nAll hail, redeeming grace!\nAll hail, the gift of Christ our Lord,\nOur strength and righteousness!","n":3}]},{"n":240,"t":"Even me","k":"G","s":[{"p":"v","n":1,"t":"Lord, I hear of showers of blessing,\nThou art scattering full and free;\nShow'rs the thirsty land refreshing;\nLet some droppings fall on me."},{"p":"c","n":1,"t":"Even me, even me,\nLet some droppings fall on me."},{"p":"v","n":2,"t":"Pass me not, O God, my Father!\nSinful though my heart may be;\nThou might'st leave me, but the rather\nLet Thy mercy light on me."},{"p":"v","n":3,"t":"Pass me not, O mighty Spirit,\nThou canst make the blind to see;\nWitnesser of Jesus' merit,\nSpeak the word of power to me."},{"p":"v","n":4,"t":"Love of God, so pure and changeless,\nBlood of Christ, so rich and free,\nGrace of God, so rich and boundless,\nMagnify it all in me."},{"p":"v","n":5,"t":"Pass me not, Thy lost one bringing;\nBind my heart, O Lord, to Thee;\nWhilst the streams of life are springing,\nBlessing others, oh, bless me!"}]},{"n":241,"t":"Thou art standing","k":"F","s":[{"p":"v","t":"O Jesus, Thou art standing\nOut-side the fast closed door,\nIn lowly patience waiting\nTo pass the threshold o'er.","n":1},{"p":"v","t":"O Jesus, Thou art knocking;\nAnd, lo! that hand is scarred,\nAnd thorns Thy brow encircle,\nAnd tears Thy face have marred!","n":2},{"p":"v","t":"O love that passeth knowledge!\nSo patiently to wait!\nO, sin that hath no equal!\nSo fast to bar gate.","n":3},{"p":"v","t":"0 Jesus, Thou art pleading\nIn ac-cents meek and low,\n'I died for you, My children,\nAnd will you treat Me so?'","n":4},{"p":"v","t":"O Lord with shame and sorrow,\nWe open now the door;\nDear Sa-viour, enter, enter!\nAnd leave us nevermore.","n":5}]},{"n":242,"t":"My sins on Jesus","k":"Eb","s":[{"p":"v","t":"I lay my sins on Jesus,\nThe spotless Lamb of God;\nHe bears them all, and frees us\nFrom the accursed load\nI bring my guilt to Jesus,\nTo wash my crimson stains\nWhite in His blood most precious\nTill not a spot remains.","n":1},{"p":"v","t":"I lay my wants on Jesus\nAll fullness dwells in Him;\nHe heals all my diseases,\nHe doth my soul redeem\nI lay my grieves on Jesus,\nMy burden and my cares;\nHe from them all releases,\nHe all my sorrows shares.","n":2},{"p":"v","t":"I rest my soul on Jesus\nThis weary soul of mine:\nHis right hand me embraces,\nI on His breast recline.\nI love the name of Jesus\nImmanuel, Christ, the Lord;\nLike fragrance on the breezes\nHis name abroad is poured.","n":3},{"p":"v","t":"I long to be like Jesus,\nMeek, loving, lowly, mild;\nI long to be like Jesus,\nThe Father's holy Child;\nI long to be with Jesus,\nA mid the heavenly throng,\nTo sing with saints. His praises,\nTo learn the angel's song.","n":4}]},{"n":243,"t":"Save me at the cross","k":"A","s":[{"p":"v","t":"Loving Saviour, hear my cry,\nHear my cry, hear my cry;\nTrembling to Thy arms I fly;\nO, save me at the Cross,\nI have sinned, but Thou hast died,\nThou hast died, Thou hast died,\nIn Thy mercy let me hide,\nO, save me at the Cross.","n":1},{"p":"c","t":"Lord Jesus, receive me,\nNo more would I grieve Thee\nNow, blessed Redeemer,\nO, save me at the Cross!","n":1},{"p":"v","t":"T
