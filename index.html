\nwalking up the kings highway(repeat)","n":2},{"p":"v","t":"If you are not walking,\nStart while I\u2019m talking,\nWalking up the King\u2019s highway,\nThere will be a blessing","n":3},{"p":"v","t":"You will be confessing,\nWalking up the King\u2019s highway","n":4},{"p":"v","t":"It\u2019s a highway to heaven\nNone can walk up there\nBut the pure in heart\nIt\u2019s a highway to heaven\nWalking up the King\u2019s highway","n":5},{"p":"v","t":"We will understand it better by and by\nI tell you by and by when the morning comes\nAll the saints of God are gathered home\nWe will tell the story(3ce)","n":6},{"p":"v","t":"When we all get to heaven\nWhat a day of rejoicing that will be,\nWhen we all see Jesus we\u2019ll sing and shout the victory.","n":7}]},{"n":611,"t":"Here I am","k":"","s":[{"p":"v","t":"HERE I AM\nO LORD 4X\nFATHER I HAVE COME TO DO YOUR WILL 2X","n":1}]},{"n":612,"t":"He\u2019ll understand and say well done","k":"","s":[{"p":"v","t":"If where you give the best of your service,\nTelling the world that the Savior has come,\nbe not dismayed when men don\u2019t believe you;\nHe\u2019ll understand and say \u201cwell done\u201d.","n":1},{"p":"c","t":"O when I come to the end of my journey,\nweary of life, and battle is won,\nCarrying the staff and the cross of redemption,\nHe\u2019ll understand and say \u201cwell done\u201d.","n":1},{"p":"v","t":"Misunderstood, the Savior of sinners,\nHanged to the cross,\nHe was God\u2019s only Son;\noh! Hear Him call His Father in heaven:\n\u201cLet not my will, but Thine be well done\u201d.","n":2},{"p":"v","t":"When the short life of labor has ended,\nComes the reward for the race you have run,\nSweet is the rest prepared for the faithful,\nHe\u2019ll understand and say \u201cwell done\u201d.","n":3},{"p":"v","t":"But if you try and fail in the trying,\nHands sore and scared from the work you\u2019ve begun;\nTake up your cross, run quickly to meet Him,\nHe\u2019ll understand and say \u201cwell done\u201d.","n":4}]},{"n":613,"t":"He\u2019s God","k":"","s":[{"p":"v","t":"When I come into His presence\nI humble myself,\nlift up both my hands,\nand I began to worship Him,\nI worship Him.\n(repeat)\n1.","n":1},{"p":"v","t":"For all He's done for me,\nredeemed and set me free,\nand because, just because He's God.","n":2},{"p":"v","t":"When I come into His presence\nI humble myself,\nremembering what He's done,\nthe victories He's won,\nso I'll praise Him,\nI'll praise Him.\n(repeat)\n2.","n":3},{"p":"v","t":"God, God, my God.\nGod, God, my God.\nBridge:","n":4},{"p":"v","t":"He's God.\nVamp:","n":5}]},{"n":614,"t":"He\u2019s able","k":"","s":[{"p":"v","t":"Exceedingly, abundantly,\nAbove all, all you could ask or think,\nAccording to the power,\nthat worketh in you, you\u2026","n":1},{"p":"c","t":"God is able to do just what He said He would do,\nHe\u2019s going to fulfill every promises to you,","n":1},{"p":"v","n":2,"t":"Don't give up on God,\n'Cause He won't give up on you,\nHe's able."}]},{"n":615,"t":"Hide thou me","k":"","s":[{"p":"v","t":"Sometimes I feel discouraged and think my life in vain,\nI\u2019m tempted then to murmur and of my lot complain,","n":1},{"p":"v","t":"But when I think of Jesus and all He\u2019s done for me,\nThen I cry, O Rock of Ages,\nHide Thou me.","n":2},{"p":"v","t":"Sometimes it seems I dare not go one step further on,\nAnd from my heart all courage has disappeared and gone,","n":3},{"p":"v","t":"But I remember Jesus and all His love for me,\nThen I cry, O Rock of Ages,\nHide Thou me.","n":4},{"p":"v","t":"O what a Friend is Jesus,\nSure Anchor for my soul,\nSo tender, true, and gracious,\nI\u2019m safe in His control,","n":5},{"p":"v","t":"My help in time of danger my strong defense is He,\nO Thou blessed Rock of Ages,\nHide Thou me.","n":6}]},{"n":616,"t":"Highest praise","k":"","s":[{"p":"v","t":"Oh most, Holy God\nJesus we adore You\nWe lift up our hands\nAnd with our voice\nWe give You the highest praise.","n":1},{"p":"v","t":"Wonderful Counsellor\nJesus, we love You\nSinging song of praise\nWith joy in our hearts\nWe give You the highest praise","n":2},{"p":"v","t":"Halleluyah\nPower, glory and honour\nHalleluyah\nYou\u2019re my refuge and strength\nHalleluyah\nFor Your wisdom and faithfulness\nLove and compassion\nWe give You the highest praise","n":3}]},{"n":617,"t":"Hold on to Jesus","k":"","s":[{"p":"v","t":"In this troubled world we live in;\nnothin\u2019 seems to make sense\nmany looking\u2019 for the way, seaching to and fro\nsometimes this rope i\u2019m holding seems to be slippin\u2019\nbut am gonna hold on tighter to the only hope I know","n":1},{"p":"c","t":"I\u2019m gonna hold on, hold on to Jesus,\nHold to the Lamb of Calvary\nI\u2019m gonna hold on, hold on to Jesus\nand Jesus will Hold on to me","n":1},{"p":"v","t":"Oh\u2019 satan keeps on talking\nsaying\u2019 you can\u2019t make it\ntrying to convince me there\u2019s no use to try\nbut I refuse to listen and keep right on going\ntrusting\u2019 and believing\u2019 in Jesus knots of time","n":2}]},{"n":618,"t":"Holy God","k":"","s":[{"p":"v","t":"Holy God we honor You\nHoly God we bless Your name(2ce)\nLet Your presence fill this place mighty God,\nSo that we can be changed by Your glory,\nAs we humble ourselves under Your mighty Hand.\nOh, be exalted.\nHoly God we honor You\nHoly God we bless Your name\nCome and drench our hearts with Your rain,\nAs the Holy Spirit gives us power,\nWe surrender everything to You oh Lord,\nBe glorified.","n":1},{"p":"c","t":"Holy God we honor You,\nHoly God we bless Your name.","n":1},{"p":"v","t":"Bless the Lord oh my soul,\nAnd all that is within me bless his name.(2ce)","n":2},{"p":"v","t":"We honor You.\nWe bless Your name.\nWe love You Lord.\nWith everything.(3ce)","n":3}]},{"n":619,"t":"Holy Holy Holy Lord","k":"","s":[{"p":"v","n":1,"t":"Holy Holy Holy Lord\nGod of power and might,\nHeaven and earth are filled with your glory\nHosanna in the highest."}]},{"n":620,"t":"Holy Spirit dwell in me","k":"","s":[{"p":"v","t":"Holy Spirit come and be, let my mind be with Thee,\nTouch my life that I may serve Thee;\nBe with me all the time, be my strength and be my might,\nGive me peace and give me joy,\nHoly Spirit! Holy Spirit! Come and be.","n":1},{"p":"c","t":"Holy Spirit dwell in me, Touch my eye that I might see all Your goodness in this house;\nStay beside me every hour,\nBe my drink, be my living bread,\nGive me shelter, give me peace,\nHoly Spirit! Holy Spirit, dwell in me.","n":1},{"p":"v","t":"Holy Spirit rescue me, set my soul completely free,\nOh Lord cover me with Your feather,\nbe my shield and buckler,\nLet me be in Your mind;\nLord I pray may You rescue me,\nHoly Spirit! Holy Spirit, rescue me.","n":2},{"p":"v","t":"Holy Spirit come and be, let my soul be always Thine,\nWhen I\u2019m worrying in my mind,\nGive me grace to me through\nBe the bosom of the grace,\nBe my whole amazing grace,\nHoly Spirit! Holy Spirit, come and be.","n":3},{"p":"v","t":"Holy Spirit rescue me, Let my soul be completely free,\nThere is a Jordan over here,\nLet me walk on the dry land;\nLet me see a brand new place,\nSee me resting in the savior's place,\nHoly Spirit! Holy Spirit, rescue me.","n":4}]},{"n":621,"t":"Holy highway","k":"","s":[{"p":"v","t":"There is a road called the Holy Highway that was once a desert land,\nVery soon you will hear the sound of a Holy marching band;\nEverlasting joy upon them, there\u2019s a remnant strong and true,\nWe bring the song back to Zion, We bring the praise back to you.","n":1},{"p":"v","t":"We exalt You God Almighty,\nYou are worthy to be praised;\nLet all nations bow down before You,\nHoly ancient days.","n":2},{"p":"v","t":"There is a road called the Holy Highway where the people dance and shout,\nFor the enemy is running with confusion all about;\nRaise your banners and sing the victory\nRaise them high His word is true,\nWe bring the song back to Zion, we bring the praise back to You.","n":3},{"p":"v","t":"We exalt You God Almighty,\nYou are worthy to be praised;\nLet all nations bow down before You,\nHoly ancient days.\nChorus:","n":4}]},{"n":622,"t":"Holy is the Lord","k":"Eb","s":[{"p":"v","t":"Holy, Holy, Holy\nHoly is the Lord\nHoly, Holy, Holy\nHoly is the Lord\nHe who always giveth more\nEvermore the same\nHeaven and earth He ruleth, come and praise His name.\nThe Lord is Holy\nBless ye the Lord\nAll ye servant of the Lord\nBless ye the Lord\n\nHe\u2019s the rock of my salvation\nHe\u2019s the peace within my soul\nCast down but never forsaken\nWhen I\u2019m weak, He makes me strong\nHe\u2019s the joy of my salvation\nHe\u2019s the Lord of my life\nI will always, I will always, I will always trust Him\nAnd forever lift him up","n":1},{"p":"c","t":"Lift up your hands ye people\nbless ye the Lord\nLift up your hands all ye people\nBless ye the Lord","n":1},{"p":"v","t":"Hallelujah, Hallelujah,\nhallelujah\nBless ye the Lord","n":2},{"p":"v","t":"Solo: Bless ye\nAll: The Lord","n":3}]},{"n":623,"t":"Hosanna in the highest, let our king be lifted up hosanna","k":"","s":[{"p":"v","t":"Be lifted high, higher,\nBe lifted high, higher,\nOh Lord, be lifted high,\nFor You are ho-ho-holy,\nRighteous and wor-worthy,\nOh Lord be lifted high.\nBe lifted higher,\nHigher,\nBe lifted higher,\nJesus You be lifted higher,\nhigher,\nBe lifted higher.","n":1},{"p":"c","t":"Let our King be lifted up,\nHosanna.","n":1},{"p":"v","t":"Let our King be lifted up\nLet our King be lifted up\nHosanna.\nJesus You be lifted higher,\nhigher,\nBe lifted higher.","n":2},{"p":"v","t":"Hosanna in the highest,\nlet our King be lifted up\nLet our King be lifted up\nLet our King be lifted up\nHosanna.\nBe lifted higher,\nBe lifted higher,\nBe lifted higher.","n":3}]},{"n":624,"t":"How can a youth guide his way","k":"C","s":[{"p":"v","t":"Lord, give me Your Spirit\nruling me always\nruling me always\nTime after time.\nMany times flesh wants to be ruling over me\nExcept Your Spirit can see me through","n":1},{"p":"v","t":"How can a man keep his ways?\nExcept the Lord\nExcept the Lord\nHow can a youth guide his ways?\nExcept the Lord\nOnly the Lord","n":2},{"p":"v","t":"Sweet Holy Spirit my teacher and porter\nrevealer of truth and mystery\nDear Lord, help me to love You and\npray more obedient always,\nand keep Your law","n":3},{"p":"v","t":"How can a man keep his ways?\nExcept the Lord\nExcept the Lord\nHow can a youth guide his ways?\nExcept the Lord\nOnly the Lord\nChorus:\nEnd\u2026","n":4}]},{"n":625,"t":"How great is our God (hebrew)","k":"","s":[{"p":"v","t":"Gadol Elohai\nShiruki Gadol Elohai\nKol echad yirei\nKi Gadol Elohai","n":1},{"p":"v","t":"Shem me\u2019 al\nKol shem\nOtcha raui le\u2019 halel\nLibi yashir\nKi Gadol Elohai","n":2},{"p":"v","t":"How Great is our God\nsing with me\nHow great is our God\nAnd all will say\nHow great, how great is our God.","n":3}]},{"n":626,"t":"How lovely is your dwelling place","k":"C","s":[{"p":"v","t":"How lovely is your dwelling place,\nAlmighty Lord,\nThere\u2019s an hunger deep inside my soul,\nOnly in your presence, are my heart and flesh restored,\nhow lovely\nHow lovely is your dwelling place,\nAlmighty Lord,\nThere\u2019s an hunger deep inside my soul,\nOnly in your presence, are my heart and flesh restored,\nhow lovely is your dwelling place.\nIn your courts there\u2019s shelter,\nfor the greatest and the small,\nThe sparrow has a place to build their nest,\nThe pilgrim finds refreshment in the rains that fall\nAnd each one has the strength to meet the test.\nHow lovely is your dwelling place,\nAlmighty Lord,\nThere\u2019s an hunger deep inside my soul,\nOnly in your presence, are my heart and flesh restored,\nhow lovely is your dwelling place.\nA single day is better when spent in humble praise\nthan a thousand days of living without you,\nThe Lord bestows his FAVOUR\non each one who obeys\nand blessings on the one whose heart is true\nHow lovely is your dwelling place,\nAlmighty Lord,\nThere\u2019s an hunger deep inside my soul,\nOnly in your presence, are my heart and flesh restored,\nhow lovely is your dwelling place,\nah, ah, ah, ah,\nhow lovely is your dwelling place.","n":1},{"p":"c","t":"ah, ah, ah, ah, ah\u2026\u2026","n":1}]},{"n":627,"t":"Humble thyself","k":"G","s":[{"p":"v","t":"If thou wouldst have the dear Saviour from heaven,\nwalk side by side from the morn till the even,\nThere is a rule that each day you must follow,\nHumble thyself to walk with God.","n":1},{"p":"c","t":"Humble thyself and the Lord will draw near thee,\nHumble thyself and His presence shall cheer thee;\nHe will not walk with the proud or the scornful,\nHumble thyself to walk with God.","n":1},{"p":"v","t":"Just as the Lord in the world\u2019s early ages,\nWalked and communed with the prophets and sages,\nHe will come now if you meet the conditions\nHumble thyself to walk with God.","n":2},{"p":"v","t":"Just as the stream finds a bed that is lonely,\nSo Jesus walks with the pure and the Holy;\nCast out the pride and in Heart-felt contrition\nHumble thyself to walk with God.","n":3}]},{"n":628,"t":"I adore you","k":"C#","s":[{"p":"v","t":"You saw me in my needs, You paid the price for me;\nAnd through Your love I have been set free;\nNow I am not afraid, You took my sin and shame,\nForevermore I will bless Your Holy name.","n":1},{"p":"v","t":"I adore You, I adore You,\nLamb of God, my Saviour, Prince of peace;\nI adore You, I adore You,\nJesus, You mean all the world to me,\nI adore You, Lord.","n":2},{"p":"v","t":"I adore You, Lord.","n":3}]},{"n":629,"t":"I almost let go","k":"F","s":[{"p":"v","t":"I almost let go\nI felt like I just couldn't take life anymore\nMy problems had me bound\nDepression weighed me down\nBut God held me close\nSo I wouldn't let go\nGod\u2019s mercy kept me\nSo I wouldn't let go\n1.","n":1},{"p":"v","t":"I almost gave up\nI was right at the edge of a\nbreakthrough\nBut couldn't see\nThe devil really had me\nBut Jesus came and grabbed me\nAnd He held me close\nSo I wouldn't let go\nGod\u2019s mercy kept me\nSo I wouldn't let go.\n2.","n":2},{"p":"v","t":"So I\u2019m here today\nBecause God kept me\nI\u2019m alive today\nOnly because of His grace\nOh He kept me\nGod kept me\nHe kept me\nSo I wouldn\u2019t let go","n":3},{"p":"v","t":"Oh He kept me\nGod kept me\nHe kept me\nSo I wouldn\u2019t let go","n":4}]},{"n":630,"t":"I am a christian","k":"","s":[{"p":"v","t":"There is therefore now no condemnation to them which are in Christ Jesus, who walk not after the flesh, but after the Spirit.\n\nRomans 8:1","n":1},{"p":"c","t":"I am a C,\nI am a C-H,\nI am C-H-R-I-S-T-I-A-N,\nAnd I have C-H-R-I-S-T,\nIn my H-E-A-R-T,\nAnd I will L-I-V-E,\nE-T-E-R-N-A-L-L-Y.","n":1},{"p":"v","t":"For the law of the Spirit of life in Christ Jesus hath made me free from the law of sin and death.\n\nRomans 8:2","n":2},{"p":"v","t":"For to be carnally minded is death; but to be spiritually minded is life and peace.\n\nRomans 8:6","n":3},{"p":"v","t":"Because the carnal mind is enmity against God: for it is not subject to the law of God, neither indeed can be.\n\nRomans 8:7","n":4},{"p":"v","t":"And if Christ be in you, the body is dead because of sin; but the Spirit is life because of righteousness.\n\nRomans 8:10","n":5}]},{"n":631,"t":"I am a friend of God","k":"","s":[{"p":"v","t":"Who am I that You are mindful of me,\nHow You hear me when I call,\nIs it true that You are thinking of me,\nHow You love me,\nIt\u2019s amazing, so amazing.","n":1},{"p":"c","t":"I am a friend of God,\nI am a friend of God,\nI am a friend of God,\nHe calls me friend.","n":1},{"p":"v","t":"What a friend we have in Jesus,\nAll our sins and griefs to bear!\nWhat a privilege to carry\nEverything to God in prayer!\nO what peace we often forfeit,\nO what need-less pain we bear\nAll because we do not carry,\nEverything to God in prayer!","n":2},{"p":"v","t":"Friendship with Jesus,\nFellowship divine,\nOh, what blessed\nsweet communion,\nJesus is a friend of mine.","n":3}]},{"n":632,"t":"I am redeemed","k":"","s":[{"p":"v","t":"Where there was hate,\nlove now abides\nWhere there was confusion,\npeace now reigns\nI\u2019m walking with Jesus\nI\u2019m a child of the King\nAnd it\u2019s all because (I am Redeemed)\nI\u2019ll tell of His favour\nI\u2019ll tell of His love\nI\u2019ll tell him because God has been good to me\nHe purchased my redemption\nwith His precious blood\nand from sin He set me free","n":1},{"p":"c","t":"I am Redeemed\nbought with a price\nJesus has changed my whole life\nIf anybody ask you just who I am\nTell them I am Redeemed","n":1}]},{"n":633,"t":"I am what you see","k":"Eb","s":[{"p":"v","t":"Ooooo\nOoooo\nI am healed;\nI am free;\nI am what You see,\nI am what You see.\nI am what You see\u2026.\n\nOpen my eyes, help me believe,\nI am what You see.","n":1},{"p":"c","t":"Help me to see me,\nThe way You see me;\nSometimes I see pain Lord;\nBut You see victory,\nI see where I am Lord;\nYou see where I shall be,\nOpen my eyes, Help me believe,\nI am what You see.\nYou see me victorious,\nYou see me faithful;\nYou see me believing that You are able,\nYou see me rejoicing that I have survived;\nOpen my eyes, help me believe,\nI am what You see.","n":1}]},{"n":634,"t":"I asked the Lord","k":"Bb","s":[{"p":"v","t":"I asked the Lord to comfort me,\nWhen things weren\u2019t going my way,\nHe said to me; I will be with you and cast your cares away.","n":1},{"p":"v","t":"I asked the Lord to comfort me,\nWhen darkness was all that I saw,\nHe said to me; never be afraid for I will see you through.","n":2},{"p":"v","t":"I didn\u2019t ask for riches\nHe gave me wealth untold,\nThe moon, the stars, the sun, the sky\nHe gave me, eyes to behold.","n":3},{"p":"v","t":"I thank the Lord for everything,\nAnd I count my blessings each day,\nHe came to me when I needed Him\nI only had to pray.","n":4},{"p":"v","t":"He\u2019ll come to you if you ask Him to\nFor He\u2019s only a pray\u2019r away.","n":5}]},{"n":635,"t":"I believe","k":"C","s":[{"p":"v","t":"Jehovah You, I trust,\nIn You oh Lord,\nJehovah You, I trust,\nIn You,\nI believe, I believe\n(2ce)","n":1},{"p":"c","t":"You are the God of miracles,\nYou are the God of wonders,\nYou are the God all powerful,\nI believe (6x)","n":1},{"p":"v","t":"So long bye bye (2ce),\nGoodbye to my pain,\nAnd my sorrow,\nSo long bye bye\nSo long,\nBye bye\n(x10)","n":2}]},{"n":636,"t":"I bless your name","k":"","s":[{"p":"v","t":"In prisoners chain with bleeding stripes\npaul and silas prayed that night\nand in their","n":1},{"p":"v","t":"I bless Your name 2x\nI give You honour,give You praise\nYou are the life, The Truth the way\nI bless Your name, I bless Your name.","n":2}]},{"n":637,"t":"I come to the garden alone","k":"G","s":[{"p":"v","t":"I come to the garden alone,\nWhile the dew is still on the roses,\nAnd the voice I hear falling on my ear,\nThe Son of God discloses.","n":1},{"p":"c","t":"And He walks with me and He talks with me,\nAnd He tells me I am his own;\nAnd the joy we share as we tarry there,\nNone other has ever known.","n":1},{"p":"v","t":"He speaks, and the sound of his voice is so sweet,\nThe birds hush their singing,\nAnd the melody that He give to me\nWithin my heart is to ringing.","n":2},{"p":"v","t":"I stay in the garden with Him,\nThough the night around me is falling.\nBut He bids me go;\nthrough the voice of woe\nHis voice to me is calling.","n":3},{"p":"v","t":"And He walk with me and He talks with me,\nAnd He tells me I am His own;\nAnd the joy we share as we tarry there,\nNone other has ever known.","n":4}]},{"n":638,"t":"I have a joy","k":"","s":[{"p":"v","t":"I have a joy,\nThe joy of salvation,\nThe joy of deliverance,\nJoy everyday (2ce).","n":1},{"p":"v","t":"Joy, joy, joy everyday,\nhappiness, happiness, happiness everyday,\nJoy, joy, joy everyday,\nThe joy of salvation,\nJoy everyday.","n":2}]},{"n":639,"t":"I have heard of a saviour\u2019s love","k":"G","s":[{"p":"v","t":"I have heard of a Savior's love,\nAnd a wonderful love it must be;\nBut did He come down from above\nOut of love and compassion for me?","n":1},{"p":"c","t":"Yes Oh Yes,\nOut of love and compassion for me,\nYes Oh Yes,\nHe suffered and died on the tree.","n":1},{"p":"v","t":"I have heard how He suffered and bled,\nHow He languished and died on the tree;\nBut Oh, is it a-ny-where said\nThat He languished and suffered for me?","n":2},{"p":"v","t":"I\u2019ve been told of a heaven on high,\nWhich the children of Jesus shall see;\nBut is there a place in the sky\nMade ready and furnished for me?","n":3}]},{"n":640,"t":"I have no other God but you","k":"","s":[{"p":"v","t":"I have no other God but You,\nI have no other God but You;\nYou have done what no man has done,\nYou will do what no man can do.","n":1},{"p":"v","t":"God is a miracle worker,\nGod is a glorious God.","n":2}]},{"n":641,"t":"I have seen the Lord's goodness","k":"","s":[{"p":"v","t":"Oh, Lord You have been so good,\nYou are so good to me,\nOh Lord, You are excellent in my life everyday,\nOh, Lord You have been so good,\nOh Lord, You are excellent in my life.","n":1}]},{"n":642,"t":"I heard the voice of Jesus say\u2026","k":"Bb","s":[{"p":"v","t":"I heard the voice of Jesus say, Come unto me and rest;\nLay down thou weary one,\nlay down thy head upon my breast;\nI came to Jesus as I was, weary and worn and sad,\nI found in Him a resting place,\nAnd He has made me glad.","n":1},{"p":"v","t":"I heard the voice of Jesus say, \u201cBehold, I freely give\nThe living water; thirsty one,\nStoop down and drink and live.\u201d\nI came to Jesus and I drank of that living giving stream,\nMy thirst was quenched, my soul revived and now I live in Him.","n":2},{"p":"v","t":"I heard the voice of Jesus say,\n\u201cI am this dark world\u2019s light,\nLook unto me, my morn shall rise,\nAnd all thy day be bright.\u201d\nI looked to Jesus and I found in Him my Star, my sun,\nAnd in that light of life I\u2019ll walk,\nTill travelling days are gone.\nLast verse","n":3}]},{"n":643,"t":"I know who makes the daisies","k":"","s":[{"p":"v","t":"I know who makes the daisies,\nAnd paints them starry bright;\nI know who clothes the lilies,\nSo sweet and soft and white:","n":1},{"p":"v","t":"And surely needful raiment,\nHe will for me provide,\nWho know Him as my Jesus,\nAnd in His love confide.","n":2},{"p":"v","t":"I know who feeds the sparrow,\nAnd robin, red and gay;\nI know who makes the skylark,\nSoar up to greet the day:","n":3},{"p":"v","t":"And me much He cares for,\nAnd feeds with daily bread,\nWhom He has taught to love Him,\nAnd trust what He has raid.","n":4},{"p":"v","t":"The daisy and the lily,\nObey Him all they can;\nThe robin and the skylark,\nFulfil His perfect plan:","n":5},{"p":"v","t":"And I, to whom given,\nA heart and mind and will,\nMust try and serve Him better,\nAnd all His laws fulfil.","n":6},{"p":"v","t":"The daisies, they must perish,\nThe lark and robin die;\nBut I shall live forever,\nAbove the bright and blue sky:","n":7},{"p":"v","t":"Dear Saviour, Thou wilt help me,\nTo love Thee more and more,\nUntil in heaven I see Thee,\nAm like Thee, and adore.","n":8}]},{"n":644,"t":"I love that man from Galilee","k":"","s":[{"p":"v","t":"He has forgiven me all my sins, and placed the Holy Ghost within,\nOh, I love, that Man from Galilee.","n":1}]},{"n":645,"t":"I love the Lord","k":"","s":[{"p":"v","t":"I love the Lord,\nHe heard my cry\nand pitied every groan,\nLong as I live\nand troubles rise,\nI\u2019ll hasten to His throne.","n":1},{"p":"v","t":"I\u2019ll hasten to His throne\u2026","n":2}]},{"n":646,"t":"I love to praise your name","k":"E","s":[{"p":"v","t":"I love to praise your name,\nI love to lift you up,\nWe bless your name,\nSweet Jesus, Jesus, Jesus, Jesus, Jesus.\nDemons tremble at the name when we call it,\nMountains move at the same when we shout it,\nThy name\u2019s above all names\u2026..\nEvery kneel shall bow, every tongue confess,\nThat Jesus, Jesus, Jesus, Jesus, Jesus\nI love to praise your name,\nI love to lift you up,\nWe bless your name,\nSweet Jesus, Jesus, Jesus, Jesus, Jesus.\nSweet Jesus, Jesus, Jesus, Jesus, Jesus.","n":1},{"p":"c","t":"I love to praise your name,\nI love to lift you up,\nWe bless your name,\nSweet Jesus.","n":1}]},{"n":647,"t":"Praise medley","k":"","s":[{"p":"v","t":"Ah, Lord God, thou has made the heaven\nAnd the earth by thy great power,\nAh, Lord God, thou has made the heaven\nAnd the earth by thine outstretched arm.","n":1},{"p":"v","t":"Nothing is too difficult for thee\n\tNothing is too difficult for thee\nGreat and Mighty God,\nGreat in counsel, mighty in deeds, mighty in deeds\nNothing, nothing, absolutely nothing,\nNothing is too difficult for thee.","n":2},{"p":"v","t":"Give me oil in my lamp\nKeep me burning;\nGive me oil my lamp I pray\nGive me oil my lamp\nKeep me burning,\nKeep me burning 'til the break of day\nSing Hosanna! Sing Hosanna!\nSing Hosanna to the King of kings! Sing Hosanna! Sing Hosanna!\nSing Hosanna to the Lord.","n":3}]},{"n":648,"t":"O clap your hand oh ye people","k":"","s":[{"p":"v","t":"Heavenly father Your name is wonderful\nYour name is Excellent\nYour name is Beautiful\nWe worship You lord For You are mighty\nYou got the whole world in Your hands","n":1}]},{"n":649,"t":"Oh no, had I known","k":"F","s":[{"p":"v","t":"When the saints shall march to heaven\nWith Jesus as their Leader\nMarching onward like soldiers\nYes, able soldiers\nSinging and rejoicing\nOh hear the sinners cry\nOh, no, had I known!","n":1},{"p":"v","t":"Oh, no, the sinner\u2019s voice I hear\u2026\nGone, gone, they have gone, they have gone\nMarching to join the glory above;\nOh, no, had I known!","n":2},{"p":"v","t":"Oh! Wake up slumber wake up\nAnd prepare for the glory\nMeeting Jesus your Saviour\nThe Captain of the band\nPrepare before it\u2019s too late\nOr join the group that cry\nOh, no, had I known!","n":3},{"p":"v","t":"Oh, no, the sinner\u2019s voice I hear\u2026\nGone, gone, they have gone, they have gone\nMarching to join the glory above;\nOh, no, had I known!\n%","n":4}]},{"n":650,"t":"Our father and our God (baba \u1eb9l\u1eb9da wa)","k":"Ab","s":[{"p":"v","t":"Our Father and our God\nAccept our songs of praise\nOn earth and heaven above\nThe God Who reigns in love\nTo Thee is due all praise and thanks\nAnd majesty for ever more","n":1},{"p":"v","t":"Begotten Son of God\nWho shed His blood for us\nWho rose up from the dead\nAnd up to heaven ascend\nTo Thee is due all praise and thanks\nAnd majesty for ever more","n":2},{"p":"v","t":"To Thee the Holy Ghost\nWe raise our songs of praise\nThou Who has shed the light\nOf life into our heart\nTo Thee is due all praise and thanks\nAnd majesty for ever more","n":3},{"p":"v","t":"Our God immortal One\nWe praise Thine Holy name\nOn earth and heaven above\nWe raise our songs of praise\nTo Thee is due all praise and thanks\nAnd majesty for ever more.","n":4}]},{"n":651,"t":"Why should I worry or fret","k":"Eb","s":[{"p":"v","t":"He holds the future in the palm of His hand,\nAnd He has never failed me yet,\nI know He\u2019s leading and still has control,\nSo why should I worry or fret.\nI know He owns my future\nAnd I know He holds my hands\nAnd I know just as sure as I\u2019m singing this song\nI\u2019m part of His almighty plan\u2026","n":1},{"p":"c","t":"I believe,\nI believe,\nI believe,\nso why should I worry or fret.","n":1},{"p":"v","t":"He told me He\u2019ll protect me and go with me each day\nand brother, I\u2019ve no reason to doubt\nHe\u2019s been so near me every step of the way\nAnd He will surely lead His children on out.\nI know He owns my future\nAnd I know He holds my hands\nAnd I know just as sure as I\u2019m singing this song\nI\u2019m part of His almighty plan\u2026","n":2},{"p":"v","t":"There are some people who live each day in fear,\nOf what tomorrow may bring\nBut I\u2019m trusting in One who is always so near\nI\u2019m talking \u2018bout the King of all kings.\nI know He owns my future\nAnd I know He holds my hands\nAnd I know just as sure as I\u2019m singing this song\nI\u2019m part of His almighty plan\u2026","n":3}]},{"n":652,"t":"How can two walk together","k":"","s":[{"p":"v","n":1,"t":"It all started in the garden of Eden\nWhen the first two were born in sin\nNow Cain was the seed of the serpent\nAnd Abel the Seed of God"},{"p":"c","t":"How can two walk together,\nUnless they both agree?\nOne believed in trinity doctrine\nAnd the other believed in one God","n":1},{"p":"v","n":2,"t":"Now Cain looked for vain and beauty\nWhile Abel sought the face of God\nNow they tried to walk together\nBut they found out they could not agree"},{"p":"v","n":3,"t":"Those two spirits that started in Eden\nStill rule men's heart today\nOne spirit will give you worldly wisdom\nAnd the other the True Word of God"}]},{"n":653,"t":"Holy answer is on the way","k":"","s":[{"p":"v","n":1,"t":"Holy answer is on the way\nYes I know\nJesus said if I believe\nIt shall be so\nMy Father knows my needs before I pray\nI will rest assure the answer is on the way"}]},{"n":654,"t":"Comfort me","k":"","s":[{"p":"v","n":1,"t":"You are my rock and my salvation\nFrom You Lord my help comes from\nEven in my darkest hour,\nYou comfort me"},{"p":"c","t":"In the Lord put I my trust\nTell me whom shall I fear\nThough I walk through the valley of death\nI shall never fear evil\nFor Thy rod and staff they comfort me","n":1},{"p":"v","n":2,"t":"I will rest upon Your word\nWhich have never ever failed\nFor in it I found my peace\nAnd You comfort me."}]},{"n":655,"t":"We believe god's prophet","k":"","s":[{"p":"v","n":1,"t":"He wasn't sent to please all men,\nBut He had the safer law;\nHe brought to us the way to heaven,\nAnd we will get there by His word."},{"p":"c","t":"We believe, We believe\nWe believe God's prophet\nHe alone has God's word for our day\nWe believe, We believe\nWe believe God's prophet\nWe put his word in our heart each day.","n":1},{"p":"v","n":2,"t":"There is no shortage of believing,\nGod don't need man's sympathy;\nHe has His eagles across the world,\nAnd they'll believe like you and me."},{"p":"v","n":3,"t":"Now that we know who we are,\nNow that we know from whence we came;\nWe are part of His royal family,\nA people called out for His name."}]},{"n":656,"t":"I\u2019ve got that old time religion in my heart","k":"Eb","s":[{"p":"v","n":1,"t":"I\u2019m glad Jesus came, glory to His name,\u000bO what a friend is He;\u000bHe so freely gave His own life to save,\u000bFrom bonds of sin set free."},{"p":"c","t":"I\u2019ve got that pure love in my heart\u000b(I\u2019ve got that old time religion in my heart)\u000bIt is now way down inside, I\u2019ve got that new peace in my heart\u000b(A way down inside, I\u2019ve got a new kind of feeling in my heart,)","n":1},{"p":"v","n":2,"t":"Where true joys will e\u2019er abide;\u000b(True joys abide;)\u000bNobody knows what it means to me,\u000bNobody knows by my Lord and me,\nI\u2019ve got that pure love in my heart,\u000b(I\u2019ve got that old time religion in my heart)\u000bIt is now way down inside.\u000b(Away down inside)\nWhat a joy to know One who loves us so,\u000bHe is so kind and true;\u000bHe has changed my life from all sin and strife,\u000bHe\u2019ll do the same for you."},{"p":"v","n":3,"t":"Where true joys will e\u2019er abide;\u000b(True joys abide;)\u000bNobody knows what it means to me,\u000bNobody knows by my Lord and me,\nI\u2019ve got that pure love in my heart,\u000b(I\u2019ve got that old time religion in my heart)\u000bIt is now way down inside.\u000b(Away down inside)\nSinner won\u2019t you now humbly to Him bow,\u000bJust let the Lord come in;\u000bYou\u2019ll find perfect peace, joy will never cease,\u000bYou shall the life-crown win.\nLast verse"},{"p":"v","n":4,"t":"Where true joys will e\u2019er abide;\u000b(True joys abide;)\u000bNobody knows what it means to me,\u000bNobody knows by my Lord and me,\nI\u2019ve got that pure love in my heart,\u000b(I\u2019ve got that old time religion in my heart)\u000bIt is now way down inside.\u000b(Away down inside)\nEnd"}]},{"n":657,"t":"The new song","k":"Eb","s":[{"p":"v","n":1,"t":"It thrills my soul to hear the songs of praise\u000bWe mortals sing below\u000bAnd though it takes the parting of the way\u000bYet I must onward go\nI hope to hear throughout unnumbered days,,\u000bThe song earth cannot know\u000bThey sing in heav\u2019n a new song\u000bOf Moses and the Lamb."},{"p":"c","t":"I want to hear the angels singing to bid me welcome\u000bTo mansions bright and fair.","n":1},{"p":"v","n":2,"t":"I want to hear the glad harps ringing with voices blending rich and rare (so rare)\nI want to see the master bringing a precious crown.\u000bCrown of life that I may own and wear.\nI want to hear that mighty chorus sweetly sing (4x)\u000bTo hear it swell and ring!\nThe greatest joy that I have ever known\u000bIs praising Him in songs\u000bI know someday when I have older grown\u000bMy voice will not be strong\nBut if good seed for Jesus I have sown\u000bWith angels I\u2019ll belong\u000bThey sing in heav\u2019n I new song\u000bOf Moses and the Lamb."},{"p":"v","n":3,"t":"I want to hear the glad harps ringing with voices blending rich and rare (so rare)\nI want to see the master bringing a precious crown.\u000bCrown of life that I may own and wear.\nI want to hear that mighty chorus sweetly sing (4x)\u000bTo hear it swell and ring!\nThe sweetest song that earth can ever boast\u000bWas sung when Christ was born\u000bYet he who walked the Galilean coast\u000bSometimes was sad forlorn\nLast verse\nHe left the earth to send the Holy Ghost\u000bTo guide us till that morn\u000bThey sing in heaven a new song\u000bOf Moses and the Lamb."},{"p":"v","n":4,"t":"I want to hear the glad harps ringing with voices blending rich and rare (so rare)\nI want to see the master bringing a precious crown.\u000bCrown of life that I may own and wear.\nI want to hear that mighty chorus sweetly sing (4x)\u000bTo hear it swell\u000band ring!\nEnd"}]},{"n":658,"t":"All people that on earth do dwell","k":"G","s":[{"p":"v","n":1,"t":"All people that on Earth do dwell,\nSing to the Lord with cheerful voice;\nHim serve with fear, his praise forth tell;\nCome ye before him and rejoice."},{"p":"v","n":2,"t":"The Lord, ye know, is God indeed;\nWithout our aid he did us make;\nWe are his folk, he doth us feed,\nAnd for his sheep he doth us take."},{"p":"v","n":3,"t":"O enter then his gates with praise,\nApproach with joy his courts unto;\nPraise, laud, and bless his name always,\nFor it is seemly so to do."},{"p":"v","n":4,"t":"For why? The Lord our God is good;\nHis mercy is forever sure;\nHis truth at all times firmly stood,\nAnd shall from age to age endure."}]}],"y":[{"n":1,"t":"A f'ope f'olorun","k":"C","s":[{"p":"v","t":"A f\u2019Ope f\u2019Olorun\nL\u2019okan ati l\u2019ohun wa,\nEni nsohun \u2018yanu\n\u2018Kun enit\u2019 araye nyo\nGbat\u2019 awa l\u2019omo \u2018wo\nOun na lo ntoju wa,\nO si f\u2019ebun ife,\nSe \u2018toju wa sibe.","n":1},{"p":"v","t":"Oba onib\u2019ore\nMa fi wa sile lailai\nAyo ti ko le pin\nOun bukun yo je ti wa\nPa wa mo n\u2019nu ore\nSo wa ngba mba damu\nYo wa ninu ibi\nL\u2019aye ati l\u2019orun","n":2},{"p":"v","t":"K\u2019a f\u2019iyin on ope,\nFun Jesu Krist\u2019 Oluwa\nOba awon oba,\nTi O ga ju lorun,\nOlorun kan laelae,\nT\u2019aye at\u2019orun mbo,\nBe l\u2019o wa d\u2019isiyi,\nBeni y\u2019o wa laelae.","n":3}]},{"n":2,"t":"Adura mi ti gba","k":"","s":[{"p":"v","n":1,"t":"Adura mi ti gba, mo pade Jesu l'ona, adura mi ti gba, mo pade Jesu l'ona\nO ni ki n ma ma ja, O ni ki n ma ma binu, O ni ki n ma soro odi s'eni Mimo, Adura mi ti gba, Mo pade Jesu l'ona"}]},{"n":3,"t":"Alafia pupo ni awon to fe ofin re ni","k":"","s":[{"p":"v","t":"Mo f\u2019aiye at\u2019 ife mi fun\nOdagutan to ku fun mi\njeki nle je Olotito\njesu Olorun mi","n":1},{"p":"v","t":"Ngo wa feni t\u2019oku fun mi\nAiye mmi y\u2019 o si dun pupo\nNgo wa feni t\u2019o ko fun mi\njesu Olorun mi","n":2},{"p":"v","t":"Mo gbagbe \u2018pe Iwo ngbani\n\u2018Tori \u2018wo ku k\u2019emi le la\nEmi y\u2019o si gbeke le O\nJesu Olorun mi","n":3},{"p":"v","t":"Iwo t\u2019o ku ni Kalfari\nLati so mi d\u2019 ominira\nMo yara mi soto fun O\nJesu Olorun mi.","n":4}]},{"n":4,"t":"Alaimo ni emi","k":"","s":[{"p":"v","t":"Alaimo ni emi,\nOlorun Oluwa!\nEmi ha gbodo sunmo O,\nT\u2019emi t\u2019eru ese?","n":1},{"p":"v","t":"Eru ese yi npa\nOkan buburu mi\nYio ha si ti buru to,\nL\u2019oju Re mimo ni!","n":2},{"p":"v","t":"Emi o ha si ku,\nBi alainireti,\nMo r\u2019ayo ninu iku Re,\nFun otosi b\u2019emi.","n":3},{"p":"v","t":"Eje ni ti o ta\nT\u2019is\u2019 ore-ofe Re;\nLe w\u2019elese t\u2019o buruju,\nLe m\u2019okan lile ro.","n":4},{"p":"v","t":"Mo wole l\u2019ese Re,\nJo k\u2019o dariji mi\nNihin l\u2019emi o wa titi,\n\u2018Wo o wipe, \u201cDide\u201d.","n":5}]},{"n":5,"t":"Anu re Oluwa lawa ntoro","k":"F","s":[{"p":"v","t":"Anu R\u1eb9, Oluwa, l\u2019awa nt\u1ecdr\u1ecd,\nR\u1ecd ojo R\u1eb9 le wa;\n\u1eb8iy\u1eb9 ti nfo at\u2019era to nrin\u2018l\u1eb9\nNri w\u1ecdn l\u1ecdp\u1ecdl\u1ecdp\u1ecd.","n":1},{"p":"c","t":"Anu, Anu, Anu, R\u1eb9\nBaba wa \u1ecdrun,\nL\u2019awa nt\u1ecdr\u1ecd,\n\u1eb8iy\u1eb9 ti nfo at\u2019era t\u2019o nrin\u2018l\u1eb9\nNri w\u1ecdn l\u1ecdp\u1ecdl\u1ecdp\u1ecd.","n":1},{"p":"v","t":"Orun l\u2019\u1ecdsan nipa a\u1e63\u1eb9 R\u1eb9 ni,\nAt\u2019o\u1e63upa l\u2019oru\nIgba ojo at\u2019igba ikore,\nL\u1ecdw\u1ecd r\u1eb9 ni nw\u1ecdn wa","n":2},{"p":"v","t":"\u2018Gbati e\u1e63u at\u2019\u1eb9s\u1eb9 ndode wa,\nIkolu w\u1ecdn soro,\nLogo asan arankan ti p\u2019aiya\nOluwa gba wa la","n":3},{"p":"v","t":"Dafidi ko le gbagbe anu R\u1eb9,\nNiwaju Goliath;\nDani\u1eb9li \u2018nu iho kiniun,\nIw\u1ecd lo n\u1e63\u2019abo r\u1eb9","n":4},{"p":"v","t":"Iru w\u1ecdnyi l\u2019awa nt\u1ecdr\u1ecd,\nR\u1ecd ojo R\u1eb9 le wa;\nLarin \u1ecdta j\u1eb9 ki awa ma gba\nfun iyin ogo R\u1eb9.","n":5},{"p":"v","t":"Anu bi Batimeu af\u1ecdju,\nL\u2019a nt\u1ecdr\u1ecd l\u1ecdd\u1ecd R\u1eb9;\nAti gbogbo aw\u1ecdn alailera,\nNw\u1ecdn ri anu R\u1eb9 gba","n":6},{"p":"v","t":"Ayaba \u1eb8sita ko le gbagbe,\nLasiko \u2018damu R\u1eb9,\nAdura lo fi \u1e63\u1eb9gun \u1ecdta r\u1eb9,\n\u1eccl\u1ecdrun lo ja fun.","n":7},{"p":"v","t":"\u1eccta ile ko le \u1e63e wa nibi,\nGb\u1eb9k\u1eb9 r\u1eb9 le Jesu,\nAj\u1eb9, O\u1e63o ati alawirin,\nNw\u1ecdn npete l\u2019asan ni\nAnu, Anu, Anu, R\u1eb9\nBaba wa \u1ecdrun,\nL\u2019awa nt\u1ecdr\u1ecd,\n\u1eb8iy\u1eb9 ti nfo at\u2019era t\u2019o nrin\u2018l\u1eb9\nNri w\u1ecdn l\u1ecdp\u1ecdl\u1ecdp\u1ecd.\nChorus:","n":8}]},{"n":6,"t":"Ao pade leti odo","k":"","s":[{"p":"v","t":"Ao pade leti odo,\nT\u2019 ese angeli tite;\nT\u2019 o mo gara bi kristali;\nLeba ite Olorun?","n":1},{"p":"c","t":"Ao pade leti odo,\nOdo didan, Odo didan na,\nPel\u2019 awon mimo leba odo,\nT\u2019o nsan leba ite ni.","n":1},{"p":"v","t":"Leti bebe odo na yi\nPel\u2019 Olusagutan wa\nAo ma rin a o ma sin\nB\u2019a ti ntele pase re.","n":2},{"p":"v","t":"K\u2019a to de odo na,\nAo s\u2019 eru wa kale;\nJesu jo gba eru ese\u2019\nAwon ti y\u2019o de l\u2019 ade.","n":3},{"p":"v","t":"Nje l\u2019eba odo tutu na,\nAo r\u2019 oju Olugbala;\nEmi wa ki o pinya mo,\nYio korin ogo re.","n":4}]},{"n":7,"t":"Apata ayeraye","k":"","s":[{"p":"v","t":"Apata ayeraye,\nSe ibi isadi mi;\nJe ki omi on eje\nT\u2019o san lati iha Re\nSe iwosan f\u2019ese mi,\nK\u2019o si so mi di mimo.","n":1},{"p":"v","t":"K\u2019ise ise owo mi\nL\u2019o le mu ofin Re se,\nB\u2019itara mi ko l\u2019are\nT\u2019omije mi nsan titi,\nWon ko to fun etutu\n\u2018Wo nikan l\u2019o le gbala.","n":2},{"p":"v","t":"Ko s\u2019ohun ti mo mu wa,\nMo ro mo agbelebu;\nMo wa k\u2019o d\u2019aso bo mi,\nMo nwo O fun iranwo;\nMo wa sib\u2019orisun ni,\nWe mi, Olugbala mi.","n":3},{"p":"v","t":"\u2018Gbati emi mi ba lo,\nT\u2019iku ba p\u2019oju mi de,\nTi mba lo s\u2019aye aimo,\nKi nri O n\u2019ite anu;\nApata ayeraye\nSe ibi isadi mi.","n":4}]},{"n":8,"t":"Apata mi ayeraye","k":"","s":[{"p":"v","t":"Apata mi Ayeraye,\nIw\u1ecd ni mo gb\u1eb9k\u1eb9le,\nJ\u1ecdw\u1ecd maj\u1eb9 k\u2019oju ti mi\nTiti un o fi d\u2019\u1ecdd\u1ecd R\u1eb9.","n":1},{"p":"c","t":"\u1e62\u2019anu fun mi,\nGb\u1ecd adura mi\nRan mi l\u1ecdw\u1ecd\n\u1e62\u2019anu fun mi,\nGb\u1ecd adura mi\nRan mi l\u1ecdw\u1ecd\nIw\u1ecd ni mo gb\u1eb9k\u1eb9le.","n":1},{"p":"v","t":"Igba mi mbe li owo Re,\nAwa o se beru?\nBaba ki y\u2019o je k\u2019omo Re,\nSokun li ainidi.","n":2},{"p":"v","t":"Igba mi mbe li owo Re,\n\u2018Wo l\u2019a o gbekele;\nTit\u2019 a o f\u2019aiye osi \u2018le,\nT\u2019a o si ri ogo Re.","n":3},{"p":"v","t":"Tani yo gbe Jacob dide,\nNi ero araye,\nEgungun gbigb\u1eb9 a le s\u1ecdji,\nLagbara \u1eccba ogo.","n":4},{"p":"v","t":"Bi ko til\u1eb9 s\u2019alabaro,\nTi olutunu jina\n\u1eccl\u1ecdrun y\u2019o bo a\u1e63iri\nF\u2019aw\u1ecdn to ba gb\u1eb9k\u1eb9le.","n":5}]},{"n":9,"t":"Are mu o","k":"","s":[{"p":"v","t":"Are mu o, aiye su o,\nLala po fun o?\nJesu ni, \u201cWa si odo mi\nK\u2019o simi.","n":1},{"p":"v","t":"Ami wo l\u2019emi o fi mo,\nPe On l\u2019o npe mi\nAm\u2019 iso wa lowo, ati\nEse Re.","n":2},{"p":"v","t":"O ha ni ade bi Oba,\nTi mo le fi mo?\nToto, ade wa lori Re,\nT\u2019egun ni.","n":3},{"p":"v","t":"Bi mo ba ri, bi mo tele,\nKini ere mi?\nOpolopo iya ati\n\u2018Banuje.","n":4},{"p":"v","t":"Bi mo tele tit\u2019aye mi,\nKini ngo ri gba?\nEkun a dopin, n o simi\nTit\u2019aye.","n":5},{"p":"v","t":"Bi mo bere pe, K\u2019O gba mi,\nY\u2019o ko fun mi bi?\nB\u2019orun at\u2019aiye nkoja lo\nKo je ko.","n":6},{"p":"v","t":"Bi mo ba ri, ti mo ntele\nY\u2019o ha bukun mi?\nAwon ogun orun nwipe,\nYio se.","n":7}]},{"n":10,"t":"Asegun ati ajogun ni aje","k":"","s":[{"p":"v","t":"Asegun ati ajogun ni a je,\nNipa eje Kristi a ni isegun;\nB\u2019Oluwa je tiwa, a ki yo subu;\nKo s\u2019ohun to le bori agbara Re.","n":1},{"p":"c","t":"Asegun ni wa, nipa eje Jesu;\nBaba fun wa ni \u2018segun, nipa eje Jesu,\nEni t\u2019a pa f\u2019elese\nSibe, O wa, O njoba;\nAwa ju asegun lo,\nAwa ju asegun lo.","n":1},{"p":"v","t":"A nlo l\u2019oruko Olorun Israeli\nLati segun ese at\u2019aisododo;\nKise fun wa, sugbo Tire ni iyin\nFun \u2018gbala at\u2019isegun ta f\u2019eje ra.","n":2},{"p":"v","t":"Eni t\u2019O ba si segun ni ao fi fun,\nLati je manna to t\u2019orun wa nihin\nL\u2019orun yo si gbe imo \u2018pe asegun,\nYo wo \u2018so funfun, yo si dade wura.","n":3}]},{"n":11,"t":"Aw'omo ogun oba ti a feje re ra","k":"","s":[{"p":"v","t":"Aw\u2019omo ogun oba tia f\u2019eje Re ra,\nAsi mura lati jagun fun Kristi Oluwa,\nA ngb\u2019arin ota wa, sugbon a nf\u2019 ayo korin,\nOkan wa yio duro gbonyin-gbonyin,\nAwon omo ogun Oba.","n":1},{"p":"c","t":"Awa omo ogun Oba\nA o korin iyin Re\nA o si ja tokan-tokan\nF\u2019Oba Ologo julo.","n":1},{"p":"v","t":"Aw\u2019omo ogun Oba,\nSo f\u2019ayo l\u2019oko Re,\nO ko eniti a kan mo \u2018gi\nGba Kristi Oba wa mbe,\nAdanu l\u2019ere aiye a o f\u2019ayo gba iya,\nLati bowo f\u2019oruko Re,\nb\u2019omo ogun Oba.","n":2},{"p":"v","t":"Awa omo ogun Oba,\nA o jade pelu Re,\nBi awa ba le ba jiya,\nK\u2019a nsi ru itiju,\nK\u2019a gb\u2019a asia Re ga,\n\u2018Tori akoko nlo,\nA ti gba ade nsunmole,\nF\u2019awon omo ogun Oba.\nAwa omo ogun Oba\nA o korin iyin Re\nA o si ja tokan-tokan\nF\u2019Oba Ologo julo.\nChorus:","n":3}]},{"n":12,"t":"Aye si mbe","k":"","s":[{"p":"v","t":"Aye si mbe! Ile Od\u2019agutan,\nEwa ogo re npe o pe \u201cMa bo\u201d\nWole, wole, wole nisisiyi.","n":1},{"p":"v","t":"Ojo lo tan, orun si fere wo,\nOkunkun de tan, \u2018mole nkoja lo,\nWole, wole, wole nisisiyi.","n":2},{"p":"v","t":"Ile iyawo na kun fun ase;\nWole, wole to oko \u2018yawo lo;\nWole, wole, wole nisisiyi.","n":3},{"p":"v","t":"O nkun! O nkun! Ile ayo na nkun\nYara! Mase pe ko kun ju fun O!\nWole, wole, wole nisisiyi.","n":4},{"p":"v","t":"\u201cAye si mbe\u201d ilekun si sile,\nIlekun ife, iwo ko pe ju,\nWole, wole, wole nisisiyi.","n":5},{"p":"v","t":"Wole, wole! Tire ni ase na,\nWa gb\u2019ebun \u2018fe ayeraye lofe!\nWole, wole, wole nisisiyi.","n":6},{"p":"v","t":"Kiki ayo l\u2019o wa nibe, wole!\nAwon angeli npe o fun ade,\nWole, wole, wole nisisiyi.","n":7},{"p":"v","t":"L\u2019ohun rara n\u2019ipe ife na ndun!\nWa ma jafara, wole, ase na!\nWole, wole, wole nisisiyi.","n":8},{"p":"v","t":"K\u2019ile to su, ilekun na le ti\n\u2018Gba na o k\u2019abamo! \u201co se! o se!\u201d\nO se, o se, ko s\u2019aye mo; o se!.","n":9}]},{"n":13,"t":"Baba a tun pade","k":"G","s":[{"p":"v","t":"Baba, a tun pade l\u2019oo\u2019ko Jesu,\nA si wa teriba lab\u2019ese Re,\nAtun fe gb\u2019ohun wa s\u2019oke si O\nLati wa anu, lati k\u2019orin iyin.","n":1},{"p":"v","t":"A yin O fun itoju \u2019gba gbogbo\nOjojumo l\u2019a o ma rohin \u2019se Re\nWiwa laye wa, anu Re ha ko\nApa re ki O fi ngba \u2019ni mora.","n":2},{"p":"v","t":"O se! a ko ye fun ife nla Re,\nA sako kuro lodo Re poju,\nSugbon kikankikan ni O si npe\nNje a de a pada wa \u2019le Baba.","n":3},{"p":"v","t":"Nipa o\u2019ko t\u2019o b\u2019or\u2019ohun gbogbo\nNipa ife t\u2019o ta \u2019fe gbogbo yo,\nNipa eje ti a ta fun ese,\nSilekun anu, si gba \u2019ni s\u2019ile\nEnd.\nLast verse.","n":4}]},{"n":14,"t":"Baba eleda wa","k":"G","s":[{"p":"v","t":"Baba, eleda wa,\nGbo orin iyin wa\nL\u2019aye ati l\u2019orun,\nBaba Olubukun:\nIwo l\u2019ogo ati iyin,\nOpe, ati ola ye fun.","n":1},{"p":"v","t":"\u2018Wo Olorun Omo,\nT\u2019O ku lati gba wa;\nEni t\u2019O ji dide,\nTi O si goke lo:\nIwo l\u2019ogo, ati iyin,\nOpe, ati ola ye fun.","n":2},{"p":"v","t":"Si O Emi Mimo,\nNi a korin iyin:\nIwo t\u2019o f\u2019imole\nIye si okan wa;\nIwo l\u2019ogo, ati iyin,\nOpe, ati ola ye fun.","n":3},{"p":"v","t":"Mimo, mimo, mimo,\nSi O Olorun wa\nL\u2019aye ati l\u2019orun,\nL\u2019a o ma korin pe,\nIwo l\u2019ogo, ati iyin,\nOpe, ati ola ye fun.","n":4}]},{"n":15,"t":"Bi krist\u2019 ti da okan mi nde","k":"","s":[{"p":"v","t":"Bi Krist\u2019 ti da okan mi nde,\nAye mi ti dabi Orun,\nLarin \u2018banuje at\u2019 aro,\nAyo ni lati mo Jesu.","n":1},{"p":"c","t":"Halleluya! Ayo l\u2019o je,\nPe mo ti ri \u2018dariji gba;\nIbikibi ti mo ba wa,\nKo s\u2019ewu, Jesu wa nibe.","n":1},{"p":"v","t":"Mo ti ro pe Orun jina,\nSugbon nigbati Jesu de,\nL\u2019Orun ti de \u2018nu okan mi,\nNibe ni yo si wa titi.","n":2},{"p":"v","t":"Nibo l\u2019a ko le gbe l\u2019aye?\nL\u2019or\u2019oke tabi petele?\nL\u2019ahere tabi agbala?\nKo s\u2019ewu, Jesu wa nibe.","n":3}]},{"n":16,"t":"Bibeli iwe aiyeraiye","k":"","s":[{"p":"v","t":"Bibel\u2019 iwe aiyeraiye!\nTani le r\u2019idi re?\nTani le so idide re?\nTani le m\u2019opin re?","n":1},{"p":"v","t":"Asiri Olodumare;\nIko Oba orun;\nIda t\u2019o pa oro iku;\nAworan Olorun.","n":2},{"p":"v","t":"Okan ni O larin opo,\nIwe aiye \u2018gbani,\nIwo l\u2019o s\u2019ona igbala,\nDi mimo f\u2019araiye.","n":3},{"p":"v","t":"Isura ti Jesu Kristi\nOba nla t\u2019o gunwa;\nJo, tumo ara re fun mi,\nKi \u2018m\u2019 ye siyemeji.","n":4},{"p":"v","t":"Ki \u2018m\u2019 si o pelu adura\nKi \u2018m\u2019 k\u2019 eko ninu re,\nIwo Iwe Aiyeraiye,\nF\u2019ife Jesu han mi.","n":5}]},{"n":17,"t":"Bugbe re ti lewa to","k":"","s":[{"p":"v","t":"Bugbe Re ti l\u2019ewa to\nNi \u2018le mole at\u2019ife\nBugbe Re ti l\u2019ewa to\nLaiye ese at\u2019osi\nokan mi nfa nitoto\nFun idapo enia Re\nFun imole olu Re\nFun ekun re Olorun","n":1},{"p":"v","t":"Ayo ba awon eiye\nTi nfo pepe Re ka\nAyo okan t\u2019o simi\nL\u2019aiya Baba l\u2019o poju\nGege b\u2019adaba Noa\nTi ko r\u2019ibi simi le\nNwon pada sodo Baba\nNwon si nyo titi aiye","n":2},{"p":"v","t":"Nwon ko simi iyin won\nNinu aiye osi yi\nOmi nsun ni aginju\nManna nt\u2019orun wa fun won\nNwon nlo lat\u2019ipa de pa\nTiti nwon si wole l\u2019ese Re,\nT\u2019O mu won la ewu ja.","n":3},{"p":"v","t":"Baba je ki njere be\nS\u2019amona mi l\u2019aiye yi\nF\u2019ore ofe pa mi mo\nFun mi l\u2019aye lodo Re\nIwo l\u2019Orun at\u2019 Asa,\nTo okan isina mi;\nIwo l\u2019orisun ore\nRo ojo re sori mi","n":4}]},{"n":18,"t":"B\u2019olorun oba orun","k":"","s":[{"p":"v","t":"Ti ma nsoro n\u2019igba ni;\nO tun ba wa soro be loni\nArakunrin, oto ni.\nOhun t\u2019O ba wi fun o;\nOhun kan l\u2019aigbodo-mase: gboran","n":1},{"p":"c","t":"Sa gboran, sa gboran\nEyi ni \u2018fe Re,\n\u2018Gbat\u2019 O ba ranse si o\nSa gboran, Sa gboran.","n":1},{"p":"v","t":"Bi o ba je t\u2019Oluwa\nO ni lati gbo tire,\nKo s\u2019ona \u2018hinrere miran mo;\nMase sa ase Re ti\nMa si se lo oro Re,\n\u2018Gbat\u2019 Olugbala ba nsoro, sa gbo.","n":2},{"p":"v","t":"Bi o ba fe ni ipin\nNi \u2018lu daradara ni\nLehin aiye wa buburu yi;\nBi o ko tile m\u2019ona,\nKrist y\u2019o wipe, \u201ctele Mi\u201d\nIgbagbo y\u2019o si wipe, sa gboran","n":3}]},{"n":19,"t":"E funpe naa kikan","k":"","s":[{"p":"v","t":"E fun pe naa kikan,\nipe ihinrere,\nk\u2019o fun jake jado,\nL\u2019eti gbogbo eda.","n":1},{"p":"c","t":"Odun idasile ti de;\nPada elese pada.\n(2ce)","n":1},{"p":"v","t":"Fun \u2018pe t\u2019Od\u2019aguntan;\nT\u2019a ti pa s\u2019etutu,\nJe ki agbaye mo,\nAgbara eje Re.","n":2},{"p":"v","t":"Eyin eru ese,\nE so\u2019ra yin d\u2019omo,\nLowo Kristi Jesu,\nE gb\u2019ominira yin.","n":3},{"p":"v","t":"Olori Alufa,\nL\u2019Olugbala ise;\nO fi \u2018ra Re rubo,\nArukun, aruda.","n":4},{"p":"v","t":"Okan alare, wa,\nSinmi laya Jesu,\nOnirobinuje,\nTujuka, si ma yo.","n":5}]},{"n":20,"t":"Eje k'a f'inu didun","k":"","s":[{"p":"v","n":1,"t":"Eje k'a f'inu didun\nYin Oluwa Olore\nAnu Re, O wa titi\nLododo dajudaju."},{"p":"v","n":2,"t":"On nipa agbara Re,\nF'imole d'aye titun,\nAnu Re, O wa titi\nLododo dajudaju."},{"p":"v","n":3,"t":"O mbo gbogb'eda 'laye,\nO npese fun aini won,\nAnu Re, O wa titi\nLododo dajudaju."},{"p":"v","n":4,"t":"O bukun ayanfe Re,\nLi aginju iparun,\nAnu Re, O wa titi\nLododo dajudaju."}]},{"n":21,"t":"Elese wa s'orisun na","k":"","s":[{"p":"v","t":"Elese wa s\u2019orisun na,\nWa pelu \u2018banuje re,\nRi won sinu omi jijin,\n\u2018Wo y\u2019o r\u2019irorun nibe.","n":1},{"p":"c","t":"Yara kalo, mase duro,\nIseju kan le so emi re nu,\nJesu nduro lati gba o,\nAnu mbe fun o loni.","n":1},{"p":"v","t":"Wa t\u2019iwo t\u2019eru ese re,\nJesu ti nduro de o,\nB\u2019ese re pon bi alari,\nWon yio funfun bi snow.","n":2},{"p":"v","t":"Jesu Olugbala wipe,\nAwon ti o ba gbagbo,\nTi nwon si ronupiwada,\nY\u2019o r\u2019iye gba lodo Re.","n":3},{"p":"v","t":"Wa we ninu orisun na,\nF\u2019eti si ohun ife,\nJeki awon Angeli yo,\nF\u2019elese to yi pada.","n":4}]},{"n":22,"t":"Ema te siwaju, kristian ologun","k":"","s":[{"p":"v","t":"Ema te siwaju, Kristian ologun,\nMa tejumo Jesu t\u2019O mbe niwaju\nKristi Oluwa wa ni Balogun wa,\nWo! asia Re wa niwaju ogun;","n":1},{"p":"c","t":"E ma te siwaju, Kristian ologun,\nSa tejumo Jesu t\u2019O mbe niwaju.","n":1},{"p":"v","t":"Ni oruko Jesu, ogun esu sa,\nNje Kristian ologun, ma nso s\u2019 isegun;\nOrun apadi mi ni hiho iyin,\nAra, gb\u2019ohun nyin ga, gb\u2019orin nyin s\u2019oke.","n":2},{"p":"v","t":"Bi egbe ogun nla, n\u2019ijo Olorun,\nAra, a nrin l\u2019 ona t\u2019awon mimo rin;\nA ko yawa n\u2019ipa, egbe kan ni wa,\nOkan l\u2019eko, n\u2019ife ati n\u2019ireti.","n":3},{"p":"v","t":"Ite at\u2019ijoba wonyi le parun,\nSugbon Ijo Jesu y\u2019o wa titi lai,\nOrun apadi ko le bor\u2019ijo yi,\nA n\u2019ileri Jesu, eyi ko le ye.","n":4},{"p":"v","t":"E ma ba ni kalo, enyin enia;\nD\u2019ohun nyin po mo wa, l\u2019orin isegun,\nOgo, iyin, ola, fun Kristi Oba,\nEyi ni y\u2019o ma je orin wa titi.","n":5}]},{"n":23,"t":"Emi 'ba n'egberun ahon","k":"","s":[{"p":"v","t":"Emi \u2018ba n\u2019egberun ahon,\nFun \u2018yin Olugbala,\nOgo Olorun Oba mi\nIsegun ore Re.","n":1},{"p":"c","t":"Abi ko seun fun e\n(a o ma seun fun mi)\nAbi ko da e l\u2019are\n(a o ma damilare)\nEje re seun fun mi ooo(eje re seun fun mi)","n":1},{"p":"v","t":"Jesu t\u2019o seru wa d\u2019ayo\nT\u2019o mu banuje tan\nOrin ni l\u2019eti elese\nIye at\u2019ilera.","n":2},{"p":"v","t":"O segun agbara ese\nO da onde sile;\nEje Re le w\u2019eleri mo,\nEje Re seun fun mi.","n":3},{"p":"v","t":"O s\u2019oro, oku gb\u2019ohun Re\nO gba emi titun;\nOnirobinuje y\u2019ayo,\nOtosi si gbagbo.","n":4},{"p":"v","t":"Odi, e korin iyin Re;\nAditi, gbohun Re;\nAfoju, Olugbala de,\nAyaro, fo f\u2019ayo.","n":5},{"p":"v","t":"Baba mi at\u2019Olorun mi,\nFun mi ni \u2018ranwo Re;\nKi nle ro ka gbogbo aye,\nOla oruko Re.","n":6}]},{"n":24,"t":"Emi ni, ma beru","k":"","s":[{"p":"v","t":"N\u2019irumi at\u2019iji aye,\nMo gbo ohun itunu kan;\nO nso simi l\u2019eti wipe,\nEmi ni, mase beru.","n":1},{"p":"v","t":"Emi l\u2019o we okan re mo,\nEmi l\u2019o mu ki o reran;\nEmi n\u2019iye imole re,\nEmi ni, mase beru.","n":2},{"p":"v","t":"Awon igbi omi wonyi,\nTi f\u2019agbara won lu mi ri;\nWon ko le se o nibi mo,\nEmi ni, mase beru.","n":3},{"p":"v","t":"Mo ti mu ago yi l\u2019ekan,\nWo ko le mo kikoro re;\nEmi ti mo bi o ti ri,\nEmi ni, mase beru.","n":4},{"p":"v","t":"Mo pe lor\u2019eni arun re,\nOju mi ko ye lara re;\nIbukun mi wa l\u2019ori re,\nEmi ni, mase beru.","n":5},{"p":"v","t":"Gbat\u2019 emi re ba pin laye,\nT\u2019awon t\u2019orun wa pade re;\nW o gbohun kan to mo pe,\nEmi ni, mase beru.","n":6}]},{"n":25,"t":"Emi orun gbadura wa","k":"","s":[{"p":"v","t":"Emi \u1ecdrun, gb\u2019adura wa,\nWa gbe \u2018nu ile yi;\nS\u1ecdkale p\u1eb9l\u2019agbara R\u1eb9,\nWa, \u1eb8mi Mim\u1ecd, wa.","n":1},{"p":"v","t":"Wa bi \u2018m\u1ecdl\u1eb9 si fihan wa\nB\u2019aini wa ti p\u1ecd to;\nWa t\u1ecd wa si \u1ecdna iye\nTi olododo nrin.","n":2},{"p":"v","t":"Wa, bi ina \u1eb9b\u1ecd mim\u1ecd,\nS\u2019\u1ecdkan wa di mim\u1ecd,\nJ\u1eb9 ki \u1ecdkan wa j\u1eb9 \u1ecdr\u1eb9\nF\u2019oruk\u1ecd Oluwa.","n":3},{"p":"v","t":"Wa, bi iri, si wa bukun\nAkoko mim\u1ecd yi,\nKi \u1ecdkan alaileso wa\nLe y\u1ecd l\u2019agbara R\u1eb9.","n":4},{"p":"v","t":"Wa, bi adaba, n\u2019apa R\u1eb9,\nApa ife mim\u1ecd,\nWa, j\u1eb9 ki Ij\u1ecd R\u1eb9 l\u2019aye\nDabi ij\u1ecd t\u2019\u1ecdrun.","n":5},{"p":"v","t":"\u1eb8mi \u1ecdrun, gb\u2019adura wa,\nS\u2019aye yi d\u2019ile R\u1eb9;\nS\u1ecdkal\u1eb9 p\u1eb9l\u2019agbara R\u1eb9,\nWa, \u1eb8mi Mim\u1ecd wa.","n":6}]},{"n":26,"t":"Enyin ni imole aiye","k":"","s":[{"p":"v","t":"Mo fe kin nje imole fun Jesu\nNibikibi, ki nfi ewa Re han\nKi nma dagba n\u2019nu ore-ofe Re,\nKi nje imole Re l\u2019aiye.","n":1},{"p":"c","t":"Ki ntan imole, ki ntan imole,\nKi ntan \u2018mole, ife atorunwa:\nKi nma f\u2019ogo fun l\u2019osan at\u2019oru,\nKi nma tan \u2018mole fun Jesu","n":1},{"p":"v","t":"Mo fe ki nje imole fun Jesu,\nNinu ayo tabi ibanuje;\nKi nje \u2018ranlowo f\u2019awon t\u2019eru npa,\nKi nje imole Re l\u2019aiye.","n":2},{"p":"v","t":"Mo fe ki nje imole fun Jesu,\nImole ninu aiye ese yi;\nKi nmu awon ti nsako pada bo,\nKi nma gbe oruko Re ga.","n":3},{"p":"v","t":"Mo fe ki nje imole fun Jesu,\nKi nfi tayotayo sure \u2018je mi;\nKi ngbekele or\u2019 ofe Re nikan\nTiti ngo fi ri oju Re\nKi ntan imole, ki ntan imole,\nKi ntan \u2018mole, ife atorunwa:\nKi nma f\u2019ogo fun l\u2019osan at\u2019oru,\nKi nma tan \u2018mole fun Jesu\nChorus:\nAmin","n":4}]},{"n":27,"t":"Ewe ti oba orun","k":"","s":[{"p":"v","t":"Ewe ti Oba orun,\nKorin didun b\u2019e ti nlo;\nKorin \u2018yin Olugbala,\nOlogo n\u2019nu ise Re.","n":1},{"p":"c","t":"A nlo sodo Olorun\nL\u2019ona t\u2019awon baba rin\nNwon si nyo nisisiyi,\nAyo won lawa o ri.\nA nlo sodo Olorun\nL\u2019ona t\u2019awon baba rin\nNwon si nyo nisisiyi,\nAyo won lawa o ri.","n":1},{"p":"v","t":"Korin agbo kekere,\nE o simi n\u2019ite Re;\nIb\u2019 a pese \u2018joko nyin\nIbe si n\u2019Ijoba yin.","n":2},{"p":"v","t":"Woke, omo imole\nIlu Sion wa lokan;\nIbe n\u2019ile wa titi,\nIbe l\u2019a o r\u2019Oluwa.","n":3},{"p":"v","t":"Ma sa, e duro l\u2019ayo,\nNi eti ile ti yin;\nKristi Omo Baba nwi\nPe, Laifoya k\u2019a ma lo.","n":4},{"p":"v","t":"Jesu, a nlo l\u2019ase Re,\nA ko \u2018hun gbogbo sile\nIwo ma j\u2019Amona wa\nA o si ma ba O lo.","n":5}]},{"n":28,"t":"Eyin ero nibo l\u2019e nlo","k":"","s":[{"p":"v","t":"\u201cEyin ero nibo l\u2019 e nlo\nT\u2019 eyin t\u2019 opa lowo nyin?\u201d\nA nrin ajo mimo kan lo\nNipa ese Oba wa.\nLori oke on petele,\nA nlo s\u2019afin Oba rere,\nA nlo s\u2019afin Oba rere,\nA nlo sile t\u2019 odara\nA nlo s\u2019afin Oba rere,\nA nlo sile t\u2019 odara.","n":1},{"p":"v","t":"Eyin ero, e so fun ni\nTi ireti enyin ni?\nAso mimo , ade ogo\nNi Jesu y\u2019o fi fun wa;\nOmi iye l\u2019a o ma mu\nAo ba Olorun wa gbe\nAo ba Olorun wa gbe\nNile mimo didara\nAo ba Olorun wa gbe\nNile mimo didara.","n":2},{"p":"v","t":"E ko beru ona t\u2019 e nrin\nEnyin ero kekere?\nOre airi npelu wa lo,\nAwon Angel yi wa ka\nJesu Kristi l\u2019 amona wa,\nY\u2019 o ma so wa, y\u2019o ma to wa\nY\u2019 o ma so wa, y\u2019o ma to wa\nNinu ona ajo wa\nY\u2019 o ma so wa, y\u2019o ma to wa\nNinu ona ajo wa.","n":3},{"p":"v","t":"\u201cEro a fe ba nyin kegbe ,\nL\u2019 ona ajo s\u2019 ile na;\u201d\nWa ma kalo, wa ma kalo,\nWa si egbe ero wa,\nWa e ma se fi wa sile,\nJesu nduro, o nreti wa\nJesu nduro, o nreti wa\nNile mimo t\u2019 o dara\nJesu nduro, o nreti wa\nNile mimo t\u2019 o dara\u2026\u2026 Amin","n":4}]},{"n":29,"t":"Eyin logo, eyin Mimo","k":"","s":[{"p":"v","t":"Jesu, mo wa sodo Re,\nJe ki n le ma to O leyin,\nBi \u2018ni mi gbogbo segbe,\nTi ero mi gbogbo si soji.","n":1},{"p":"c","t":"Eyin logo, eyin mimo,\nE f\u2019ope fun Baba loke,\nDa wa si Baba n\u2019nu anu Re\nNi kehin gba okan wa la.","n":1},{"p":"v","t":"Keferi, Imale, e wa\nOnigbagbo, ma kalo,\nK\u2019a jo yin Olorun wa,\nK\u2019a le d\u2019ade ni \u2018kehin.","n":2}]},{"n":30,"t":"Eyin oba ogo","k":"F","s":[{"p":"v","t":"E yin Oba ogo, Oun ni Olorun,\nYin fun 'se 'yanu ti o ti fihan,\nO wa pel\u2019awon ero mimo l'ona,\nO si je imole won l'osan l'oru.","n":1},{"p":"c","t":"E yin Angel 'didan,\nlu duru wura,\nKi gbogbo yin juba,\nt'e nwo oju re,\nNi gbogbo 'joba re, b'aye ti nyi lo.\nIse re y'o ma yin\nIse re y'o ma yin\nFi ibukun fun Oluwa okan mi.","n":1},{"p":"v","t":"E yin fun 'rapada ti gbogbo okan,\nE yin fun orisun imularada,\nFun inu rere ati itoju re,\nFun 'daniloju pe O ngbo adura.","n":2},{"p":"v","t":"E yin fun idanwo\nbi okun ife,\nT'o nso wa po mo awon ohun orun,\nFun 'gbagbo ti \u2018nsegun, 'reti ti ki sa,\nFun ile ogo t'O ti pese fun wa.","n":3}]},{"n":31,"t":"Fa mi mora","k":"","s":[{"p":"v","t":"Tire l\u2019emi se, mo ti gb\u2019ohun Re,\nO nso ife Re si mi:\nSugbon mo fe n de l\u2019apa igbagbo,\nKi nle tubo sunmo O.","n":1},{"p":"v","t":"Fa mi mora, mora, Oluwa,\nSib\u2019 agbelebu t\u2019O ku,\nFa mi mora, mora, mora, Oluwa,\nSib\u2019 eje Re t\u2019o n\u2019iye","n":2},{"p":"v","t":"Ya mi si mimo fun ise Tire,\nNipa ore-ofe Re;\nJe ki nfi okan igbagbo w\u2019oke,\nK\u2019ife mi te si Tire.","n":3},{"p":"v","t":"A! ayo mimo ti wakati kan\nTi mo lo nib\u2019 ite Re;\n\u2018Gba mo gb\u2019adura si Olorun mi,\nMo ba soro bi ore.","n":4},{"p":"v","t":"Ijinle ife mbe ti nko le mo,\nTiti ngo koja odo;\nAyo giga ti emi ko le so,\nTiti ngo fi wa \u2018simi.","n":5}]},{"n":32,"t":"Fun mi n\u2019iwa Mimo","k":"","s":[{"p":"v","t":"Fun mi n\u2019iwa mimo; igbona okan,\nSuru ninu iya; aro fun ese;\nIgbagbo n\u2019nu Jesu; ki nmo \u2018toju Re;\nAyo n\u2019nu isin Re; emi adura.","n":1},{"p":"v","t":"Fun mi l\u2019okan ope; igbekele Krist\u2019,\nItara f\u2019ogo Re, \u2018reti n\u2019n\u2019oro Re,\nEkun fun iya Re, \u2018rora f\u2019ogbe Re,\nIrele n\u2019nu \u2018danwo; iyin fun \u2018ranwo.","n":2},{"p":"v","t":"Fun mi n\u2019iwa funfun, fun mi n\u2019isegun,\nWe abawon mi nu; fa \u2018fe mi s\u2019Orun\nMu mi ye \u2018joba Re; ki nwulo fun O;\nKi nj\u2019alabukun fun; ki ndabi Jesu.","n":3}]},{"n":33,"t":"Fun wa ni \u2018le kristian!","k":"","s":[{"p":"v","t":"Ile ti a nkeko Bibeli,\nIle ti a nlepa \u2018fe Baba\n\u2018Le ti \u2018fe Re f\u2019ewa de lade;\nOlorun Baba wa,\nFun wa n\u2019ile Kristian.","n":1},{"p":"v","t":"Nibiti bale je oloto,\nIle to bo lowo asise\nIle ti nyo fun \u2018fe at\u2019orin;\nOlorun Baba wa,\nFun wa ni \u2018le Kristian","n":2},{"p":"v","t":"Nibit\u2019 iya-ile b\u2019ayaba\nNfihan p\u2019ona Re lo dara ju,\nIle t\u2019a gb\u2019Olugbala laye;\nOlorun Baba wa,\nFun wa ni \u2018le Kristian","n":3},{"p":"v","t":"Nibiti a nto awon \u2018mode\nLati mi Kristi to feran won,\nIle ti a ntanna adura,\nOlorun Baba wa,\nFun wa ni \u2018le Kristian","n":4}]},{"n":34,"t":"Gbadura wa","k":"","s":[{"p":"v","t":"Gb\u2019adura wa Oba aiye\nGbat\u2019 a wole fun O;\nGbogbo wa nkigbe n\u2019irele\nA mbebe fun anu.","n":1},{"p":"v","t":"Tiwa l\u2019ebi, Tire l\u2019anu\nMase le wa pada;\nSugbon gbo \u2018gbe wa n\u2019ite Re\nRan adura wa lowo.","n":2},{"p":"v","t":"Ese awon baba wa po\nTiwa ko si kere;\nSugbon lati irandiran,\nL\u2019o ti f\u2019ore Re han.","n":3},{"p":"v","t":"Nigba ewu, b\u2019omi jija,\nYi ilu wa yi ka\nIwo l\u2019a wo, t\u2019a si kepe\nK\u2019a ma ri iranwo Re.","n":4},{"p":"v","t":"L\u2019ohun kan, gbogbo wa wole;\nL\u2019abe iyonu Re,\nGbogbo wa njewo ese wa,\nA ngbawe fun \u2018le wa.","n":5},{"p":"v","t":"F\u2019oju anu wo aini wa,\nBi a ti nkepe O;\nMa f\u2019idajo Re ba wa wi,\nDa wa si l\u2019anu Re.","n":6}]},{"n":35,"t":"Gbangba l'oju re Olorun","k":"","s":[{"p":"v","t":"Gbangba l\u2019oju Re Olorun mi,\nS\u2019ohun gbogbo ta nse,\nL\u2019osan, t\u2019oru bakan na ni,\nL\u2019oju Re Olorun.","n":1},{"p":"v","t":"Ko s\u2019ese kan ti a le da,\nKo s\u2019oro t\u2019ale so,\nTi ko si ninu iwe Re,\nFun iranti gbogbo.","n":2},{"p":"v","t":"Ese ole, ese iro,\nEse aiforiji,\nEse ka soro eni lehin,\nBaba dariji wa.","n":3},{"p":"v","t":"Ese igberaga okan,\nEse isokuso,\nEse aini \u2018gbagbo daju,\nBaba dariji wa.","n":4},{"p":"v","t":"A! L\u2019ojo nla ojo \u2018dajo,\nMa je k\u2019oju tiwa,\nT\u2019oju gbogbo aye yio pe,\nBaba dariji wa.","n":5},{"p":"v","t":"Dariji mi Olorun mi,\nKin to lo laiye yi,\nSi pa gbogbo ese mi re,\nBaba dariji mi.","n":6}]},{"n":36,"t":"Gbo orin enirapada","k":"F","s":[{"p":"v","t":"Gbo orin eni irapada,\nOrin iyin titun,\nNwon nyin Odagutan l\u2019ogo\nNwon nkorin na bayi","n":1},{"p":"c","t":"Ogo f\u2019Eni to fe wa,\nT\u2019o f\u2019eje Re we wa,\nTi o si so wa di mimo,\nN\u2019nu ibi iye ni.","n":1},{"p":"v","t":"A f\u2019oso wa n\u2019nu eje Re,\nO si funfun laulau;\n\u2018Mole t\u2019 O tan si okan wa\nNf\u2019 Ipa oto Re han.","n":2},{"p":"v","t":"Nipa agbara eje Jesu,\nL\u2019a fo \u2018tegun esu;\nNipa agbara oto Re,\nLa se bori ota.","n":3},{"p":"v","t":"Je ka juba Odagutan\nT\u2019o fun wa ni \u2018mole;\nTire l\u2019ogo at\u2019agbara,\nOlanla at\u2019ipa.","n":4}]},{"n":37,"t":"Ha! Egbe mi","k":"","s":[{"p":"v","t":"Ha! Egbe mi e w\u2019asia\nBi ti nfe lele!\nOgun Jesu fere de na,\nA fere segun.","n":1},{"p":"c","t":"\u201cD\u2019 odi mu, Emi fere de\u201d\nBeni Jesu nwi,\nRan \u2018dahun pada s\u2019orun, pe\n\u201cAwa o di mu.\u201d","n":1},{"p":"v","t":"Wo opo ogun ti mbo wa;\nEsu nko won bo;\nAwon alagbara nsubu,\nA fe damu tan!","n":2},{"p":"v","t":"Wo asia Jesu ti nfe,\nGbo ohun ipe;\nA o segun gbogbo ota\nNi oruko Re.","n":3},{"p":"v","t":"Ogun ngbona girigiri,\nIranwo wa mbo;\nBalogun wa mb wa tete,\nEgbe, tujuka!","n":4}]},{"n":38,"t":"Hosannah eyin orun","k":"","s":[{"p":"v","t":"E gbori nyin s\u2019oke enu ona\nK\u2019Oluwa ogo wole\nEnit\u2019 O f\u2019eje Re r\u2019aiye pada,\nO mbo lati gba \u2018joba.","n":1},{"p":"c","t":"Hosanna, eyin Orun,\nHallelujah, eyin aiye,\nOrun, osupa e wole,\nKabiyesi f\u2019Oba wa.","n":1},{"p":"v","t":"Awa iran Israel ni Africa,\nE gb\u2019ola Oluwa ga\nAjagunmolu wa ti goke lo\nLati lo pese aye.","n":2},{"p":"v","t":"Wo, Oba ninu Ola nla Re,\nGun keke ofurufu,\nAgogo Orun pelu korin iyin\n\u2018Gbat\u2019 Oba ogo wole.","n":3},{"p":"v","t":"Okan mi nfa s\u2019agbala ayo na,\nNibiti Kristi gun wa,\nOdi yika ati Agbala Re,\nWura l\u2019a fi se loso.","n":4},{"p":"v","t":"Agbagba Merinlelogun wole\nPelu ade wura won,\nAt\u2019 awon Eda Alaye Merin,\nNwon nfi iye fo f\u2019ayo.","n":5}]},{"n":39,"t":"Ibase p'oluwa","k":"","s":[{"p":"v","t":"Ibase p\u2019Oluwa,\nOba to wa ni tiwa,\nLo ye k\u2019awa ma const EN=[],YO=[],ALL=[];
(HYMN_RAW_DATA.e||[]).forEach(h=>{const o={id:'en-'+h.n,n:h.n,t:h.t,k:h.k||'',s:(h.s||[]).map(s=>({type:s.p==='c'?'chorus':'verse',text:s.t,num:s.n||0})),lang:'en'};EN.push(o);ALL.push(o)});
(HYMN_RAW_DATA.y||[]).forEach(h=>{const o={id:'yo-'+h.n,n:h.n,t:h.t,k:h.k||'',s:(h.s||[]).map(s=>({type:s.p==='c'?'chorus':'verse',text:s.t,num:s.n||0})),lang:'yo'};YO.push(o);ALL.push(o)});
delete window.HYMN_RAW_DATA;

let tab='english',query='',dark=localStorage.getItem('d')==='1',
    favs=new Set(JSON.parse(localStorage.getItem('f')||'[]')),
    fs=parseInt(localStorage.getItem('s')||'18'),
    fontId=localStorage.getItem('fo')||'cormorant',
    curHymn=null,filtered=[],shown=0,BATCH=50;

const FONTS=[
  {id:'cormorant',l:'Cormorant',f:"'Cormorant Garamond','Times New Roman',Georgia,serif"},
  {id:'lora',l:'Lora',f:"'Lora','Times New Roman',Georgia,serif"},
  {id:'merriweather',l:'Merriweather',f:"'Merriweather','Times New Roman',Georgia,serif"},
  {id:'crimson',l:'Crimson Pro',f:"'Crimson Pro','Times New Roman',Georgia,serif"},
  {id:'mono',l:'JetBrains Mono',f:"'JetBrains Mono','Courier New',monospace"},
];

function getFont(){return(FONTS.find(x=>x.id===fontId)||FONTS[0]).f}
function saveFav(){localStorage.setItem('f',JSON.stringify([...favs]))}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
const $=id=>document.getElementById(id);

const heartSvg=(f,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f?'#C41E3A':'none'}" stroke="${f?'#C41E3A':'currentColor'}" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
const sunSvg=`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;
const moonSvg=`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>`;
const noteSvg=(s=11)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`;

// ── Views ──
let curView='home';
function showView(v){
  $('v-'+curView).classList.remove('active');
  curView=v;
  $('v-'+v).classList.add('active');
  window.scrollTo({top:0,behavior:'instant'});
  if(v==='browse'){updateBrowse();updateThemeUI();}
  if(v==='home')updateHome();
  if(v==='detail')updateThemeUI();
}

function updateHome(){
  $('eng-count').textContent=EN.length+' hymns';
  $('yor-count').textContent=YO.length+' hymns';
  $('fav-count').textContent=favs.size+' saved';
  // Piano keys
  let pk='';
  for(let i=0;i<18;i++) pk+=`<div style="flex:1;background:rgba(255,255,255,.04);border-right:1px solid rgba(255,255,255,.03)"></div>`;
  [1,2,null,4,5,6,null,8,9,null,11,12,13,null,15,16].forEach(p=>{
    if(p!==null) pk+=`<div style="position:absolute;left:${(p/18)*100-1.5}%;top:0;width:3%;height:55%;background:rgba(255,255,255,.08);border-radius:0 0 2px 2px"></div>`;
  });
  $('piano-keys').innerHTML=pk;
}

function setTab(t){tab=t;if(!query){const si=$('sinp');if(si)si.value='';}}

// ── Browse ──
function getList(){
  let list;
  if(query){
    list=tab==='favorites'?ALL.filter(h=>favs.has(h.id)):ALL;
  } else {
    list=tab==='favorites'?ALL.filter(h=>favs.has(h.id)):tab==='yoruba'?YO:tab==='all'?ALL:EN;
  }
  if(!query) return list;
  const q=query.toLowerCase(),qN=parseInt(q);
  return list.filter(h=>{
    if(!isNaN(qN)&&h.n===qN) return true;
    if(h.t.toLowerCase().includes(q)) return true;
    if(h.k.toLowerCase().includes(q)) return true;
    return h.s.some(s=>s.text.toLowerCase().includes(q));
  });
}

function updateBrowse(){
  $('browse-title').textContent=tab==='english'?'English Hymns':tab==='yoruba'?'Yorùbá Hymns':tab==='all'?'All Hymns':'Favorites';
  const tabs=$('tabs');
  tabs.innerHTML=['all','english','yoruba','favorites'].map(t=>{
    const a=tab===t;
    return `<div onclick="setTab('${t}');updateBrowse()" style="padding:10px 0;flex:1;text-align:center;cursor:pointer;font-size:11.5px;font-weight:${a?600:400};letter-spacing:1px;text-transform:uppercase;color:${a?'var(--red)':'var(--txt3)'};border-bottom:${a?'2.5px solid var(--red)':'2.5px solid transparent'};transition:all .2s">${t==='favorites'?'♥ Saved':t==='yoruba'?'Yorùbá':t==='all'?'All':'English'}</div>`;
  }).join('');
  filtered=getList();shown=0;renderList(true);
}

function renderList(clear){
  const list=$('hymn-list'),empty=$('empty-state'),more=$('load-more');
  if(clear)list.innerHTML='';
  if(filtered.length===0){
    empty.style.display='block';more.style.display='none';
    $('empty-msg').textContent=tab==='favorites'?'No favorites yet — tap ♥ on any hymn':'No hymns found';
    return;
  }
  empty.style.display='none';
  const end=Math.min(shown+BATCH,filtered.length);
  const frag=document.createDocumentFragment();
  for(let i=shown;i<end;i++){
    const h=filtered[i],row=document.createElement('div');
    row.className='hrow';
    const hasCho=h.s.some(s=>s.type==='chorus');
    row.innerHTML=`<div style="font-family:'Instrument Serif',serif;font-size:16px;font-weight:400;color:var(--red);min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--numBg);border-radius:12px">${h.n}</div><div style="flex:1;min-width:0"><div class="htitle">${esc(h.t)}</div><div class="hmeta">${h.k?noteSvg()+' '+esc(h.k):''}${hasCho?'<span class="badge" style="color:var(--red);background:var(--numBg)">chorus</span>':''}${h.lang==='yo'?'<span class="badge" style="color:var(--blue);background:rgba(58,59,129,.06)">Yorùbá</span>':''}</div></div><button class="fbtn" style="background:none;border:none;cursor:pointer;padding:6px;display:flex;flex-shrink:0">${heartSvg(favs.has(h.id))}</button>`;
    (function(hymn){row.addEventListener('click',function(){openHymn(hymn)})})(h);
    const fb=row.querySelector('.fbtn');
    (function(hid,btn){fb.addEventListener('click',function(e){e.stopPropagation();toggleFav(hid);btn.innerHTML=heartSvg(favs.has(hid))})})(h.id,fb);
    frag.appendChild(row);
  }
  list.appendChild(frag);
  shown=end;
  more.style.display=shown<filtered.length?'block':'none';
}

function loadMore(){renderList(false)}

let searchTimer;
function onSearch(v){
  query=v;$('sclear').style.display=v?'flex':'none';
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{filtered=getList();shown=0;renderList(true);},200);
}
function clearSearch(){$('sinp').value='';onSearch('');}
function focusSearch(){setTimeout(()=>{const s=$('sinp');if(s){s.value='';s.focus();}},100);}

// ── Detail ──
function openHymn(h){
  curHymn=h;
  $('detail-num').textContent='HYMN '+h.n;
  $('detail-title').textContent=h.t;
  let badges='';
  if(h.k) badges+=`<div style="display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border-radius:20px;padding:5px 14px;font-size:12.5px;font-weight:500;border:1px solid rgba(255,255,255,.06)">${noteSvg(13)} Key: ${esc(h.k)}</div>`;
  if(h.lang==='yo') badges+=`<div style="display:inline-flex;background:rgba(196,30,58,.15);border-radius:20px;padding:5px 14px;font-size:12.5px;border:1px solid rgba(196,30,58,.1)">Yorùbá</div>`;
  $('detail-badges').innerHTML=badges;
  
  const favBtn=$('detail-fav-btn'),nfb=favBtn.cloneNode(true);
  nfb.innerHTML=heartSvg(favs.has(h.id),20);
  favBtn.parentNode.replaceChild(nfb,favBtn);nfb.id='detail-fav-btn';
  nfb.addEventListener('click',function(){toggleFav(h.id);this.innerHTML=heartSvg(favs.has(h.id),20);});
  
  const list=h.lang==='yo'?YO:EN;
  const idx=list.findIndex(x=>x.id===h.id);
  const prev=idx>0?list[idx-1]:null,next=idx<list.length-1?list[idx+1]:null;
  const nb="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 15px;cursor:pointer;color:#fff;font-size:13px;font-weight:500;backdrop-filter:blur(8px)";
  let navH='';
  if(prev) navH+=`<button id="prev-btn" style="${nb}">‹ Prev</button>`;
  if(next) navH+=`<button id="next-btn" style="${nb}">Next ›</button>`;
  $('detail-nav').innerHTML=navH;
  if(prev){const pb=$('prev-btn');if(pb)pb.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openHymn(prev)});}
  if(next){const nb2=$('next-btn');if(nb2)nb2.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openHymn(next)});}
  
  renderLyrics();showView('detail');
}

function renderLyrics(){
  if(!curHymn) return;
  const font=getFont();document.fonts&&document.fonts.ready.then(function(){});let html='';
  curHymn.s.forEach((sec,i)=>{
    const isC=sec.type==='chorus';
    if(i>0) html+=`<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin:20px 0"><div style="flex:1;max-width:24px;height:1px;background:var(--bdr)"></div><span style="font-size:8px;color:var(--txt3);opacity:.3">♪</span><div style="flex:1;max-width:24px;height:1px;background:var(--bdr)"></div></div>`;
    html+=`<div style="margin-bottom:4px"><span style="font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:${isC?'var(--red)':'var(--txt3)'};background:${isC?'var(--numBg)':'var(--vLbl)'};padding:3px 9px;border-radius:5px;display:inline-block;margin-bottom:8px">${isC?'♪ Chorus':'Verse '+sec.num}</span></div>`;
    const lines=sec.text.split('\n').map(l=>esc(l)).join('<br>');
    if(isC) html+=`<div style="font-size:${fs}px;line-height:1.8;font-family:${font};color:var(--lyric);background:var(--choBg);border:1px solid var(--choBdr);border-left:3px solid var(--red);border-radius:12px;padding:14px 18px;font-style:italic;">${lines}</div>`;
    else html+=`<div style="font-size:${fs}px;line-height:1.8;font-family:${font};color:var(--lyric);padding:0 2px;">${lines}</div>`;
  });
  $('detail-lyrics').innerHTML=html;
}

function toggleFav(id,btn){
  favs.has(id)?favs.delete(id):favs.add(id);saveFav();
  if(btn)btn.innerHTML=heartSvg(favs.has(id));
  if(tab==='favorites'&&curView==='browse')updateBrowse();
}

function toggleDark(){
  dark=!dark;localStorage.setItem('d',dark?'1':'0');updateThemeUI();
}
function updateThemeUI(){
  $('browse-wrap').classList.toggle('dark',dark);
  $('detail-wrap').classList.toggle('dark',dark);
  $('font-sheet').classList.toggle('dark',dark);
  const icon=dark?sunSvg:moonSvg;
  $('theme-btn-browse').innerHTML=icon;
  $('theme-btn-detail').innerHTML=icon;
  $('theme-btn-detail').style.background=dark?'rgba(58,59,129,.9)':'#12132E';
}

function changeSize(d){fs=Math.max(14,Math.min(30,fs+d));localStorage.setItem('s',fs);renderLyrics();}
function showFontPicker(){
  $('font-options').innerHTML=FONTS.map(fo=>{
    const sel=fontId===fo.id;
    return `<div onclick="pickFont('${fo.id}')" style="display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:13px;cursor:pointer;margin-bottom:6px;background:${sel?'var(--numBg)':'transparent'};border:1.5px solid ${sel?'var(--red)':'var(--bdr)'};transition:all .15s">
      <div style="font-family:${fo.f};font-size:26px;width:44px;text-align:center;color:${sel?'var(--red)':'var(--txt)'}">Aa</div>
      <div style="flex:1"><div style="font-size:14px;font-weight:${sel?600:400};color:${sel?'var(--red)':'var(--txt)'}">${fo.l}</div><div style="font-family:${fo.f};font-size:12.5px;color:var(--txt2);margin-top:2px;font-style:italic">Amazing grace, how sweet…</div></div>
      ${sel?'<div style="color:var(--red)">✓</div>':''}
    </div>`;
  }).join('');
  $('font-sheet').style.background=dark?'#111827':'#fff';
  $('font-overlay').style.display='block';
}
function hideFontPicker(){$('font-overlay').style.display='none';}
function pickFont(id){fontId=id;localStorage.setItem('fo',id);hideFontPicker();
  var lyr=document.getElementById('detail-lyrics');
  if(lyr){lyr.style.display='none';setTimeout(function(){renderLyrics();lyr.style.display='block';},50);}
  else{renderLyrics();}
}

// ── Init ──
updateHome();updateThemeUI();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
