hough I perish, I will pray,\nI will pray, I will pray,\nThou of life the Living Way:\nO, save me at the Cross!\nThou hast said Thy grace is free,\nGrace is free, grace is free;\nHave compassion, Lord, on me;\nO, save me at the Cross!","n":2},{"p":"v","t":"Wash me in Thy cleansing blood,\nCleansing blood, cleansing blood,\nPlunge me now beneath the flood;\nO, save me at the Cross,\nOnly faith will pardon bring,\nPardon bring, pardon bring,\nIn that faith to Thee I cling:\nO, save me at the Cross!","n":3}]},{"n":244,"t":"How sweet the name","k":"Eb","s":[{"p":"v","t":"How sweet the name of Jesus sounds\nIn a believer's ear;\nIt soothes his sorrows, heals his wounds\nAnd drives away his fears.","n":1},{"p":"v","t":"It makes the wounded spirit whole,\nAnd calms the troubled breast;\n'Tis manna to the hungry soul,\nAnd to the weary rest.","n":2},{"p":"v","t":"Dear Name, the Rock on which I build,\nMy shield and hiding place,\nMy never failing Treasury, filled\nWith boundless stores of grace.","n":3},{"p":"v","t":"Jesus, my Shepherd, Saviour, Friend\nMy Prophet, Priest, and King,\nMy Lord, my Life, my Way, my End,\nAccept the praise I bring.","n":4},{"p":"v","t":"I would Thy boundless love proclaim\nWith every fleeting breath;\nSo shall the music of Thy Name\nRefresh my soul in death.","n":5}]},{"n":245,"t":"'Tis heaven there","k":"Ab","s":[{"p":"v","t":"Since Christ my soul from sin set free,\nThis world has been a heaven to me,\nAnd, mid earth's sorrow and its woe,\n'Tis heaven my Jesus here to know.","n":1},{"p":"c","t":"O hallelujah, yes 'tis heaven!\n\u201cTis heaven to know my sins forgiven;\nOn land or sea, what matters where,\nWhere Jesus is, 'tis heaven there.","n":1},{"p":"v","t":"Once heaven seemed afar-off place,\nTill Jesus showed His smiling face;\nNow it's be-gun within my soul.\n'Twill last while end-less ages roll.","n":2},{"p":"v","t":"What matter where on earth we dwell?\nOn mountain top, or in the dell?\nIn cottage or in mansion fair,\nWhere Jesus is, 'tis heaven there.","n":3}]},{"n":246,"t":"Take the world but give me Jesus","k":"F","s":[{"p":"v","t":"Take the world, but give me Jesus,\nAll its joys are but a name,\nBut His love abideth ever,\nThrough eternal years the same.","n":1},{"p":"c","t":"Oh, the height and depth of mercy!\nOh, the length and breadth of love!\nOh, the fullness of redemption,\nPledge of endless life above.","n":1},{"p":"v","t":"Take the world, but give me Jesus,\nSweetest comfort of my soul,\nWith my Saviour watching o\u2019er me,\nI can sing, though billows roll.","n":2},{"p":"v","t":"Take the world, but give me Jesus,\nLet me view His constant smile;\nThen throughout my pilgrim journey,\nLight will cheer me all the while.","n":3},{"p":"v","t":"Take the world, but give me Jesus,\nIn His Cross my trust shall be,\nTill, with clearer, brighter vision,\nFace to face my Lord I see.","n":4}]},{"n":247,"t":"He hideth my soul","k":"D","s":[{"p":"v","t":"A wonderful Saviour is Jesus, my Lord,\nA wonderful Saviour to me,\nHe hideth my soul in the cleft of the rock,\nWhere rivers of plea-sure I see.","n":1},{"p":"c","t":"He hideth my soul in the cleft of the rock,\nThat shadows a dry thirsty land;\nHe hid-eth my life in the depths of His love,\nAnd covers me there with His hand,\nAnd covers me there with His hand.","n":1},{"p":"v","t":"A wonderful Saviour is Jesus, My Lord,\nHe taketh my burden away,\nHe holdeth me up, and I shall not be moved,\nHe giveth me strength as my day.","n":2},{"p":"v","t":"With numberless blessings each moment He crowns\nAnd filled with His fullness divine,\nI sing in my rapture, oh, glory to God,\nFor such a Redeemer as mine!","n":3},{"p":"v","t":"When clothed in His brightness transported I rise,\nTo meet Him in clouds of the sky,\nHis perfect salvation, His wonderful love,\nI'll shout with the millions on high.","n":4}]},{"n":248,"t":"Keep close to Jesus","k":"G","s":[{"p":"v","t":"When you start for the land of unending heav\u2019nly rest,\nKeep close to Jesus all the way;\nHe\u2019s a true, faithful guide, and the way He knows the best,\nKeep close to Jesus all the way.","n":1},{"p":"c","t":"Keep close to Jesus,\nKeep close to Jesus,\nKeep close to Jesus all the way;\nBy day or by night never turn from the right,\nKeep close to Jesus all the way.","n":1},{"p":"v","t":"Never mind threat\u2019ning storms or the trials as you go,\nKeep close to Jesus all the way,\n\u2018Tis a comfort and joy when His favour we can know,\nKeep close to Jesus all the way.","n":2},{"p":"v","t":"To be safe from the darts of the dark and evil one,\nKeep close to Jesus all the way;\nTake the shield of true faith till the victory is won,\nKeep close to Jesus all the way.","n":3},{"p":"v","t":"We shall reach our new home up in heaven by and by,\nKeep close to Jesus all the way;\nWhere with those whom we love, we shall never weep nor sigh,\nKeep close to Jesus all the way.","n":4}]},{"n":249,"t":"'Tis so sweet to trust in Jesus","k":"Ab","s":[{"p":"v","t":"'TIS so sweet to trust in Jesus\nJust to take Him at His word;\nJust to rest upon His promise\nJust to know,\n\"Thus saith the Lord.\"","n":1},{"p":"c","t":"Jesus, Jesus, how I trust Him!\nHow I've proved Him o'er and o'er\nJesus, Jesus, precious Jesus!\nOh, for grace to trust Him more.","n":1},{"p":"v","t":"Oh, how sweet to trust in Jesus,\nJust to trust His cleansing blood!\nJust in simple faith to plunge me\n'Neath the healing, cleansing flood.","n":2},{"p":"v","t":"Yes, 'tis sweet to trust in Jesus,\nJust from sin and self to cease;\nJust from Jesus simply taking\nLife and rest, and joy and peace.","n":3},{"p":"v","t":"I'm so glad I learned to trust Thee,\nPrecious Jesus, Saviour, Friend;\nAnd I know that Thou art with me,\nWilt be with me to the end.","n":4}]},{"n":250,"t":"Jesus, lover of my soul","k":"Ab","s":[{"p":"v","t":"Jesus lover of my soul,\nlet me to Thy bosom fly,\nWhile the nearer waters roll,\nWhile the tempest still is high;\nHide me, O my Saviour, hide!\nTill the storm of life is past;\nSafe in-to the haven guide;\nO, receive my soul at last!","n":1},{"p":"v","t":"Other refuge have I none;\nHangs my helpless soul on Thee;\nLeave, ah! leave me not alone\nStill support and comfort me.\nAll my trust on Thee is stayed\nAll my help from Thee I bring;\nCover my defenseless head\nWith the shadow of Thy wing.","n":2},{"p":"v","t":"Thou, O Christ! art all I want,\nMore than all in Thee I find;\nRaise the fallen, cheer the faint,\nHeal the sick, and lead the blind,\nJust and Holy is Thy Name,\nI am all unrighteousness;\nVile and full of sin I am,\nThou art full of truth and grace.","n":3},{"p":"v","t":"Plenteous grace with Thee is found,\nGrace to cover all my sin;\nLet the healing streams abound,\nMake and keep me pure with-in,\nThou of life the fountain art,\nFreely let me take of Thee;\nSpring Thou up within my heart,\nRise to all eternity.","n":4}]},{"n":251,"t":"Rescue the perishing","k":"Bb","s":[{"p":"v","t":"Rescue the perishing,\nCare for the dying\nSnatch them in pity from sin and the grave;\nWeep o'er the erring ones,\nLift up the fallen,\nTell them of Jesus, the mighty to save.","n":1},{"p":"c","t":"Rescue, the perishing, care for the dying;\nJesus is merciful, Jesus will save.","n":1},{"p":"v","t":"Though they are slighting Him,\nStill He is waiting,\nWaiting the penitent child to receive,\nPlead with them earnestly,\nPlead with them gently,\nHe will forgive if they only believe.","n":2},{"p":"v","t":"Down in the human heart,\nCrushed by the tempter,\nFeelings lie buried that grace can restore;\nTouched by a loving heart,\nWakened by kindness,\nCords that were broken will vibrate once more.","n":3},{"p":"v","t":"Rescue the perishing,\nDuty demands it,\nStrength for Thy labour the Lord will pro-vide\nBack to the narrow way,\nPatiently win them;\nTell the poor wanderer a Saviour has died.","n":4}]},{"n":252,"t":"Bright, beautiful home","k":"C","s":[{"p":"v","t":"THERE is a Home eternal\nBeautiful and bright,\nWhile sweet joys supernal\nNever are dimmed by night,\nWhite-robed angels are singing\nEver around the bright throne\nWhen oh, when shall I see thee\nBeautiful, beautiful Home","n":1},{"p":"c","t":"Bright, beautiful Home bright\nBeautiful Home! '\nBright Home of our Saviour\nBright beautiful Home.","n":1},{"p":"v","t":"Flowers are ever springing\nIn that Home so fair\nLittle children singing\nPraises to Jesus there\nOh they swell the glad anthem\nEver around the bright throne\nWhen oh, when shall I see thee\nBeautiful, beautiful Home?","n":2},{"p":"v","t":"Soon shall join the ransomed,\nFar beyond the sky\nChrist is my Salvation\nWhy should I fear to die\nSoon my eyes shall behold Him\nSeated upon the bright throne\nThen, oh then shall I see thee\nBeautiful, beautiful Home?","n":3}]},{"n":253,"t":"One there is above all others","k":"G","s":[{"p":"v","t":"One there is above all others\nOh, how He loves!\nHe is love beyond a brother's\nOh, how He loves!\nEarthly friends may fail or leave us,\nOne day soothe the next day grieves us\nBut this friend will ne'er deceive us\nOh, how He loves us.","n":1},{"p":"v","t":"'Tis eternal life to know Him\nOh! how He loves!\nThink, O think how much we owe Him\nOh! how He loves!\nWith His precious blood He bought us\nIn the wilderness He sought us\nTo His fold He safety brought us,\nOh! how He loves!","n":2},{"p":"v","t":"We have found a friend in Jesus\nOh! how He loves! .\n\"Tis His great delight to bless us\nOh! how He loves!\nHow our hearts delight to hear Him\nBid us, dwell in safety near Him,\nWhy should we distrust or fear Him\nOh! how He loves!","n":3},{"p":"v","t":"Through His name we are forgiven\nOh, how He loves\nBackward shall our foes be driven,\nOh, how He loves\nBest of blessings He'll provide us\nNaught but good shall e'er betide us\nSafe to glory He will guide us,\nOh, how He loves!","n":4}]},{"n":254,"t":"O, for thousand tongues to sing","k":"F","s":[{"p":"v","t":"Oh for a thousand tongue to sing;\nMy dear Redeemer's praise\nThe glories of my God and King\nThe triumph of His grace.","n":1},{"p":"v","t":"Jesus the name that charms our fear;\nThat bids our sorrows cease;\n'Tis music in the sinner's ear;\n'Tis life and health and peace.","n":2},{"p":"v","t":"He breaks the power of cancelled sin\nHe sets the prisoners free\nHis blood can make the foulest clean\nHis blood availed for me.","n":3},{"p":"v","t":"He speaks and listening to His voice,\nNew life the dead receive\nThe mournful broken heart rejoice,\nThe humble poor believe.","n":4},{"p":"v","t":"Hear Him, ye deaf His praise ye dumb\nYour loosened tongue employ;\nYe blind, behold your Saviour come\nAnd leap ye lame for joy!","n":5},{"p":"v","t":"My gracious Master and my God\nAssist me to proclaim\nAnd spread through all the earth abroad\nThe honours of thy name.","n":6}]},{"n":255,"t":"Soldiers of Christ arise!","k":"C","s":[{"p":"v","t":"Soldiers of Christ a-rise!\nAnd put your armour on;\nStrong in the strength which God supplies\nThrough His eternal Son!\nStrong in the Lord of hosts,\nStand in His mighty power\nWho in the strength of Jesus trusts\nIs more than conqueror.","n":1},{"p":"v","t":"Stand, then, in His great might,\nWith all His strength endued;\nAnd take, to arm you for the fight,\nThe panoply of God:\nTo keep your armour bright,\nAt-tend with constant care;\nStill marching in your Captain's sight,\nAnd watching unto prayer.","n":2},{"p":"v","t":"Jesus hath died for you,\nWhat can His love withstand?\nBelieve, hold fast your shield, and who\nShall pluck you from His hand?\nThen, having all things done,\nAnd every conflict passed\nAccepted each through Christ alone,\nYou shall be crowned at last.","n":3}]},{"n":256,"t":"Watch and pray","k":"Bb","s":[{"p":"v","t":"Christian! seek not yet re-pose;\nHear thy guardian angel say,\n'Thou art in the midst of foes;\nWatch and pray.'","n":1},{"p":"v","t":"Principalities and powers,\nMust\u2018 ring their un-seen array,\nWait for thy unguarded hour;\nWatch and pray.","n":2},{"p":"v","t":"Gird thy heavenly armour on;\nWear it ever, night and day;\nAmbushed lies the evil one;\nWatch and pray.","n":3},{"p":"v","t":"Hear the victors who o'er-came;\nStill they mark each warrior's way\nAll with one sweet voice exclaim,\n\u201cWatch and pray\u201d.","n":4},{"p":"v","t":"Hear, above all, hear thy Lord,\nHim thou lovest to obey;\nHide with-in thy heart His word,\nWatch and pray.","n":5},{"p":"v","t":"Watch as if on that alone\nHung the issue of the day;\nPray that help may be sent down;\nWatch and pray.","n":6}]},{"n":257,"t":"Jesus calls us","k":"C","s":[{"p":"v","t":"Jesus calls us; o'er the tumult\nOf our life's wild, restless sea,\nDay by day His sweet voice soundeth\nSaying 'Christian, follow Me!'","n":1},{"p":"v","t":"As of old, Apostles heard It\nBy the Galilean lake,\nTurned from home, and toil and kindred.\nLeaving all for His dear sake.","n":2},{"p":"v","t":"Jesus calls us from the worship\nOf the vain world's golden store;\nFrom each idol that would keep us,\nSaying \"Christian, love Me more!\"","n":3},{"p":"v","t":"In our joys and in our sorrows,\nDays of toil and hours of ease;\nStill He calls, in cares and pleasure,\n\"Christian, love Me more than these.\"","n":4},{"p":"v","t":"Jesus calls us! by Thy mercies,\nSaviour, may we hear Thy call!\nGive our hearts to Thy obedience,\nServe and love Thee best of all!","n":5}]},{"n":258,"t":"Glorious things","k":"F","s":[{"p":"v","t":"Glorious things of Thee are spoken,\nZion, city of our God!\nHe, whose word cannot be broken,\nFormed thee for His own abode.","n":1},{"p":"v","t":"On the Rock of Ages founded:\nWhat can shake thy sure re-pose?\nWith salvation's walls surrounded,\nThou may'st smile at all thy foes.","n":2},{"p":"v","t":"See! The streams of living waters,\nSpringing from eternal love,\nWell supply Thy sons and daughters,\nAnd all fear of want remove.","n":3},{"p":"v","t":"Who can faint while such a river,\nEver flows their thirst t\u2019assuage?\nGrace which, like the Lord, the giver,\nNever fails from age to age.","n":4},{"p":"v","t":"Round each habitation hovering,\nSee the cloud and fire appear,\nFor a glory and a covering,\nShowing that the Lord is near","n":5},{"p":"v","t":"Blest inhabitants of Zion,\nWashed in the Redeemer\u2019s blood,\nJesus, whom their souls rely on,\nMakes them king and priest to God.","n":6},{"p":"v","t":"Saviour, if of Zion's city;\nI, through grace, a member am,\nLet the world de-ride or pit-y,\nI will glory in Thy Name.","n":7},{"p":"v","t":"Fading is the worldling\u2019s pleasure,\nAll his boast-ed pomp and show;\nSo-lid joys and lasting treasure,\nNone but Zion's children know.","n":8}]},{"n":259,"t":"God is our refuge","k":"C","s":[{"p":"v","t":"God is our refuge and our strength,\nIn straits a present aid.\nTherefore, although the earth remove,\nWe will not be afraid.","n":1},{"p":"v","t":"Though hills a-midst the seas be cast;\nThough waters roaring make,\nAnd troubled be; yea, though the hills\nBy swelling seas do shake.","n":2},{"p":"v","t":"A river is, whose streams do glad\nThe city of our God,\nThe holy place, wherein the Lord\nMost high hath His abode.","n":3},{"p":"v","t":"God in the midst of her doth dwell,\nNothing shall her remove;\nThe Lord to her an helper will,\nAnd that right early prove.","n":4},{"p":"v","t":"Be still, and know that I am God;\nAmong the heathen\nI will be exalted, I on earth\nWill be exalted high.","n":5}]},{"n":260,"t":"Thank God I'm free","k":"Bb","s":[{"p":"v","t":"For a long time I travelled\nDown a long lonely road;\nMy heart was so heavy in sin I sink low,\nThen I heard about Jesus,\nWhat a wonderful hour;\nI'm so glad that I found out\nHe could bring me out\nThrough His saving power.","n":1},{"p":"c","t":"Thank God I am free, free; free\nFrom this world of sin,\nWashed in the blood of Jesus,\nI've been born again\nHallelujah I'm saved, saved; saved\nBy His wonderful grace\nI'm so glad that I found out that\nHe could bring me out\nAnd show me the way.","n":1},{"p":"v","t":"Like a bird out of prison\nThat has taken its flight;\nLike a blind man whom God\nGave back his sight,\nLike a poor wretched beggar,\nThat's found fortune and fame,\nI'm so glad that I found out\nHe could bring me out\nThro His Holy name.","n":2}]},{"n":261,"t":"Spirit divine","k":"Eb","s":[{"p":"v","t":"Spirit divine, attend our prayers\nAnd make our hearts Thy home;\nDescend with all Thy gracious powers,\nO, come great Spirit come!","n":1},{"p":"v","t":"Come as the light to us reveal,\nOur need of Thee below;\nAnd lead us in those paths of life,\nWhere all the righteous go.","n":2},{"p":"v","t":"Come as the fire, and purge our hearts,\nWith sacrificial flame,\nLet our whole self an offering be\nTo our Redeemer\u2019s name.","n":3},{"p":"v","t":"Come as the dew, and sweetly bless,\nThis consecrated hour;\nMay barrenness rejoice to own\nThy fertilizing power.","n":4},{"p":"v","t":"Come as the dove, and spread Thy wings,\nThy wings of peaceful love;\nAnd let Thy Church on earth become\nBlest as the Church above.","n":5},{"p":"v","t":"Come as the wind, with rushing sound,\nAnd Pentecostal grace,\nThat all of women born may see\nThe glory of Thy name.","n":6}]},{"n":262,"t":"Following thee","k":"Eb","s":[{"p":"v","t":"Jesus, I my cross have taken,\nAll to leave and follow Thee;\nDestitute, despised, forsaken,\nThou from hence my all shalt be.","n":1},{"p":"c","t":"I will follow Thee, my Saviour\nThou didst shed Thy blood for me,\nAnd though all the world forsake Thee,\nBy Thy grace I'll follow Thee.","n":1},{"p":"v","t":"Perish every fond ambition,\nAll I've sought, and hoped, and known,\nYet how rich is my condition!\nGod and heaven are still mine own.","n":2},{"p":"v","t":"Let the world despise and leave me;\nThey have left my Saviour too;\nHuman hearts and looks deceive me;\nThou art not, like them, un-true.","n":3},{"p":"v","t":"And whilst Thou shalt smile upon me,\nGod of wisdom, love and might,\nFoes may hate, and Friends disown me;\nShow Thy face and all is bright.","n":4},{"p":"v","t":"Man may trouble and distress me,\n'Twill but drive me to Thy breast;\nLife with, trials hard may press me,\nHeaven will bring me sweeter rest.","n":5},{"p":"v","t":"Oh! 'tis not in grief to harm me,\nWhile Thy love is left to me;\nO! 'twere not in joy to charm me,\nWere that joy un-mixed with Thee.","n":6}]},{"n":263,"t":"Come ye apart","k":"E","s":[{"p":"v","t":"Come ye yourselves apart and rest awhile,\nWeary I know it, of the press and throng;\nWipe from your brow the sweat and dust of toil,\nAnd in my quiet strength again be strong.","n":1},{"p":"v","t":"Come ye aside from all the world holds dear;\nFor converse which the world has never known;\nAlone with Me and with My Father here;\nWith Me and with My Father no alone.","n":2},{"p":"v","t":"Come, tell Me all that ye have said and done,\nYour victories and failures, hopes and fears;\nI know how hardly souls are wooed and won;\nMy choicest wreaths are always wet with tears.","n":3},{"p":"v","t":"Come ye and rest! The journey is too great,\nAnd ye will faint beside the way and sink;\nThe bread of life is here for you to eat,\nAnd here for you in the wine of love to drink.","n":4},{"p":"v","t":"Then, fresh from converse with your Lord, return,\nAnd work till daylight softens into even;\nThe brief hours are not lost in which ye learn,\nMore of your Master and His rest in heaven.","n":5}]},{"n":264,"t":"Hark, my soul","k":"Ab","s":[{"p":"v","t":"Hark, my soul it is the Lord!\nTis thy Saviour, hear His word;\nJesus speaks, and speaks to thee,\n\"Say, poor sinner, lovest thou Me?\"","n":1},{"p":"v","t":"\"I delivered thee when bound,\nAnd, when bleeding, healed thy wound,\nSought thee wandering, set thee right\nTurned thy darkness into light.\"","n":2},{"p":"v","t":"\"Can a woman's tender care\nCease towards the child she bare?\nYes, she may forgetful be,\nYet will I remember thee.\"","n":3},{"p":"v","t":"\"Mine is an unchanging love\nHigher than the heights above,\nDeeper than the depths beneath,\nFree and faithful, strong as death\"","n":4},{"p":"v","t":"\"Thou shalt see My glory soon.\nWhen the work of grace is done;\nPartner of my throne shalt be;\nSay, poor sinner, lovest thou me?\"","n":5},{"p":"v","t":"Lord, it is my chief complaint\nThat my love is weak and faint;\nYet I love Thee and adore;\nO for grace to love Thee more!","n":6}]},{"n":265,"t":"I need thee","k":"Ab","s":[{"p":"v","t":"I need Thee every hour,\nMost gracious Lord;\nNo tender voice like Thine\nCan peace afford.","n":1},{"p":"c","t":"I need Thee, Oh, I need Thee,\nEvery hour I need Thee;\nO, bless me now, my Saviour,\nI come to Thee.","n":1},{"p":"v","t":"I need Thee every hour,\nStay Thou near by;\nTemptations lose their power\nWhen Thou art nigh.","n":2},{"p":"v","t":"I need Thee every hour,\nIn joy or pain;\nCome quickly and abide,\nOr life is vain.","n":3},{"p":"v","t":"I need Thee every hour,\nTeach me, Thy will;\nAnd Thy rich promises\nIn me fulfill.","n":4},{"p":"v","t":"I need Thee every hour,\nMost Holy One\nO, make me thine indeed,\nThou blessed Son!","n":5}]},{"n":266,"t":"Nearer to thee","k":"Eb","s":[{"p":"v","t":"Nearer, my God, to Thee,\nNearer to Thee,\nE\u2019en though it be a cross\nThat raiseth me;\nStill all my song shall be,\nNearer, my God, to Thee;\nNearer to Thee.","n":1},{"p":"v","t":"Though like a wanderer,\nThe sun gone down,\nDarkness be over me,\nMy rest a stone;\nYet in my dreams I'd be,\nNearer, my God, to Thee,\nNearer to Thee.","n":2},{"p":"v","t":"There let the way appear,\nSteps unto heaven\nAll that Thou sendest me,\nIn mercy given\nAngels to beckon me,\nNearer, my God to Thee,\nNearer to Thee.","n":3},{"p":"v","t":"Then with my waking thoughts,\nBright with Thy praise,\nOut of my stony griefs,\nBethel I'll raise;\nSo by my woes to be\nNearer, my God to Thee,\nNearer to Thee.","n":4},{"p":"v","t":"Or if on joyful wings,\nCleaving the sky,\nSun, moon, and stars for-got,\nUpward, I fly,\nStill all my song shall be,\nNearer, my God to Thee,\nNearer to Thee.","n":5}]},{"n":267,"t":"On the altar","k":"E","s":[{"p":"v","t":"My spirit, soul, and body.\nJesus, I give to Thee,\nA consecrated offering.\nThine evermore to be.","n":1},{"p":"c","t":"My all is on the altar,\nLord, I am all Thine own,\nOh, may my faith ne\u2019er falter,\nLord, keep me Thine alone","n":1},{"p":"v","t":"O Jesus, mighty Saviour,\nI trust in Thy great name;\nI look for Thy salvation,\nThy promise now I claim","n":2},{"p":"v","t":"Now, Lord, I yield my members,\nFrom sin's dominion free,\nFor warfare and for triumph\nAs weapons unto Thee.","n":3},{"p":"v","t":"I\u2019m Thine, O blessed Jesus,\nWashed in Thy precious blood.,\nSealed by Thy Holy Spirit,\nA sacrifice to God.","n":4}]},{"n":268,"t":"Pray, always pray","k":"C","s":[{"p":"v","t":"Pray, always pray;\nThe Holy Spirit pleads,\nWith-in thee all thy daily; hourly\nneeds.","n":1},{"p":"v","t":"Pray, always pray;\nBeneath sin's heaviest load,\nPrayer sees the blood from Jesus' side that flowed.","n":2},{"p":"v","t":"Pray, always pray;\nThough weary, faint and lone;\nPrayer nestles by the Father's sheltering throne.","n":3},{"p":"v","t":"Pray, always pray;\nAmid the world's turmoil,\nPrayer keeps the heart at rest, and nerves from toil.","n":4},{"p":"v","t":"Pray, always pray;\nIf joys thy pathway throng,\nPrayer strikes the harp, and sings the angel's song.","n":5},{"p":"v","t":"Pray, always pray;\nIf loved ones pass the veil.\nPrayer drinks with them of springs that cannot fail.","n":6},{"p":"v","t":"All earthly things with earth\nShall pass away;\nPrayer grasps eternity;\nPray always pray.","n":7}]},{"n":269,"t":"We seek thy face","k":"Bb","s":[{"p":"v","t":"Lord Jesus Christ, we seek Thy face,\nWithin the veil we bow the knee,\nO, let Thy glory fill the place!\nAnd bless us while we wait on Thee.","n":1},{"p":"v","t":"We thank Thee for the gracious blood\nThat purged our sins and brought us nigh,\nAll cleansed and sanctified to God,\nThy holy Name to magnify.","n":2},{"p":"v","t":"Shut in with Thee far, far a-above\nThe restless world that wars be-low;\nWe seek to learn and prove thy love,\nThy wisdom and Thy grace to know.","n":3},{"p":"v","t":"Thy brow that once with thorns was bound,\nThy hands, Thy side, we fain would see;\nDraw near, Lord Jesus, glory crowned,\nAnd bless us while we wait on Thee.","n":4}]},{"n":270,"t":"Tell it to Jesus","k":"Bb","s":[{"p":"v","t":"Are you weary, are you heavy hearted?\nTell it to Jesus, Tell it to Jesus;\nAre you grieving over joys departed?\nTell it to Jesus alone.","n":1},{"p":"c","t":"Tell it to Jesus, Tell it to Jesus,\nHe is a friend that's well known;\nYou have no other such a friend or brother,\nTell it to Jesus alone.","n":1},{"p":"v","t":"Do the tears flow down, your cheeks unbidden?\nTell it to Jesus, Tell it to Jesus;\nHave you sins that to man's eyes are hidden?\nTell it to Jesus alone.","n":2},{"p":"v","t":"Do you fear the gathering clouds of sorrow?\nTell it to Jesus, Tell it to Jesus;\nAre you anxious what shall be tomorrow?\nTell it to Jesus alone.","n":3},{"p":"v","t":"Are you troubled with the thought of dying?\nTell it to Jesus, Tell it to Jesus,\nFor Christ's coming kingdom are you sighing?\nTell it to Jesus alone.","n":4}]},{"n":271,"t":"The soul's desire","k":"E","s":[{"p":"v","t":"Prayer is the soul's sincere desire,\nUttered or unexpressed!\nThe motion of a hidden fire\nThat trembles in the breast.","n":1},{"p":"v","t":"Prayer is the burden of a sigh,\nThe falling of a tear,\nThe up-ward glancing of an eye,\nWhen none but God is near.","n":2},{"p":"v","t":"Prayer is the simplest form of speech\nThat infant lips can try;\nPrayer is the sublimes strains that reach\nThe Majesty on high.","n":3},{"p":"v","t":"Prayer is the Christian's vital breath\nThe Christian's native air:\nHis watch-word at the gates of death:\nHe enters heaven with prayer.","n":4},{"p":"v","t":"Prayer is the contrite sinner's voice,\nReturning from his ways;\nWhile angels in their songs rejoice,\nAnd cry; \"Behold, he prays!\"","n":5},{"p":"v","t":"O Thou by whom we come to God!\nThe Life, the Truth, the Way;\nThe path of prayer Thyself hast trod;\nLord, teach us how to pray.","n":6}]},{"n":272,"t":"More love to thee","k":"Ab","s":[{"p":"v","t":"More love to Thee, O Christ,\nMore love to Thee!\nHear thou the prayer I make\nOn bended knee;\nThis is my earnest plea,\nMore love, O Christ, to Thee,\nMore love to Thee!\nMore love to Thee!","n":1},{"p":"v","t":"Once earthly joy I craved\nSought peace and rest,\nNow Thee alone I seek,\nGive what is best:\nThis all my prayer shall be,\nMore love, O Christ, to Thee!\nMore love to Thee!\nMore love to Thee!","n":2},{"p":"v","t":"Let sorrow do its work,\nCome grief or pain;\nSweet are Thy messengers,\nSweet their refrain,\nWhen they can sing with me,\nMore love, O Christ, to Thee,\nMore love to Thee!\nMore love to Thee!","n":3},{"p":"v","t":"Then shall my latest breath\nWhisper Thy praise;\nThis be the parting cry,\nMy heart shall raise;\nThis still its prayer shall be,\nMore love, O Christ, to Thee,\nMore love to Thee!\nMore love to Thee!","n":4}]},{"n":273,"t":"Approach, my soul","k":"","s":[{"p":"v","t":"Approach, my soul the mercy seat,\nWhere Jesus answers prayer;\nThere humbly fall before His feet,\nFor none can perish there.","n":1},{"p":"v","t":"Thy promise is my only plea,\nWith this I venture nigh;\nThou callest burdened souls to Thee,\nAnd such, O Lord, am I!","n":2},{"p":"v","t":"Bowed down beneath a load of sin,\nBy Satan sorely pressed,\nBy wars without, and fears within,\nI come to Thee for rest.","n":3},{"p":"v","t":"Be thou my shield and hiding place;\nThat sheltered near Thy side,\nI may my fierce accuser\u2019s face,\nAnd tell him Thou hast died.","n":4},{"p":"v","t":"O, wondrous love! To bleed and die,\nTo bear the Cross and shame,\nThat guilty sinners such as I\nMight plead Thy gracious Name.","n":5}]},{"n":274,"t":"Lord, speak to me","k":"F","s":[{"p":"v","t":"Lord, speak to me, that I may speak\nIn living echoes of Thy tone;\nAs thou has sought, so let me seek,\nThy erring children lost and lone.","n":1},{"p":"v","t":"O, lead me, Lord, that I may lead,\nThe wandering and the wavering feet;\nO, feed me, Lord, that I may feed,\nThy hungering ones with manna sweet!","n":2},{"p":"v","t":"O, teach me, Lord, that I may teach\nThe precious things Thou dost impart!\nAnd wing my words that they may reach\nThe hidden depths of many a heart.","n":3},{"p":"v","t":"O, give Thine own sweet rest to me!\nThat I may speak with soothing power\nA word in season, as from Thee,\nTo weary ones in needful hour.","n":4},{"p":"v","t":"O, fill me with Thy fullness, Lord!\nUntil my very heart o'er-flow,\nIn kind-ling thought, and glowing word,\nThy love to tell, Thy praise to show.","n":5},{"p":"v","t":"O, use me, Lord, use even me!\nJust as Thou wilt, and how, and where,\nUntil Thy blessed face I see,\nThy rest, Thy joy, Thy glory share.","n":6}]},{"n":275,"t":"I love to tell the story","k":"Ab","s":[{"p":"v","t":"I love to tell the sto-ry\nOf un-seen things\nabove,\nOf Jesus and His glory,\nOf Jesus and His love!\nI love to tell the story!\nBecause I know \u2018tis true!\nIt satisfies my longings,\nAs no-thing else can do.","n":1},{"p":"c","t":"I love to tell the story\n\u2018Twill be my theme in glory,\nTo tell the old, old story\nOf Jesus and His love.","n":1},{"p":"v","t":"I love to tell the story\nMore wonderful it seems,\nThan all the golden fancies,\nOf all our golden dreams!\nI love to tell the story!\nIt did so much for me!\nAnd that is just the reason\nI tell it now to thee.","n":2},{"p":"v","t":"I love to tell the story\n'Tis pleasant to re-peat,\nWhat seems, each time I tell it,\nMore wonderfully sweet,\nI love to tell the story!\nFor some have never heard\nThe message of salvation\nFrom God's own Holy Word.","n":3},{"p":"v","t":"I love to tell the story\nFor those who know it best,\nSeem hun-ger-ing and thirst-ing,\nTo hear it, like the rest,\nAnd when, in scenes of glory,\nI sing the new, new song,\n'Twill be the old, old sto-ry\nThat I have loved so long","n":4}]},{"n":276,"t":"Jesus shall reign","k":"Eb","s":[{"p":"v","t":"Jesus shall reign wher-e'er the sun,\nDoes his successive journey run;\nHis kingdom spread from shore to shore,\nTill moons shall wax and wane no more.","n":1},{"p":"v","t":"To Him shall endless prayer be made,\nAnd endless praises crown His head,\nHis Name like sweet perfume shall rise,\nWith every morning sacrifice.","n":2},{"p":"v","t":"People and realms of every tongue,\nDwell on His love with sweetest song;\nAnd infant voices shall proclaim,\nTheir early blessings on His Name.","n":3},{"p":"v","t":"Blessings a-bound where\u2019re He reigns;\nThe prisoner leaps to loose his chains;\nThe weary find Eternal rest,\nAnd all the sons of want are blest.","n":4},{"p":"v","t":"Where He displays His healing power,\nDeath and the curse are known no more;\nIn Him the tribes of Adam boasts,\nMore blessings than their father lost.","n":5},{"p":"v","t":"Let every creatures rise and bring,\nPeculiar honours to our King;\nAngels descend with songs a-gain;\nAnd earth repeat the loud Amen!","n":6}]},{"n":277,"t":"When he cometh","k":"","s":[{"p":"v","t":"When He cometh, when He cometh,\nTo make up His jewels,\nAll His jewels, precious jewels,\nHis loved and His own.","n":1},{"p":"c","t":"Like the stars of the morning\nHis bright crown adorning,\nThey shall shine in their beauty,\nBright gems for His crown.","n":1},{"p":"v","t":"He will gather, He will gather\nBright gems for His kingdom,\nAll the blood-bought, all the holy,\nHis loved and His own.","n":2},{"p":"v","t":"Ransomed sinners, ransomed sinners,\nWho have trusted in Jesus,\nAre the jewels, precious jewels,\nHis loved and His own.","n":3}]},{"n":278,"t":"Safe in the arms of Jesus","k":"G","s":[{"p":"v","t":"Safe in the arms of Jesus,\nSafe on His gentle breast,\nThere by His love o'er-shaded,\nSweetly my soul shall rest,\nHark! 'tis the voice of angels,\nBorne in a song to me,\nOver the fields of glory,\nOver the jasper sea.","n":1},{"p":"c","t":"Safe in the arms of Jesus,\nSafe on His gentle breast,\nThere by His love o'er-shaded,\nSweetly my soul shall rest.","n":1},{"p":"v","t":"Safe in the arms of Jesus,\nSafe from corroding care,\nSafe from the world's temptations,\nSin can-not harm me there,\nFree from the blight of sorrow,\nFree from my doubts and fears;\nOnly a few more trials,\nOnly a few more tears!","n":2},{"p":"v","t":"Jesus, my heart's dear refuge,\nJesus has died for me;\nFirm on the Rock of Ages,\nEver my trust shall be,\nHere let me wait with patience,\nWait till the night is o'er,\nWait till I see the morning.\nBreak on the golden shore.","n":3}]},{"n":279,"t":"Around the throne","k":"C","s":[{"p":"v","t":"A-round, the throne of God in heaven\nThou-sands of children stand,\nChildren whose sins are all for-given\nA holy, happy band;\nSinging Glory, glory, glory;\nSinging Glory, glory, glory.","n":1},{"p":"v","t":"What brought them to that world above?\nThat, heaven so bright and fair,\nWhere all is peace, and joy, and love;\nHow came those children there?\nSinging Glory, glory, glory;\nSinging Glory, glory, glory.","n":2},{"p":"v","t":"Be-cause the Saviour shed His blood\nTo wash away their sin;\nBath-ed in that pure and precious blood\nBe-hold them white and clean!\nSinging Glory, glory, glory;\nSinging Glory, glory, glory.","n":3},{"p":"v","t":"On earth, they sought the Saviour's grace,\nOn earth they loved His Name;\nSo now they see His blessed face,\nAnd stand before the Lamb.\nSinging Glory, glory, glory;\nSinging Glory, glory, glory.","n":4}]},{"n":280,"t":"Yield not to temptation","k":"Bb","s":[{"p":"v","t":"Yield not to temptation,\nFor yielding is sin,\nEach victory will help you,\nSome other to win;\nFight manfully onward,\nDark passions subdue,\nLook ever to Jesus,\nHe\u2019ll carry you through.","n":1},{"p":"c","t":"Ask the Saviour to help you,\nComfort, strengthen and keep you,\nHe is willing to aid you,\nHe will carry you through.","n":1},{"p":"v","t":"Shun e-vil companions,\nBad language disdain,\nGod's name hold in reverence\nNor take it in vain;\nBe thoughtful and earnest,\nKind heart-ed and true,\nLook ever to Jesus,\nHe'll carry you through.","n":2},{"p":"v","t":"To him that o\u2019ercometh,\nGod giveth a crown,\nThrough faith we shall conquer,\nThough often cast down,\nHe who is our Saviour,\nOur strength will re-new,\nLook ever to Jesus,\nHe'll carry you through.","n":3}]},{"n":281,"t":"Pleasant are thy court above","k":"C","s":[{"p":"v","t":"Pleasant are Thy court above\nIn the land of light and love\nPleasant are Thy courts below\nIn this land of sin and woe","n":1},{"p":"v","t":"Oh my spirit longs and faints\nFor the converse of Thy Saints\nFor the brightness of Thy grace\nFor Thy fulfilness God of grace.","n":2},{"p":"v","t":"Happy birds that sing and fly\nRound Thy altars, O Most High\nHappier souls that find a rest\nIn a heavenly Father's breast!","n":3},{"p":"v","t":"Like the wandering dove that found\nNo repose on earth around\nThey can no their ark repair,\nAnd enjoy it ever there.","n":4},{"p":"v","t":"Happy souls! their praises flow\nEven in this valley of woe;\nWater in the desert rise.\nManner feeds them from the skies","n":5},{"p":"v","t":"On they go from strength to strength,\nTill they reach Thy throne at length,\nAll Thy feet adoring fall\nAnd has let them safe through all.","n":6},{"p":"v","t":"Lord, be mine this prize to win,\nGuide me through a world of sin,\nKeep me by Thy saving grace,\nGive me at Thy side a place;","n":7},{"p":"v","t":"Sun and shield alike Thou art,\nGuide and guard erring heart\nGrace and glory flow from Thee;\nShower, O shower them, Lord on me.","n":8}]},{"n":282,"t":"Not a disappointment","k":"D","s":[{"p":"v","t":"He is not a disappointment!\nJesus is far more to me\nThan in all my glowing day dreams\nI had fancied He could be;\nAnd the more I get to know Him,\nso the more I find him true him,\nAnd the more I long that others\nshould be led to know Him too,\nAnd the more I long that others\nshould be led to know Him too.","n":1},{"p":"v","t":"He is not a disappointment!\nHe has saved my soul from sin;\nAll the guilt and all the anguish,\nWhich oppressed my heart within,\nHe has banished by His presence,'\nand His bless-ed kiss of peace\nHas assured my heart forever that\nHis love will never cease.\nHas assured my heart forever that\nHis love will never cease.","n":2},{"p":"v","t":"He is not a disappointment!\nHe is coming by and by,\nIn my heart I have the witness\nthat His coming draweth nigh!\nAll the scoffers may despise me,\nand no change around may see;\nBut He tells me He is coming,\nand that's quite enough for me.\nBut He tells me He is coming,\nand that's quite enough for me.","n":3},{"p":"v","t":"He is not a disappointment!\nHe is all in all to me\nBlessed Saviour, Sanctifier,\nthe unchanging Christ is He!\nHe has won my heart's affections,\nand He meets my every need;\nHe is not a disappointment,\nFor He satisfies indeed.\nHe is not a disappointment,\nFor He satisfies in-deed.","n":4}]},{"n":283,"t":"An atoning death","k":"C","s":[{"p":"v","t":"Have you read the story of the cross,\nWhere Jesus bled and died;\nWhere your debt was paid by\nHis precious blood\nThat flowed from His wounded side?","n":1},{"p":"c","t":"He died an atoning death for thee,\nHe died an a-toning death;\nOh, wondrous love! it was for thee\nHe died an atoning death!","n":1},{"p":"v","t":"Have you read how they placed the crown of thorns\nUpon His lovely brow?\nWhen He prayed forgive them oh! forgive,\nThey know not what they do.","n":2},{"p":"v","t":"Have you read how He saved the dying thief\nWhen hanging on the tree?\nWho looked with pitying eyes and said,\nDear Lord, remember me.","n":3},{"p":"v","t":"Have you read that He looked to heaven and said,\n'Tis finished \u2013 \u2018twas for thee?\nHave you ever said, I thank Thee, Lord,\nFor giving Thy life for me?","n":4}]},{"n":284,"t":"I am happy in him","k":"F","s":[{"p":"v","t":"My soul is so happy in Jesus,\nFor He is so precious to me,\nHis voice, it is music to hear it,\nHis face, it is heaven to see.","n":1},{"p":"c","t":"I am happy in Him...\nI am happy in Him...\nMy soul with delight\nHe fills day and night,\nFor I am happy in Him.","n":1},{"p":"v","t":"He sought me so long ere I knew Him,\nWhen wandering afar from the fold;\nSafe home in His arms He hath brought me,\nTo where there are pleasures untold.","n":2},{"p":"v","t":"His love and His mercy surround me,\nHis grace like a river doth flow;\nHis Spirit, to guide and to comfort,\nIs with me wherever I go.","n":3},{"p":"v","t":"They say I shall some day be like Him,\nMy cross and my burden lay down;\nTill then I will ever be faithful\nIn gathering gems for His crown.","n":4}]},{"n":285,"t":"The debt unknown","k":"C","s":[{"p":"v","t":"When this passing world is done,\nWhen has sunk you glow-ing sun,\nWhen we stand with Christ in glory,\nLooking o'er life's finished story.","n":1},{"p":"c","t":"Then, dear Lord, shall I fully know,\nNot till then, how much I owe;.\nThen, dear Lord, shall I fully know,\nNot till then, how much I owe.","n":1},{"p":"v","t":"When I stand before the throne,\nDressed in beauty not my own;\nWhen I see Thee as Thou art,\nLove Thee with un-sinning heart.","n":2},{"p":"v","t":"When I hear the wick-ed call,\nOn the rocks and hills to fall;\nWhen I see them start and shrink\nOn the fiery deluge brink.","n":3},{"p":"v","t":"When the praise of heaven I hear,\nLoud as thunders to the ear;\nLoud a man-y water's noise,\nSweet as harp's meIodious voice.","n":4}]},{"n":286,"t":"Master, speak!","k":"C","s":[{"p":"v","t":"Master, speak! Thy servant heareth\nWaiting for Thy gracious Word,\nLonging for Thy voice that cheer-eth,\nMaster, let it now be heard,\nI am listening, Lord, for Thee;\nWhat hast Thou to say to me?","n":1},{"p":"v","t":"Master, speak! Though least and lowest,\nLet me not un-heard depart,\nMaster, speak! for O, Thou knowest\nAll the yearning of my heart,\nKnowest all it truest need;\nSpeak! And make me blest\nin-deed.","n":2},{"p":"v","t":"Master, speak! and make me ready,\nWhen Thy voice is truly heard,\nWith obedience glad and steady,\nStill to follow every word;\nI am listening, Lord, for Thee;\nMaster, speak, O, speak to me!","n":3},{"p":"v","t":"Speak to me by name, O Master!\nLet me know it is to me,\nSpeak, that I may follow faster,\nWith a step more firm and free,\nWhere the Shepherd leads the flock,\nIn the shadow of the Rock.","n":4}]},{"n":287,"t":"Forward!","k":"Bb","s":[{"p":"v","t":"Forward! Forward! \u2018tis the Lord's command,\nForward! forward! to the promised land;\nForward! forward! let the chorus ring;\nWe are sure to win with Christ, our King!\nSatan's fearful onslaught cannot make us yield,\nWhile we trust in Christ, our Buckler and our Shield;\nPressing ever on the Spirits sword we wield,\nAnd we follow all the way.\nForward! Forward! \u2018tis the Lord's command,\nForward! forward! to the promised land;\nForward! forward! let the chorus ring;\nWe are sure to win with Christ, our King!","n":1},{"p":"c","t":"Christ, our mighty Captain, leads -gainst the foe;\nwe will never falter when\nHe bids us go\nThough His righteous purpose we may never know,\nYet we'll folIow all the way.","n":1},{"p":"v","t":"Let our glorious banner ever be unfurled,\nFrom its mighty stronghold evil shall be hurled;\nChrist and mighty Captain, overcomes the world,\nAnd we follow all the way.","n":2},{"p":"v","t":"Forward! Forward! \u2018tis the Lord's command,\nForward! forward! to the promised land;\nForward! forward! let the chorus ring;\nWe are sure to win with Christ, our King!\nFierce the battle rages, but 'twill not be long,\nThen triumphant shall we join the blessed throng,\nJoyfully uniting in the victors\u2019 song;\nIf we follow all the way.\nForward! Forward! \u2018tis the Lord's command,\nForward! forward! to the promised land;\nForward! forward! let the chorus ring;\nWe are sure to win with Christ, our King!","n":3}]},{"n":288,"t":"Conquerors are we","k":"G","s":[{"p":"v","t":"Conquerors and overcomers now are we,\nThru the precious blood of Christ we\u2019ve victory,\nIf the Lord be for us,\nwe can never fail;\nNothing \u2018gainst His mighty power can e\u2019er prevail.","n":1},{"p":"c","t":"Conquerors are we, through the blood; through the blood;\nGod will give us victory through the blood; through the blood,\nThrough the Lamb for sinners slain,\nYet who lives and reigns again,\nMore than conquerors are we,\nMore than conquerors are we.","n":1},{"p":"v","t":"In the Name of Israel's God we'll onward press,\nOver-coming sin and all unrighteousness:\nNot to us, but unto Him the praise shall be\nFor salvation and for blood-bought victory.","n":2},{"p":"v","t":"Unto him that overcometh shall be given\nHere to eat of 'hidden manna' sent from heaven;\nOver yonder he the victor's palm shall bear\nAnd a robe of white and golden crown shall wear.","n":3}]},{"n":289,"t":"Lord, dismiss us","k":"Bb","s":[{"p":"v","t":"Lord, dismiss us with Thy blessing,\nFill our hearts with joy and peace;\nLet us each, Thy love possessing,","n":1},{"p":"v","t":"Triumph in redeeming grace:\nO refresh us, O refresh us, Traveling through this\nwilderness!","n":2},{"p":"v","t":"Thanks we give, and adoration,\nFor Thy Gospel's joyful sound;\nMay the fruits of Thy salvation","n":3},{"p":"v","t":"In our hearts and lives a-bound;\nMay Thy presence, may Thy presence\nWith us evermore be found!","n":4},{"p":"v","t":"So whene-'er the signal's given,\nUs from earth to call away,\nBorne on angel's wings to heaven,","n":5},{"p":"v","t":"Clad the summons to obey,\nWe shall surely, we shall surely\nReign with Christ in endless day.","n":6}]},{"n":290,"t":"Will your anchor hold?","k":"F","s":[{"p":"v","t":"Will your anchor hold in the storms of life\nWhen the clouds unfold their wings of strife?\nWhen the strong tides lift, and the cables strain,\nWill your anchor shift, or firm remain?","n":1},{"p":"c","t":"We have an anchor that keeps the soul\nSteadfast and sure while the billows roll,\nFastened to the Rock which cannot move\nGrounded firm and deep in the Saviour's love.","n":1},{"p":"v","t":"It is safely moored 'twill the storm withstand,\nFor 'tis well se-cured by the Saviour's hand;\nAnd the cables passed from His heart to mine\nCan defy the blast through strength divine.","n":2},{"p":"v","t":"It will firmly hold in the straits of fear,\nWhen the breakers have told the reef is near;\nThough the tempest rave, and the wild winds blow,\nNot an angry wave shall our bank o\u2019er-flow.","n":3},{"p":"v","t":"It will surely hold in the floods of death,\nWhen the waters cold chill our latest breath;\nOn the rising tide it can never fail,\nWhile our hopes abide within the veil.","n":4},{"p":"v","t":"When our eyes behold through the gathering night,\nThe city of gold, our harbour bright,\nWe shall anchor fast by the heavenly shore,\nWith the storms all past for evermore.","n":5}]},{"n":291,"t":"Seeking for me","k":"C","s":[{"p":"v","t":"Jesus, my Saviour, to Bethlehem came,\nBorn in a manger to sorrow and shame;\nOh, it was wonderful blest be His name!\nSeeking for me, for me!\nSeeking for me! For me! For me!\nSeeking for me! For me! For me!\nOh it was wonderful blest be His name!\nSeeking for me, for me!","n":1},{"p":"v","t":"Jesus, my Saviour, on Calvary's tree,\nPaid the great debt, and my soul He set free;\nOh, it was wonderful how could it be?\nDying for me! for me!\nDying for me! For me! For me!\nDying for me! For me! For me!\nOh, it was wonderful how could it be?\nDying for me, for me!","n":2},{"p":"v","t":"Jesus, my Saviour, the same as of old,\nWhile I was wandering afar from the fold,\nGently and long did He plead with my soul,\nCalling for me, for me!\nCalling for me! For me! For me!\nCalling for me! For me! For me!\nGently and long did He plead with my soul,\nCalling for me, for me!","n":3},{"p":"v","t":"Jesus, my Saviour, shall come from on high;\nSweet is the promise as weary years fly;\nO, I shall see Him descending the sky,\nComing for me, for me!\nComing for me! For me! For me!\nComing for me! For me! For me!\nOh, I shall see Him descending the sky,\nComing for me, for me!","n":4}]},{"n":292,"t":"Only a sinner","k":"C","s":[{"p":"v","t":"Naught have I gotten but what I received;\nGrace hath bestowed it since I have believed;\nBoasting excluded, pride I abase;\nI'm only a sinner saved by grace!","n":1},{"p":"c","t":"Only a sinner saved by grace!\nOnly a sinner saved by grace!\nThis is my story to God be the glory\nI'm only a sinner saved by grace!","n":1},{"p":"v","t":"Once, I was foolish, and sin ruled my heart,\nCausing my footsteps from God to depart,\nJesus hath found me, happy my ease;\nI now am a sinner saved by grace!","n":2},{"p":"v","t":"Tears unavailing, no merit had I;\nMercy had saved me, or else I must die;\nSin had alarmed me, fearing God's face;\nBut now I'm a sinner saved by grace!","n":3},{"p":"v","t":"Suffer a sinner whose heart overflows,\nLoving his Saviour, to tell what he knows,\nOnce more to tell it, would I embrace - I'm\nOnly a sinner saved by grace!","n":4}]},{"n":293,"t":"Come believing","k":"G","s":[{"p":"v","t":"Once a-gain the Gospel message\nFrom the Saviour you have heard;\nWill you heed the invitation?\nWill you turn and seek the Lord?","n":1},{"p":"c","t":"Come believing! (Come!)\nCome believing! (Come!)\nCome to Jesus! Look and live! (Look, oh look and live!)\nCome believing! (Come!)\nCome believing! (Come!)\nCome to Jesus! Look and live!","n":1},{"p":"v","t":"Many summers you have wasted,\nRipened harvest you have seen;\nWinter snows by spring have melted,\nYet you linger in your sin.","n":2},{"p":"v","t":"Jesus for your choice is waiting;\nTarry not; at once decide!\nWhile the Spirit now is striving,\nYield and seek the Saviour's side.","n":3},{"p":"v","t":"Cease of fitness to be thinking\nDo not longer try to feel!\nIt is trusting, and not feeling;\nThat will give the Spirit's seal.","n":4},{"p":"v","t":"Let your will to God be given,\nTrust in Christ's atoning blood,\nLook to Jesus now in Heaven,\nRest on His unchanging Word.","n":5}]},{"n":294,"t":"No other plea","k":"Ab","s":[{"p":"v","t":"My faith has found a resting place,\nNot in device nor creed;\nI trust the ever-living One,\nHis wounds for me shall plead.","n":1},{"p":"c","t":"I need no other argument,\nI need no other plea,\nIt is enough that Jesus died,\nAnd that He died for me.","n":1},{"p":"v","t":"Enough for me that Jesus saves,\nThis ends my fears and doubt;\nA sinful soul I come to Him,\nHe\u2019ll never cast me out.","n":2},{"p":"v","t":"My heart is leaning on the Word,\nThe written Word of God,\nSalvation by my Saviour\u2019s name,\nSalvation through His blood.","n":3},{"p":"v","t":"My great Physician heals the sick,\nThe lost He came to save;\nFor me His precious blood He shed,\nFor me His life He gave.\nI need no other\nargument,\nI need no other plea,\nIt is enough that Jesus died,\nAnd that He died for me.","n":4}]},{"n":295,"t":"Jesus is passing this way","k":"C","s":[{"p":"v","t":"Is there a heart that is waiting;\nLonging for pardon today?\nHear the glad message proclaiming\nJesus is passing this way.","n":1},{"p":"c","t":"Jesus is passing this way,\nThis way today;\nJesus is passing this way,\nIs passing this way today.","n":1},{"p":"v","t":"Is there a heart that has wandered?\nCome with thy burden today;\nMercy is tenderly pleading,\nJesus is passing this way.","n":2},{"p":"v","t":"Is there a heart that is broken,\nWeary and sighing for rest?\nCome to the arms of thy Saviour,\nPillow thy head on His breast.","n":3},{"p":"v","t":"Come to thy only Redeemer,\nCome to His infinite love;\nCome to the gate that is leading\nHome-ward to mansions above.","n":4}]},{"n":296,"t":"Blessed quietness","k":"A","s":[{"p":"v","t":"Joys are flowing like a river\nSince the Comforter has come;\nHe abides with us forever,\nMakes the trusting heart His home.","n":1},{"p":"c","t":"Blessed quietness,\nhoIy quietness,\nWhat assurance in my soul!\nOn the stormy sea,\nHe speaks peace to me,\nHow the billows cease to roll!","n":1},{"p":"v","t":"Bringing life and health and gladness\nAll around this heavenly Guest:\nBanished unbelief and sad-ness,\nChanged our weariness to rest.","n":2},{"p":"v","t":"Like the rain that falls from heaven,\nLike the sunlight from the sky,\nSo the Holy Ghost is given,\nComing on us from on high.","n":3},{"p":"v","t":"See a fruitful field is growing!\nBless-ed fruits of righteousness:\nAnd the streams of life are flowing,\nIn the lonely wilderness.","n":4},{"p":"v","t":"What a wonderful salvation!\nWhere we always see His face;\nWhat a perfect habitation!\nWhat a quiet resting place!","n":5}]},{"n":297,"t":"That man of Calvary","k":"C","s":[{"p":"v","t":"Fairest of all the earth beside,\nChiefest of all unto Thy bride,\nFullness divine in Thee I see,\nWonderful Man of Calvary!","n":1},{"p":"c","t":"That Man of Calvary\nHas won my heart from me\nAnd died to set me free,\nBlest Man of Calvary!","n":1},{"p":"v","t":"Granting the sinner life and peace,\nGranting the captive sweet release,\nShedding His blood to make us free,\nMerciful Man of Calvary!","n":2},{"p":"v","t":"Giving the gifts obtained for men,\nPouring out love beyond our kin,\nGiving us spotless purity,\nBountiful Man of Calvary!","n":3},{"p":"v","t":"Comfort of all my earthly way,\nJesus, I'll meet Thee some sweet day;\nCentre of glory, in Thee I'll see,\nWonderful Man of Calvary!","n":4}]},{"n":298,"t":"Is thy heart right","k":"C","s":[{"p":"v","t":"Have thy affections been nailed to the Cross?\nIs thy heart right with God?\nDost thou count all things for Jesus but loss?\nIs thy heart right with God?","n":1},{"p":"c","t":"Is thy heart right with God,\nWashed in the crimson flood\nCleansed and made holy, humble and lowly\nRight in the sight of God?","n":1},{"p":"v","t":"Hast thou dominion o'er self and sin?\nIs thy heart right with God?\nO'er all evil without and within?\nIs thy heart right with God?","n":2},{"p":"v","t":"Is there no more condemnation for sin?\nIs thy heart right with God?\nDoes Jesus rule in the temple within?\nIs thy heart right with God?","n":3},{"p":"v","t":"Are all thy powers under Jesus control?\nIs thy heart right with God?\nDoes He each moment abide in thy soul?\nIs thy heart right with God?","n":4},{"p":"v","t":"Art thou now walking in heaven's pure light?\nIs thy heart right with God?\nIs thy soul wearing the garment of white?\nIs thy heart right with God? .","n":5}]},{"n":299,"t":"Joy to the world","k":"C","s":[{"p":"v","t":"Joy to the world; the Lord is come\nLet earth receive her king,\nLet every heart prepare Him a room,\nAnd heaven and nature sing;\nAnd heaven and nature sing;\nAnd heaven (and heaven) and nature sing.","n":1},{"p":"v","t":"Joy to the world; the Saviour reigns\nLet men their song employ,\nwhile fields and floods, rocks, hills and plain,\nRepeat the sounding Joy;\nRepeat the sounding Joy;\nRepeat, (Repeat) the sounding Joy.","n":2},{"p":"v","t":"He rules the world with truth and grace;\nAnd makes the nation prove\nThe glory of His righteousness\nAnd wonders of His love;\nAnd wonders of His love;\nAnd wonders of His love.","n":3}]},{"n":300,"t":"The comforter has come","k":"C","s":[{"p":"v","t":"O, spread the tidings round,\nWherever man is found,\nWherever human hearts and human woes abound;\nLet every Christian tongue pro-claim the joyful sound;\nThe Comforter has come!","n":1},{"p":"c","t":"The Comforter has come;\nthe Comforter has come!\nThe Holy Ghost from Heaven, the Father\u2019s promise given;\nOh, spread the tidings round wherever man is found,\nThe Comforter has come!","n":1},{"p":"v","t":"The long, long night is past,\nThe morning breaks at last;\nAnd hushed the dreadful wail, and fury of the blast,\nAs o\u2019er the golden hills, the day Advances fast!\nThe Comforter has come!","n":2},{"p":"v","t":"Lo, the great King of kings,\nWith healing in His wings,\nTo every captive soul a full deliverance brings;\nAnd through the vacant cells, the song of triumph rings:\nThe Comforter has come!","n":3},{"p":"v","t":"O boundless Love divine!\nHow shall this tongue of mine,\nTo wondering mortals tell,\nthe matchless grace divine,\nThat I, a child of hell, should in His image shine?\nThe Comforter has come!","n":4},{"p":"v","t":"Sing till the echoes fly\nAbove the vaulted sky,\nAnd all the saints above to all below reply,\nIn strains of endless love, the song that ne\u2019er will die:\nThe Comforter has come!","n":5}]},{"n":301,"t":"When Jesus comes","k":"C","s":[{"p":"v","t":"When Jesus comes to re-ward His servants,\nWhether it be noon or night,\nFaithful to Him will He find us watching,\nWith our lamps all trimmed and bright?","n":1},{"p":"c","t":"Oh, can we say we are ready, brother!\nReady for the soul's bright home?\nSay, will He find you and me still watching,\nWaiting, waiting, when the Lord shall come?","n":1},{"p":"v","t":"If at the dawn of the early morning,\nHe shall call us one by one,\nWhen to the Lord we restore our talents,\nWill He answer thee \u2013 \u201cWell done?\u201d","n":2},{"p":"v","t":"Have we been true to the trust He left us?\nDo we seek to do our best?\nif in our hearts there is naught condemns us,\nWe shall, have a glorious rest.","n":3},{"p":"v","t":"Blessed are those whom the Lord finds watching,\nIn His glory they shall share;\nIf He should come at the dawn or mid-night,\nWill He find us watching there?","n":4}]},{"n":302,"t":"Joy bells in my heart","k":"C","s":[{"p":"v","t":"I've got the joy-bells in my heart,\nI've got the joy-bells in my heart,\nI\u2019II sing His praises\nThrough all the ages\nI've got the joy-bells in my heart.","n":1}]},{"n":303,"t":"We're going home","k":"","s":[{"p":"v","t":"Let us sing a song that will cheer us by the way,\nIn a little while we're home;\nFor the night will end in the everlasting day,\nIn a lit-tie while we're going home.","n":1},{"p":"c","t":"In a little while, in a little while,\nWe shall cross the billow's foam;\nWe shall meet at last,\nWhen the stormy winds are past;\nIn a little while we're going home.","n":1},{"p":"v","t":"We will do the work that our hands may find to do,\nIn a little while we're going home;\nAnd the grace of God will our daily strength re-new,\nIna little while we're going home.","n":2},{"p":"v","t":"We will smooth the path for some weary way-worm feet,\nIn a little while we're going home;\nO may loving hearts spread a-round an influence sweet!\nIn a little where we're going home.","n":3},{"p":"v","t":"There's a rest beyond, there's relief from every care,\nIn a little while we're going home;\nAnd no tears shall fall in that city bright and fair;\nIn a little while we're going home.","n":4}]},{"n":304,"t":"O Jesus, I have promised","k":"Bb","s":[{"p":"v","t":"O Jesus, I have promised,\nTo serve Thee to the end;\nBe Thou for ever near me,\nMy Master and my Friend!\nI shall not fear the battle,\nIf Thou art by my side,\nNor wander from the pathway,\nIf Thou wilt be my Guide.","n":1},{"p":"v","t":"O let me feel Thee near me;\nThe world is ever near,\nI see the sights that dazzle,\nThe tempting sounds I hear;\nMy foes are ever near me,\nAround me and within,\nBut, Jesus, draw Thou nearer,\nAnd shield my soul from sin.","n":2},{"p":"v","t":"O let me hear Thee speaking\nIn accents clear and still,\nAbove the storms of passion,\nThe murmurs of self-will,\nO speak, to reassure me,\nTo hasten or control;\nO speak, and make me listen,\nThou Guardian of my soul!","n":3},{"p":"v","t":"O Jesus, Thou hast promised\nTo all who follow Thee,\nThat where Thou art in glory,\nThere shall Thy servants be;\nAnd, Jesus, I have promised,\nTo serve Thee to the end;\nO give me grace to follow;\nMy Master and my Friend.","n":4}]},{"n":305,"t":"I am determined","k":"C","s":[{"p":"v","t":"I am determined, I've made up my mind; I'll serve the Lord,\nI've left this world and its pleasure behind.\nI will serve the Lord.\nI'll follow wherever He leadeth,\nI'll pasture wherever He feedeth\nI am determined, I've made up mind,\nI serve the Lord.","n":1}]},{"n":306,"t":"Send the light!","k":"G","s":[{"p":"v","t":"There's a call comes ringing o'er the rest-less wave,\nSend the light! Send the light!\nThere are souls to rescue, There are souls to save,\nSend the light! Send the light!","n":1},{"p":"c","t":"Send the light, the blessed gospel light,\nLet it shine from shore to shore!\nSend the light! and let its radiant beam,\nLight the world for evermore.","n":1},{"p":"v","t":"We have heard the Macedonian call today\nSend the light! Send the light!\nAnd a golden offering at the Cross we lay,\nSend the light! Send the light!","n":2},{"p":"v","t":"Let us pray that grace may everywhere abound\nSend the light! Send the light!\nAnd a Christ-like Spirit everywhere be found,\nSend the light! Send the light!","n":3},{"p":"v","t":"Let us not grow weary in the work of love,\nSend the light! Send the light!\nLet us gather jewels for a crown above,\nSend the light! Send the light!","n":4}]},{"n":307,"t":"Look and live","k":"Bb","s":[{"p":"v","t":"I've a message from the Lord, hallelujah!\nThe message unto you I'll give,\n'Tis recorded in His Word, hallelujah!\nIt is only that you \"look and live.\"","n":1},{"p":"c","t":"Look and live! My brother live,\nLook to Jesus now and live\n'Tis recorded in His Word; hallelujah!\nIt is only that you look and live.","n":1},{"p":"v","t":"I've a message full of love, hallelujah!\nA message, O my friend, for you;\n'Tis a message from above, hallelujah!\nJesus said it; and I know 'tis true.","n":2},{"p":"v","t":"Life is offered unto you, hallelujah!\nEternal life your soul shall have,\nIf you'll only look to Him, hallelujah!\nLook to Jesus who alone can save.","n":3}]},{"n":308,"t":"The move is on","k":"C","s":[{"p":"v","t":"The move is on my Lord, the move in on\nThe move is on my Lord, the move is on\nI can hear; I know, I know the move is on,","n":1},{"p":"v","t":"Move on Brother, move on Sister, this is the moving day,\nMove a little closer, where the streams are flowing,\nMove on Brother, move on.","n":2}]},{"n":309,"t":"Count your blessings","k":"C","s":[{"p":"v","t":"When upon life's billows you are tempest tossed,\nWhen you are discouraged, thinking all is lost,\nCount your many blessings name them one by one,\nAnd it will surprise you what the Lord hath done.","n":1},{"p":"c","t":"Count your blessings, name them one by one,\nCount your blessings, see what God hath done;\nCount your blessings, name them one by one,\nAnd it will surprise you what the Lord hath done.","n":1},{"p":"v","t":"Are you ever burdened with a load of care?\nDoes the cross seem heavy you are called to bear?\nCount your many blessings, every doubt will fly,\nAnd you will be singing as the days go by.","n":2},{"p":"v","t":"When you look at others with their lands and gold\nThink that Christ has promised you His wealth untold,\nCount your many blessings, money cannot buy,\nYour re-ward in heaven, nor your home on high.","n":3},{"p":"v","t":"So a-mid the conflict, whether great or small,\nDo not be discouraged, God is over all,\nCount your many blessings, angels will at-tend,\nHelp and comfort give you to your journey's end.","n":4}]},{"n":310,"t":"O be ready!","k":"Bb","s":[{"p":"v","t":"When the Bridegroom cometh by and by,\nWhen the Bridegroom cometh by and by,\nWill your lamps be burning bright?\nWill your robes be pure and white?\nWhen the Bridegroom cometh by and by?","n":1},{"p":"c","t":"O be ready! O be ready!\nReady when the Bridegroom comes;\nO be ready! O be ready!\nReady when the Bridegroom comes.","n":1},{"p":"v","t":"When the Bridegroom cometh by and by,\nWhen the Bridegroom cometh by and by,\nO, be ready for that day,\nWith your sins all washed away,\nWhen the Bridegroom cometh by and by.","n":2},{"p":"v","t":"When the Bridegroom cometh by and by,\nWhen the Bridegroom cometh by and by,\nWill your wearied heart rejoice\nAt the sound of Jesus voice,\nWhen the Bridegroom cometh by and by?","n":3},{"p":"v","t":"When the Bridegroom cometh by and by,\nWhen the Bridegroom cometh by and by,\nWill the sorrows of the past,\nAll be changed to joy at last,\nWhen the Bridegroom cometh by and by?","n":4},{"p":"v","t":"When the Bridegroom cometh by and by,\nWhen the Bridegroom cometh by and by,\nWhen the Lord shall call His own,\nCan you stand before the throne?\nWhen the Bridegroom cometh by and by?","n":5},{"p":"v","t":"When the Bridegroom cometh by and by,\nWhen the Bridegroom cometh by and by,\nWill you join the ransomed host,\nOr be found among the lost?\nWhen the Bridegroom cometh by and by?","n":6}]},{"n":311,"t":"Christ returneth!","k":"","s":[{"p":"v","t":"It may be at morn, when the day is awaking\nWhen sunlight through darkness and shadow is breaking,\nThat Jesus will come in the fullness of glory\nTo receive from the world \"His own.\"","n":1},{"p":"c","t":"O Lord Jesus, how long?\nHow long are we shout the glad song?\nChrist returneth! Hallelujah!\nHallelujah! Amen!\nHallelujah! Amen!","n":1},{"p":"v","t":"It may be at midday, it may be at twilight,\nIt may be, perchance, that the blackness of midnight,\nWill burst into light in the blaze of His glory.\nWhen Jesus receives \"His own.\"","n":2},{"p":"v","t":"While hosts cry \u201cHosanna\u201d from heaven descending\nWith glorified saints, and the angels attending,\nWith grace on His brow, like a \u2018halo of glory\u2019\nWill Jesus receive \"His own.\"","n":3},{"p":"v","t":"Oh, joy! Oh, delight, should we go without dying;\nNo sickness, no sadness, no dread, and no crying;\nCaught up through the clouds with our Lord into glory,\nWhen Jesus receives \"His own.\"","n":4}]},{"n":312,"t":"Lord I'm coming now","k":"","s":[{"p":"v","t":"Lord I'm coming now to Thee,\nLay Thy nail scarred hand on me,\nLet Thy healing virtue flow,\nAnd I shall be made whole.","n":1}]},{"n":313,"t":"The wondrous story","k":"","s":[{"p":"v","t":"I will sing the wondrous story\nOf the Christ who died for me;\nHow He left His home in glory,\nFor the Cross on Calvary.","n":1},{"p":"c","t":"Yes, I'll sing the wondrous story,\nOf the Christ who died for me\nSing it with the saints in glory\nGathered by the crystal sea.","n":1},{"p":"v","t":"I was lost; but Jesus found me\nFound the sheep that went a-stray,\nThrew His loving arms around me,\nDrew me back into His way.","n":2},{"p":"v","t":"I was bruised; but Jesus healed me;\nFaint was I from many a fall;\nSight was gone and fears possessed me,\nBut He freed me from them all.","n":3},{"p":"v","t":"Days of darkness still come o'er me;\nSorrow's paths I of-ten tread;\nBut the Saviour still is with me,\nBy His hand I'm safely led.","n":4},{"p":"v","t":"He will keep me till the river\nRolls its waters at my feet;\nThen He'll bear me safely over,\nWhere the loved ones I shall meet.","n":5}]},{"n":314,"t":"God our help","k":"C","s":[{"p":"v","t":"O God, our help in ages past,\nOur hope for years to come\nOur shelter from the stormy blast,\nAnd our eternal home!","n":1},{"p":"v","t":"Under the shadow of Thy throne\nThy saints have dwelt secure;\nSufficient is Thine arm alone,\nAnd our defence is sure.","n":2},{"p":"v","t":"Before the hills in order stood,\nOr earth received her frame,\nFrom everlasting Thou art God,\nTo endless years the same.","n":3},{"p":"v","t":"A thousand ages in Thy sight\nAre like an evening gone\nShort as the watch that ends the night\nBefore the rising sun.","n":4},{"p":"v","t":"Time, like an ever rolling stream,\nBears all its sons away;\nThey fly forgotten, as a dream\nDies at the opening day.","n":5},{"p":"v","t":"O God, our help in ages past,\nOur hope for years to come,\nBe Thou our Guard while troubles last,\nAnd our eternal home!","n":6}]},{"n":315,"t":"It pays to serve Jesus","k":"F","s":[{"p":"v","t":"It pays to serve Jesus,\nI speak from my heart;\nHe'll always be with us,\nIf we do our part;\nThere's naught in this wide world can pleasure afford,\nThere's peace and contentment in serving the Lord.","n":1},{"p":"c","t":"I\u2019ll love Him far better than in days of yore,\nI'll serve Him more truly than ever be-fore.\nI'll do as He bids me whatever the cost,\nI'll be a true soldier,\nI'll die at my post.","n":1},{"p":"v","t":"And oft when, I'm tempted to turn from the track,\nI think of my Saviour, my mind wanders back\nTo the place where they nailed Him on Calvary's tree\nI hear a voice saying: \"I suffered for thee.\"","n":2},{"p":"v","t":"A place I remembered where I was set free.\n'Twas where I found par-don, a heaven to me;\nThere Jesus spoke sweetIy to my weary soul,\nMy sins were forgiven, He made my heart whole.","n":3},{"p":"v","t":"How rich is the blessing the world can-not give,\nI'm satisfied fully for Jesus to live;\nThough friends may for-sake me and trials arise,\nI'm trusting in Jesus, His love never dies.","n":4},{"p":"v","t":"There is no one like Jesus can cheer me today,\nHis love and His kindness can ne'er fade away;\nIn winter,\nin summer, in sunshine and rain,\nHis love and affection are always the same.","n":5},{"p":"v","t":"Will you have this blessing that Jesus bestows?\nA free, full salvation from sin's bitter throes,\nO come to the Saviour, to Calvary\u2019s tree!\nThe fountain is opened, is flowing for thee.","n":6}]},{"n":316,"t":"There is joy","k":"C","s":[{"p":"v","t":"When a sinner comes, as a sinner may,\nThere is joy;\nThere is joy;\nWhen he turns to God in the Gospel way,\nThere is joy, there is joy.","n":1},{"p":"c","t":"There is joy among the angels,\nAnd their harps with music ring;\nWhen a sinner comes repenting,\nBending low before our King.","n":1},{"p":"v","t":"When a soul is born in the Kingdom bright,\nThere is joy,\nThere is joy;\nWhen he walks by faith in the Gospel light,\nThere is joy, there is joy.","n":2},{"p":"v","t":"When a pilgrim comes to the river wide,\nThere is joy, there is joy;\nWhen he dwells secure on the other side,\nThere is joy, there is joy.","n":3}]},{"n":317,"t":"Peace, perfect peace","k":"","s":[{"p":"v","t":"Peace, perfect peace, in this dark world of sin?\nThe blood of Jesus whispers peace within.","n":1},{"p":"v","t":"Peace, perfect peace, by thronging duties pressed?\nTo do the will of Jesus \u201cthis is rest\u201d.","n":2},{"p":"v","t":"Peace, perfect peace, with sorrows surging round?\nOn Jesus' blossom naught but calm is found.","n":3},{"p":"v","t":"Peace, perfect peace, with loved ones far away?\nIn Jesus keeping we are safe, and they.","n":4},{"p":"v","t":"Peace, perfect peace, our future all unknown?\nJesus we know, and He is on the throne.","n":5},{"p":"v","t":"Peace, perfect peace, death shadowing us and ours?\nJesus has vanquished death and all its powers.","n":6},{"p":"v","t":"It is enough; earth's struggles soon shall cease,\nAnd Jesus calls us to heaven's perfect peace.","n":7}]},{"n":318,"t":"A channel of blessing","k":"","s":[{"p":"v","t":"Is your life a channel of blessing?\nIs the love of God flowing through you?\nAre you telling the lost of the Saviour?\nAre you ready His service to do?","n":1},{"p":"c","t":"Make me a channel of blessing today,\nMake me a channel of blessing, I pray;\nMy life possessing, my service blessing,\nMake me a channel of blessing today.","n":1},{"p":"v","t":"Is your life a channel of blessing?\nAre you burdened for those that are lost?\nHave you urged upon those who are straying,\nThe Saviour who died on the Cross?","n":2},{"p":"v","t":"Is your life a channel of blessing?\nIs it daily telling for Him?\nHave you spoken the Word of salvation\nTo those who are dying in sin?","n":3},{"p":"v","t":"We can-not be channels of blessing\nIf our lives are not free from all sin;\nWe will barriers be and a hindrance\nTo those we are trying to win.","n":4}]},{"n":319,"t":"I will sing of my redeemer","k":"","s":[{"p":"v","t":"I will sing of my Re-deem-er,\nAnd His won-drous love to me;\nOn the cru-el Cross He suffered,\nFrom the curse to set me free.","n":1},{"p":"c","t":"Sing, O sing of my Re-deem-er,\nWith His blood, He purchased me,\nOn the Cross, He seaIed my pardon,\nPaid the debt, And made me free.","n":1},{"p":"v","t":"I will tell the wondrous story,\nHow my lost estate to save,\nIn His boundless love and mercy,\nHe the ransom freely gave.","n":2},{"p":"v","t":"I will praise my dear Redeemer,\nHis triumphant pow'r I\u2019ll tell,\nHow the victory He giveth,\nOver sin, and death, and hell.","n":3},{"p":"v","t":"I will sing of my Redeemer,\nand His heavenly love to me;\nHe from death to life hath brought me,\nSon of God, with Him to be.","n":4}]},{"n":320,"t":"Tell it far and wide","k":"","s":[{"p":"v","t":"Tell it! let the people hear it,\n\"Jesus saves from sin!\"\nLet the breezes bear the message,\n\"Jesus makes men clean;\nThat He shed His blood to save us!\"\nTell it far and wide,\n\"In no other is redemption\nSave the Crucified!\"","n":1},{"p":"c","t":"Tell it far and wide,\nTell it far and wide,\n\"In no other is redemption,\nSave the Crucified!\"","n":1},{"p":"v","t":"Tell it to the lone and weary,\nTo the blithe and gay;\nTo the aged with their bur-dens,\nTo the child at play.\n\"There is full and free salvation!\"\nHear the bless-ed word,\n\u2018There is mercy and true heal-ing\nIn the Saviour's blood\u2019.","n":2},{"p":"v","t":"Free the mercy, full the par-don,\nJesus died to give!\nSweet the welcome that the sinner\nSurely will receive\nWeary, weak; and heavy laden,\nCome to Him today;\nLet the cleansing blood of Jesus\nWash your sins away.","n":3}]},{"n":321,"t":"May the Lord depend on you","k":"C","s":[{"p":"v","t":"In the warfare that is raging\nFor the truth and for the right,\nWhen the conflict fierce, is raging,\nWith the powers of the night;\nGod needs workers brave and true;\nMay He, then, depend on you","n":1},{"p":"c","t":"May the Lord depend on you\nLoyalty is but His due,\nSay; O spirit, brave and true,\nThat He may depend on you.","n":1},{"p":"v","t":"See they come on sable pinions.\nCome in strong Satanic might;\nPowers come and dark dominions,\nFrom the regions of the night,\nGod requires the brave and true;\nMay He, then, depend on you","n":2},{"p":"v","t":"From His throne the Father sees us;\nAngels help us to prevail;\nAnd our Leader true is Jesus,\nAnd we shall not, cannot fail;\nTriumph crowns the brave and true;\nMay the Lord depend on you","n":3}]},{"n":322,"t":"Jesus is alive","k":"","s":[{"p":"v","t":"Jesus is alive, Jesus is alive,\nSin and death must go, they are conquered foe,\nFor Jesus is alive.","n":1}]},{"n":323,"t":"The old, old story","k":"","s":[{"p":"v","t":"Tell me the old, old story\nOf unseen things above,\nOf Jesus and His glory,\nOf Jesus and His love,\nTell me the story simply,\nAs to a little child;\nFor I am weak and weary,\nAnd helpless and defiled.","n":1},{"p":"c","t":"Tell me the old, old story\nTell me the old, old story\nTell me the old, old story,\nOf Jesus and His love.","n":1},{"p":"v","t":"Tell me the story slowly,\nThat I may take it in;\nThat wonderful redemption,\nGod's remedy for sin,\nTell me the story often,\nFor I forget so soon!\nThe \u201cearly dew\u201d of morning\nHas passed away at noon.","n":2},{"p":"v","t":"Tell me the story softly,\nWith earnest tones, and grave;\nRemember! I\u2019m the sinner\nWhom Jesus came to save\nTell me that story always,\nIf you would really be\nIn any time of trouble\nA comforter to me.","n":3},{"p":"v","t":"Tell me the same old story,\nWhen you have cause to fear\nThat this world's empty glory\nIs costing me too dear\nYes; and when that world's glory\nIs dawning on my soul,\nTell me the old, old story,\nChrist Jesus makes thee whole.","n":4}]},{"n":324,"t":"Trust and obey","k":"F","s":[{"p":"v","t":"When we walk with the Lord,\nIn the light of His Word,\nWhat a glory He sheds on our way!\nWhile we do His good will,\nHe abides with us still\nAnd with all who will trust and obey.","n":1},{"p":"c","t":"Trust and obey;\nFor there's no other way\nTo be happy in Jesus,\nBut to trust and obey.","n":1},{"p":"v","t":"Not a shadow can rise,\nNot a cloud in the skies,\nBut His smile quickly drives it away;\nNot a doubt nor a fear,\nNot a sigh nor a tear,\nCan a-bide while we trust and obey.","n":2},{"p":"v","t":"Not a burden we bear,\nNot a sorrow we share,\nBut our toil He doth richly repay;\nNot a grief nor a loss,\nNot a frown nor a cross,\nBut is blest if we trust and obey.","n":3},{"p":"v","t":"But we never can prove\nThe delights of His love,\nUntil all on the altar we lay,\nFor the favour He shows,\nAnd the joy He bestows,\nAre for them who will trust and obey.","n":4},{"p":"v","t":"Then in fellowship sweet,\nWe will sit at His feet,\nOr we'll walk by His side in the way;\nWhat He says we will do,\nWhere He sends we will go,\nNever fear, only trust and obey.","n":5}]},{"n":325,"t":"Make me more like thee","k":"","s":[{"p":"v","t":"Make me more like Thee,\nJesus make me more like Thee,\nGive me a heart that's filled with love,\nAnd make me more like thee.","n":1}]},{"n":326,"t":"My Lord and I","k":"","s":[{"p":"v","t":"I have a friend so precious\nSo very dear to me,\nHe loves me with such tender love,\nHe loves so faithfully;\nI could not live a-part from Him,\nI love to feel Him nigh,\nAnd so we dwell together,\nMy Lord and I.","n":1},{"p":"v","t":"He knows how much I love Him,\nHe knows I love Him well;\nBut with what love He loveth me\nMy tongue can never tell,\nIt is an everlasting love\nIn ever rich supply,\nAnd so we love each other,\nMy Lord and I.","n":2},{"p":"v","t":"He knows how I am longing\nSome weary soul to win,\nAnd so He bids me go and speak\nThe loving Word for Him\nHe bids me tell His wondrous love,\nAnd why He came to die,\nAnd so we work together,\nMy Lord and I.","n":3},{"p":"v","t":"So up into the mountains\nOf heaven's cloud-less light,\nOr away into the valleys\nOf dark-ness or of night\nThough round us tempests gather\nAnd storms are raging high,\nWe'll travel on together,\nMy Lord and I.","n":4},{"p":"v","t":"And when the journey's end-ed\nIn rest and peace at last,\nWhen every thought of danger\nAnd weariness is pass.\nIn the Kingdom of the future,\nIn the Glory by and by,\nWe'll live and reign together,\nMy Lord and I.","n":5}]},{"n":327,"t":"A friend for children","k":"C","s":[{"p":"v","t":"There's a Friend for little children\nAbove the bright blue sky,\nA Friend that never changes,\nWhose love will never die;\"\nUn-like our friends by nature,\nWho change with changing years;\nThis Friend is always worthy,\nThe precious Name He bears.","n":1},{"p":"v","t":"There's a rest for little children\nAbove the bright blue sky\nWho love the blessed Saviour;\nAnd to His Father cry;\nA rest from every trouble,\nFrom sin and danger free,\nThere every little pilgrim\nShall rest eternally.","n":2},{"p":"v","t":"There's a home for little children\nAbove the bright blue sky\nWhere Jesus reigns in glory,\nA home of peace and joy;\nNo home on earth is like it,\nNor can with it compare;\nFor every one is happy\nNor can be happier there.","n":3},{"p":"v","t":"There's a crown for little children\nAbove the bright blue sky;\nAnd all who look to Jesus\nShall wear it by-and-by;\nA crown of brightest glory, .\nWhich he shall sure bestow,\nOh all who love the Saviour,\nAnd walk with Him below.","n":4},{"p":"v","t":"There's song for little children\nAbove the bright blue sky,\nAnd a harp of sweetest music\nFor their hymn of victory,\nAnd all above is pleasure,\nAnd found in Christ alone;\nO come, dear little children,\nThat all may be your own!","n":5}]},{"n":328,"t":"Just the same","k":"C","s":[{"p":"v","t":"Have you ever heard the story,\nOf the Babe of Bethlehem,\nWho was worshipped by the angels\nAnd the wise and holy men;\nHow he taught the learned doctors\nIn the temple far away?\nO, I'm glad, so glad to tell you,\nHe is just the same today!","n":1},{"p":"c","t":"He is just... the same today,\nHe is just ... the same today,.\nSeeking those who are astray,\nSaving souls along the way;\nThank God! He is just the same today.","n":1},{"p":"v","t":"Have you ever heard the story,\nHow He walked upon the sea,\nTo His dear disciples tossing\nOn the waves of Galilee?\nHow the waves in angry motion\nQuickly would His will obey?\nO, I'm glad, so glad to tell you,\nHe is just the same today.","n":2},{"p":"v","t":"Have you ever heard of Jesus\nPraying in Gethsemane,\nAnd the ever thrilling story\nHow He died up-on the tree,\nCru-el thorns His fore-head piercing,\nAs His spirit passed away?\nThis He did for you, my brother,\nAnd He's just the same today!","n":3}]},{"n":329,"t":"Courage brother!","k":"F","s":[{"p":"v","t":"Courage, brother! do not stumble,\nThough thy path be dark as night;\nThere's a star to guide the humble,\nTrust in God, and do the right!","n":1},{"p":"v","t":"Let the road be rough and dreary,\nAnd its end far out of sight;\nFoot it bravely strong or weary;\nTrust in God, and do the right!","n":2},{"p":"v","t":"Perish policy and cunning!\nPerish all that fears the light.\nWhether losing, whether winning,\nTrust in God, and do the right!","n":3},{"p":"v","t":"Trust no party, sect, or faction,\nTrust no leaders in the fight;\nBut in every word and action,\nTrust in God, and do the right!","n":4},{"p":"v","t":"Trust no lovely forms of passion,\nFriends may look like angels bright;\nTrust no custom, school, or fashion;\nTrust in God and do the right!","n":5},{"p":"v","t":"Simple rule, and safest guiding,\nInward peace; and inward might;\nStar upon our path abiding,\nTrust in God, and do the right!","n":6},{"p":"v","t":"Some will hate thee, some will love thee,\nSome will flatter, some will slight;\nCease from man, and look above thee,\nTrust in God, and do the right!","n":7}]},{"n":330,"t":"God moves in a mysterious way","k":"G","s":[{"p":"v","t":"God moves in a mysterious way\nHis wonders to perform;\nHe plants His footsteps in the sea\nAnd rides upon the storm.","n":1},{"p":"v","t":"Deep in unfathomable mines\nOf never-falling skill,\nHe treasures up His bright designs,\nAnd
